[global]
    server string = samba
    idmap config * : range = 3000-7999
    security = user
    server min protocol = SMB2
    server max protocol = SMB3
    client min protocol = SMB2
    client max protocol = SMB3

    # SMB signing and encryption (required by Windows 11)
    server signing = mandatory
    client signing = mandatory
    smb encrypt = auto

    # disable printing services
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    host msdfs = no
    wide links = yes
    follow symlinks = yes
    unix extensions = no
    acl allow execute always = yes

    # allow SMB clients to read/write extended attributes (xattrs) on files
    ea support = yes

    # MacOS Compatibility options
    vfs objects = catia fruit streams_xattr
    fruit:resource = file
    fruit:metadata = stream
    fruit:locking = netatalk
    fruit:encoding = native

    # Special configuration for Apple's Time Machine
    fruit:model = TimeCapsule
    fruit:aapl = yes

    # fix filenames with special chars
    mangled names = no
    dos charset = CP850
    unix charset = UTF-8

    # Logging
    log file = /dev/stdout
    max log size = 50

    # Workgroup
    workgroup = MYGROUP

    # Disable NetBIOS if not needed
    disable netbios = no

[config]
    path = /config
    comment = Home Assistant Config
    browseable = yes
    writable = yes
    read only = no
    valid users = carlo
    force user = carlo
    force group = carlo
    create mask = 0664
    force create mode = 0664
    directory mask = 0775
    force directory mode = 0775
    veto files = /.apdisk/.DS_Store/.TemporaryItems/.Trashes/desktop.ini/ehthumbs.db/Network Trash Folder/Temporary Items/Thumbs.db/
    delete veto files = yes

[home]
    path = /home_carlo
    comment = Home Directory
    browseable = yes
    writable = yes
    read only = no
    valid users = carlo
    force user = carlo
    force group = carlo
    create mask = 0664
    force create mode = 0664
    directory mask = 0775
    force directory mode = 0775
    veto files = /.apdisk/.DS_Store/.TemporaryItems/.Trashes/desktop.ini/ehthumbs.db/Network Trash Folder/Temporary Items/Thumbs.db/
    delete veto files = yes