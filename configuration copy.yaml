                    entity_id:
                      - switch.sonoff_10024024c4_1
                    state: "off"
                    match: all
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_2
                    state: "on"
                    match: all
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_2
                  - delay: "0:00:00.300000"
                  - action: switch.turn_on
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_1
              - conditions:
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_1
                    state: "on"
                    match: all
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_2
