                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_2
                    state: "off"
                    match: all
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_1
                  - delay: "0:00:00.300000"
                  - action: switch.turn_on
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_2
              - conditions:
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_1
                    state: "off"
                    match: all
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_2
                    state: "on"
                    match: all
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_2
                  - delay: "0:00:00.300000"
                  - action: switch.turn_on
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_1
              - conditions:
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_1
                    state: "on"
                    match: all
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_2
                    state: "on"
                    match: all
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_1
              - conditions:
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_1
                    state: "off"
                    match: all
                  - condition: state
                    entity_id:
                      - switch.sonoff_10024024c4_2
                    state: "off"
                    match: all
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_1
                  - delay: "0:00:00.300000"
                  - action: switch.turn_off
                    target:
                      entity_id:
                        - switch.sonoff_10024024c4_1
          # FIXED: Sostituito logbook.log con system_log.write
          - action: system_log.write
            data:
              level: info
              message: "Luce scale Turn OFF - Switch1: {{ states('switch.sonoff_10024024c4_1') }}, Switch2: {{ states('switch.sonoff_10024024c4_2') }}, Power: {{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}W"
