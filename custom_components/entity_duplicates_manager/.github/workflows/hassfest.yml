name: hassfest

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hassfest:
    name: Run hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@v2
        with:
          action: check
          path: "custom_components/entity_duplicates_manager"
          ignore: "brands"

  hacs:
    name: Run HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@v1
        with:
          category: "integration"
          path: "custom_components/entity_duplicates_manager"