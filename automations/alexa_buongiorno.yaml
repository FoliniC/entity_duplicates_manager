- alias: "Alexa: Risposta al Buongiorno v2"
  id: alexa_risposta_buongiorno_v2
  trigger:
    - platform: state
      entity_id: input_boolean.buongiorno_alexa
      to: "on"
  action:
    # 1. Log inizio script
    - service: system_log.write
      data:
        level: info
        message: "Alexa Buongiorno: avvio sequenza mattutina"
    # 2. Messaggio di benvenuto su Alexa Cucina (alexa_media play_media custom)
    - service: media_player.play_media
      target:
        entity_id: media_player.2o_echo_dot_di_carlo
      data:
        media_content_id: "Buongiorno Carlo! Spero che tu abbia passato una splendida notte. Tutto è pronto in casa per iniziare la giornata."
        media_content_type: "custom"
    # 3. Apertura tapparella camera grande
    - service: cover.open_cover
      target:
        entity_id: cover.camera_grande_tapparella_knx
    # 4. Attiva radio m2o tramite Alexa (alexa_media) con controllo volume
    - service: system_log.write
      data:
        level: info
        message: "Alexa Buongiorno: avvia riproduzione radio"
    - service: script.turn_on
      data:
        entity_id: script.alexa_play_music_with_volume_check
        variables:
          media_player: media_player.2o_echo_dot_di_carlo
          radio_script: script.alexa_radio_m2o_custom
    # 5. Attendi 5 secondi
    - delay: "00:00:05"
    # 6. Spegni input_boolean
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.buongiorno_alexa