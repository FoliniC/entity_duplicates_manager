- id: gestione_cloudflare_presence
  alias: "Gestione Cloudflare Presence"
  description: "Spegne Cloudflare quando Carlo è a casa (home o Casa), lo accende quando esce."
  trigger:
    - platform: state
      entity_id: person.carlo
  condition:
    - condition: template
      value_template: "{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state != trigger.to_state.state }}"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('person.carlo') in ['home', 'Casa'] }}"
          sequence:
            - service: shell_command.stop_cloudflare
              data: {}
        - conditions:
            - condition: template
              value_template: "{{ states('person.carlo') not in ['home', 'Casa', 'unknown', 'unavailable'] }}"
          sequence:
            - service: shell_command.start_cloudflare
              data: {}
  mode: single

- id: cloudflare_avvio_ha
  alias: "Cloudflare - Avvia tunnel all'avvio di HA"
  description: "All'avvio di HA, avvia il tunnel Cloudflare se Carlo non è a casa."
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay:
        seconds: 30
    - condition: template
      value_template: "{{ states('person.carlo') not in ['home', 'Casa'] }}"
    - service: shell_command.start_cloudflare
      data: {}
    - event: fancoil_log_event
      event_data:
        level: INFO
        message: "Cloudflare tunnel avviato all'avvio di HA (person.carlo={{ states('person.carlo') }})"
  mode: single
