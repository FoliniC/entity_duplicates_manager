- id: climate_setpoint_offset_automation
  alias: "Climate Setpoint Offset Automation"
  description: "Applies a global offset to climate entity setpoints."

  trigger:
    - platform: state
      entity_id:
        - climate.climatizzazione_appartamento
        - climate.controllo_temperatura_cucina
        - climate.controllo_temperatura_camera_grande
        - climate.controllo_temperatura_camera
        - climate.controllo_temperatura_corridoio
        - climate.controllo_temperatura_bagno
        - climate.controllo_temperatura_sala
      attribute: temperature
      id: "climate_temp_change"
    - platform: state
      entity_id: input_number.climate_setpoint_offset
      id: "offset_slider_change"

  condition:
    - condition: template
      value_template: >
        {{ trigger is not defined
           or (trigger.id == 'climate_temp_change' and trigger.to_state is not none and trigger.to_state.attributes.temperature is defined)
           or (trigger.id == 'offset_slider_change' and states('input_number.climate_setpoint_offset') not in ['unknown', 'unavailable']) }}

    - condition: template
      value_template: >
        {% if trigger is not defined or trigger.id != 'climate_temp_change' %}
          true
        {% else %}
          {% if trigger.from_state is not none and trigger.to_state is not none %}
            {% set old_target = trigger.from_state.attributes.temperature | float(0) if trigger.from_state.attributes.temperature is defined else 0 %}
            {% set new_target = trigger.to_state.attributes.temperature | float(0) %}
            {% set current_offset = states('input_number.climate_setpoint_offset') | float(0) %}
            {% set expected_current_target = (old_target + current_offset) | round(1) %}
            {% set actual_current_target = new_target | round(1) %}
            {{ actual_current_target != expected_current_target }}
          {% else %}
            true
          {% endif %}
        {% endif %}

  action:
    - variables:
        entity_ids_to_update: >-
          {{ [trigger.entity_id] if (trigger is defined and trigger.id is defined and trigger.id == 'climate_temp_change' and trigger.entity_id is defined)
             else [
              'climate.climatizzazione_appartamento',
              'climate.controllo_temperatura_cucina',
              'climate.controllo_temperatura_camera_grande',
              'climate.controllo_temperatura_camera',
              'climate.controllo_temperatura_corridoio',
              'climate.controllo_temperatura_bagno',
              'climate.controllo_temperatura_sala'
            ] }}
        current_offset: "{{ states('input_number.climate_setpoint_offset') | float(0) }}"

    - repeat:
        for_each: "{{ entity_ids_to_update }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(repeat.item, 'temperature') is not none }}"
            then:
              - variables:
                  climate_entity_id: "{{ repeat.item }}"
                  original_setpoint: "{{ state_attr(repeat.item, 'temperature') | float(0) }}"
                  new_target_setpoint: "{{ (original_setpoint + current_offset) | round(1) }}"

              - action: climate.set_temperature
                target:
                  entity_id: "{{ climate_entity_id }}"
                data:
                  temperature: "{{ new_target_setpoint }}"

              - action: system_log.write
                data:
                  message: >
                    Climate Setpoint Offset Automation:
                    Entity: {{ climate_entity_id }}
                    Original Setpoint: {{ original_setpoint }}
                    Offset: {{ current_offset }}
                    New Target Setpoint: {{ new_target_setpoint }}
                  level: debug
