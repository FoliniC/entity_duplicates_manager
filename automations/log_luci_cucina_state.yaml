- id: log_luci_cucina_state_change
  # Log Luci Cucina State Change - traccia ogni cambio di stato switch.1..4
  # Classifica il motivo (fisico/RF, UI, automazione, dropout Wi-Fi/cloud)
  alias: "Log Luci Cucina State Change"
  description: "Traccia ogni cambio di stato dei 4 switch luci cucina per diagnosticare spegnimenti anomali"
  mode: queued
  max: 50
  # coda
  trigger:
    - platform: state
      entity_id:
        - switch.luci_cucina
        - switch.bancone_cucina
        - switch.tavolo_cucina
        - switch.cucina_luci_cucina_switch_4
  condition:
    # Logga OGNI cambio reale: on/off/unavailable/unknown
    # Esclude solo: nessun cambio reale (from==to) e rumore unavailable<->unknown
    - condition: template
      value_template: >
        {{ trigger.to_state.state != trigger.from_state.state
           and not (trigger.to_state.state in ['unavailable', 'unknown']
                    and trigger.from_state.state in ['unavailable', 'unknown']) }}
  action:
    - variables:
        to_state: "{{ trigger.to_state.state }}"
        from_state: "{{ trigger.from_state.state }}"
        debug_entity: "{{ trigger.entity_id }}"
        friendly_name: >-
          {% set eid = trigger.entity_id %}
          {% if 'luci_cucina' in eid and 'switch_' not in eid %}luce 1
          {% elif 'bancone_cucina' in eid %}luce bancone
          {% elif 'tavolo_cucina' in eid %}luce tavolo
          {% elif 'cucina_luci_cucina_switch_4' in eid %}luce 4
          {% else %}{{ eid }}{% endif %}
        user_id: "{{ trigger.to_state.context.user_id if trigger.to_state.context is defined else none }}"
        parent_id: "{{ trigger.to_state.context.parent_id if trigger.to_state.context is defined else none }}"
        # NOTA: trigger.to_state.context è un oggetto Context, NON un dict.
        # Non ha .get(); va accesso per attributo con guardia is_defined.
        source: >
          {% set ctx = trigger.to_state.context if trigger.to_state.context is defined else none %}
          {{ ctx.source if ctx is not none and ctx.source is defined else '' }}
        ts: "{{ trigger.to_state.last_changed | default(now()) }}"
        user_name: >
          {% if user_id is not none %}
            {% set person = states.person | selectattr('attributes.user_id', 'eq', user_id) | first | default(none) %}
            {{ person.attributes.friendly_name if person else 'ID:' ~ user_id[:8] }}
          {% else %}
            none
          {% endif %}
        # Rileva transizioni anomale (dropout Wi-Fi/cloud o riavvio dispositivo)
        anomalous: >
          {{ from_state in ['unavailable', 'unknown'] or to_state in ['unavailable', 'unknown'] }}
        reason: >
          {% if anomalous %}
            Stato anomalo (dropout Wi-Fi/cloud o riavvio dispositivo): {{ from_state }} -> {{ to_state }}
          {% elif source == 'BUTTON' or (user_id is none and parent_id is none and source == '') %}
            Fisico/RF (pulsante o telecomando Tuya)
          {% elif user_id is not none %}
            Interfaccia Web/App ({{ user_name }})
          {% elif parent_id is not none %}
            Sistema/Automazione (parent: {{ parent_id[:12] }})
          {% elif source != '' %}
            Esterno (source={{ source }})
          {% else %}
            Fisico/RF (pulsante o telecomando Tuya)
          {% endif %}
        action_word: >
          {% if to_state == 'on' %}ACCESO
          {% elif to_state == 'off' %}SPENTO
          {% else %}{{ to_state | upper }}{% endif %}
        level: "{{ 'WARNING' if anomalous else 'INFO' }}"
    # 1) PRIMA il log (priorità assoluta)
    - event: cucina_log_event
      event_data:
        level: "{{ level }}"
        action: "{{ action_word }}"
        message: "Cucina {{ friendly_name }} {{ action_word }} (era {{ from_state }}) — Motivo: {{ reason }} [entity={{ debug_entity }} source={{ source }} user_id={{ user_id }} parent_id={{ parent_id }}] @ {{ ts }}"
        wait: 1
    # 2) Notifica push (solo per on/off, non per unavailable/unknown)
    - if:
        - condition: template
          value_template: "{{ to_state in ['on', 'off'] }}"
      then:
        # Usare notify group per notifiche device-agnostic
        - action: notify.all_devices
          data:
            title: "💡 Cucina {{ friendly_name }} {{ action_word }}{% if anomalous %} ⚠️{% endif %}"
            message: "Motivo: {{ reason }}"
            data:
              tag: "cucina_{{ debug_entity.split('.')[-1] }}"
              importance: "{{ 'high' if (to_state == 'on' or anomalous) else 'normal' }}"
              notification_icon: "mdi:lightbulb"
      # else: (non fare nulla se non on/off)