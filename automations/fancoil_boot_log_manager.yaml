- id: fancoil_boot_log_manager
  alias: "Fancoil: Gestore Log di Boot"
  description: "Attiva il buffer dei log all'avvio e lo svuota dopo 2 minuti"
  trigger:
    - trigger: homeassistant
      event: start
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.fancoil_boot_buffering
    - service: python_script.set_state
      data:
        entity_id: input_boolean.fancoil_boot_buffering
        log_queue: ""
    - delay: "00:02:00"
    - action: script.fancoil_flush_logs
