# EV Charge 2025 - Invio Corrente alla Colonnina Prism
# Questa automazione invia il target ampere calcolato alla wallbox Prism via MQTT

- id: ev_charge_2025_send_current_to_prism
  alias: "EV 2025: Invio Corrente a Prism"
  description: "Invia la corrente target calcolata alla colonnina Prism quando cambia"
  mode: single
  trigger:
    # Trigger quando cambia il target ampere calcolato (via sensor template o input_number)
    - platform: template
      value_template: >
        {{ states('sensor.ev_charge_2025_solar_max_ampere') != states('input_text.ev_charge_2025_last_mqtt_payload') }}
      id: "target_changed"
    # Trigger periodico per sicurezza (ogni minuto)
    - platform: time_pattern
      minutes: "/1"
      id: "periodic_check"
    # Trigger quando si attiva/disattiva la ricarica
    - platform: state
      entity_id: input_boolean.ev_charge_2025_charging_active
      id: "charging_toggle"
    # Trigger quando cambia modalità
    - platform: state
      entity_id: input_select.ev_charge_2025_mode
      id: "mode_change"
  condition:
    # Solo se la ricarica è attiva
    - condition: state
      entity_id: input_boolean.ev_charge_2025_charging_active
      state: "on"
    # Solo se il veicolo è connesso
    - condition: state
      entity_id: binary_sensor.ev_charge_2025_can_charge
      state: "on"
    # Solo se il SOC auto è sotto il limite
    - condition: template
      value_template: >
        {{ states('sensor.ev_charge_2025_current_soc') | float(0) < states('input_number.ev_charge_2025_vehicle_limit_soc') | float(100) }}
  action:
    - variables:
        # Ricalcola tutto come nel dashboard
        smart_meter: "{{ states('sensor.smart_meter_ts_100a_1_potenza_reale') | float(0) }}"
        unit_sm: "{{ state_attr('sensor.smart_meter_ts_100a_1_potenza_reale', 'unit_of_measurement') }}"
        prism_p: "{{ states('sensor.prism_potenza_assorbita') | float(0) }}"
        b_discharge: "{{ states('sensor.solarnet_power_battery_discharge') | float(0) }}"
        b_charge: "{{ states('sensor.solarnet_power_battery_charge') | float(0) }}"
        byd_soc: "{{ states('sensor.byd_battery_box_premium_hv_state_of_charge') | float(0) }}"
        voltage_raw: "{{ states('sensor.folini_carlo_voltage_ac') | float(230) }}"
        active: "{{ is_state('input_boolean.ev_charge_2025_charging_active', 'on') }}"
        no_grid: "{{ is_state('input_boolean.ev_charge_2025_no_grid', 'on') }}"
        no_grid_2025: "{{ is_state('input_boolean.ev_charge_2025_no_grid_2025', 'on') }}"
        connected: "{{ is_state('binary_sensor.ev_charge_2025_can_charge', 'on') }}"
        mode: "{{ states('input_select.ev_charge_2025_mode') }}"
        crono: "{{ states('input_number.ev_charge_2025_cronostar_power_target') | float(0) }}"
        manual_kw: "{{ states('input_number.ev_charge_2025_manual_power_kw') | float(2.0) }}"
        cur_soc: "{{ states('sensor.ev_charge_2025_current_soc') | float(0) }}"
        limit_soc: "{{ states('input_number.ev_charge_2025_vehicle_limit_soc') | float(100) }}"
        min_soc: "{{ states('input_number.ev_charge_2025_target_soc') | float(0) }}"
        p_prot: "{{ states('input_number.ev_charge_2025_byd_protection_soc') | float(10) }}"
        p_inv: "{{ states('input_number.ev_charge_2025_byd_inversion_soc') | float(30) }}"
        p_max_d: "{{ states('input_number.ev_charge_2025_byd_max_discharge_soc') | float(90) }}"
        w_max_c: "{{ states('input_number.ev_charge_2025_byd_max_charge_power') | float(5) * 1000 }}"
        w_max_d: "{{ states('input_number.ev_charge_2025_byd_max_discharge_power') | float(5) * 1000 }}"
        inertia_delta_a: "{{ states('input_number.ev_charge_2025_current_min_delta_a') | int(2) }}"
        inertia_interval_min: "{{ states('input_number.ev_charge_2025_current_min_interval_min') | int(3) }}"
        grid_p_w: "{{ (smart_meter * 1000) if unit_sm == 'kW' else smart_meter }}"
        voltage: "{{ 230 if voltage_raw <= 0 else voltage_raw }}"
        w_surplus_puro: "{{ (prism_p - grid_p_w) - b_discharge + b_charge }}"
        surplus: "{{ [0, w_surplus_puro - 200] | max }}"
    - variables:
        byd_policy: >
          {% if byd_soc < p_prot and not no_grid_2025 %}
            Protezione batteria casa
          {% elif byd_soc < p_inv %}
            Ripartizione graduale
          {% else %}
            Auto prioritaria con supporto BYD
          {% endif %}
        w_disponibile: >
          {% if byd_soc < p_prot and not no_grid_2025 %}
            {% set w_to_battery = [surplus, w_max_c] | min %}
            {{ surplus - w_to_battery }}
          {% elif byd_soc < p_inv %}
            {% set byd_span = [1, p_inv - p_prot] | max %}
            {% set ratio = (byd_soc - p_prot) / byd_span %}
            {% set w_auto_raw = surplus * ratio %}
            {% set w_to_battery = [surplus - w_auto_raw, w_max_c] | min %}
            {{ surplus - w_to_battery }}
          {% else %}
            {% set span = [1, p_max_d - p_inv] | max %}
            {% set bonus_ratio = [(byd_soc - p_inv) / span, 1.0] | min %}
            {% set byd_support_w = bonus_ratio * w_max_d %}
            {{ surplus + byd_support_w }}
          {% endif %}
        byd_support_w: >
          {% if byd_soc >= p_inv %}
            {% set span = [1, p_max_d - p_inv] | max %}
            {% set bonus_ratio = [(byd_soc - p_inv) / span, 1.0] | min %}
            {{ bonus_ratio * w_max_d }}
          {% else %}
            0.0
          {% endif %}
        bonus_ratio: >
          {% if byd_soc >= p_inv %}
            {% set span = [1, p_max_d - p_inv] | max %}
            {{ [(byd_soc - p_inv) / span, 1.0] | min }}
          {% else %}
            0.0
          {% endif %}
    - variables:
        # Calcolo target ampere (come nel dashboard)
        target_amp_raw: >
          {% if mode == 'Manuale' %}
            {% set manual_amp = (manual_kw * 1000 / 230) | int %}
            {% if no_grid %}
              {% set solar_amp = (w_disponibile | float(0) / voltage | float(230)) | int %}
              {% set target_amp = [[solar_amp, manual_amp] | min | clamp(6, 32), 0] | max if solar_amp >= 6 else 0 %}
              {% set calc_amp = solar_amp %}
            {% else %}
              {% set target_amp = manual_amp | clamp(6, 32) %}
              {% set calc_amp = target_amp %}
            {% endif %}
            {% set can_force_min = true %}
          {% elif crono >= 7.9 %}
            {% set calc_amp = (w_disponibile | float(0) / voltage | float(230)) | int %}
            {% set can_force_min = (cur_soc < min_soc and byd_soc >= p_inv) %}
            {% set target_amp = ([6, calc_amp] | max) if (calc_amp >= 6 or can_force_min) else 0 %}
          {% elif crono > 0.1 %}
            {% set raw_amp = (crono * 1000 / voltage | float(230)) | int %}
            {% set target_amp = [[raw_amp, 6] | max, 32] | min %}
            {% set calc_amp = target_amp %}
            {% set can_force_min = true %}
          {% else %}
            {% set target_amp = 0 %}
            {% set calc_amp = 0 %}
            {% set can_force_min = false %}
          {% endif %}
          {{ target_amp }}
        target_amp: "{{ target_amp_raw | int(0) }}"
        target_mode: >
          {% set t_amp = target_amp_raw | int(0) %}
          {% set target_mode = 3 if (not active or cur_soc >= limit_soc or t_amp < 6) else 2 %}
          {{ target_mode | int(3) }}
        last_current_amp: "{{ states('input_text.ev_charge_2025_last_mqtt_payload') | int(0) }}"
        last_mode: "{{ states('input_text.ev_charge_2025_last_mqtt_mode') | int(0) }}"
        real_prism_mode: "{{ states('sensor.prism_mode') }}"
        real_prism_mode_num: >
          {{ (1 if real_prism_mode == 'solar' else 2 if real_prism_mode == 'normal' else 3 if real_prism_mode == 'pause' else 7 if real_prism_mode == 'autolimit' else 0) | int(0) }}
        real_prism_amp: "{{ states('sensor.prism_corrente_impostata_dell_utente') | int(0) }}"
        amp_delta: "{{ (target_amp_raw | int(0) - (states('input_text.ev_charge_2025_last_mqtt_payload') | int(0))) | abs }}"
        force_current_sync: >
          {% set t_amp = target_amp_raw | int(0) %}
          {% set l_amp = states('input_text.ev_charge_2025_last_mqtt_payload') | int(0) %}
          {% set t_mode = 3 if (not active or cur_soc >= limit_soc or t_amp < 6) else 2 %}
          {% set l_mode = states('input_text.ev_charge_2025_last_mqtt_mode') | int(0) %}
          {% set r_mode = (1 if real_prism_mode == 'solar' else 2 if real_prism_mode == 'normal' else 3 if real_prism_mode == 'pause' else 7 if real_prism_mode == 'autolimit' else 0) | int(0) %}
          {% set r_amp = states('sensor.prism_corrente_impostata_dell_utente') | int(0) %}
          {% set a_delta = (t_amp - l_amp) | abs %}
          {{ t_amp == 0 or l_amp < 0 or mode == 'Manuale' or (t_amp < l_amp and a_delta >= inertia_delta_a) or t_mode != l_mode or t_mode != r_mode or (t_mode == 2 and l_amp < 6) or (t_mode == 2 and r_amp < 6 and t_amp >= 6) }}
        delta_ok: "{{ amp_delta | int(0) >= inertia_delta_a }}"
        last_current_raw: "{{ states('input_text.ev_charge_2025_last_current_change_time') }}"
        last_current_dt: "{{ strptime(last_current_raw, '%Y-%m-%d %H:%M:%S', none) }}"
        last_current_ts: "{{ as_timestamp(last_current_dt) if last_current_dt else 0 }}"
        seconds_since_current_change: "{{ ((as_timestamp(now()) - last_current_ts) | int) if last_current_ts > 0 else 999999 }}"
        inertia_interval_s: "{{ inertia_interval_min * 60 }}"
        interval_ok: "{{ seconds_since_current_change | int(0) >= (inertia_interval_min * 60) }}"
        should_send_current: >
          {% set t_amp = target_amp_raw | int(0) %}
          {% set l_amp = states('input_text.ev_charge_2025_last_mqtt_payload') | int(0) %}
          {{ t_amp != l_amp and (force_current_sync or (delta_ok and interval_ok)) }}
    - choose:
        # Invia corrente se dovrebbe essere inviata
        - conditions:
            - condition: template
              value_template: "{{ should_send_current }}"
          sequence:
            - service: mqtt.publish
              data:
                topic: "home/prism/1/command/set_current_user"
                payload: "{{ target_amp }}"
            - service: mqtt.publish
              data:
                topic: "home/prism/1/command/set_mode"
                payload: "{{ target_mode }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.ev_charge_2025_last_mqtt_payload
              data:
                value: "{{ target_amp }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.ev_charge_2025_last_mqtt_mode
              data:
                value: "{{ target_mode }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.ev_charge_2025_last_mqtt_time
              data:
                value: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.ev_charge_2025_last_current_change_time
              data:
                value: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            - service: system_log.write
              data:
                level: info
                logger: ev_charge_2025
                message: "Inviato a Prism: {{ target_amp }}A, Mode: {{ target_mode }} (trigger: {{ trigger.id }})"