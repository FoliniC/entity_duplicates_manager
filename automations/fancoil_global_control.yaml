- id: "fancoil_global_control"
  alias: "Fancoil: Controllo Globale Appartamento"
  initial_state: true
  mode: restart
  description: >-
    Gestisce l'accensione/spegnimento globale dei fancoil in base a schedulazione, 
    produzione acqua calda e temperatura circuito.
  triggers:
    - trigger: state
      entity_id:
        - schedule.riscaldamento
        - binary_sensor.pdc_acqua_calda
        - switch.attiva_fancoil
        - binary_sensor.fancoil_circuit_temp_invalid
    - trigger: numeric_state
      entity_id: sensor.temperatura_circuito_riscaldamento
      below: 25
    - trigger: numeric_state
      entity_id: sensor.temperatura_circuito_riscaldamento
      above: 28
    - trigger: homeassistant
      event: start
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.platform == 'homeassistant' and trigger.event == 'start' }}"
      then:
        - delay: "00:03:00"
        - wait_template: >-
            {{ states('input_select.fancoil_system_hvac_mode') not in ['unknown', 'unavailable', None] }}
          timeout: "00:01:00"
          continue_on_timeout: true

    - variables:
        hvac_mode_attuale: "{{ states('input_select.fancoil_system_hvac_mode') }}"
        pdc_h2o: "{{ is_state('binary_sensor.pdc_acqua_calda', 'on') }}"
        sched_on: "{{ is_state('schedule.riscaldamento', 'on') }}"
        switch_on: "{{ is_state('switch.attiva_fancoil', 'on') }}"
        circuit_temp: "{{ states('sensor.temperatura_circuito_riscaldamento') | float(0) }}"
        threshold_heat: "{{ states('input_number.circuit_temp_threshold_heat') | float(30) }}"
        threshold_cool: "{{ states('input_number.circuit_temp_threshold_cool') | float(20) }}"
        
        # Il modo desiderato è quello impostato sul climate master, 
        # a meno che il sistema non debba essere spento per schedulazione/switch
        master_hvac_mode: "{{ states('climate.climatizzazione_appartamento') }}"
        saved_mode: "{{ states('sensor.fancoil_system_saved_hvac_mode') }}"
        
        target_mode: >-
          {% if sched_on or switch_on %}
            {% if master_hvac_mode in ['heat', 'cool', 'dry', 'fan_only'] %}
              {{ master_hvac_mode }}
            {% else %}
              {# Fallback se il master è off/unavail ma lo switch è on: usa il modo salvato #}
              {% if saved_mode in ['heat', 'cool', 'dry', 'fan_only'] %}
                {{ saved_mode }}
              {% else %}
                {# Ultima spiaggia: se anche il salvato è ignoto, prova l'input_select o infine heat #}
                {% set last_mode = states('input_select.fancoil_system_hvac_mode') %}
                {{ last_mode if last_mode in ['heat', 'cool'] else 'heat' }}
              {% endif %}
            {% endif %}
          {% else %} off
          {% endif %}

        # Motivo del blocco
        block_reason: >-
          {% if target_mode == 'heat' %}
            {% if pdc_h2o %} Produzione Acqua Calda
            {% elif circuit_temp < threshold_heat %} Temperatura Circuito Bassa ({{ circuit_temp }}°C)
            {% else %} none
            {% endif %}
          {% elif target_mode == 'cool' %}
            {% if pdc_h2o %} Produzione Acqua Calda
            {% elif circuit_temp > threshold_cool %} Temperatura Circuito Alta ({{ circuit_temp }}°C)
            {% else %} none
            {% endif %}
          {% else %} none
          {% endif %}

    # 1. Allineamento del modo HVAC Master
    - if:
        - condition: template
          value_template: "{{ target_mode != hvac_mode_attuale }}"
        - condition: template
          value_template: "{{ states('input_select.fancoil_system_hvac_mode') not in ['unknown', 'unavailable', None] }}"
      then:
        - action: input_select.select_option
          target:
            entity_id: input_select.fancoil_system_hvac_mode
          data:
            option: "{{ target_mode }}"
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Global] (Created: {{ now().strftime('%H:%M:%S') }}) Cambio stato globale: {{ hvac_mode_attuale }} -> {{ target_mode }} (Sched: {{ 'ON' if sched_on else 'OFF' }}, Switch: {{ 'ON' if switch_on else 'OFF' }}, Trigger: {{ trigger.get('entity_id', trigger.platform) }})"

    # 2. Logging Blocchi (solo se il sistema è acceso)
    - if:
        - condition: template
          value_template: "{{ target_mode != 'off' and block_reason != 'none' }}"
      then:
        - event: fancoil_log_event
          event_data:
            level: warning
            message: "[Global] (Created: {{ now().strftime('%H:%M:%S') }}) Sistema in blocco temporaneo. Motivo: {{ block_reason }}"

    # 3. Logging Ripristino (se era bloccato e ora non lo è più)
    - if:
        - condition: template
          value_template: "{{ target_mode != 'off' and block_reason == 'none' and (trigger.from_state is defined and trigger.from_state.state != trigger.to_state.state or trigger.platform == 'homeassistant') }}"
      then:
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Global] (Created: {{ now().strftime('%H:%M:%S') }}) Blocchi rimossi, sistema operativo."

