- id: log_luce_scale_state_change
  alias: "Log Luce Scale State Change"
  description: "Logga l'accensione e lo spegnimento effettivo della luce scale con il motivo."
  initial_state: true
  trigger:
    - platform: state
      entity_id: light.luce_scale
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
  action:
    - variables:
        user_id: "{{ trigger.to_state.context.user_id }}"
        parent_id: "{{ trigger.to_state.context.parent_id }}"
        source: "{{ states('input_text.scale_light_source') }}"
        # Riconoscimento utente o sistema
        user_name: >
          {% if user_id is not none %}
            {% set person = states.person | selectattr('attributes.user_id', 'eq', user_id) | first | default(none) %}
            {{ person.attributes.friendly_name if person else 'ID:' ~ user_id[:8] }}
          {% else %}
            none
          {% endif %}
        # Riconoscimento motivo finale
        reason: >
          {% if source != '' %}
            {{ source }}
          {% elif user_name != 'none' %}
            Interfaccia ({{ user_name }})
          {% elif parent_id is not none %}
            Sistema (Azione Automatica)
          {% else %}
            Pulsante Fisico
          {% endif %}
    - event: scale_log_event
      event_data:
        level: INFO
        action: "{{ 'acceso' if trigger.to_state.state == 'on' else 'spento' }}"
        message: "Luce scale cambiata a {{ trigger.to_state.state }} (Motivo: {{ reason }})"
        wait: 1
  mode: queued
