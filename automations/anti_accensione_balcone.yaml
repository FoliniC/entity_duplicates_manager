# Anti-Accensione Balcone
# ─────────────────────────────────────────────────────────────────────────────
# Spegne la luce del balcone quando si accende per un comando ESTERNO non voluto
# (pulsante fisico, telecomando RF).
#
# Come distingue le accensioni legittime da quelle non volute:
#   - UI / App           -> context.user_id valorizzato       -> NON intercetta
#   - Automazione HA     -> context.parent_id valorizzato     -> NON intercetta
#   - Alexa/SmartLife    -> traffico cloud Tuya recente (<10s) -> NON intercetta (via sensor.tuya_balcone_recent_cloud_traffic)
#   - Fisico/RF/Cloud    -> user_id=None AND parent_id=None   -> INTERCETTA e spegne
#
# Le automazioni del tramonto (accendi_balcone / spegni_balcone) e gli interventi
# manuali da dashboard NON vengono toccati.
# Per accendere fisicamente col pulsante reale, disabilitare questa automazione
# dall'UI di HA (Impostazioni -> Automazioni).
# ─────────────────────────────────────────────────────────────────────────────

- id: anti_accensione_balcone
  alias: "Balcone: Anti-Accensione (comando esterno)"
  description: "Spegne la luce balcone se accesa da una sorgente esterna non voluta (fisico/RF). Chiama script.anti_accensione_balcone_check che verifica traffico cloud Tuya real-time sul router (<15s). Se c'è traffico -> Alexa/SmartLife legittimo -> NON interviene."
  mode: single
  initial_state: true
  trigger:
    - platform: state
      entity_id: switch.luce_balcone_switch_1
      to: "on"
  condition:
    # Solo accensioni con origine ESTERNA: nessun utente e nessuna automazione.
    # Esclude: UI/App (user_id), Automazioni (parent_id), Alexa/emulated_hue (source)
    - condition: template
      value_template: >
        {{ trigger.to_state.context.user_id is none
           and trigger.to_state.context.parent_id is none
           and (trigger.to_state.context.source | default('')) not in ['alexa', 'emulated_hue', 'hue'] }}
  action:
    # Chiama script che verifica traffico cloud Tuya real-time e decide se spegnere
    - action: script.turn_on
      target:
        entity_id: script.anti_accensione_balcone_check
