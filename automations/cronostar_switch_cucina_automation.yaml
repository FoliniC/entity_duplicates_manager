- id: cronostar_switch_cucina_apply
  alias: "CronoStar - apply switch cucina"
  description: "Generated by CronoStar Editor"
  mode: restart
  triggers:
    - trigger: time_pattern
      minutes: "0"
    - trigger: event
      event_type: cronostar_profiles_loaded
  conditions:
    - condition: state
      entity_id: input_boolean.cronostar_switch_paused
      state: "off"
  actions:
    - action: cronostar.apply_now
      data:
        target_entity: "switch.luci_cucina_switch_2"
        preset_type: "generic_switch"
        global_prefix: "cronostar_switch_cucina_"