- alias: "Alexa: Modalità Uscita"
  id: alexa_modalita_uscita
  trigger:
    - platform: state
      entity_id: input_boolean.alexa_accendi_uscita
      to: "on"
  action:
    # 0. Attiva blocco per evitare che l'apertura porta riaccenda la luce scale
    - service: system_log.write
      data:
        level: info
        message: "Automation alexa_modalita_uscita TRIGGERED"
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.block_scale_light_on_door_open
    # 1. Verifica e corregge modalità tethering via traceroute (primo hop 192.168.0.11 = Normale)
    - service: script.turn_on
      target:
        entity_id: script.verify_tether_normale
    # 2. Verifica modalità tethering = Normale (dopo auto-correzione)
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_select.usb_tether_mode') != 'Normale' }}"
          sequence:
            - service: system_log.write
              data:
                level: warning
                message: "Alexa Uscita: modalità tethering NON è Normale (attuale: {{ states('input_select.usb_tether_mode') }})"
            - service: notify.send_message
              target:
                entity_id: notify.cucina_speak
              data:
                message: "Attenzione: la connessione non è in modalità Normale. Attualmente è {{ states('input_select.usb_tether_mode') }}. Cambiala in Normale prima di uscire."
    # 2. Spegni tutte le luci (tranne light.uscita che è il trigger)
    - service: light.turn_off
      target:
        entity_id:
          - light.luce_scale
          - light.verifica
    - service: switch.turn_off
      target:
        entity_id:
          - switch.luci_cucina
          - switch.bancone_cucina
          - switch.tavolo_cucina
          - switch.cucina_luci_cucina_switch_4
    # 3. Spegni radio/sistema audio se in riproduzione
    - service: system_log.write
      data:
        level: info
        message: "Alexa Uscita - Invio comando FERMA a tutti i device Alexa (stati: cucina={{ states('media_player.cucina') }}, sistema_audio={{ states('media_player.sistema_audio') }}, 2o_echo={{ states('media_player.2o_echo_dot_di_carlo') }})"
    - choose:
        # alexa_media (supporta media_stop) - Ora abilitato!
        - conditions:
            - condition: state
              entity_id: media_player.2o_echo_dot_di_carlo
              state: "playing"
          sequence:
            - service: media_player.media_stop
              target:
                entity_id: media_player.2o_echo_dot_di_carlo
        - conditions:
            - condition: state
              entity_id: media_player.echo_dot_di_carlo
              state: "playing"
          sequence:
            - service: media_player.media_stop
              target:
                entity_id: media_player.echo_dot_di_carlo
        # alexa_devices - SEMPRE invia "ferma" (non controlla stato, non fa male se non suona)
        - conditions: []
          sequence:
            - service: alexa_devices.send_text_command
              data:
                device_id: "9f7fa85d1597bcdd4948d75d1524dad8"
                text_command: "ferma"
            - service: alexa_devices.send_text_command
              data:
                device_id: "e029aab2768927141cbfaf737132ed29"
                text_command: "ferma"
    # 4. Accendi luci scale (per percorso uscita)
    - service: light.turn_on
      target:
        entity_id: light.luce_scale
    # 5. Saluto finale
    - service: notify.send_message
      target:
        entity_id: notify.cucina_speak
      data:
        message: "Arrivederci Carlo!"
    # 6. Auto-reset input_boolean Alexa dopo 3 secondi
    - delay: "00:00:03"
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.alexa_accendi_uscita