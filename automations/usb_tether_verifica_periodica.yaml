- alias: "USB Tether - verifica periodica modalità Normale"
  id: usb_tether_verifica_periodica_normale_standalone
  description: "Controlla ogni 60s se la rotta primaria è via router (192.168.0.11) e corregge usb_tether_mode"
  trigger:
    - platform: time_pattern
      minutes: "/1"
  action:
    - service: script.turn_on
      target:
        entity_id: script.verify_tether_normale
    - event: halog2026_write_event
      event_data:
        subsystem: usb_tether
        level: DEBUG
        message: "Verifica periodica modalità Normale completata"
  mode: single