# FASE 7 - Notifiche persistenti consiglio finestra
# Si attiva quando il consiglio finestra cambia e rimane stabile per 5 minuti.
# Invia una persistent_notification con contesto completo.
# La notifica viene rimossa quando il consiglio torna a nessuna_azione/incerto.

- alias: "Bagno: Notifica Consiglio Finestra"
  id: notifica_consiglio_finestra_bagno
  trigger:
    - platform: state
      entity_id: sensor.consiglio_finestra_bagno
      to:
        - "apri"
        - "chiudi"
      for:
        minutes: 5
  condition: []
  action:
    - action: persistent_notification.create
      data:
        notification_id: "finestra_bagno"
        title: >-
          {% set consiglio = states('sensor.consiglio_finestra_bagno') %}
          {% if consiglio == 'apri' %}
            🪟 Apri la finestra – Bagno
          {% elif consiglio == 'chiudi' %}
            🔒 Chiudi la finestra – Bagno
          {% else %}
            ℹ️ Consiglio finestra – Bagno
          {% endif %}
        message: >-
          {% set consiglio = states('sensor.consiglio_finestra_bagno') %}
          {% set motivo = state_attr('sensor.consiglio_finestra_bagno', 'motivo') | default('N/A') %}
          {% set delta = state_attr('sensor.consiglio_finestra_bagno', 'delta_omega') | float(0) | round(2) %}
          {% set trend = state_attr('sensor.consiglio_finestra_bagno', 'trend_umidita') | default('N/A') %}
          {% set finestra = state_attr('sensor.consiglio_finestra_bagno', 'finestra_aperta') %}
          {% set confidenza = state_attr('sensor.consiglio_finestra_bagno', 'confidenza') | default(0) %}
          {% set rh = states('sensor.umidita_bagno_pilota') | float(0) | round(1) %}
          **Stanza:** Bagno
          **Consiglio:** {{ consiglio }}
          **Umidità interna:** {{ rh }}%
          **Trend umidità:** {{ trend }}
          **Delta omega:** {{ delta }} g/kg
          **Finestra dichiarata:** {{ 'aperta' if finestra else 'chiusa' }}
          **Confidenza:** {{ confidenza }}%
          **Motivo:** {{ motivo }}

- alias: "Bagno: Rimuovi Notifica Finestra"
  id: rimuovi_notifica_finestra_bagno
  trigger:
    - platform: state
      entity_id: sensor.consiglio_finestra_bagno
      to:
        - "nessuna_azione"
        - "incerto"
        - "mantieni_aperta"
        - "mantieni_chiusa"
  condition: []
  action:
    - action: persistent_notification.dismiss
      data:
        notification_id: "finestra_bagno"
