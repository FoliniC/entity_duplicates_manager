# FASE 8 - Window State & Advice Logger
# Logga i cambiamenti di stato finestra e consiglio finestra nel log fancoil_events
trigger:
  - platform: state
    entity_id:
      - input_boolean.finestra_cucina_aperta
      - sensor.consiglio_finestra_cucina
sensor:
  - name: "Finestra Cucina Logger"
    unique_id: finestra_cucina_logger
    state: >
      {% set finestra = is_state('input_boolean.finestra_cucina_aperta', 'on') %}
      {% set consiglio = states('sensor.consiglio_finestra_cucina') %}
      {% set rh = states('sensor.umidita_cucina_pilota') | float(0) %}
      {% set omega_int = states('sensor.omega_cucina') | float(0) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(0) %}
      {% set delta_omega = (omega_int - omega_ext) | round(2) %}
      {% set trend = states('sensor.trend_umidita_cucina') %}
      {{ 'aperta' if finestra else 'chiusa' }} | {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | trend={{ trend }}
    attributes:
      finestra_aperta: "{{ is_state('input_boolean.finestra_cucina_aperta', 'on') }}"
      consiglio_finestra: "{{ states('sensor.consiglio_finestra_cucina') }}"
      rh_int: "{{ states('sensor.umidita_cucina_pilota') | float(0) }}"
      omega_int: "{{ states('sensor.omega_cucina') | float(0) }}"
      omega_ext: "{{ states('sensor.omega_esterno') | float(0) }}"
      delta_omega: "{{ (states('sensor.omega_cucina') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) }}"
      trend_umidita: "{{ states('sensor.trend_umidita_cucina') }}"
      temp_int: "{{ states('sensor.temperatura_cucina_reale_calcolata') | float(0) }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_cucina_switch_1', 'on') or is_state('switch.fancoil_cucina_switch_2', 'on') or is_state('switch.fancoil_cucina_switch_3', 'on') or is_state('switch.fancoil_cucina_switch_4', 'on') }}"
    availability: >
      {{ has_value('input_boolean.finestra_cucina_aperta') and has_value('sensor.consiglio_finestra_cucina') }}
  - action: call_service
    service: logbook.log
    data:
      name: "Finestra Cucina"
      message: >
        {% set finestra = is_state('input_boolean.finestra_cucina_aperta', 'on') %}
        {% set consiglio = states('sensor.consiglio_finestra_cucina') %}
        {% set rh = states('sensor.umidita_cucina_pilota') | float(0) %}
        {% set delta_omega = (states('sensor.omega_cucina') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) %}
        {% set trend = states('sensor.trend_umidita_cucina') %}
        Finestra {{ 'APERTA' if finestra else 'CHIUSA' }} | Consiglio: {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | Trend={{ trend }}
    target: {}
  - action: fancoil_log_event
    data:
      level: info
      message: >
        {% set finestra = is_state('input_boolean.finestra_cucina_aperta', 'on') %}
        {% set consiglio = states('sensor.consiglio_finestra_cucina') %}
        {% set rh = states('sensor.umidita_cucina_pilota') | float(0) %}
        {% set delta_omega = (states('sensor.omega_cucina') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) %}
        {% set trend = states('sensor.trend_umidita_cucina') %}
        [Cucina] WINDOW: Finestra {{ 'APERTA' if finestra else 'CHIUSA' }} | Consiglio: {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | Trend={{ trend }}
    target: {}
