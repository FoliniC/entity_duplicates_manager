# Template: /usr/share/hassio/homeassistant/yaml_generator/templates/fancoil_automation.j2
# MODIFIED for unified persistence using input helpers and trigger-based templates
# Removed all Pyscript state save/restore logic

- id: "fancoil_camera_grande_fanmode_dynamics"
  alias: "Fancoil Camera grande fanmode dinamica"
  initial_state: true
  mode: restart
  description: >-
    Regola la velocità ventola del fan-coil Camera grande in base alla distanza dal setpoint e alla modalità caldo/freddo.
  triggers:
    - trigger: state
      entity_id:
        - sensor.fancoil_camera_grande_hvac_temp_mode
        - sensor.fancoil_camera_grande_temperature_difference
        - binary_sensor.fancoil_camera_grande_stop_condition
        - input_number.fancoil_camera_grande_setpoint
        - input_boolean.fancoil_camera_grande_enabled
        - input_boolean.fancoil_deumidificazione
        - switch.attiva_fancoil
        - switch.attiva_pdc
        - switch.attiva_pompa_circolazione
        - input_datetime.fancoil_camera_grande_last_main_off
      for: "00:00:05"
    - trigger: time_pattern
      minutes: "/10"
    - trigger: event
      event_type: automation_reloaded
    - trigger: event
      event_type: fancoil_start_initialization
      event_data:
        fancoil_id: "camera_grande"
  conditions:
    - condition: state
      entity_id: input_boolean.fancoil_camera_grande_enabled
      state: "on"
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.platform == 'event' and trigger.event.event_type == 'fancoil_start_initialization' }}"
      then:
        - delay: "00:00:15"
        - wait_template: >-
            {{ states('input_select.fancoil_system_hvac_mode') not in ['unknown', 'unavailable', None] and
               states('input_number.master_setpoint_heat') not in ['unknown', 'unavailable', None] }}
          timeout: "00:00:30"
    - variables:
        verbosity_level: "{{ states('input_select.fancoil_verbosity_level_master') | default('info') }}"
        raw_hvac_mode: "{{ states('sensor.fancoil_camera_grande_hvac_temp_mode') }}"
        hvac_temp_mode: "{{ raw_hvac_mode if raw_hvac_mode in ['heat', 'cool', 'dry', 'fan_only', 'off'] else 'off' }}"
        diff: "{{ states('sensor.fancoil_camera_grande_temperature_difference') | float(0) }}"
        stop_condition: "{{ is_state('binary_sensor.fancoil_camera_grande_stop_condition', 'on') }}"
        deumidificazione: "{{ is_state('input_boolean.fancoil_deumidificazione', 'on') }}"
        system_enabled: >-
          {{ is_state('switch.attiva_fancoil', 'on') and
             is_state('switch.attiva_pdc', 'on') and
             is_state('switch.attiva_pompa_circolazione', 'on') }}
        soglia_high: "{{ states('input_number.fan_distance_high') | float(2.0) }}"
        soglia_medium: "{{ states('input_number.fan_distance_medium') | float(1.2) }}"
        soglia_low: "{{ states('input_number.fan_distance_low') | float(0.5) }}"
        soglia_idle: "{{ states('input_number.fan_distance_idle') | float(0.3) }}"
        soglia_stop: "{{ states('input_number.fan_distance_stop') | float(-0.3) }}"
        # Isteresi di ripartenza (ampiezza) e ritardo minimo (temporale)
        soglia_resume: "{{ states('input_number.fan_distance_resume') | float(0.5) }}"
        resume_delay_minutes: "{{ states('input_number.fancoil_resume_delay_minutes') | float(3) }}"
        # Stato hardware attuale delle velocità
        fan_attuale_hw: >-
          {% set s1 = is_state('switch.fancoil_camera_grande_switch_1','on') %}
          {% set s2 = is_state('switch.fancoil_camera_grande_switch_2','on') %}
          {% set s3 = is_state('switch.fancoil_camera_grande_switch_3','on') %}
          {% set s4 = is_state('switch.fancoil_camera_grande_switch_4','on') %}
          {% if (not s1 and not s2 and not s3 and not s4) %} off
          {% elif (not s1 and not s2 and not s3 and s4) %} idle
          {% elif (s1 and not s2 and not s3 and s4) %} low
          {% elif (not s1 and s2 and not s3 and s4) %} medium
          {% elif (not s1 and not s2 and s3 and s4) %} high
          {% else %} unknown
          {% endif %}
        # Determinazione velocità target (include STOP)
        fan_target: >-
          {% if not (system_enabled | bool(false)) %}
            off
          {% elif hvac_temp_mode == 'off' %}
            off
          {% elif hvac_temp_mode == 'dry' %}
            idle
          {% elif stop_condition %}
            {{ 'idle' if deumidificazione else 'off' }}
          {% elif is_state('binary_sensor.pdc_acqua_calda', 'on') %}
            idle
          {% elif diff >= (soglia_high - 0.01) %}
            high
          {% elif diff >= (soglia_medium - 0.01) %}
            medium
          {% elif diff >= (soglia_low - 0.01) %}
            low
          {% elif diff >= (soglia_idle - 0.01) %}
            idle
          {% else %}
            {{ 'idle' if deumidificazione else 'idle' }}
          {% endif %}
        # Stati attuali climate e main
        hvac_attuale: "{{ states('climate.controllo_temperatura_camera_grande') | default('off') }}"
        main_on: "{{ is_state('switch.stox_fancoil_camera_grande_switch','on') }}"
        # Disponibilità hardware: procediamo solo se lo stox e la valvola sono realmente disponibili
        main_available: >-
          {% set stox = states('switch.stox_fancoil_camera_grande_switch') %}
          {% set vlv = states('switch.fancoil_camera_grande_switch_4') %}
          {{ stox not in ['unavailable','unknown'] and vlv not in ['unavailable','unknown'] }}
        # Disponibilità climate: esclude STOP e main OFF
        hvac_unavail: >-
          {% if stop_condition %}
            false
          {% elif not main_on %}
            false
          {% else %}
            {# Usiamo la temperatura calcolata invece del sensore interno per tolleranza guasti #}
            {% set t_calc = states('sensor.temperatura_camera_grande_reale_calcolata') %}
            {{ t_calc in ['unavailable','unknown', None, ''] or hvac_attuale in ['unavailable','unknown', None, ''] }}
          {% endif %}
        # Prima esecuzione dopo avvio/caricamento: last_triggered assente o evento start_initialization
        first_run: >-
          {{ this.attributes.last_triggered is none
              or (trigger is defined and trigger.platform == 'event' and trigger.event.event_type == 'fancoil_start_initialization') }}
        # Isteresi temporale per la ripartenza: minuti trascorsi dall'ultimo STOP main
        minutes_since_off: >-
          {% set ts = states('input_datetime.fancoil_camera_grande_last_main_off') %}
          {{ ((as_timestamp(now()) - as_timestamp(ts)) / 60) | default(9999) | float(9999) if ts not in ['unavailable', 'unknown', '', None] and as_timestamp(ts) > 0 else 9999 }}
        # Al reboot (first_run) ignoriamo il ritardo minimo per ripartire subito se serve
        resume_allowed: "{{ hvac_temp_mode == 'dry' or (deumidificazione and not stop_condition) or (not stop_condition and diff >= soglia_resume and (minutes_since_off >= resume_delay_minutes or first_run)) }}"
        logging_active: >-
          {% set follow = is_state('input_boolean.fancoil_camera_grande_logging_follow_master', 'on') %}
          {% set master_on = is_state('input_boolean.fancoil_logging_master_enabled', 'on') %}
          {% set local_on = is_state('input_boolean.fancoil_camera_grande_logging_enabled', 'on') %}
          {{ (follow and master_on) or (not follow and local_on) }}

    # Watchdog Setpoint: Se Follow è ON e il setpoint diverge, forza l'allineamento
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_camera_grande_sp_follow_master
          state: "on"
      then:
        - variables:
            # Ricalcolo puntuale del target atteso
            calc_sp_heat: "{{ states('input_number.master_setpoint_heat') | float(20) }}"
            calc_sp_cool: "{{ states('input_number.master_setpoint_cool') | float(26) }}"
            calc_offset: "{{ states('input_number.fancoil_camera_grande_sp_offset') | float(0) }}"
            calc_target: >-
              {% if hvac_temp_mode == 'heat' %}
                {{ (calc_sp_heat | float + calc_offset | float) | round(1) }}
              {% elif hvac_temp_mode == 'cool' %}
                {{ (calc_sp_cool | float + calc_offset | float) | round(1) }}
              {% else %}
                {{ state_attr('climate.controllo_temperatura_camera_grande', 'temperature') }}
              {% endif %}
            actual_sp: "{{ state_attr('climate.controllo_temperatura_camera_grande', 'temperature') | float(0) }}"
        - if:
            - condition: template
              value_template: "{{ (calc_target | float(0)) != (actual_sp | float(0)) and hvac_temp_mode in ['heat','cool'] }}"
          then:
            - event: fancoil_log_event
              event_data:
                level: warning
                message: "[Camera grande] Watchdog: Setpoint disallineato (Attuale: {{ actual_sp }}°C, Atteso: {{ calc_target }}°C). Forzo allineamento."
            - action: climate.set_temperature
              target:
                entity_id: climate.controllo_temperatura_camera_grande
              data:
                temperature: "{{ calc_target | float | clamp(5, 35) }}"

    - if:
        - condition: template
          value_template: "{{ logging_active }}"
      then:
        - event: fancoil_log_event
          event_data:
            level: info
            message: >
              {% set sp_raw = state_attr('climate.controllo_temperatura_camera_grande', 'temperature') | float(21) %}
              {% set t_raw = states('sensor.fancoil_camera_grande_last_temperature') | float(0) %}
              {% set diff_raw = states('sensor.fancoil_camera_grande_temperature_difference') | float(0) %}
              {% set trig = trigger.entity_id if trigger is defined and trigger.entity_id is defined else 'periodic/time' %}
              {% set f_st = trigger.from_state.state if trigger is defined and trigger.from_state is defined else '?' %}
              {% set t_st = trigger.to_state.state if trigger is defined and trigger.to_state is defined else '?' %}
              {% set knx_val = states('sensor.temperatura_camera_grande') if 'sensor.temperatura_camera_grande' != '' and 'sensor.temperatura_camera_grande' != '%%' ~ 'knx_temp_sensor' ~ '%%' else 'N/A' %}
              [Camera grande] State Dump: Trigger={{ trig }} ({{ f_st }}->{{ t_st }}), Temp={{ t_raw | round(2) }}°C, KNX={{ knx_val }}°C, Hum={{ states('sensor.fancoil_camera_grande_last_humidity') | default('N/A') }}% (Var: {{ states('sensor.statistics_umidita_camera_grande_variance') | default('N/A') }}), Setpoint={{ sp_raw | round(1) }}°C (Raw: {{ sp_raw }}), MasterSP={{ states('input_number.master_setpoint_heat') if hvac_temp_mode == 'heat' else states('input_number.master_setpoint_cool') }}°C, Delta={{ diff | round(2) }}°C (RawDiff: {{ diff_raw }}), Offset={{ states('input_number.fancoil_camera_grande_sp_offset') | float(0) }}°C, Target={{ fan_target }}, HvacMode={{ hvac_temp_mode }}, StopCond={{ stop_condition }}, System={{ system_enabled }}, PDC_H2O={{ states('binary_sensor.pdc_acqua_calda') }}, Comm={{ states('sensor.fancoil_camera_grande_status_comunicazione') }}, T_Circ={{ states('sensor.temperatura_circuito_riscaldamento') | default('N/A') }}°C, Main={{ states('switch.stox_fancoil_camera_grande_switch') }}, Soglie=[S:{{ soglia_stop }}, I:{{ soglia_idle }}, L:{{ soglia_low }}, M:{{ soglia_medium }}, H:{{ soglia_high }}], SW=[{% for i in range(1,5) %}{% set s = states('switch.fancoil_camera_grande_switch_' ~ i) %}{{ '1' if s == 'on' else ('0' if s == 'off' else ('U' if s == 'unavailable' else ('?' if s == 'unknown' else 'N'))) }}{{ ',' if not loop.last }}{% endfor %}]
    # Log di debug (solo verbose) esclusi quando climate è OFF o main è OFF o climate non disponibile
    - if:
        - condition: template
          value_template: "{{ verbosity_level in ['verbose'] and hvac_temp_mode != 'off' and main_on and hvac_attuale not in ['unavailable','unknown'] }}"
      then:
        - action: persistent_notification.create
          data:
            title: "Fancoil Camera grande (debug)"
            message: >-
              Stato: hvac={{ hvac_attuale }}, temp={{ states('sensor.stox_fancoil_camera_grande_temperature') | float(0) }}°C, setpoint={{ state_attr('climate.controllo_temperatura_camera_grande', 'temperature') | float(21) }}°C,
              calcolo_mode={{ hvac_temp_mode }}, diff={{ diff | round(2) }}°C,
              fan_hw={{ fan_attuale_hw }}, fan_target={{ fan_target }}
        - event: fancoil_log_event
          event_data:
            level: debug
            message: "[Camera grande] DEBUG: hvac={{ hvac_attuale }}, temp={{ states('sensor.stox_fancoil_camera_grande_temperature') | float(0) }}°C, sp={{ state_attr('climate.controllo_temperatura_camera_grande', 'temperature') | float(21) }}°C, mode={{ hvac_temp_mode }}, diff={{ diff | round(2) }}°C, fan_hw={{ fan_attuale_hw }}, fan_target={{ fan_target }}"

    # Guard globale: se PDC/pompa/fancoil globale non sono tutti attivi,
    # spegni subito i relè stanza e non proseguire con init/resume.
    - if:
        - condition: template
          value_template: "{{ not (system_enabled | bool(false)) }}"
      then:
        - if:
            - condition: template
              value_template: "{{ not main_on and main_available }}"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.stox_fancoil_camera_grande_switch
            - event: fancoil_log_event
              event_data:
                level: warning
                message: "[Camera grande] GLOBAL DISABLED: Stox acceso per mantenere temperatura/umidità disponibili."
        - if:
            - condition: template
              value_template: >-
                {{ is_state('switch.fancoil_camera_grande_switch_1','on') or
                   is_state('switch.fancoil_camera_grande_switch_2','on') or
                   is_state('switch.fancoil_camera_grande_switch_3','on') or
                   is_state('switch.fancoil_camera_grande_switch_4','on') or
                   fan_attuale_hw != 'off' }}
          then:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_camera_grande_switch_1
                  - switch.fancoil_camera_grande_switch_2
                  - switch.fancoil_camera_grande_switch_3
                  - switch.fancoil_camera_grande_switch_4
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.fancoil_camera_grande_last_main_off
              data:
                datetime: "{{ now().isoformat() }}"
            - event: fancoil_log_event
              event_data:
                level: warning
                message: "[Camera grande] GLOBAL DISABLED: spengo relè stanza. attiva_fancoil={{ states('switch.attiva_fancoil') }}, pdc={{ states('switch.attiva_pdc') }}, pompa={{ states('switch.attiva_pompa_circolazione') }}, fan_hw={{ fan_attuale_hw }}"
        - if:
            - condition: template
              value_template: "{{ hvac_attuale not in ['unavailable','unknown'] }}"
          then:
            - action: climate.set_fan_mode
              target:
                entity_id: climate.controllo_temperatura_camera_grande
              data:
                fan_mode: "off"
        - stop: "Sistema fancoil globale non abilitato"
    # Verifica disponibilità climate
    - if:
        - condition: template
          value_template: "{{ hvac_unavail }}"
      then:
        - if:
            - condition: template
              value_template: "{{ verbosity_level in ['error', 'info', 'verbose'] }}"
          then:
            - action: persistent_notification.create
              data:
                title: "Fancoil Camera grande"
                message: "Climate non disponibile ({{ hvac_attuale }}). Automazione sospesa."
            - event: fancoil_log_event
              event_data:
                level: warning
                message: "[Camera grande] Climate UNAVAILABLE - stato={{ hvac_attuale }}, main_on={{ main_on }}"
      else:
        # Inizializzazione prima esecuzione
        - if:
            - condition: template
              value_template: "{{ first_run }}"
          then:
            # Forza accensione switch principale (Stox)
            - action: switch.turn_on
              target:
                entity_id: switch.stox_fancoil_camera_grande_switch
            - event: fancoil_log_event
              event_data:
                level: info
                message: >
                  [Camera grande] INITIALIZATION - Global Config: MasterMode={{ states('input_select.fancoil_system_hvac_mode') }}, MasterSP=[H:{{ states('input_number.master_setpoint_heat') }}, C:{{ states('input_number.master_setpoint_cool') }}], Soglie=[S:{{ soglia_stop }}, I:{{ soglia_idle }}, L:{{ soglia_low }}, M:{{ soglia_medium }}, H:{{ soglia_high }}], Verbosity={{ verbosity_level }}, MasterLog={{ states('input_boolean.fancoil_logging_master_enabled') }} | Local Config: Offset={{ states('input_number.fancoil_camera_grande_sp_offset') }}, FollowSP={{ is_state('input_boolean.fancoil_camera_grande_sp_follow_master', 'on') }}, FollowHVAC={{ is_state('input_boolean.fancoil_camera_grande_hvac_mode_follow_master', 'on') }}
            # RESTORE VALUES FROM TRIGGER-BASED SENSORS (PERSISTENCE)
            - action: input_number.set_value
              target:
                entity_id: input_number.fancoil_camera_grande_sp_offset
              data:
                value: "{{ states('sensor.fancoil_camera_grande_saved_offset') | float(0) }}"
            - delay: "00:00:01"
            - event: fancoil_log_event
              event_data:
                level: info
                message: "[Camera grande] DEBUG First Run: raw_hvac_mode='{{ raw_hvac_mode }}', hvac_temp_mode='{{ hvac_temp_mode }}'"
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.controllo_temperatura_camera_grande
              data:
                hvac_mode: "{{ hvac_temp_mode if hvac_temp_mode != 'off' else 'heat' }}"
            - delay: "00:00:02"

        # Gestione STOP: se la differenza è sotto soglia_stop O la modalità è OFF, spegni il fancoil (velocità+valvola)
        - if:
            - condition: template
              value_template: "{{ (stop_condition and not deumidificazione and hvac_temp_mode != 'dry') or hvac_temp_mode == 'off' }}"
          then:
            # Esegui STOP solo se il fancoil è realmente attivo; in caso contrario evita log ripetuti
            - if:
                - condition: template
                  value_template: >-
                    {{ is_state('switch.fancoil_camera_grande_switch_1','on') or
                       is_state('switch.fancoil_camera_grande_switch_2','on') or
                       is_state('switch.fancoil_camera_grande_switch_3','on') or
                       is_state('switch.fancoil_camera_grande_switch_4','on') }}
              then:
                - action: switch.turn_off
                  target:
                    entity_id:
                      - switch.fancoil_camera_grande_switch_1
                      - switch.fancoil_camera_grande_switch_2
                      - switch.fancoil_camera_grande_switch_3
                      - switch.fancoil_camera_grande_switch_4
                - delay: "00:00:02"
                # Memorizza timestamp STOP e logga su file SOLO quando si è effettuato lo spegnimento
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.fancoil_camera_grande_last_main_off
                  data:
                    datetime: "{{ now().isoformat() }}"
                - event: fancoil_log_event
                  event_data:
                    level: info
                    message: >
                      {% if hvac_temp_mode == 'off' %}
                        [Camera grande] STOP fancoil: modalità impostata su OFF
                      {% else %}
                        [Camera grande] STOP fancoil: diff={{ diff | round(2) }}°C ≤ {{ soglia_stop }}, mode={{ hvac_temp_mode }}
                      {% endif %}
                - if:
                    - condition: template
                      value_template: "{{ verbosity_level in ['verbose'] }}"
                  then:
                    - action: persistent_notification.create
                      data:
                        title: "Fancoil Camera grande"
                        message: >-
                          {% if hvac_temp_mode == 'off' %}
                            STOP attivo: modalità OFF, spengo switch velocità/valvola.
                          {% else %}
                            STOP attivo: diff={{ diff | round(2) }}°C ≤ {{ soglia_stop }}, spengo switch velocità/valvola.
                          {% endif %}
                    - event: fancoil_log_event
                      event_data:
                        level: info
                        message: >
                          {% if hvac_temp_mode == 'off' %}
                            [Camera grande] STOP attivo: modalità OFF
                          {% else %}
                            [Camera grande] STOP attivo: diff={{ diff | round(2) }}°C ≤ {{ soglia_stop }}
                          {% endif %}
          else:
            # Riaccendi il main (RESUME) solo se disponibile e con isteresi (bypass ritardo al primo avvio)
            - if:
                - condition: template
                  value_template: "{{ hvac_temp_mode != 'off' and not main_on and main_available and (not stop_condition or deumidificazione or hvac_temp_mode == 'dry') and (first_run or resume_allowed) }}"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.stox_fancoil_camera_grande_switch
                - delay: "00:00:07"
                # Log di ripartenza e traccia timestamp
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.fancoil_camera_grande_last_main_on
                  data:
                    datetime: "{{ now().isoformat() }}"
                - event: fancoil_log_event
                  event_data:
                    level: info
                    message: "[Camera grande] RESUME main: diff={{ diff | round(2) }}°C ≥ {{ soglia_resume }}, attesa={{ resume_delay_minutes }} min"
            # Aggiornamento velocità ventola se necessario
            - variables:
                debounce_seconds: "{{ states('input_number.fancoil_debounce_seconds') | float(30) }}"
            - if:
                - condition: template
                  value_template: "{{ fan_target != fan_attuale_hw and hvac_temp_mode != 'off' and main_available }}"
              then:
                - delay: "00:00:{{ '%02d' % (debounce_seconds | int % 60) }}"
                - condition: template
                  value_template: "{{ fan_target == fan_attuale_hw or True }}" # Re-check condition after delay
                - event: fancoil_log_event
                  event_data:
                    level: info
                    message: "[Camera grande] Cambiamento velocità: {{ fan_attuale_hw }} -> {{ fan_target }} (Delta: {{ diff | round(2) }}°C, Inerzia: {{ debounce_seconds }}s)"
                - action: climate.set_fan_mode
                  target:
                    entity_id: climate.controllo_temperatura_camera_grande
                  data:
                    fan_mode: "{{ fan_target }}"

- id: "fancoil_camera_grande_master_off_handler"
  alias: "Fancoil Camera grande: spegnimento quando master OFF"
  initial_state: true
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_select.fancoil_system_hvac_mode
      to: "off"
  conditions:
    - condition: state
      entity_id: input_boolean.fancoil_camera_grande_hvac_mode_follow_master
      state: "on"
    - condition: not
      conditions:
        - condition: state
          entity_id: climate.controllo_temperatura_camera_grande
          state: "unavailable"
  actions:
    - action: climate.turn_off
      target:
        entity_id: climate.controllo_temperatura_camera_grande
    - delay: "00:00:01"

- id: "fancoil_camera_grande_unfollow_on_manual_setpoint"
  alias: "Fancoil Camera grande: disattiva Follow su cambio setpoint manuale"
  initial_state: true
  mode: single
  triggers:
    - trigger: state
      entity_id: input_number.fancoil_camera_grande_setpoint
  conditions:
    - condition: state
      entity_id: input_boolean.fancoil_camera_grande_sp_follow_master
      state: "on"
    - condition: template
      value_template: "{{ trigger.to_state.context.user_id is not none }}"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.fancoil_camera_grande_sp_follow_master

- id: "fancoil_camera_grande_allinea_master"
  alias: "Fancoil Camera grande: allinea al master quando Follow Mode ON"
  initial_state: true
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.fancoil_camera_grande_hvac_mode_follow_master
      to: "on"
    - trigger: state
      entity_id: input_boolean.fancoil_camera_grande_sp_follow_master
      to: "on"
    - trigger: state
      entity_id: input_select.fancoil_system_hvac_mode
    - trigger: state
      entity_id:
        - input_number.master_setpoint_heat
        - input_number.master_setpoint_cool
        - input_number.fancoil_camera_grande_sp_offset
    - trigger: homeassistant
      event: start
  conditions:
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.fancoil_camera_grande_hvac_mode_follow_master
          state: "on"
        - condition: state
          entity_id: input_boolean.fancoil_camera_grande_sp_follow_master
          state: "on"
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.platform == 'homeassistant' or (trigger.event is defined and trigger.event == 'start') }}"
      then:
        - delay: "00:00:15"
        - wait_template: >-
            {{ states('input_select.fancoil_system_hvac_mode') not in ['unknown', 'unavailable', None] and
               states('input_number.master_setpoint_heat') not in ['unknown', 'unavailable', None] }}
          timeout: "00:00:30"
    - variables:
        master_hvac_mode: "{{ states('input_select.fancoil_system_hvac_mode') | default('off') }}"
        room_state: "{{ states('climate.controllo_temperatura_camera_grande') | default('off') }}"
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_camera_grande_hvac_mode_follow_master
          state: "on"
        - condition: template
          value_template: "{{ master_hvac_mode != room_state and room_state not in ['unavailable','unknown'] }}"
      then:
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ master_hvac_mode == 'off' }}"
              sequence:
                - action: climate.turn_off
                  target:
                    entity_id: climate.controllo_temperatura_camera_grande
            - conditions:
                - condition: template
                  value_template: "{{ master_hvac_mode != 'off' }}"
              sequence:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: climate.controllo_temperatura_camera_grande
                  data:
                    hvac_mode: "{{ master_hvac_mode }}"
    # Aggiorna setpoint se follow è attivo
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_camera_grande_sp_follow_master
          state: "on"
      then:
        - variables:
            sp_heat: "{{ states('input_number.master_setpoint_heat') | float(20) }}"
            sp_cool: "{{ states('input_number.master_setpoint_cool') | float(26) }}"
            offset: "{{ states('input_number.fancoil_camera_grande_sp_offset') | float(0) }}"
            new_sp: >-
              {% if master_hvac_mode == 'heat' %}
                {{ (sp_heat | float + offset | float) | round(1) }}
              {% elif master_hvac_mode == 'cool' %}
                {{ (sp_cool | float + offset | float) | round(1) }}
              {% else %}
                {{ state_attr('climate.controllo_temperatura_camera_grande','temperature') | float(21) }}
              {% endif %}
        - action: climate.set_temperature
          target:
            entity_id: climate.controllo_temperatura_camera_grande
          data:
            temperature: "{{ new_sp | float | clamp(5, 35) }}"

- id: "fancoil_camera_grande_main_power_sync"
  alias: "Fancoil Camera grande: sincronizza switch principale"
  initial_state: true
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - switch.fancoil_camera_grande_switch_1
        - switch.fancoil_camera_grande_switch_2
        - switch.fancoil_camera_grande_switch_3
        - switch.fancoil_camera_grande_switch_4
    - trigger: time_pattern
      minutes: "/30"
  actions:
    - variables:
        stop_condition: "{{ is_state('binary_sensor.fancoil_camera_grande_stop_condition', 'on') }}"
        any_speed_on: >-
          {{ is_state('switch.fancoil_camera_grande_switch_1','on') or
             is_state('switch.fancoil_camera_grande_switch_2','on') or
             is_state('switch.fancoil_camera_grande_switch_3','on') or
             is_state('switch.fancoil_camera_grande_switch_4','on') }}
        main_on: "{{ is_state('switch.stox_fancoil_camera_grande_switch','on') }}"
        main_available: "{{ states('switch.stox_fancoil_camera_grande_switch') not in ['unavailable','unknown', None, ''] }}"
        system_enabled: >-
          {{ is_state('switch.attiva_fancoil', 'on') and
             is_state('switch.attiva_pdc', 'on') and
             is_state('switch.attiva_pompa_circolazione', 'on') }}
        # Determiniamo se l'hardware a valle è disponibile (non in stato unavailable)
        fan_hw_available: >-
          {{ states('switch.fancoil_camera_grande_switch_1') not in ['unavailable', 'unknown'] }}
    - choose:
        # Se lo Stox è OFF e l'hardware è disponibile (comunicante) → accendi Stox per lettura temperatura
        - conditions:
            - condition: template
              value_template: "{{ not main_on and main_available }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.stox_fancoil_camera_grande_switch
            - delay: "00:00:02"
            - event: fancoil_log_event
              event_data:
                level: info
                message: "[Camera grande] FORCE MAIN ON (always-on logic): Stox alimentato per lettura temperatura/umidità. System={{ system_enabled }}, Delta={{ states('sensor.fancoil_camera_grande_temperature_difference') | float(0) | round(2) }}°C"
        # Se qualche velocità è ON ma main è OFF (caso improbabile dopo la modifica precedente) → accendi main
        - conditions:
            - condition: template
              value_template: "{{ (system_enabled | bool(false)) and any_speed_on and not main_on and not stop_condition and main_available }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.stox_fancoil_camera_grande_switch
            - delay: "00:00:02"
            - event: fancoil_log_event
              event_data:
                level: info
                message: "[Camera grande] MAIN ON (sync): speed_on={{ any_speed_on }}, stop_condition={{ stop_condition }}, diff={{ states('sensor.fancoil_camera_grande_temperature_difference') | float(0) | round(2) }}°C"
        # Se tutte le velocità sono OFF ma main è ON (senza STOP) → non spegnere main (log solo se disponibile)
        - conditions:
            - condition: template
              value_template: "{{ not any_speed_on and not stop_condition and main_on and main_available }}"
          sequence:
            - event: fancoil_log_event
              event_data:
                level: info
                message: "[Camera grande] (sync): tutte le velocità OFF, main resta ON. diff={{ states('sensor.fancoil_camera_grande_temperature_difference') | float(0) | round(2) }}°C, stop_condition={{ stop_condition }}"

- id: "fancoil_camera_grande_entity_monitor"
  alias: "Fancoil Camera grande: Monitor disponibilità entità"
  initial_state: true
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      hours: "/12"
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.platform == 'homeassistant' or (trigger.event is defined and trigger.event == 'start') }}"
      then:
        - delay:
            seconds: "{{ range(1, 20) | random }}"
        - wait_template: "{{ is_state('input_text.fancoil_boot_semaphore', 'none') }}"
          timeout: "00:20:00"
        - action: input_text.set_value
          target:
            entity_id: input_text.fancoil_boot_semaphore
          data:
            value: "camera_grande"
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Camera grande] Semaphore acquired (Entity: input_text.fancoil_boot_semaphore, Owner: {{ states('input_text.fancoil_boot_semaphore') }}). Starting polling."
        - repeat:
            while:
              - condition: template
                value_template: >-
                  {% set critical_entities = [
                    'switch.stox_fancoil_camera_grande_switch',
                    'climate.controllo_temperatura_camera_grande',
                    'input_number.fan_distance_stop'
                  ] %}
                  {# Semaphore: Check first entity first #}
                  {% if states(critical_entities[0]) in ['unavailable', 'unknown'] %}
                    {{ repeat.index <= 40 }}
                  {% else %}
                    {# First is OK, check if any others are missing #}
                    {% set ns = namespace(missing_count=0) %}
                    {% for entity in critical_entities %}
                      {% if states(entity) in ['unavailable', 'unknown'] %}
                        {% set ns.missing_count = ns.missing_count + 1 %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.missing_count > 0 and repeat.index <= 40 }}
                  {% endif %}
            sequence:
              - variables:
                  missing_report: >-
                    {% set critical_entities = [
                      'switch.stox_fancoil_camera_grande_switch',
                      'climate.controllo_temperatura_camera_grande',
                      'input_number.fan_distance_stop'
                    ] %}
                    {% if states(critical_entities[0]) in ['unavailable', 'unknown'] %}
                      ['{{ critical_entities[0] }}'] (BLOCKING)
                    {% else %}
                      {% set ns = namespace(missing=[]) %}
                      {% for entity in critical_entities %}
                        {% if states(entity) in ['unavailable', 'unknown'] %}
                          {% set ns.missing = ns.missing + [entity] %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.missing }}
                    {% endif %}
              - event: fancoil_log_event
                event_data:
                  level: info
                  message: "[Camera grande] Polling check {{ repeat.index }}/40: Waiting for {{ missing_report }} (next check in 15s)"
              - delay: "00:00:15"
        - action: input_text.set_value
          target:
            entity_id: input_text.fancoil_boot_semaphore
          data:
            value: "none"
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Camera grande] Semaphore released."
    - variables:
        critical_entities:
          - switch.stox_fancoil_camera_grande_switch
          - climate.controllo_temperatura_camera_grande
          - input_number.fan_distance_stop
        unavailable: >-
          {% set ns = namespace(items=[]) %}
          {% for entity in critical_entities %}
            {% if states(entity) in ['unavailable','unknown'] %}
              {% set ns.items = ns.items + [entity] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
    - if:
        - condition: template
          value_template: "{{ unavailable | length > 0 }}"
      then:
        - action: persistent_notification.create
          data:
            title: "Fancoil Camera grande: Problema Entità"
            message: >-
              Entità non disponibili dopo polling:
              {% for entity in unavailable %}
              - {{ entity }}
              {% endfor %}
        - event: fancoil_log_event
          event_data:
            level: warning
            message: "[Camera grande] Entità UNAVAILABLE dopo polling: {{ unavailable }}"
      else:
        - if:
            - condition: template
              value_template: "{{ trigger.platform == 'homeassistant' or (trigger.event is defined and trigger.event == 'start') }}"
          then:
            - event: fancoil_log_event
              event_data:
                level: info
                message: "[Camera grande] Tutte le entità disponibili. Avvio inizializzazione."
            - event: fancoil_start_initialization
              event_data:
                fancoil_id: "camera_grande"

