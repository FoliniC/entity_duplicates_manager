- id: "fancoil_camera_grande_recovery_stuck"
  alias: "Fancoil Camera grande: Ripristino anomalie (Temp/Speed)"
  initial_state: true
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.fancoil_camera_grande_last_temperature
      for: "00:20:00" # Ridotto da 45 a 20 minuti
    - trigger: time_pattern
      minutes: "/15" # Controllo periodico per speed mismatch
  conditions:
    - condition: state
      entity_id: input_boolean.fancoil_camera_grande_enabled
      state: "on"
  actions:
    - variables:
        # Ricalcoliamo target e attuale per verificare mismatch
        diff: "{{ states('sensor.fancoil_camera_grande_temperature_difference') | float(0) }}"
        stop_condition: "{{ is_state('binary_sensor.fancoil_camera_grande_stop_condition', 'on') }}"
        hvac_mode: "{{ states('sensor.fancoil_camera_grande_hvac_temp_mode') }}"
        deumidificazione: "{{ is_state('input_boolean.fancoil_deumidificazione', 'on') }}"
        system_enabled: >-
          {{ is_state('switch.attiva_fancoil', 'on') and
             is_state('switch.attiva_pdc', 'on') and
             is_state('switch.attiva_pompa_circolazione', 'on') }}
        soglia_high: "{{ states('input_number.fan_distance_high') | float(2.0) }}"
        soglia_medium: "{{ states('input_number.fan_distance_medium') | float(1.2) }}"
        soglia_low: "{{ states('input_number.fan_distance_low') | float(0.5) }}"
        soglia_idle: "{{ states('input_number.fan_distance_idle') | float(0.3) }}"

        fan_target: >-
          {% if not (system_enabled | bool(false)) %}
            off
          {% elif hvac_mode == 'off' %}
            off
          {% elif hvac_mode == 'dry' %}
            idle
          {% elif stop_condition %}
            {{ 'idle' if deumidificazione else 'off' }}
          {% elif is_state('binary_sensor.pdc_acqua_calda', 'on') %}
            idle
          {% elif diff >= (soglia_high - 0.01) %}
            high
          {% elif diff >= (soglia_medium - 0.01) %}
            medium
          {% elif diff >= (soglia_low - 0.01) %}
            low
          {% elif diff >= (soglia_idle - 0.01) %}
            idle
          {% else %}
            {{ 'idle' if deumidificazione else 'idle' }}
          {% endif %}

        fan_attuale_hw: >-
          {% set s1 = is_state('switch.fancoil_camera_grande_switch_1','on') %}
          {% set s2 = is_state('switch.fancoil_camera_grande_switch_2','on') %}
          {% set s3 = is_state('switch.fancoil_camera_grande_switch_3','on') %}
          {% set s4 = is_state('switch.fancoil_camera_grande_switch_4','on') %}
          {% if (not s1 and not s2 and not s3 and not s4) %} off
          {% elif (not s1 and not s2 and not s3 and s4) %} idle
          {% elif (s1 and not s2 and not s3 and s4) %} low
          {% elif (not s1 and s2 and not s3 and s4) %} medium
          {% elif (not s1 and not s2 and s3 and s4) %} high
          {% else %} unknown
          {% endif %}

        # Anomalia Temperatura: stuck da 20 min mentre dovrebbe andare
        temp_stuck: >-
          {{ trigger.platform == 'state' and hvac_mode != 'off' and (not stop_condition or deumidificazione or hvac_mode == 'dry') and fan_attuale_hw in ['low','medium','high'] }}

        # Anomalia Velocità: target diverso da attuale per 15 min
        # Usiamo il last_changed del climate per evitare trigger immediati dopo un comando legittimo
        speed_mismatch: >-
          {% set last_ch = states.climate.controllo_temperatura_camera_grande.last_changed %}
          {% set wait_passed = (as_timestamp(now()) - as_timestamp(last_ch)) > 900 if last_ch is not none else false %}
          {{ hvac_mode != 'off' and (not stop_condition or deumidificazione or hvac_mode == 'dry') and fan_target != fan_attuale_hw and fan_target != 'off' and fan_attuale_hw != 'unknown' and wait_passed }}

        # Se il sistema globale è disabilitato, i relè a valle devono essere tutti OFF.
        # Se dopo i tentativi di spegnimento risultano ancora attivi, il dispositivo relè può essere bloccato.
        global_disabled_hw_stuck: >-
          {{ not (system_enabled | bool(false)) and fan_attuale_hw not in ['off','unknown'] }}

    - if:
        - condition: template
          value_template: "{{ temp_stuck or speed_mismatch or global_disabled_hw_stuck }}"
      then:
        - event: fancoil_log_event
          event_data:
            level: warning
            message: >-
              [Camera grande] Ripristino anomalia ({{ 'Global Disabled HW Stuck' if global_disabled_hw_stuck else ('Temp Stuck' if temp_stuck else 'Speed Mismatch') }}):
              Temp={{ states('sensor.fancoil_camera_grande_last_temperature') }}°C, Target={{ fan_target }}, Attuale={{ fan_attuale_hw }}.
              Avvio Power Cycle Stox.
        - action: switch.turn_off
          target:
            entity_id: switch.stox_fancoil_camera_grande_switch
        - delay: "00:00:10"
        - action: switch.turn_on
          target:
            entity_id: switch.stox_fancoil_camera_grande_switch
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Camera grande] Power Cycle Stox per anomalia completato."
