- id: "1758973932993"
  alias: Accendi scale se aperta porta
  description: ""
  triggers:
    - trigger: state
      to: "on"
      entity_id:
        - binary_sensor.garage_door_contact_filtered
  conditions: []
  actions:
    - action: pyscript.scale_events_write
      data:
        message: "Contatto porta garage 🚪 cambiato a {{ trigger.to_state.state }}"
        level: INFO
        action: "invariato"
        wait: 0
    - if:
        - condition: template
          value_template: "{{ trigger.to_state.state == 'on' }}"
      then:
        - if:
            - condition: state
              entity_id: light.luce_scale
              state: "on"
          then:
            - action: pyscript.scale_events_write
              data:
                message: "Accendi scale se aperta porta 🚪 - Luce già accesa, attendo 30 secondi prima del toggle"
                level: INFO
                action: "invariato"
            - delay:
                seconds: 30
        - action: light.toggle
          metadata: {}
          data: {}
          target:
            entity_id: light.luce_scale
        - action: pyscript.scale_events_write
          data:
            message: "Accendi scale se aperta porta 🚪 - Toggled light.luce_scale"
            level: INFO
            action: "toggle"
  mode: parallel
  max: 10
- id: "1765212631845"
  alias: Spegni luci balcone
  description: ""
  triggers:
    - trigger: sun
      event: sunrise
      offset: -01:00:00
  conditions: []
  actions:
    - action: switch.turn_off
      metadata: {}
      target:
        entity_id: switch.presa_luci_natale
      data: {}
  mode: single
