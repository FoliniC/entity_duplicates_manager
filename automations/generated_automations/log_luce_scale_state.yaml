- id: log_luce_scale_state_change
  alias: "Log Luce Scale State Change"
  description: "Logga l'accensione e lo spegnimento effettivo della luce scale con il motivo."
  trigger:
    - platform: state
      entity_id: light.luce_scale
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
  action:
    - variables:
        is_ha: "{{ is_state('input_boolean.scale_light_ha_command', 'on') }}"
        ctx: "{{ trigger.to_state.context }}"
        reason: >
          {% if ctx.user_id != none %}
            {% set user = states.person | selectattr('attributes.user_id', 'eq', ctx.user_id) | first | default(none) %}
            Interfaccia ({{ user.attributes.friendly_name if user else 'Utente' }})
          {% elif ctx.parent_id != none %}
            {% set auto = states.automation | selectattr('context.id', 'eq', ctx.parent_id) | first | default(none) %}
            {% if auto %}
              Automazione: {{ auto.attributes.friendly_name }}
            {% else %}
              {% set scri = states.script | selectattr('context.id', 'eq', ctx.parent_id) | first | default(none) %}
              {% if scri %}
                Script: {{ scri.attributes.friendly_name }}
              {% else %}
                Comando HA (ID: {{ ctx.parent_id[:8] }})
              {% endif %}
            {% endif %}
          {% elif is_ha %}
            Sistema (Avvio/Interno)
          {% else %}
            Pulsante Fisico
          {% endif %}
    - event: scale_log_event
      event_data:
        level: INFO
        action: "{{ 'acceso' if trigger.to_state.state == 'on' else 'spento' }}"
        message: "Luce scale cambiata a {{ trigger.to_state.state }} (Motivo: {{ reason }})"
        wait: 1
  mode: queued
