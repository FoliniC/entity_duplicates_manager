- id: "ev_charge_2025_control"
  alias: "EV Charge 2025 Control"
  description: "Master Control Rev. 28 - Hardened BYD 30% Priority"
  triggers:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: state
      entity_id: input_boolean.ev_charge_2025_charging_active
    - trigger: state
      entity_id: input_select.ev_charge_2025_mode
    - trigger: state
      entity_id: input_number.ev_charge_2025_manual_power_kw
    - trigger: state
      entity_id: input_number.ev_charge_2025_cronostar_power_target
    - trigger: state
      entity_id: sensor.ev_charge_2025_solar_max_ampere
    - trigger: state
      entity_id: sensor.byd_battery_box_premium_hv_state_of_charge
    - trigger: state
      entity_id: sensor.smart_meter_ts_100a_1_potenza_reale
  action:
    - variables:
        is_active: "{{ is_state('input_boolean.ev_charge_2025_charging_active', 'on') }}"
        mode: "{{ states('input_select.ev_charge_2025_mode') }}"
        cur_soc: "{{ states('sensor.ev_charge_2025_current_soc') | float(0) }}"
        tgt_soc: "{{ states('input_number.ev_charge_2025_target_soc') | float(0) }}"
        limit_soc: "{{ states('input_number.ev_charge_2025_vehicle_limit_soc') | float(100) }}"
        voltage: "{{ states('sensor.folini_carlo_voltage_ac') | float(235) }}"
        duration: "{{ states('input_number.ev_charge_2025_duration') | int(240) }}"
        remaining: "{{ states('sensor.ev_charge_2025_remaining_time') | int(0) }}"
        byd_soc: "{{ states('sensor.byd_battery_box_premium_hv_state_of_charge') | float(0) }}"
        solar: "{{ states('sensor.ev_charge_2025_solar_max_ampere') | float(0) | int }}"
        is_low_soc: "{{ cur_soc < tgt_soc }}"

    - choose:
        # --- START LOGIC ---
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'state' and trigger.entity_id == 'input_boolean.ev_charge_2025_charging_active' and trigger.to_state.state == 'on' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ duration < 240 }}"
              then:
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.ev_charge_2025_end_time
                  data:
                    time: "{{ (now() + timedelta(minutes=duration)).strftime('%H:%M:%S') }}"
            - delay: "00:00:02"

        # --- STOP LOGIC ---
        - conditions:
            - condition: template
              value_template: >
                {{ not is_active or cur_soc >= limit_soc or (is_active and duration < 240 and remaining <= 0 and trigger.platform == 'time_pattern') }}
          sequence:
            - action: mqtt.publish
              data:
                topic: "home/prism/1/command/set_mode"
                payload: "3"
            - if:
                - condition: template
                  value_template: "{{ is_active }}"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.ev_charge_2025_charging_active

        # --- RUN LOGIC ---
        - conditions:
            - condition: template
              value_template: "{{ is_active }}"
          sequence:
            - choose:
                - conditions: # Manuale
                    - condition: template
                      value_template: "{{ mode == 'Manuale' }}"
                  sequence:
                    - variables:
                        amp: "{{ (states('input_number.ev_charge_2025_manual_power_kw')|float * 1000 / voltage) | int | clamp(6, 32) }}"
                    - action: mqtt.publish
                      data:
                        topic: "home/prism/1/command/set_mode"
                        payload: "2"
                    - action: mqtt.publish
                      data:
                        topic: "home/prism/1/command/set_current_user"
                        payload: "{{ amp }}"

                - conditions: # Automatico
                    - condition: template
                      value_template: "{{ mode == 'Automatico' }}"
                  sequence:
                    - variables:
                        crono: "{{ states('input_number.ev_charge_2025_cronostar_power_target') | float(0) }}"
                        # can_charge is the master permit
                        can_charge: "{{ solar >= 6 or (is_low_soc and byd_soc >= 30) }}"
                        target_amp: >
                          {% if crono >= 7.9 %}
                            {{ ([6, solar] | max) | int }}
                          {% elif crono <= 0.1 %}
                            0
                          {% else %}
                            {{ (crono * 1000 / voltage) | int }}
                          {% endif %}
                    - action: mqtt.publish
                      data:
                        topic: "home/prism/1/command/set_mode"
                        payload: "{{ '2' if (can_charge and target_amp >= 6) else '3' }}"
                    - if:
                        - condition: template
                          value_template: "{{ can_charge and target_amp >= 6 }}"
                      then:
                        - action: mqtt.publish
                          data:
                            topic: "home/prism/1/command/set_current_user"
                            payload: "{{ target_amp | clamp(6, 32) }}"
                    # Debug logging
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.ev_charge_2025_last_mqtt_payload
                      data:
                        value: "{{ target_amp if (can_charge and target_amp >= 6) else 0 }}"
                    - action: input_text.set_value
                      target:
                        entity_id: input_text.ev_charge_2025_last_mqtt_time
                      data:
                        value: "{{ now().strftime('%H:%M:%S') }}"
