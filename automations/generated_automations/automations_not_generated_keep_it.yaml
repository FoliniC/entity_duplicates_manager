- id: log_homeassistant_events
  alias: Log Home Assistant lifecycle events
  description: Scrive nei log gli eventi start/stop/restart di HA (formato compatibile per analisi)
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: homeassistant
      event: shutdown
  actions:
    - action: persistent_notification.create
      data:
        title: "Home Assistant Event"
        message: >
          {% if trigger.event == 'start' %}
            EVENTO: HA STARTED alle {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
          {% elif trigger.event == 'shutdown' %}
            EVENTO: HA STOPPED alle {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
          {% endif %}
        notification_id: "ha_{{ trigger.event }}"
- id: programmazione_riscaldamento
  alias: ProgrammazioneRiscaldamento
  description: Programmazione riscaldamento
  triggers:
    - entity_id:
        - schedule.riscaldamento
      from: "off"
      to: "on"
      trigger: state
  conditions: []
  actions:
    - target:
        entity_id:
          # - switch.attiva_fancoil
          - switch.attiva_pdc
      action: homeassistant.turn_{{ trigger.to_state.state }}
  mode: single
- id: spegni_riscaldamento
  alias: SpegniRiscaldamento
  description: Programmazione riscaldamento spegni
  triggers:
    - entity_id:
        - schedule.riscaldamento
      from: "on"
      to: "off"
      trigger: state
  conditions: []
  actions:
    - target:
        entity_id:
          # - switch.attiva_fancoil
          - switch.attiva_pdc
      action: homeassistant.turn_{{ trigger.to_state.state }}
  mode: single
- id: accendi_balcone
  alias: accendi balcone
  description: ""
  triggers:
    - trigger: sun
      event: sunset
      offset: 00:00:00
  conditions: []
  actions:
    - data: {}
      target:
        entity_id:
          - switch.luce_balcone
      action: switch.turn_on
  mode: single
- id: spegni_balcone
  alias: spegni balcone
  description: ""
  triggers:
    - trigger: sun
      event: sunset
      offset: 03:20:00
  conditions: []
  actions:
    - data: {}
      target:
        entity_id: switch.luce_balcone
      action: switch.turn_off
  mode: single
- id: "1706437692341"
  alias: Regola carica colonnina
  description:
    Imposta gli ampere di ricarica della colonnina. Control the logging
    by toggling the input_boolean.logging_enabled entity
  triggers:
    - entity_id:
        - sensor.envoy_122134037538_current_power_production
      trigger: state
    - topic: home/prism/1/state
      trigger: mqtt
    - minutes: "10"
      trigger: time_pattern
  conditions: []
  actions:
    - variables:
        logging_enabled: "{{ states('input_boolean.logging_enabled') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ logging_enabled == 'on' }}"
          sequence:
            - data:
                message:
                  "Messaggio W prodotti: {{states('sensor.envoy_122134037538_current_power_production'
                  )}} \n byd_battery_box_premium_hv_state_of_charge: {{states('sensor.byd_battery_box_premium_hv_state_of_charge')}}\n
                  voltage: {{ states('sensor.folini_carlo_voltage_ac') | float(220)}}\n
                  W per batteria: {{ ((30-states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0)) / 30 * -4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) < 30 else ((states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) - 30) / 70 * 4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) <= 100 else 0 }}\n solarnet_power_battery: {{ states('sensor.solarnet_power_battery')
                  | float(0)}}\n W pef PDC e appartamento : {{ ( ( states('sensor.smart_meter_2026_a_pdc_power_a')
                  | float(50)  + states('sensor.consumo_appartamento_template') | float(100)  )  )
                  }}\n W totale : {{  (states('sensor.envoy_122134037538_current_power_production'
                  ) | float(0) \n         + \n        (((30-states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0)) / 30 * -4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) < 30 else ((states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) - 30) / 70 * 4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) <= 100 else 0)\n        -  (states('sensor.smart_meter_2026_a_pdc_power_a') |
                  float(50) +  states('sensor.consumo_appartamento_template') | float(100) ) \n       )
                  \ }}\n A per colonnina: {{ \n (\n   (\n     (\n        (states('sensor.envoy_122134037538_current_power_production'
                  ) | float(0) \n         + \n        (((30-states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0)) / 30 * -4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) < 30 else ((states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) - 30) / 70 * 4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
                  | float(0) <= 100 else 0)\n        -  (states('sensor.smart_meter_2026_a_pdc_power_a') |
                  float(50) +  states('sensor.consumo_appartamento_template') | float(100) ) \n       )
                  \n       / \n       (states('sensor.folini_carlo_voltage_ac') | float(220)\n
                  \      ) +0\n     ) | round(0)\n   )\n ) | string }}\n current_value:
                  \"{{ current_value }}\"\n previous_recharge_ampere_value: \"{{ states('input_text.previous_recharge_ampere_value')
                  }}\""
                title: Titolo
              action: persistent_notification.create
    - variables:
        current_value:
          "{{ (\n   (\n     (\n        (states('sensor.envoy_122134037538_current_power_production'
          ) | float(0) \n         + \n        (((30-states('sensor.byd_battery_box_premium_hv_state_of_charge')
          | float(0)) / 30 * -4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
          | float(0) < 30 else ((states('sensor.byd_battery_box_premium_hv_state_of_charge')
          | float(0) - 30) / 70 * 4500) if states('sensor.byd_battery_box_premium_hv_state_of_charge')
          | float(0) <= 100 else 0)\n        -  (states('sensor.smart_meter_2026_a_pdc_power_a') | float(50)
          +  states('sensor.consumo_appartamento_template') | float(100) ) \n       ) \n       /
          \n       (states('sensor.folini_carlo_voltage_ac') | float(220)\n       )
          +0\n     ) | round(0)\n   )\n ) | string }}"
        previous_recharge_ampere_value:
          "{{ states('input_text.previous_recharge_ampere_value')
          }}"
    - target:
        entity_id: input_text.previous_recharge_ampere_value
      data:
        value: "{{ current_value }}"
      action: input_text.set_value
    - choose:
        - conditions:
            - condition: template
              value_template:
                "{{ current_value | int >= 6 and current_value != previous_recharge_ampere_value
                }}"
          sequence:
            - event: ev_log_event
              event_data:
                level: info
                message: "LEGACY_AUTO (1706437692341) -> set_mode: 2"
            - data:
                topic: home/prism/1/command/set_mode
                payload: "2"
              action: mqtt.publish
            - event: ev_log_event
              event_data:
                level: info
                message: "LEGACY_AUTO (1706437692341) -> set_current_user: {{ current_value }}"
            - data:
                topic: home/prism/1/command/set_current_user
                payload: "{{ current_value }}"
              action: mqtt.publish
        - conditions:
            - condition: template
              value_template: "{{ current_value | int < 6  }}"
          sequence:
            - event: ev_log_event
              event_data:
                level: info
                message: "LEGACY_AUTO (1706437692341) -> set_mode: 3"
            - data:
                topic: home/prism/1/command/set_mode
                payload: "3"
              action: mqtt.publish
  mode: single
