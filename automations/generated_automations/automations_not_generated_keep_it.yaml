- id: Notifica ping google eliminata
  alias: Notifica ping google eliminata
  triggers:
    - entity_id: binary_sensor.ping_google
      to: "off"
      trigger: state
  actions:
    - repeat:
        until:
          - condition: state
            entity_id: binary_sensor.ping_google
            state: "on"
        sequence:
          - alias: Controlla se ping è ancora off
            condition: state
            entity_id: binary_sensor.ping_google
            state: "off"
          - alias: Notifica mancata raggiungibilità Google
            action: notify.notify
            data:
              message: Il server Google non è raggiungibile.
          - alias: Attendi 5 minuti
            delay:
              minutes: 5
