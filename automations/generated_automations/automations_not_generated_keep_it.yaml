  description: Notifica ingressi e uscite di Carlo
  triggers:
    - entity_id:
        - device_tracker.2312dra50g
      trigger: state
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
  actions:
    - alias: Invia notifica
      action: notify.send_message
      target:
        entity_id: notify.ultra17
      data:
        message:
          "{%- if trigger.to_state.state == 'home' -%}           Rilevato ingresso
          in casa da parte di {{ trigger.from_state.attributes.friendly_name }}         {%-
          elif trigger.to_state.state in ['away', 'not_home'] and trigger.from_state.state
          == 'home' -%}           Rilevata uscita da parte di {{ trigger.from_state.attributes.friendly_name
          }}         {%- endif -%}"
  mode: single
