- id: announceGoogleCalling
  alias: Announce Google Calling
  triggers:
    - trigger: event
      event_type: google_cloud_speech_to_text.result
  actions:
    - action: notify.mobile_app_ultra17
      data:
        title: TTS
        message: Google calling
- id: debug_deviatore_states
  alias: DEBUG - Stati Deviatore Scale
  triggers:
    - trigger: state
      entity_id:
        - switch.sonoff_10024024c4_1
        - switch.sonoff_10024024c4_2
    - trigger: time_pattern
      minutes: "/2"
    - trigger: homeassistant
      event: start
  action:
    - delay: "00:00:02"
    - variables:
        current_state_str: >
          {% set s1 = states('switch.sonoff_10024024c4_1') %}
          {% set s2 = states('switch.sonoff_10024024c4_2') %}
          {% set l = states('light.luce_scale') %}
          S1={{ s1 }}, S2={{ s2 }}{% if l not in ['unknown', 'unavailable'] %}, Luce={{ l }}{% endif %}
        last_state_str: "{{ states('input_text.debug_deviatore_last_state') }}"
    - choose:
        # Caso 1: HA Start
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'homeassistant' }}"
          sequence:
            - event: scale_log_event
              event_data:
                message: "DEBUG - Ripartito Home Assistant. {{ current_state_str }}"
                level: INFO
            - action: input_text.set_value
              target:
                entity_id: input_text.debug_deviatore_last_state
              data:
                value: "{{ current_state_str }}"

        # Caso 2: State Change (Sempre log)
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'state' }}"
          sequence:
            - event: scale_log_event
              event_data:
                message: "DEBUG - Cambio stato rilevato. {{ current_state_str }}"
                level: INFO
            - action: input_text.set_value
              target:
                entity_id: input_text.debug_deviatore_last_state
              data:
                value: "{{ current_state_str }}"

        # Caso 3: Time Pattern (Log solo se diverso dall'ultimo salvato)
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'time_pattern' }}"
            - condition: template
              value_template: "{{ current_state_str != last_state_str }}"
          sequence:
            - event: scale_log_event
              event_data:
                message: "DEBUG - Aggiornamento periodico (stato disallineato?). {{ current_state_str }} (Era: {{ last_state_str }})"
                level: INFO
            - action: input_text.set_value
              target:
                entity_id: input_text.debug_deviatore_last_state
              data:
                value: "{{ current_state_str }}"
      default: []
  mode: queued

- id: keepDeviatoreScaleTurnedOn
  alias: Controlla stati deviatore scale (anti-oscillazione)
  triggers:
    - trigger: state
      entity_id:
        - switch.sonoff_10024024c4_1
        - switch.sonoff_10024024c4_2
      for:
        seconds: 5
    - trigger: time_pattern
      minutes: "/5"
  variables:
    s1: "{{ states('switch.sonoff_10024024c4_1') }}"
    s2: "{{ states('switch.sonoff_10024024c4_2') }}"
    power_total: "{{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}"
    valid_states: ["on", "off"]
    problematic_states: ["unknown", "unavailable", "none"]
  conditions: []
  actions:
    - choose:
        # Caso 1: Entrambi ON - Spegni switch_2 (mantieni switch_1 come principale)
        - conditions:
            - condition: template
              value_template: "{{ states('switch.sonoff_10024024c4_1') == 'on' and states('switch.sonoff_10024024c4_2') == 'on' }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.scale_light_source
              data:
                value: "Automazione: Correzione Deviatore (ON-ON)"
            - action: switch.turn_off
              target:
                entity_id: switch.sonoff_10024024c4_2
            - delay:
                milliseconds: 500
            - action: system_log.write
              data:
                #name: "Deviatore Scale"
                level: info
                message: >-
                  Correzione ENTRAMBI ON: Spento switch_2 - 
                  S1: {{ states('switch.sonoff_10024024c4_1') }}, 
                  S2: {{ states('switch.sonoff_10024024c4_2') }},
                  Power: {{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}W
            - action: notify.send_message
              target:
                entity_id: notify.ultra17
              data:
                title: "⚠️ Deviatore Scale Corretto"
                message: >-
                  Entrambi ON rilevati → Spento switch_2
                  Stato finale: S1={{ states('switch.sonoff_10024024c4_1') }}, S2={{ states('switch.sonoff_10024024c4_2') }}
                  Power: {{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}W
            - event: scale_log_event
              event_data:
                message: "Correzione ENTRAMBI ON: Spento switch_2. S1={{ states('switch.sonoff_10024024c4_1') }}, S2={{ states('switch.sonoff_10024024c4_2') }}"
                level: WARNING
                action: "attuatore"
            - delay: "0:00:02"
            - action: input_text.set_value
              target:
                entity_id: input_text.scale_light_source
              data:
                value: ""

        # Caso 2: Entrambi OFF - Accendi switch_1
        - conditions:
            - condition: template
              value_template: "{{ states('switch.sonoff_10024024c4_1') == 'off' and states('switch.sonoff_10024024c4_2') == 'off' }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.scale_light_source
              data:
                value: "Automazione: Correzione Deviatore (OFF-OFF)"
            - action: switch.turn_on
              target:
                entity_id: switch.sonoff_10024024c4_1
            - delay:
                milliseconds: 500
            - action: system_log.write
              data:
                #name: "Deviatore Scale"
                level: info
                message: >-
                  Correzione ENTRAMBI OFF: Acceso switch_1 - 
                  S1: {{ states('switch.sonoff_10024024c4_1') }}, 
                  S2: {{ states('switch.sonoff_10024024c4_2') }},
                  Power: {{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}W
            - action: notify.send_message
              target:
                entity_id: notify.ultra17
              data:
                title: "⚠️ Deviatore Scale Corretto"
                message: >-
                  Entrambi OFF rilevati → Acceso switch_1
                  Stato finale: S1={{ states('switch.sonoff_10024024c4_1') }}, S2={{ states('switch.sonoff_10024024c4_2') }}
                  Power: {{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}W
            - event: scale_log_event
              event_data:
                message: "Correzione ENTRAMBI OFF: Acceso switch_1. S1={{ states('switch.sonoff_10024024c4_1') }}, S2={{ states('switch.sonoff_10024024c4_2') }}"
                level: WARNING
                action: "attuatore"
            - delay: "0:00:02"
            - action: input_text.set_value
              target:
                entity_id: input_text.scale_light_source
              data:
                value: ""

        # Caso 3: Stati problematici - logghiamo senza correggere
        - conditions:
            - condition: template
              value_template: "{{ states('switch.sonoff_10024024c4_1') in problematic_states or states('switch.sonoff_10024024c4_2') in problematic_states }}"
          sequence:
            - action: system_log.write
              data:
                #name: "Deviatore Scale"
                level: info
                message: >-
                  Stato problematico rilevato - 
                  Switch1: {{ states('switch.sonoff_10024024c4_1') }}, Switch2: {{ states('switch.sonoff_10024024c4_2') }},
                  Power: {{ power_total }}W
            - action: notify.send_message
              target:
                entity_id: notify.ultra17
              data:
                title: "❌ Problema Deviatore Scale"
                message: "Stato problematico: S1={{ states('switch.sonoff_10024024c4_1') }}, S2={{ states('switch.sonoff_10024024c4_2') }}"
            - event: scale_log_event
              event_data:
                message: "Stato problematico rilevato. S1={{ states('switch.sonoff_10024024c4_1') }}, S2={{ states('switch.sonoff_10024024c4_2') }}"
                level: ERROR
                action: "nulla"

        # Caso 4: Stati diversi (uno ON, uno OFF) - tutto OK
        - conditions:
            - condition: template
              value_template: "{{ states('switch.sonoff_10024024c4_1') != states('switch.sonoff_10024024c4_2') and states('switch.sonoff_10024024c4_1') in valid_states and states('switch.sonoff_10024024c4_2') in valid_states }}"
          sequence:
            - action: system_log.write
              data:
                #name: "Deviatore Scale"
                level: info
                message: >-
                  Stati OK: S1={{ s1 }}, S2={{ s2 }},
                  Power: {{ power_total }}W
      default:
        - action: system_log.write
          data:
            #name: "Deviatore Scale"
            level: info
            message: >-
              Stato non gestito: S1={{ s1 }}, S2={{ s2 }}
  mode: restart
- id: "1739986157014"
  alias: Spegni luci scale dopo tempo
  description: Spegne le luci delle scale dopo 4 minuti dall'ultima accensione o riavvio
  triggers:
    - trigger: state
      entity_id: light.luce_scale
      to: "on"
      for:
        seconds: 15
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: light.luce_scale
      state: "on"
  actions:
    - variables:
        we_turned_it_off: false
    - delay:
        minutes: 4
    - action: persistent_notification.create
      data:
        title: "Luce Scale"
        message: >-
          Spegnimento automatico luci scale.
          Consumo: {{ states('sensor.luce_scale_switch_infos') }}W
        notification_id: spegni_luci_123
    - if:
        - condition: template
          value_template: >
            {{ states('sensor.luce_scale_switch_infos') | float(0) > 7 }}
      then:
        - action: input_text.set_value
          target:
            entity_id: input_text.scale_light_source
          data:
            value: "{{ this.attributes.friendly_name }}"
        - action: light.turn_off
          target:
            entity_id: light.luce_scale
        - variables:
            we_turned_it_off: true
    - delay:
        seconds: 2

    # Verifica che si sia effettivamente spenta
    - choose:
        - conditions:
            - condition: state
              entity_id: light.luce_scale
              state: "off"
            - condition: template
              value_template: "{{ we_turned_it_off }}"
          sequence:
            - action: notify.mobile_app_ultra17
              data:
                title: "Luce Scale"
                message: "Luce scale spenta automaticamente dopo 4 minuti. Consumo: {{ states('sensor.luce_scale_switch_infos') }}W"
                data:
                  tts_text: "Spenta la luce scale"
        - conditions:
            - condition: state
              entity_id: light.luce_scale
              state: "off"
          sequence:
            - action: notify.mobile_app_ultra17
              data:
                title: "Luce Scale"
                message: "Luce scale era già spenta (spenta da altra automazione). Consumo: {{ states('sensor.luce_scale_switch_infos') }}W"
                data:
                  tts_text: "La luce scale era già spenta"
      default:
        - action: notify.mobile_app_ultra17
          data:
            title: "⚠️ Errore Luce Scale"
            message: "La luce non si è spenta correttamente dopo il timeout"
  mode: restart

- id: "1740142914490"
  alias: Memorizza stato di luci_scale_switch_2 e luci_scale_switch_3
  description:
    Memorizza lo stato di switch.luci_scale_switch_2 e switch.luci_scale_switch_3
    ogni volta che vengono modificati
  triggers:
