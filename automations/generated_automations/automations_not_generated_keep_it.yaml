- id: "1706437692342"
  alias: Regola carica colonnina GUI
  description: Imposta gli ampere di ricarica della colonnina. Controlla il logging tramite input_boolean.logging_enabled.
  triggers:
    - trigger: state
      entity_id:
        - sensor.envoy_122134037538_current_power_production
    - trigger: mqtt
      topic: home/prism/1/state
    - trigger: time_pattern
      minutes: "10"
  conditions: []
  actions:
    - variables:
        logging_enabled: "{{ states('input_boolean.logging_enabled') }}"
        soc: "{{ states('sensor.byd_battery_box_premium_hv_state_of_charge') | float(0) }}"
        power_production: "{{ states('sensor.envoy_122134037538_current_power_production') | float(0) }}"
        voltage: "{{ states('sensor.folini_carlo_voltage_ac') | float(220) }}"
        consumo_pdc: "{{ states('sensor.smart_meter_2026_a_pdc_power_a') | float(50) }}"
        consumo_appartamento: "{{ states('sensor.consumo_appartamento_template') | float(100) }}"
        solarnet_power_battery: "{{ states('sensor.solarnet_power_battery') | float(0) }}"
        w_battery: >
          {{ ((30 - soc) / 30 * -4500) if soc < 30 else ((soc - 30) / 70 * 4500) if soc <= 100 else 0 }}
        w_totale: "{{ (power_production + w_battery - (consumo_pdc + consumo_appartamento)) | round(2) }}"
        current_value: "{{ ((w_totale / voltage) | round(0)) | string }}"
        previous_recharge_ampere_value: "{{ states('input_text.previous_recharge_ampere_value') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ logging_enabled == 'on' }}"
          sequence:
            - action: persistent_notification.create
              data:
                title: "Titolo"
                message: >
                  Messaggio W prodotti: {{ power_production }} W
                  SOC Batteria BYD: {{ soc }} %
                  Voltage: {{ voltage }} V
                  W per batteria: {{ w_battery | round(2) }} W
                  Solarnet Power Battery: {{ solarnet_power_battery }} W
                  W per PDC e Appartamento: {{ (consumo_pdc + consumo_appartamento) | round(2) }} W
                  W totale: {{ w_totale }} W
                  A per colonnina: {{ current_value }} A
                  Current Value: {{ current_value }}
                  Previous Recharge Ampere Value: {{ previous_recharge_ampere_value }}
    - action: input_text.set_value
      target:
        entity_id: input_text.previous_recharge_ampere_value
      data:
        value: "{{ current_value }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ current_value | int >= 6 and current_value != previous_recharge_ampere_value }}"
          sequence:
            - event: ev_log_event
              event_data:
                level: info
                message: "LEGACY_GUI (1706437692342) -> set_mode: 2"
            - action: mqtt.publish
              data:
                topic: home/prism/1/command/set_mode
                payload: "2" # Modalità di ricarica
            - event: ev_log_event
              event_data:
                level: info
                message: "LEGACY_GUI (1706437692342) -> set_current_user: {{ current_value }}"
            - action: mqtt.publish
              data:
                topic: home/prism/1/command/set_current_user
                payload: "{{ current_value }}"
        - conditions:
            - condition: template
              value_template: "{{ current_value | int < 6 }}"
          sequence:
            - event: ev_log_event
              event_data:
                level: info
                message: "LEGACY_GUI (1706437692342) -> set_mode: 3"
            - action: mqtt.publish
              data:
                topic: home/prism/1/command/set_mode
                payload: "3" # Modalità di spegnimento o standby
  mode: single
- id: "1707128644063"
  alias: Alert finestra stanza
  description: "Rileva apertura finestre tramite varianza termica e di umidità con controllo delta esterno"
  triggers:
    - entity_id:
        - sensor.statistics_temperatura_bagno_variance
        - sensor.statistics_temperatura_cucina_variance
        - sensor.statistics_temperatura_camera_grande_variance
        - sensor.statistics_temperatura_camera_variance
        - sensor.statistics_temperatura_sala_variance
      above: "0.07"
      for:
        minutes: 1
      trigger: numeric_state
    - entity_id:
        - sensor.statistics_umidita_bagno_variance
        - sensor.statistics_umidita_cucina_variance
        - sensor.statistics_umidita_camera_grande_variance
        - sensor.statistics_umidita_camera_variance
        - sensor.statistics_umidita_sala_variance
      above: "2.0"
      for:
        minutes: 1
      trigger: numeric_state
  conditions:
    - condition: template
      alias: "Verifica differenziale termico interno/esterno > 5 gradi"
      value_template: >
        {% set temp_ext = states('sensor.temperatura_strenscia') | float(none) %}
        {% set room = trigger.entity_id.replace('sensor.statistics_temperatura_', '').replace('sensor.statistics_umidita_', '').replace('_variance', '') %}
        {% set room_temps = {
          'bagno': 'sensor.temperatura_bagno',
          'cucina': 'sensor.th1a_temperature',
          'camera_grande': 'sensor.temperatura_camera_grande',
          'camera': 'sensor.temperatura_camera',
          'sala': 'sensor.temperatura_sala'
        } %}
        {% set source_entity = room_temps.get(room) %}
        {% set temp_int = states(source_entity) | float(none) if source_entity else none %}
        
        {% if temp_ext is not none and temp_int is not none %}
          {{ (temp_int - temp_ext) | abs > 5 }}
        {% else %}
          true
        {% endif %}
  actions:
    - event: fancoil_log_event
      event_data:
        level: info
        message: >
          Window Alert Triggered - Room: {{ trigger.to_state.name.replace('statistics_temperatura_','').replace('statistics_umidita_','').replace('_variance','') }}, 
          Entity: {{ trigger.entity_id }}, 
          Value: {{ trigger.to_state.state }},
          Temp Est: {{ states('sensor.temperatura_strenscia') }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ 'bagno' in trigger.entity_id }}"
          sequence:
            - action: notify.mobile_app_ultra17
              data:
                message: TTS
                data:
                  tts_text: Probabilmente la finestra del bagno è aperta.
        - conditions:
            - condition: template
              value_template: "{{ 'cucina' in trigger.entity_id }}"
          sequence:
            - action: notify.mobile_app_ultra17
              data:
                message: TTS
                data:
                  tts_text: Probabilmente la finestra della cucina è aperta.
        - conditions:
            - condition: template
              value_template: "{{ 'camera_grande' in trigger.entity_id }}"
          sequence:
            - action: notify.mobile_app_ultra17
              data:
                message: TTS
                data:
                  tts_text: Probabilmente la finestra della camera grande è aperta.
        - conditions:
            - condition: template
              value_template: "{{ 'camera' in trigger.entity_id and 'camera_grande' not in trigger.entity_id }}"
          sequence:
            - action: notify.mobile_app_ultra17
              data:
                message: TTS
                data:
                  tts_text: Probabilmente la finestra della camera è aperta.
        - conditions:
            - condition: template
              value_template: "{{ 'sala' in trigger.entity_id }}"
          sequence:
            - action: notify.mobile_app_ultra17
              data:
                message: TTS
                data:
                  tts_text: Probabilmente la finestra della sala è aperta.
  mode: single
