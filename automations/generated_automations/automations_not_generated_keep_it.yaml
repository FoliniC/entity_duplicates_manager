- alias: "Ping google automation"
  id: ping_google_30_minuti
  description: "Aggiorna lo stato del ping ogni 30 minuti quando non si è a casa"
  triggers:
    - trigger: time_pattern
      minutes: "/30"
  conditions:
    - condition: state
      entity_id: person.carlo
      state: not_home
    # Trigger solo se l'automazione target è abilitata E non è già in esecuzione
    - condition: state
      entity_id: automation.verifica_e_sistema_connessione_internet_2
      state: "on" # Assicurati che sia abilitata
    - condition: template
      value_template: "{{ state_attr('automation.verifica_e_sistema_connessione_internet_2', 'current') == 0 }}" # Assicurati che non sia già in esecuzione
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: binary_sensor.ping_google
  mode: single

