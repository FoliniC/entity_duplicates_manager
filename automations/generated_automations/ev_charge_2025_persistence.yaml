- id: ev_charge_2025_save_state
  alias: "EV Charge 2025: Salva Stato su HALog"
  description: "Salva gli helper EV su file ad ogni modifica"
  triggers:
    - trigger: state
      entity_id:
        - input_number.ev_charge_2025_byd_min_soc_stop
        - input_number.ev_charge_2025_target_soc
        - input_number.ev_charge_2025_vehicle_limit_soc
  action:
    - action: pyscript.halog2026_state_save
      data:
        subsystem: "ev"
        entity_id: "{{ trigger.entity_id }}"
        value: "{{ trigger.to_state.state }}"
