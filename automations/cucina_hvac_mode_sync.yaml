                  {% set local_mode = states('input_select.fancoil_cucina_hvac_mode_local') %}
                  {% if follow_master and master_hvac_mode not in ['unavailable', 'unknown', None, ''] %}
                      {{ master_hvac_mode }}
                  {% elif not follow_master and local_mode not in ['unavailable', 'unknown', None, ''] %}
                      {{ local_mode }}
                  {% else %}
                      off
                  {% endif %}
        - conditions:
            - condition: template
              value_template: >
