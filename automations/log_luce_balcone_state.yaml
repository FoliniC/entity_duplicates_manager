- id: log_luce_balcone_state_change
  alias: "Log Luce Balcone State Change"
  description: "Traccia ogni cambio di stato di switch.luce_balcone_switch_1 con il motivo (fisico/RF, blackout, vocale, automazione, UI) per diagnosticare le accensioni saltuarie."
  mode: queued
  max: 50
  trigger:
    - platform: state
      entity_id: switch.luce_balcone_switch_1
  condition:
    # Logga OGNI cambio di stato reale: on<->off ma anche i passaggi da/verso
    # unavailable/unknown, che sono esattamente la firma delle accensioni
    # saltuarie notturne (dropout Wi-Fi/Tuya cloud o riavvio dispositivo).
    # Si escludono solo: nessun cambio reale (from==to) e il puro rumore di
    # polling unavailable<->unknown (nessuna informazione utile).
    - condition: template
      value_template: >
        {{ trigger.to_state.state != trigger.from_state.state
           and not (trigger.to_state.state in ['unavailable', 'unknown']
                    and trigger.from_state.state in ['unavailable', 'unknown']) }}
  action:
    - variables:
        to_state: "{{ trigger.to_state.state }}"
        from_state: "{{ trigger.from_state.state }}"
        ctx: "{{ trigger.to_state.context }}"
        user_id: "{{ trigger.to_state.context.user_id if trigger.to_state.context is defined else none }}"
        parent_id: "{{ trigger.to_state.context.parent_id if trigger.to_state.context is defined else none }}"
        # NOTA: trigger.to_state.context e' un oggetto Context, NON un dict.
        # Non ha .get(); va acceso per attributo con guardia.
        source: >
          {% set ctx = trigger.to_state.context if trigger.to_state.context is defined else none %}
          {{ ctx.source if ctx is not none and ctx.source is defined else '' }}
        # Timestamp leggibile
        ts: "{{ trigger.to_state.last_changed | default(now()) }}"
        # Riconoscimento utente (interfaccia web/app)
        user_name: >
          {% if user_id is not none %}
            {% set person = states.person | selectattr('attributes.user_id', 'eq', user_id) | first | default(none) %}
            {{ person.attributes.friendly_name if person else 'ID:' ~ user_id[:8] }}
          {% else %}
            none
          {% endif %}
        # Stato anomalo? (arrivo da/per unavailable/unknown) -> pista dropout
        anomalous: >
          {{ from_state in ['unavailable', 'unknown'] or to_state in ['unavailable', 'unknown'] }}
        # Classificazione del MOTIVO dell'evento
        reason: >
          {% if anomalous %}
            Stato anomalo (dropout Wi-Fi/cloud o riavvio dispositivo): {{ from_state }} -> {{ to_state }}
          {% elif source == 'BUTTON' or (user_id is none and parent_id is none and source == '') %}
            Fisico/RF (pulsante o telecomando Tuya)
          {% elif user_id is not none %}
            Interfaccia Web/App ({{ user_name }})
          {% elif parent_id is not none %}
            Sistema/Automazione (parent: {{ parent_id[:12] }})
          {% elif source != '' %}
            Esterno (source={{ source }})
          {% else %}
            Fisico/RF (pulsante o telecomando Tuya)
          {% endif %}
        # Etichetta leggibile per l'azione nel log
        action_word: >
          {% if to_state == 'on' %}ACCESO
          {% elif to_state == 'off' %}SPENTO
          {% else %}{{ to_state | upper }}{% endif %}
        # Livello di log: WARNING se c'è un'anomalia (dropout), INFO altrimenti
        level: "{{ 'WARNING' if anomalous else 'INFO' }}"
    # 1) PRIMA il log (priorita' assoluta: deve sempre finire nel file)
    - event: balcone_log_event
      event_data:
        level: "{{ level }}"
        action: "{{ action_word }}"
        message: "Luce balcone {{ action_word }} (era {{ from_state }}) — Motivo: {{ reason }} [source={{ source }} user_id={{ user_id }} parent_id={{ parent_id }}] @ {{ ts }}"
        wait: 1
    # 2) POI la notifica push (non bloccante: un suo eventuale fallimento
    #    non impatta il log sopra). Solo per gli eventi utente rilevanti,
    #    per non allagare il telefono con i flapping unavailable.
    - if:
        - condition: template
          value_template: "{{ to_state in ['on', 'off'] }}"
      then:
        # Usare notify group per notifiche device-agnostic
        - action: notify.send_message
          target:
            entity_id: notify.notify_mobile_devices
          data:
            title: "💡 Luce balcone {{ action_word }}{% if anomalous %} ⚠️{% endif %}"
            message: "Motivo: {{ reason }}"
            tag: luce_balcone_change
            importance: "{{ 'high' if (to_state == 'on' or anomalous) else 'normal' }}"
            notification_icon: "mdi:lightbulb"
      # fall-through controllato: in caso di errore notify non blocca il flow
      else: []
