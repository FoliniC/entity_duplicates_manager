- id: "wcfs_camera_grande_open_3d0ec557"
  alias: "Fancoil Camera Grande: Stop fan when window opens"
  description: "Stop fancoil fan when window opens, save speeds for resume"
  trigger:
    - platform: state
      entity_id: binary_sensor.contact_camera_grande_contact_camera_grande
      to: "on"
      id: "window_opened"
  condition:
    - condition: state
      entity_id: input_boolean.fancoil_camera_grande_enabled
      state: "on"
  variables:
    contact_state: "{{ trigger.to_state.state }}"
    fan_speeds: >
      {% set main = states('switch.stox_fancoil_camera_grande_switch') %}
      {% set aux = states('switch.fancoil_camera_grande_switch_aux') %}
      {% set aux2 = states('switch.fancoil_camera_grande_switch_aux2') %}
      {% set aux3 = states('switch.fancoil_camera_grande_switch_aux3') %}
      {{ {
        "main": main,
        "aux": aux,
        "aux2": aux2,
        "aux3": aux3
      } | to_json }}
    fan_was_on: "{{ main == 'on' or aux == 'on' or aux2 == 'on' or aux3 == 'on' }}"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ fan_was_on == 'True' }}"
          sequence:
            - service: input_text.set_value
              target:
                entity_id: input_text.fancoil_camera_grande_saved_fan_speeds
              data:
                value: "{{ fan_speeds }}"
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.fancoil_camera_grande_window_opened_at
              data:
                timestamp: "{{ now().timestamp() | int }}"
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.fancoil_camera_grande_fan_was_on
            - service: switch.turn_off
              target:
                entity_id: switch.stox_fancoil_camera_grande_switch
            - service: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_camera_grande_switch_aux
                  - switch.fancoil_camera_grande_switch_aux2
                  - switch.fancoil_camera_grande_switch_aux3
      default: []
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.fancoil_camera_grande_last_main_off
      data:
        timestamp: "{{ now().timestamp() | int }}"
  mode: single
