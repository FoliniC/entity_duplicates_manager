# Automation: Control Balcone Message Capture
# ─────────────────────────────────────────────────────────────────────────────
# Starts/stops the LocalTuya message capture for the balcony device
# based on the input_boolean.capture_balcone_messages toggle.
# ─────────────────────────────────────────────────────────────────────────────

- id: capture_balcone_messages_control
  alias: "Balcone: Controllo Cattura Messaggi"
  description: "Avvia/ferma la cattura messaggi LocalTuya per il dispositivo balcone"
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.capture_balcone_messages
      to: "on"
    - platform: state
      entity_id: input_boolean.capture_balcone_messages
      to: "off"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.capture_balcone_messages
              state: "on"
          sequence:
            - service: python_script.capture_balcone
              data:
                service: capture_balcone_start
            - event: balcone_log_event
              event_data:
                level: INFO
                action: "CAPTURE STARTED"
                message: "Avviata cattura messaggi LocalTuya per debug accensioni inspiegabili"
                wait: 0
            # Usare notify group per notifiche device-agnostic
            - action: notify.send_message
              target:
                entity_id: notify.notify_mobile_devices
              data:
                title: "📡 Cattura Messaggi Balcone: AVVIATA"
                message: "Registrazione messaggi LocalTuya per device bfbf8ab6b500e77408pupf attiva. File: /config/logs/balcone_capture.jsonl"
                tag: balcone_capture_start
                importance: high
                notification_icon: "mdi:record-rec"
        - conditions:
            - condition: state
              entity_id: input_boolean.capture_balcone_messages
              state: "off"
          sequence:
            - service: python_script.capture_balcone
              data:
                service: capture_balcone_stop
            - event: balcone_log_event
              event_data:
                level: INFO
                action: "CAPTURE STOPPED"
                message: "Fermata cattura messaggi LocalTuya"
                wait: 0
            # Usare notify group per notifiche device-agnostic
            - action: notify.send_message
              target:
                entity_id: notify.notify_mobile_devices
              data:
                title: "📡 Cattura Messaggi Balcone: FERMATA"
                message: "Registrazione messaggi LocalTuya disattivata"
                tag: balcone_capture_stop
                importance: default
                notification_icon: "mdi:stop-circle"