- alias: "Alexa: Imposta volume media a 20% (Cucina + Camera) v2"
  id: alexa_set_volume_20_percent_v2
  trigger:
    - platform: event
      event_type: alexa_set_volume_20
  action:
    - service: media_player.volume_set
      target:
        entity_id: media_player.alexa_echo_dots
      data:
        volume_level: 0.2
    - service: system_log.write
      data:
        level: info
        message: "Alexa Volume: impostato volume media a 20% su Cucina e Camera"
  mode: single