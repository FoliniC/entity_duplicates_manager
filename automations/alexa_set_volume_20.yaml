- alias: "Alexa: Imposta volume media a 20% (Cucina + Camera)"
  id: alexa_set_volume_20_percent
  trigger:
    - platform: event
      event_type: alexa_set_volume_20
  action:
    - service: media_player.volume_set
      target:
        entity_id:
          - media_player.cucina
          - media_player.camera
      data:
        volume_level: 0.2
    - action: system_log.write
      data:
        level: info
        message: "Alexa Volume: impostato volume media a 20% su Cucina e Camera"
  mode: single