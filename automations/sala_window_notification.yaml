# FASE 7 & FASE 9 - Notifiche consiglio finestra e valutazione efficacia
# Si attiva quando il consiglio finestra cambia e rimane stabile per 5 minuti.
# Invia una persistent_notification con contesto completo.
# La notifica viene rimossa quando il consiglio torna a nessuna_azione/incerto.

- alias: "Sala: Notifica Consiglio Finestra"
  id: notifica_consiglio_finestra_sala
  trigger:
    - platform: state
      entity_id: sensor.consiglio_finestra_sala
      to:
        - "apri"
        - "chiudi"
      for:
        minutes: 5
  condition: []
  action:
    - action: persistent_notification.create
      data:
        notification_id: "finestra_sala"
        title: >-
          {% set consiglio = states('sensor.consiglio_finestra_sala') %}
          {% if consiglio == 'apri' %}
            🪟 Apri la finestra – Sala
          {% elif consiglio == 'chiudi' %}
            🔒 Chiudi la finestra – Sala
          {% else %}
            ℹ️ Consiglio finestra – Sala
          {% endif %}
        message: >-
          {% set consiglio = states('sensor.consiglio_finestra_sala') %}
          {% set motivo = state_attr('sensor.consiglio_finestra_sala', 'motivo') | default('N/A') %}
          {% set delta = state_attr('sensor.consiglio_finestra_sala', 'delta_omega') | float(0) | round(2) %}
          {% set trend = state_attr('sensor.consiglio_finestra_sala', 'trend_umidita') | default('N/A') %}
          {% set finestra = state_attr('sensor.consiglio_finestra_sala', 'finestra_aperta') %}
          {% set confidenza = state_attr('sensor.consiglio_finestra_sala', 'confidenza') | default(0) %}
          {% set rh = states('sensor.umidita_sala_pilota') | float(0) | round(1) %}
          {% set esito_prec = states('sensor.esito_ultimo_consiglio_finestra_sala_validated_v3') %}
          {% set motivo_esito = state_attr('sensor.esito_ultimo_consiglio_finestra_sala_validated_v3', 'motivo') %}

          **Stanza:** Sala
          **Consiglio:** {{ consiglio | upper }}
          **Umidità interna:** {{ rh }}%
          **Trend umidità:** {{ trend }}
          **Delta omega:** {{ delta }} g/kg
          **Finestra dichiarata:** {{ 'aperta' if finestra else 'chiusa' }}
          **Confidenza:** {{ confidenza }}%
          **Motivo:** {{ motivo }}

          {% if esito_prec in ['efficace', 'inefficace'] %}
          ---
          **Esito Ultima Azione:** {{ esito_prec | upper }}
          *Dettaglio:* {{ motivo_esito }}
          {% endif %}

- alias: "Sala: Rimuovi Notifica Finestra"
  id: rimuovi_notifica_finestra_sala
  trigger:
    - platform: state
      entity_id: sensor.consiglio_finestra_sala
      to:
        - "nessuna_azione"
        - "incerto"
        - "mantieni_aperta"
        - "mantieni_chiusa"
  condition: []
  action:
    - action: persistent_notification.dismiss
      data:
        notification_id: "finestra_sala"

- alias: "Sala: Notifica Esito Consiglio Finestra"
  id: notifica_esito_consiglio_finestra_sala
  trigger:
    - platform: state
      entity_id: sensor.esito_ultimo_consiglio_finestra_sala_validated_v3
      to:
        - "efficace"
        - "inefficace"
  action:
    - action: persistent_notification.create
      data:
        notification_id: "esito_finestra_sala"
        title: >-
          {% set esito = trigger.to_state.state %}
          {% if esito == 'efficace' %}
            ✅ Azione Efficace – Sala
          {% else %}
            ⚠️ Azione Inefficace – Sala
          {% endif %}
        message: >-
          {% set esito = trigger.to_state.state %}
          {% set attrs = trigger.to_state.attributes %}
          {% set tipo = attrs.get('tipo_azione') | default('N/A') %}
          {% set rh_ini = attrs.get('umidita_inizio') | float(0) | round(1) %}
          {% set rh_15 = attrs.get('umidita_15m') %}
          {% set rh_30 = attrs.get('umidita_30m') %}
          {% set rh_60 = attrs.get('umidita_60m') %}

          La valutazione per l'azione di **{{ tipo | upper }}** in **Sala** si è conclusa con esito: **{{ esito | upper }}**.

          - Umidità iniziale: {{ rh_ini }}%
          {% if attrs.get('omega_inizio') not in [none, ''] %}- Omega iniziale: {{ attrs.get('omega_inizio') }} g/kg{% if attrs.get('omega_60m') not in [none, ''] %} → dopo 60m: {{ attrs.get('omega_60m') }} g/kg (Δ: {{ attrs.get('delta_omega_60m') }}){% endif %}{% endif %}
          {% if rh_15 is not none and rh_15 != '' %}- Dopo 15m: {{ rh_15 | float(0) | round(1) }}% (Δ: {{ attrs.get('delta_umidita_15m') | float(0) | round(2) }}%){% endif %}
          {% if rh_30 is not none and rh_30 != '' %}- Dopo 30m: {{ rh_30 | float(0) | round(1) }}% (Δ: {{ attrs.get('delta_umidita_30m') | float(0) | round(2) }}%){% endif %}
          {% if rh_60 is not none and rh_60 != '' %}- Dopo 60m: {{ rh_60 | float(0) | round(1) }}% (Δ: {{ attrs.get('delta_umidita_60m') | float(0) | round(2) }}%){% endif %}

          **Motivo:** {{ attrs.get('motivo') }}
    - event: fancoil_log_event
      event_data:
        level: INFO
        message: >-
          {% set esito = trigger.to_state.state %}
          {% set attrs = trigger.to_state.attributes %}
          {% set tipo = attrs.get('tipo_azione') | default('N/A') %}
          {% set rh_ini = attrs.get('umidita_inizio') | float(0) | round(1) %}
          {% set rh_30 = attrs.get('umidita_30m') | default('N/A') %}
          [Sala] EVALUATION: Esito consiglio finestra: {{ esito | upper }} | Azione: {{ tipo }} | RH inizio: {{ rh_ini }}% -> 30m: {{ rh_30 }}% | Motivo: {{ attrs.get('motivo') }}
