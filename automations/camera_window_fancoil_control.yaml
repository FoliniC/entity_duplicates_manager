# Generated by: yaml_generator/generate_fancoil_climates.py
# Template: fancoil_window_fancoil_control.j2
# Generated at: 2026-11-02 20:11:56

# Fancoil Window Control: Stop fan when window opens, resume when closes
# - Supporta sia sensore fisico (se presente) che interruttore manuale input_boolean
# - Salva velocità fan in input_text (JSON) persistente per sopravvivere a riavvio
# - Non salva se fan già spento (evita sovrascrivere con "spento")
# - Ripristina dopo timeout massimo (30 min) o chiusura finestra
- id: "fancoil_camera_window_open_stop_fan"
  alias: "Fancoil Camera: Stop fan when window opens"
  initial_state: true
  mode: single
  description: "Quando la finestra viene aperta (sensore fisico o manuale), spegne le ventole del fancoil per evitare sprechi energetici"
  triggers:
    - trigger: state
      entity_id: input_boolean.finestra_camera_aperta
      to: "on"
      for: "00:00:05"
  conditions:
    - condition: state
      entity_id: input_boolean.fancoil_camera_enabled
      state: "on"
  actions:

    - variables:
        fan_was_on: >-
          {{ is_state('switch.fancoil_camera_switch_1','on') or
             is_state('switch.fancoil_camera_switch_2','on') or
             is_state('switch.fancoil_camera_switch_3','on') or
             is_state('switch.fancoil_camera_switch_4','on') }}
        main_was_on: "{{ is_state('switch.stox_fancoil_camera_switch','on') }}"
        fan_speeds_json: >-
          {{ '{"1": ' ~ (1 if is_state('switch.fancoil_camera_switch_1','on') else 0) ~
             ', "2": ' ~ (1 if is_state('switch.fancoil_camera_switch_2','on') else 0) ~
             ', "3": ' ~ (1 if is_state('switch.fancoil_camera_switch_3','on') else 0) ~
             ', "4": ' ~ (1 if is_state('switch.fancoil_camera_switch_4','on') else 0) ~ '}' }}
    - if:
        - condition: template
          value_template: "{{ fan_was_on }}"
      then:
        # Salva stato fan SOLO se era acceso (evita sovrascrivere con spento)
        - action: input_text.set_value
          target:
            entity_id: input_text.fancoil_camera_saved_fan_speeds
          data:
            value: "{{ fan_speeds_json }}"
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.fancoil_camera_fan_was_on
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.fancoil_camera_window_opened_at
          data:
            datetime: "{{ now().isoformat() }}"
        - action: switch.turn_off
          target:
            entity_id:
              - switch.fancoil_camera_switch_1
              - switch.fancoil_camera_switch_2
              - switch.fancoil_camera_switch_3
              - switch.fancoil_camera_switch_4
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.fancoil_camera_last_main_off
          data:
            datetime: "{{ now().isoformat() }}"
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Camera] FINESTRA APERTA: spento fancoil (fan era ON). Main era: {{ main_was_on }}"
    - if:
        - condition: template
          value_template: "{{ not fan_was_on }}"
      then:
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Camera] FINESTRA APERTA: fancoil già spento, nessun intervento (velocità NON salvate)"

- id: "fancoil_camera_window_close_resume_fan"
  alias: "Fancoil Camera: Resume fan when window closes"
  initial_state: true
  mode: single
  max_exceeded: silent
  description: "Quando la finestra viene chiusa, riabilita il fancoil e ripristina velocità salvate"
  triggers:
    - trigger: state
      entity_id: input_boolean.finestra_camera_aperta
      to: "off"
      for: "00:00:05"
    # Trigger di sicurezza: timeout massimo 30 min finestra aperta
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.fancoil_camera_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.fancoil_camera_fan_was_on
      state: "on"
    - condition: template
      value_template: >-
        {% set is_closed = (states('input_boolean.finestra_camera_aperta') != 'on') %}
        {% set window_opened_at = state_attr('input_datetime.fancoil_camera_window_opened_at', 'timestamp') | float(0) %}
        {% set timeout = (now().timestamp() - window_opened_at) > 1800 if window_opened_at > 0 else false %}
        {{ is_closed or timeout }}
  actions:
    - variables:
        system_enabled: >-
          {{ is_state('switch.attiva_fancoil', 'on') and
             is_state('switch.attiva_pdc', 'on') and
             is_state('switch.attiva_pompa_circolazione', 'on') }}
        hvac_mode: "{{ states('sensor.fancoil_camera_hvac_temp_mode') }}"
        stop_condition: "{{ is_state('binary_sensor.fancoil_camera_stop_condition', 'on') }}"
        deumidificazione: "{{ is_state('input_boolean.fancoil_deumidificazione', 'on') }}"
        main_available: "{{ states('switch.stox_fancoil_camera_switch') not in ['unavailable','unknown'] }}"
        contact_state: "{{ 'off' }}"
        window_opened_at: "{{ state_attr('input_datetime.fancoil_camera_window_opened_at', 'timestamp') | float(0) }}"
        max_duration_exceeded: "{{ (now().timestamp() - window_opened_at) > 1800 if window_opened_at > 0 else false }}"
        force_resume: >-
          {{ contact_state == 'unavailable' or max_duration_exceeded }}
        fan_was_on: "{{ is_state('input_boolean.fancoil_camera_fan_was_on', 'on') }}"
        saved_speeds: "{{ states('input_text.fancoil_camera_saved_fan_speeds') | from_json({}) }}"
    # Se chiusa o timeout, sincronizza l'input_boolean su OFF se era rimasto ON
    - if:
        - condition: template
          value_template: >-
            {{ is_state('input_boolean.finestra_camera_aperta', 'on') and (force_resume or (states('input_boolean.finestra_camera_aperta') != 'on')) }}
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.finestra_camera_aperta
    - event: fancoil_log_event
      event_data:
        level: info
        message: "[Camera] FINESTRA CHIUSA/UNVAILABLE/TIMEOUT: riabilitazione fancoil. System={{ system_enabled }}, Mode={{ hvac_mode }}, StopCond={{ stop_condition }}, Force={{ force_resume }}, FanWasOn={{ fan_was_on }}"
    - if:
        - condition: template
          value_template: "{{ system_enabled and main_available and hvac_mode != 'off' and (not stop_condition or deumidificazione or hvac_mode == 'dry') }}"
      then:
        # Accendi main switch
        - action: switch.turn_on
          target:
            entity_id: switch.stox_fancoil_camera_switch
        - delay: "00:00:07"
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.fancoil_camera_last_main_on
          data:
            datetime: "{{ now().isoformat() }}"
        # Ripristina velocità fan se erano state salvate
        - if:
            - condition: template
              value_template: "{{ fan_was_on }}"
          then:
            - repeat:
                for_each:
                  - 1
                  - 2
                  - 3
                  - 4
                sequence:
                  - variables:
                      speed_on: "{{ saved_speeds.get(item|string, 0) | int(0) == 1 }}"
                  - if:
                      - condition: template
                        value_template: "{{ speed_on }}"
                    then:
                      - action: switch.turn_on
                        target:
                          entity_id: "switch.fancoil_camera_switch_{{ item }}"
                      - event: fancoil_log_event
                        event_data:
                          level: info
                          message: "[Camera] Ripristinata velocità fan {{ item }}"
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Camera] FINESTRA CHIUSA: main riacceso, velocità ripristinate da input_text"
        # Reset flag fan_was_on
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.fancoil_camera_fan_was_on
    - if:
        - condition: template
          value_template: "{{ not (system_enabled and main_available and hvac_mode != 'off' and (not stop_condition or deumidificazione or hvac_mode == 'dry')) }}"
      then:
        - event: fancoil_log_event
          event_data:
            level: info
            message: "[Camera] FINESTRA CHIUSA: condizioni non soddisfatte per riaccensione (system={{ system_enabled }}, main_avail={{ main_available }}, mode={{ hvac_mode }}, stop={{ stop_condition }})"
        # Reset flag anche se non riaccendiamo
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.fancoil_camera_fan_was_on
