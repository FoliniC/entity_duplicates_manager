# FASE 13 - Modalità di verifica interattiva per tuning algorithmico
# Registra le azioni manuali dell'utente quando input_boolean.verifica_mode è ON.
# Non interferisce con la normale automazione (quella è trigger-based nei sensori).
# L'automazione si attiva solo sugli change manuali di finestra DURANTE la verifica.

- id: "window_verifica_log_camera"
  alias: "Finestra Camera - Log Azione Manuale (Verifica)"
  description: >-
    Fase 13: Registra le azioni manuali dell'utente sulla finestra Camera
    quando la modalità verifica è attiva. Arricchisce il sensore analytics con
    conteggio override e accuratezza rispetto ai consigli automatici.
  initial_state: true
  mode: queued
  max: 10
  variables:
    window_contact_sensor:
  triggers:
    - trigger: state
      entity_id: input_boolean.finestra_camera_aperta
      id: window_toggled

  conditions:
    - condition: state
      entity_id: input_boolean.verifica_mode
      state: "on"

  actions:
    - variables:
        consiglio_ora: "{{ state_attr('sensor.consiglio_finestra_camera', 'candidato') | default(states('sensor.consiglio_finestra_camera')) }}"
        finestra_dopo: "{{ trigger.to_state.state }}"
        finestra_prima: "{{ trigger.from_state.state }}"
        user_id: "{{ trigger.to_state.context.user_id }}"
        ts: "{{ now().isoformat() }}"
        prediction_horizon: "{{ state_attr('sensor.previsione_finestra_camera', 'horizon_minutes') | int(20) }}"
        prediction_review_after_seconds: "{{ (state_attr('sensor.previsione_finestra_camera', 'horizon_minutes') | int(20)) * 60 }}"
        prediction_model_version: "{{ state_attr('sensor.previsione_finestra_camera', 'model_version') }}"
        prediction_external_source: "{{ state_attr('sensor.previsione_finestra_camera', 'external_source') }}"
        prediction_external_temperature: "{{ state_attr('sensor.previsione_finestra_camera', 'external_temperature') }}"
        prediction_external_humidity: "{{ state_attr('sensor.previsione_finestra_camera', 'external_humidity') }}"
        prediction_delta_omega: "{{ state_attr('sensor.previsione_finestra_camera', 'delta_omega') }}"
        prediction_exchange_fraction: "{{ state_attr('sensor.previsione_finestra_camera', 'exchange_fraction') }}"
        current_humidity_snapshot: "{{ state_attr('sensor.previsione_finestra_camera', 'current_humidity') }}"
        predicted_humidity_snapshot: "{{ state_attr('sensor.previsione_finestra_camera', 'predicted_humidity') }}"
        current_temperature_snapshot: "{{ state_attr('sensor.previsione_finestra_camera', 'current_temperature') }}"
        predicted_temperature_snapshot: "{{ state_attr('sensor.previsione_finestra_camera', 'predicted_temperature') }}"
        prediction_text_snapshot: "{{ state_attr('sensor.previsione_finestra_camera', 'prediction_text') }}"
        azione_tipo: >-
          {% if trigger.to_state.state == 'on' %}
            {% if consiglio_ora in ['apri', 'apri_se_riparata'] %}open_concordante{% else %}open_override{% endif %}
          {% else %}
            {% if consiglio_ora == 'chiudi' %}close_concordante{% else %}close_override{% endif %}
          {% endif %}
        e_override: >-
          {{ 'override' in azione_tipo }}
        previous_action_count: "{{ state_attr('sensor.log_attivita_manuali_camera', 'action_count') | int(0) }}"
        previous_override_count: "{{ state_attr('sensor.log_attivita_manuali_camera', 'override_count') | int(0) }}"
        action_count: "{{ previous_action_count | int(0) + 1 }}"
        override_count: "{{ previous_override_count | int(0) + (1 if e_override | bool(false) else 0) }}"
        concordant_count: "{{ action_count | int(0) - override_count | int(0) }}"
        override_rate: "{{ ((override_count | int(0) / action_count | int(1)) * 100) | round(0) }}"
        consiglio_accuracy: "{{ ((concordant_count | int(0) / action_count | int(1)) * 100) | round(0) }}"

    - action: python_script.set_state
      data:
        entity_id: sensor.log_attivita_manuali_camera
        state: "{{ azione_tipo }}"
        action_count: "{{ action_count }}"
        override_count: "{{ override_count }}"
        concordant_count: "{{ concordant_count }}"
        last_action: "{{ azione_tipo }}"
        last_recommendation: "{{ consiglio_ora }}"
        last_window_before: "{{ finestra_prima }}"
        last_window_after: "{{ finestra_dopo }}"
        user_id_last: "{{ user_id }}"
        timestamp_last: "{{ ts }}"
        prediction_horizon: "{{ prediction_horizon }}"
        prediction_review_after_seconds: "{{ prediction_review_after_seconds }}"
        prediction_model_version: "{{ prediction_model_version }}"
        prediction_external_source: "{{ prediction_external_source }}"
        prediction_external_temperature: "{{ prediction_external_temperature }}"
        prediction_external_humidity: "{{ prediction_external_humidity }}"
        prediction_delta_omega: "{{ prediction_delta_omega }}"
        prediction_exchange_fraction: "{{ prediction_exchange_fraction }}"
        prediction_text: "{{ prediction_text_snapshot }}"
        predicted_humidity: "{{ predicted_humidity_snapshot }}"
        predicted_temperature: "{{ predicted_temperature_snapshot }}"

    - action: python_script.set_state
      data:
        entity_id: sensor.analytics_tuning_camera
        state: "{{ override_rate }}"
        override_rate: "{{ override_rate }}"
        consiglio_accuracy: "{{ consiglio_accuracy }}"
        action_count: "{{ action_count }}"
        override_count: "{{ override_count }}"
        concordant_count: "{{ concordant_count }}"
        last_action: "{{ azione_tipo }}"
        last_recommendation: "{{ consiglio_ora }}"
        last_prediction_valid: false
        last_prediction_reason: "{{ 'in_attesa_verifica_tempo_stimato' if finestra_dopo == 'on' else 'azione_chiusura_senza_previsione' }}"
        last_prediction_text: "{{ prediction_text_snapshot }}"
        last_prediction_horizon: "{{ prediction_horizon }}"
        last_prediction_model_version: "{{ prediction_model_version }}"
        last_prediction_external_source: "{{ prediction_external_source }}"
        last_prediction_external_temperature: "{{ prediction_external_temperature }}"
        last_prediction_external_humidity: "{{ prediction_external_humidity }}"
        last_prediction_delta_omega: "{{ prediction_delta_omega }}"
        last_prediction_exchange_fraction: "{{ prediction_exchange_fraction }}"
        last_predicted_humidity: "{{ predicted_humidity_snapshot }}"
        last_predicted_temperature: "{{ predicted_temperature_snapshot }}"
        last_updated: "{{ ts }}"

    # Log tramite evento HALog2026 per tracing persistente
    - event: fancoil_log_event
      event_data:
        level: INFO
        message: >-
          [Verifica Camera] PREDICTION_START: finestra={{ finestra_dopo }},
          consiglio={{ consiglio_ora }}, tipo={{ azione_tipo }},
          override={{ e_override }}, utente={{ user_id }}, ts={{ ts }},
          horizon_min={{ prediction_horizon }}, model={{ prediction_model_version }},
          source={{ prediction_external_source }},
          ext_T={{ prediction_external_temperature }}, ext_RH={{ prediction_external_humidity }},
          delta_omega={{ prediction_delta_omega }}, exchange={{ prediction_exchange_fraction }},
          RH={{ current_humidity_snapshot }}->{{ predicted_humidity_snapshot }},
          T={{ current_temperature_snapshot }}->{{ predicted_temperature_snapshot }},
          text="{{ prediction_text_snapshot }}"

    # Notifica contestuale all'utente se in modalità verifica
    - action: persistent_notification.create
      data:
        title: "🔍 Verifica Camera"
        notification_id: "verifica_camera_azione"
        message: >-
          Azione registrata: finestra {{ 'aperta' if finestra_dopo == 'on' else 'chiusa' }}
          {% if e_override %}
          ⚠️ Override: il sistema consigliava «{{ consiglio_ora }}»
          {% else %}
          ✅ Concordante con consiglio «{{ consiglio_ora }}»
          {% endif %}
          Trend attuale: {{ states('sensor.trend_umidita_camera') }}
          ΔΩ: {{ state_attr('sensor.consiglio_finestra_camera', 'delta_omega') | round(2) if state_attr('sensor.consiglio_finestra_camera', 'delta_omega') is not none else 'N/A' }} g/kg
          {% if finestra_dopo == 'on' %}
          {{ prediction_text_snapshot }}
          {% endif %}

    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ finestra_dopo == 'on'
                   and predicted_humidity_snapshot | float(none) is not none
                   and predicted_temperature_snapshot | float(none) is not none }}
          sequence:
            - delay:
                seconds: "{{ prediction_review_after_seconds | int(1200) }}"

            - variables:
                verification_ts: "{{ now().isoformat() }}"
                prediction_window_still_open: >-
                  {% if window_contact_sensor %}
                    {{ is_state(window_contact_sensor, 'on') }}
                  {% else %}
                    {{ is_state('input_boolean.finestra_camera_aperta', 'on') }}
                  {% endif %}
                actual_humidity: "{{ states('sensor.umidita_camera_pilota') | float(none) }}"
                actual_temperature: >-
                  {% set t_primary = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
                  {% set t_fallback = states('sensor.fancoil_camera_temperature') | float(none) %}
                  {{ t_primary if t_primary is not none and t_primary != 0 else t_fallback }}
                humidity_error: >-
                  {% set actual = states('sensor.umidita_camera_pilota') | float(none) %}
                  {% set predicted = predicted_humidity_snapshot | float(none) %}
                  {{ (actual - predicted) | round(1) if actual is not none and predicted is not none else "" }}
                temperature_error: >-
                  {% set t_primary = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
                  {% set t_fallback = states('sensor.fancoil_camera_temperature') | float(none) %}
                  {% set actual = t_primary if t_primary is not none and t_primary != 0 else t_fallback %}
                  {% set predicted = predicted_temperature_snapshot | float(none) %}
                  {{ (actual - predicted) | round(1) if actual is not none and predicted is not none else "" }}
                prediction_valid: >-
                  {% set finestra_aperta = is_state(window_contact_sensor, 'on') if window_contact_sensor else is_state('input_boolean.finestra_camera_aperta', 'on') %}
                  {{ finestra_aperta
                     and states('sensor.umidita_camera_pilota') | float(none) is not none
                     and temp_ok }}
                prediction_ok: >-
                  {% set h_err = humidity_error | float(none) %}
                  {% set t_err = temperature_error | float(none) %}
                  {{ prediction_valid | bool(false)
                     and h_err is not none
                     and t_err is not none
                     and (h_err | abs) <= 5
                     and (t_err | abs) <= 1.0 }}
                previous_prediction_count: "{{ state_attr('sensor.analytics_tuning_camera', 'prediction_count') | int(0) }}"
                previous_prediction_ok_count: "{{ state_attr('sensor.analytics_tuning_camera', 'prediction_ok_count') | int(0) }}"
                prediction_count: "{{ previous_prediction_count | int(0) + (1 if prediction_valid | bool(false) else 0) }}"
                prediction_ok_count: "{{ previous_prediction_ok_count | int(0) + (1 if prediction_ok | bool(false) else 0) }}"
                prediction_accuracy: >-
                  {% set count = prediction_count | int(0) %}
                  {% if count > 0 %}
                    {{ ((prediction_ok_count | int(0) / count) * 100) | round(0) }}
                  {% else %}
                    0
                  {% endif %}
                new_prediction_factor_humidity: >-
                  {% set current = state_attr('sensor.analytics_tuning_camera', 'prediction_factor_humidity') | float(1.0) %}
                  {% set start = current_humidity_snapshot | float(none) %}
                  {% set predicted = predicted_humidity_snapshot | float(none) %}
                  {% set actual = states('sensor.umidita_camera_pilota') | float(none) %}
                  {% if not prediction_valid | bool(false) or start is none or predicted is none or actual is none or ((predicted - start) | abs) < 1 %}
                    {{ current | round(3) }}
                  {% else %}
                    {% set ratio = (actual - start) / (predicted - start) %}
                    {% set raw = (current * 0.75) + (current * ratio * 0.25) %}
                    {% if raw < 0.4 %}0.4{% elif raw > 1.8 %}1.8{% else %}{{ raw | round(3) }}{% endif %}
                  {% endif %}
                new_prediction_factor_temperature: >-
                  {% set current = state_attr('sensor.analytics_tuning_camera', 'prediction_factor_temperature') | float(1.0) %}
                  {% set start = current_temperature_snapshot | float(none) %}
                  {% set predicted = predicted_temperature_snapshot | float(none) %}
                  {% set actual = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
                  {% if not prediction_valid | bool(false) or start is none or predicted is none or actual is none or ((predicted - start) | abs) < 0.2 %}
                    {{ current | round(3) }}
                  {% else %}
                    {% set ratio = (actual - start) / (predicted - start) %}
                    {% set raw = (current * 0.75) + (current * ratio * 0.25) %}
                    {% if raw < 0.3 %}0.3{% elif raw > 2.0 %}2.0{% else %}{{ raw | round(3) }}{% endif %}
                  {% endif %}
                new_prediction_factor_time: >-
                  {% set current = state_attr('sensor.analytics_tuning_camera', 'prediction_factor_time') | float(1.0) %}
                  {% set h_start = current_humidity_snapshot | float(none) %}
                  {% set h_pred = predicted_humidity_snapshot | float(none) %}
                  {% set h_actual = states('sensor.umidita_camera_pilota') | float(none) %}
                  {% set t_start = current_temperature_snapshot | float(none) %}
                  {% set t_pred = predicted_temperature_snapshot | float(none) %}
                  {% set t_actual = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
                  {% set rh_ratio = ((h_actual - h_start) | abs / ((h_pred - h_start) | abs)) if h_start is not none and h_pred is not none and h_actual is not none and ((h_pred - h_start) | abs) >= 1 else none %}
                  {% set temp_ratio = ((t_actual - t_start) | abs / ((t_pred - t_start) | abs)) if t_start is not none and t_pred is not none and t_actual is not none and ((t_pred - t_start) | abs) >= 0.2 else none %}
                  {% if not prediction_valid | bool(false) %}
                    {{ current | round(3) }}
                  {% elif rh_ratio is not none and temp_ratio is not none %}
                    {% set ratio = ((rh_ratio + temp_ratio) / 2) %}
                    {% set raw = current * (1.1 if ratio < 0.75 else (0.9 if ratio > 1.25 else 1.0)) %}
                    {% if raw < 0.5 %}0.5{% elif raw > 1.8 %}1.8{% else %}{{ raw | round(3) }}{% endif %}
                  {% elif rh_ratio is not none %}
                    {% set raw = current * (1.1 if rh_ratio < 0.75 else (0.9 if rh_ratio > 1.25 else 1.0)) %}
                    {% if raw < 0.5 %}0.5{% elif raw > 1.8 %}1.8{% else %}{{ raw | round(3) }}{% endif %}
                  {% elif temp_ratio is not none %}
                    {% set raw = current * (1.1 if temp_ratio < 0.75 else (0.9 if temp_ratio > 1.25 else 1.0)) %}
                    {% if raw < 0.5 %}0.5{% elif raw > 1.8 %}1.8{% else %}{{ raw | round(3) }}{% endif %}
                  {% else %}
                    {{ current | round(3) }}
                  {% endif %}
                prediction_reason: >-
                  {% if not prediction_window_still_open | bool(false) %}
                    finestra_chiusa_prima_del_termine
                  {% elif not prediction_valid | bool(false) %}
                    finestra_chiusa_troppo_presto
                  {% elif prediction_ok | bool(false) %}
                    previsione_azzeccata
                  {% else %}
                    previsione_da_correggere
                  {% endif %}

            - action: python_script.set_state
              data:
                entity_id: sensor.analytics_tuning_camera
                state: "{{ override_rate }}"
                override_rate: "{{ override_rate }}"
                consiglio_accuracy: "{{ consiglio_accuracy }}"
                action_count: "{{ action_count }}"
                override_count: "{{ override_count }}"
                concordant_count: "{{ concordant_count }}"
                prediction_count: "{{ prediction_count }}"
                prediction_ok_count: "{{ prediction_ok_count }}"
                prediction_accuracy: "{{ prediction_accuracy }}"
                prediction_factor_humidity: "{{ new_prediction_factor_humidity }}"
                prediction_factor_temperature: "{{ new_prediction_factor_temperature }}"
                prediction_factor_time: "{{ new_prediction_factor_time }}"
                last_prediction_valid: "{{ prediction_valid }}"
                last_prediction_ok: "{{ prediction_ok }}"
                last_prediction_reason: "{{ prediction_reason }}"
                last_prediction_text: "{{ prediction_text_snapshot }}"
                last_prediction_horizon: "{{ prediction_horizon }}"
                last_prediction_model_version: "{{ prediction_model_version }}"
                last_prediction_external_source: "{{ prediction_external_source }}"
                last_prediction_external_temperature: "{{ prediction_external_temperature }}"
                last_prediction_external_humidity: "{{ prediction_external_humidity }}"
                last_prediction_delta_omega: "{{ prediction_delta_omega }}"
                last_prediction_exchange_fraction: "{{ prediction_exchange_fraction }}"
                last_predicted_humidity: "{{ predicted_humidity_snapshot }}"
                last_actual_humidity: "{{ actual_humidity }}"
                last_humidity_error: "{{ humidity_error }}"
                last_predicted_temperature: "{{ predicted_temperature_snapshot }}"
                last_actual_temperature: "{{ actual_temperature }}"
                last_temperature_error: "{{ temperature_error }}"
                last_prediction_checked_at: "{{ verification_ts }}"
                last_updated: "{{ verification_ts }}"

            - action: python_script.set_state
              data:
                entity_id: sensor.log_attivita_manuali_camera
                state: "{{ 'prediction_ok' if prediction_ok | bool(false) else 'prediction_checked' }}"
                last_prediction_valid: "{{ prediction_valid }}"
                last_prediction_ok: "{{ prediction_ok }}"
                last_prediction_reason: "{{ prediction_reason }}"
                last_prediction_horizon: "{{ prediction_horizon }}"
                last_prediction_model_version: "{{ prediction_model_version }}"
                last_prediction_external_source: "{{ prediction_external_source }}"
                last_prediction_external_temperature: "{{ prediction_external_temperature }}"
                last_prediction_external_humidity: "{{ prediction_external_humidity }}"
                last_prediction_delta_omega: "{{ prediction_delta_omega }}"
                last_prediction_exchange_fraction: "{{ prediction_exchange_fraction }}"
                last_predicted_humidity: "{{ predicted_humidity_snapshot }}"
                last_actual_humidity: "{{ actual_humidity }}"
                last_humidity_error: "{{ humidity_error }}"
                last_predicted_temperature: "{{ predicted_temperature_snapshot }}"
                last_actual_temperature: "{{ actual_temperature }}"
                last_temperature_error: "{{ temperature_error }}"
                prediction_checked_at: "{{ verification_ts }}"

            - event: fancoil_log_event
              event_data:
                level: INFO
                message: >-
                  [Verifica Camera] PREDICTION_END:
