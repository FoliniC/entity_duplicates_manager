                  delta_omega={{ prediction_delta_omega }}, exchange={{ prediction_exchange_fraction }},
                  UR start={{ current_humidity_snapshot }}, UR pred={{ predicted_humidity_snapshot }},
                  UR actual={{ actual_humidity }}, err={{ humidity_error }},
                  T start={{ current_temperature_snapshot }}, T pred={{ predicted_temperature_snapshot }}, T actual={{ actual_temperature }},
                  errT={{ temperature_error }},
                  fattori={{ new_prediction_factor_humidity }}/{{ new_prediction_factor_temperature }}/{{ new_prediction_factor_time }}

            - action: persistent_notification.create
              data:
