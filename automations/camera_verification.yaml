                  {% if prediction_valid | bool(false) %}
                  Previsione {{ 'azzeccata' if prediction_ok | bool(false) else 'da correggere' }}.
                  Tempo stimato: {{ prediction_horizon }} minuti.
                  Umidita prevista {{ predicted_humidity_snapshot }}%, reale {{ actual_humidity }}% (errore {{ humidity_error }}%).
                  Temperatura prevista {{ predicted_temperature_snapshot }}°C, reale {{ actual_temperature }}°C (errore {{ temperature_error }}°C).
                  Nuovi fattori: umidita {{ new_prediction_factor_humidity }}, temperatura {{ new_prediction_factor_temperature }}, tempo {{ new_prediction_factor_time }}.
                  {% else %}
                  Finestra aperta troppo brevemente: {{ prediction_reason }}.
                  {% endif %}

- id: "window_verifica_reset_notif_camera"
  alias: "Finestra Camera - Rimuovi notifica verifica"
  description: >-
    Fase 13: Rimuove la notifica di verifica Camera quando
    la modalità verifica viene disattivata.
  initial_state: true
  mode: single

  triggers:
    - trigger: state
      entity_id: input_boolean.verifica_mode
      to: "off"

  actions:
    - action: persistent_notification.dismiss
      data:
        notification_id: "verifica_camera_azione"
