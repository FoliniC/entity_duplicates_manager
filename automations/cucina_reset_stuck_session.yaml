# Automazione: Reset sessioni esito bloccate Cucina
# Se il sensore _con_validazione rimane in "in_attesa" per più di 15 minuti (900 secondi),
# forza un aggiornamento dell'entità per uscire dallo stallo.
# Questo gestisce il caso in cui l'helper umidità non riceva mai un valore valido.

- alias: "Reset sessione esito bloccata Cucina"
  id: reset_sessione_esito_cucina_bloccata
  initial_state: true
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/5"
  action:
    - condition: template
      value_template: >
        {{ is_state('sensor.esito_ultimo_consiglio_finestra_cucina_validated', 'in_attesa')
           and (as_timestamp(now()) - as_timestamp(states.sensor.esito_ultimo_consiglio_finestra_cucina_validated.last_changed)) > 900 }}
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.esito_ultimo_consiglio_finestra_cucina_validated
