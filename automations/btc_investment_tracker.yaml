- id: btc_tracker_significant_loss
  alias: "BTC Tracker: Perdita significativa ⚠️"
  description: "Alert se perdita NETTA > 20% dell'investimento"
  trigger:
    - platform: template
      value_template: >
        {% set roi = states('sensor.btc_roi_pct_net') | float(0) %}
        {{ roi <= -20 }}
  condition:
    - condition: template
      value_template: >
        {% set last = state_attr('automation.btc_tracker_significant_loss', 'last_triggered') %}
        {% if last is none %} true {% else %}
        {{ (now() - last).total_seconds() > 43200 }}
        {% endif %}
  action:
    - action: notify.mobile_app_ultra17
      data:
        title: "⚠️ BTC Tracker: Perdita significativa"
        message: >
          Il tuo investimento BTC ha perso oltre il 20% (NETTO tasse).
          ROI NETTO: {{ states('sensor.btc_roi_pct_net') }}%
          Valore: {{ states('sensor.btc_current_value') | float(0) | round(2) }} €
          Investito: {{ states('sensor.btc_investment_eur') | float(0) | round(2) }} €
        data:
          tag: btc_loss_alert
          importance: high
          notification_icon: "mdi:alert-circle"
          color: "#E53935"
  mode: single

- id: btc_tracker_daily_report
  alias: "BTC Tracker: Report giornaliero 📊"
  description: "Report riepilogativo ogni mattina alle 9:00 (valori netti tasse 33%)"
  trigger:
    - platform: time
      at: "09:00:00"
  action:
    - action: notify.mobile_app_ultra17
      data:
        title: "📊 BTC Tracker: Report giornaliero"
        message: >
          **Bitcoin:** {{ states('sensor.bitcoin_price_eur') | float(0) | round(2) }} € (24h: {{ states('sensor.bitcoin_24h_change_pct') | float(0) | round(2) }}%)
          
          **Il tuo portafoglio:**
          • BTC posseduti: {{ states('sensor.btc_amount') }} BTC
          • Valore attuale: {{ states('sensor.btc_current_value') | float(0) | round(2) }} €
          • Investimento: {{ states('sensor.btc_investment_eur') | float(0) | round(2) }} €
          • Profitto LORDO: {{ states('sensor.btc_profit_loss') | float(0) | round(2) }} € ({{ states('sensor.btc_roi_pct') }}%)
          • Tasse stimate (33%): {{ states('sensor.btc_tax_amount') | float(0) | round(2) }} €
          • Profitto NETTO: {{ states('sensor.btc_profit_loss_net') | float(0) | round(2) }} € ({{ states('sensor.btc_roi_pct_net') }}%)
          • Netto per BTC: {{ states('sensor.btc_net_price_per_btc') | float(0) | round(2) }} €
          
          **Obiettivo telefono (Xiaomi 17 Ultra):**
          • {{ states('sensor.target_phone_name') }}: {{ states('sensor.target_phone_price') | float(0) | round(2) }} €
          • Progresso NETTO: {{ states('sensor.btc_progress_to_phone_net_pct') }}%
          • Delta NETTO: {{ states('sensor.btc_delta_to_phone_net') | float(0) | round(2) }} €
          • {{ states('sensor.btc_can_buy_phone_net') }}
          • BTC da vendere: {{ states('sensor.btc_to_sell_for_phone') }} BTC
          
          **Break-even BTC price:** {{ states('sensor.btc_break_even_phone_price') | float(0) | round(0) }} €/BTC
          
          {% if states('sensor.btc_days_to_phone_estimate') | float(0) > 0 %}
          • Stima giorni: {{ states('sensor.btc_days_to_phone_estimate') | float(0) | round(1) }} giorni
          {% endif %}
        data:
          tag: btc_daily_report
          importance: default
          notification_icon: "mdi:chart-line"
  mode: single