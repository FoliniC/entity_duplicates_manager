# ============================================================================
# BITCOIN INVESTMENT TRACKER - Automazioni
# ============================================================================
# Notifiche quando profitto BTC NETTO (dopo tasse) >= prezzo telefono target
# File separato per essere caricato via !include_dir_merge_list automations
# ============================================================================

- id: btc_tracker_phone_affordable
  alias: "BTC Tracker: Puoi comprare il telefono! 🎉"
  description: "Notifica quando il profitto BTC NETTO (tasse 33%) copre il prezzo del telefono target"
  trigger:
    - platform: template
      value_template: >
        {% set profit = states('sensor.btc_profit_loss_net') | float(0) %}
        {% set phone = states('sensor.target_phone_price') | float(0) %}
        {{ profit >= phone }}
      id: "profit_reached_phone"
  condition:
    # Cooldown: non notificare più di una volta al giorno
    - condition: template
      value_template: >
        {% set last = state_attr('automation.btc_tracker_phone_affordable', 'last_triggered') %}
        {% if last is none %} true {% else %}
        {{ (now() - last).total_seconds() > 86400 }}
        {% endif %}
  action:
    - action: notify.mobile_app_ultra17
      data:
        title: "🎉 BTC Tracker: Obiettivo raggiunto!"
        message: >
          Il tuo profitto Bitcoin NETTO 33% ({{ states('sensor.btc_profit_loss_net') | float(0) | round(2) }} €)
          ha raggiunto il prezzo del {{ states('sensor.target_phone_name') }}
          ({{ states('sensor.target_phone_price') | float(0) | round(2) }} €)!
          
          Progresso NETTO: {{ states('sensor.btc_progress_to_phone_net_pct') }}%
          
          Valore attuale BTC: {{ states('sensor.btc_current_value') | float(0) | round(2) }} €
          Investimento: {{ states('sensor.btc_investment_eur') | float(0) | round(2) }} €
          ROI LORDO: {{ states('sensor.btc_roi_pct') }}%
          ROI NETTO (33%): {{ states('sensor.btc_roi_pct_net') }}%
          Tasse stimate (33%): {{ states('sensor.btc_tax_amount') | float(0) | round(2) }} €
          Netto per BTC: {{ states('sensor.btc_net_price_per_btc') | float(0) | round(2) }} €
          BTC da vendere: {{ states('sensor.btc_to_sell_for_phone') }} BTC
        data:
          tag: btc_phone_goal
          importance: high
          notification_icon: "mdi:bitcoin"
          color: "#F7931A"
  mode: single

- id: btc_tracker_milestone_50
  alias: "BTC Tracker: Milestone 50% 📈"
  description: "Notifica al 50% del progresso NETTO verso telefono"
  trigger:
    - platform: template
      value_template: >
        {% set pct = states('sensor.btc_progress_to_phone_net_pct') | float(0) %}
        {{ pct >= 50 and pct < 75 }}
  condition:
    - condition: template
      value_template: >
        {% set last = state_attr('automation.btc_tracker_milestone_50', 'last_triggered') %}
        {% if last is none %} true {% else %}
        {{ (now() - last).total_seconds() > 86400 }}
        {% endif %}
  action:
    - action: notify.mobile_app_ultra17
      data:
        title: "📈 BTC Tracker: 50% raggiunto!"
        message: >
          Sei a metà strada per il {{ states('sensor.target_phone_name') }} (NETTO tasse)!
          Profitto netto: {{ states('sensor.btc_profit_loss_net') | float(0) | round(2) }} € / {{ states('sensor.target_phone_price') | float(0) | round(2) }} €
        data:
          tag: btc_milestone_50
          importance: default
          notification_icon: "mdi:chart-line"
  mode: single

