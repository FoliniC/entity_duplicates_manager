# Sensori Template Rev. 38 - Fix prism_potenza_assorbita → prism_potenza (5 occorrenze)
# RIEPILOGO MODIFICHE:
#   - sensor.prism_potenza_assorbita sostituito con sensor.prism_potenza ovunque (bug critico:
#     il sensore originale probabilmente non esiste → prism_p=0 sempre → surplus sottostimato)
#   - Commenti aggiornati per chiarire la logica del battery bonus

- name: "EV Charge 2025 Solar Max Ampere"
  unique_id: ev_charge_2025_solar_max_ampere
  unit_of_measurement: "A"
  state: >
    {% set smart_meter = states('sensor.smart_meter_ts_100a_1_potenza_reale') %}
    {% set unit_sm = state_attr('sensor.smart_meter_ts_100a_1_potenza_reale', 'unit_of_measurement') %}
    {% set grid_p = smart_meter | float if smart_meter not in ['unavailable', 'unknown'] else states('sensor.potenza_prelevata_attuale') | float(0) %}
    {% set grid_p_w = (grid_p * 1000) if unit_sm == 'kW' else grid_p %}

    {# FIX: prism_potenza_assorbita → prism_potenza (entità corretta confermata) #}
    {% set prism_p = states('sensor.prism_potenza') | float(0) %}
    {% set soc = states('sensor.byd_battery_box_premium_hv_state_of_charge') | float(0) %}
    {% set voltage = states('sensor.folini_carlo_voltage_ac') | float(230) | round(1) %}

    {# b_power: negativo = batteria in ricarica (assorbe potenza), positivo = batteria in scarica (eroga) #}
    {% set b_power = states('sensor.solarnet_power_battery') | float(0) %}

    {# Surplus netto disponibile per l'EV:
       = Potenza attuale EV  (ciò che già usiamo per l'auto)
       - Prelievo netto dalla rete  (se esportiamo, grid_p_w < 0 → contribuisce positivo)
       - Potenza batteria  (se sta caricando, b_power < 0 → -b_power è positivo, surplus reale)
       Nota: il contatore (grid_p_w) è già incluso qui → NON va sottratto di nuovo
             nell'automazione. solar_max_ampere_smoothed è già il surplus "chiuso sul contatore". #}
    {% set w_surplus = (prism_p - grid_p_w) - b_power %}

    {% set margine = 350 %}

    {# Battery bonus: aggiunge la capacità di scarica POTENZIALE della BYD oltre alla
       scarica attuale (già catturata in b_power). Serve a permettere l'avvio della
       ricarica EV prevedendo che la BYD interverrà in scarica se necessario. #}
    {% set w_battery_bonus = 0 %}
    {% if soc > 75 %} {% set w_battery_bonus = 2500 %}
    {% elif soc > 50 %} {% set w_battery_bonus = 1500 %}
    {% elif soc > 35 %} {% set w_battery_bonus = 1000 %}
    {% endif %}

    {% set w_totale = w_surplus + w_battery_bonus - margine %}
    {{ ([0, (w_totale / voltage) | int] | max) }}

- name: "EV Charge 2025 Current SOC"
  unique_id: ev_charge_2025_current_soc
  unit_of_measurement: "%"
  state: >
    {% set veh_soc = states('sensor.selected_vehicle_soc') %}
    {% if veh_soc not in ['unavailable', 'unknown', 'none'] %}
      {{ veh_soc | float(0) | round(1) }}
    {% else %}
      {{ states('sensor.mg_mg4_electric_state_of_charge') | float(0) | round(1) }}
    {% endif %}

- name: "EV Charge 2025 Remaining Time"
  unique_id: ev_charge_2025_remaining_time
  unit_of_measurement: "min"
  state: >
    {% set end_time = states('input_datetime.ev_charge_2025_end_time') %}
    {% set active = is_state('input_boolean.ev_charge_2025_charging_active', 'on') %}
    {% set duration = states('input_number.ev_charge_2025_duration') | int(240) %}
    {% if active and duration < 240 and end_time != '00:00:00' %}
      {% set end_dt = today_at(end_time) %}
      {% set diff = (end_dt - now()).total_seconds() / 60 %}
      {{ [0, diff | round(0) | int] | max }}
    {% else %}
      0
    {% endif %}
  availability: "{{ states('input_datetime.ev_charge_2025_end_time') not in ['unavailable', 'unknown'] }}"

- name: "EV Charge 2025 Reason"
  unique_id: ev_charge_2025_reason
  state: >
    {% set cur = states('sensor.ev_charge_2025_current_soc') | float(0) %}
    {% set tgt = states('input_number.ev_charge_2025_target_soc') | float(0) %}
    {% set limit = states('input_number.ev_charge_2025_vehicle_limit_soc') | float(100) %}
    {% set active = is_state('input_boolean.ev_charge_2025_charging_active', 'on') %}
    {% set mode = states('input_select.ev_charge_2025_mode') %}
    {% set crono = states('input_number.ev_charge_2025_cronostar_power_target') | float(0) %}
    {% set solar = states('sensor.ev_charge_2025_solar_max_ampere_smoothed') | float(0) | int %}
    {% set prism_state = states('sensor.prism_stato_wallbox') | lower %}

    {% if prism_state in ['unplugged', 'idle', 'unknown'] %} Veicolo non collegato.
    {% elif cur >= limit %} Carica Completata.
    {% elif active %}
      {% if mode == 'Manuale' %} In carica (Manuale).
      {% elif crono >= 7.9 %}
        {% if solar >= 6 %} In carica (Solare: {{ solar }}A)
        {% else %} In pausa (Attesa Sole > 6A, attuale: {{ solar }}A)
        {% endif %}
      {% else %} In carica (Programmata: {{ [crono, solar * states('sensor.folini_carlo_voltage_ac') | float(230) / 1000] | min | round(1) }}kW effettivi)
      {% endif %}
    {% else %} Pronto.
    {% endif %}

- name: "EV Charge 2025 Time to Limit"
  unique_id: ev_charge_2025_time_to_limit
  icon: mdi:timer-sand
  state: >
    {% set cur = states('sensor.ev_charge_2025_current_soc') | float(0) %}
    {% set limit = states('input_number.ev_charge_2025_vehicle_limit_soc') | float(100) %}
    {% set cap = states('input_number.ev_charge_2025_battery_capacity') | float(50) %}
    {# FIX: prism_potenza_assorbita → prism_potenza #}
    {% set power_w = states('sensor.prism_potenza') | float(0) %}
    {% if power_w > 100 and cur < limit %}
      {% set hours = ((limit - cur) / 100 * cap) / (power_w / 1000) %}
      {{ (hours * 60) | int }} min
    {% else %} unavailable
    {% endif %}

- name: "EV Charge 2025 Power From Solar"
  unique_id: ev_charge_2025_power_from_solar
  unit_of_measurement: "W"
  state: >
    {# FIX: prism_potenza_assorbita → prism_potenza #}
    {% set prism = states('sensor.prism_potenza') | float(0) %}
    {% set smart_meter = states('sensor.smart_meter_ts_100a_1_potenza_reale') | float(0) %}
    {# Se il contatore è negativo (esportazione), tutta la potenza EV viene dal solare.
       Altrimenti, la quota solare è (prism - import), con minimo 0. #}
    {% set surplus = ((-smart_meter if smart_meter < 0 else 0) + prism) %}
    {{ [prism, surplus] | min | round(0) }}

- name: "EV Charge 2025 Power From Battery"
  unique_id: ev_charge_2025_power_from_battery
  unit_of_measurement: "W"
  state: >
    {# FIX: prism_potenza_assorbita → prism_potenza #}
    {% set prism = states('sensor.prism_potenza') | float(0) %}
    {% set solar_used = states('sensor.ev_charge_2025_power_from_solar') | float(0) %}
    {% set soc = states('sensor.byd_battery_box_premium_hv_state_of_charge') | float(0) %}
    {% set w_battery_available = [(soc - 30) / 70 * 4500, 0] | max if soc > 30 else 0 %}
    {{ [prism - solar_used, w_battery_available] | min | round(0) }}

- name: "EV Charge 2025 Power From Grid"
  unique_id: ev_charge_2025_power_from_grid
  unit_of_measurement: "W"
  state: >
    {# FIX: prism_potenza_assorbita → prism_potenza #}
    {% set prism = states('sensor.prism_potenza') | float(0) %}
    {% set solar_used = states('sensor.ev_charge_2025_power_from_solar') | float(0) %}
    {% set battery_used = states('sensor.ev_charge_2025_power_from_battery') | float(0) %}
    {{ [0, prism - solar_used - battery_used] | max | round(0) }}
