# HALog2026 — Fancoil Log Listener
# initial_state: false prevents HA from validating pyscript.halog2026_write
# at boot (before pyscript has registered its services).
# The boot manager and pyscript startup both enable this automation once safe.

- id: fancoil_log_event_listener
  alias: "Fancoil: Listener Eventi Log"
  description: "Ascolta gli eventi fancoil_log_event e li indirizza a HALog2026"
  initial_state: false
  trigger:
    - trigger: event
      event_type: fancoil_log_event
  actions:
    - action: pyscript.halog2026_write
      data:
        subsystem: fancoil
        level: "{{ trigger.event.data.level | default('info') }}"
        message: "{{ trigger.event.data.message | default('') }}"
