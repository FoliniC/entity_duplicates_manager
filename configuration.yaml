# ============================================================================
# VOICE & CONVERSATION
# ============================================================================
python_script:

conversation:
  intents:
    AccendiTV:
      - "Accendi tv"
      - "Accendi la tv"
      - "Accendi televisione"
    SpegniTV:
      - "Spegni tv"
      - "Spegni la tv"
      - "Spegni televisione"
    AccendiLuciCucina:
      - "Accendi luci cucina"
      - "Accendi luce cucina"
      - "Accendi le luci della cucina"
    SpegniLuciCucina:
      - "Spegni luci cucina"
      - "Spegni luce cucina"
      - "Spegni le luci della cucina"
    AccendiLuciScale:
      - "Accendi luci scala"
      - "Accendi luci scale"
      - "Accendi le luci delle scale"
    SpegniLuciScale:
      - "Spegni luci scala"
      - "Spegni luci scale"
      - "Spegni le luci delle scale"
    UscitaDaCasa:
      - "Esco"
    # Disabilita intenti predefiniti
    HassTurnOn: []
    HassTurnOff: []
    HassToggle: []
    HassOpenCover: []

intent_script:
  DefaultFallback:
    speech:
      text: "Comando non riconosciuto."
    action: []

  AccendiTV:
    speech:
      text: "Sto accendendo la TV"
    action:
      - action: media_player.turn_on
        target:
          device_id: e3135a5aaee16041b35148762ee53a4e

  SpegniTV:
    speech:
      text: "Sto spegnendo la TV"
    action:
      - action: media_player.turn_off
        target:
          device_id: e3135a5aaee16041b35148762ee53a4e

  AccendiLuciCucina:
    speech:
      text: "Sto accendendo le luci della cucina."
    action:
      - action: switch.turn_on
        target:
          entity_id: switch.luci_cucina

  AccendiLuciScale:
    speech:
      text: "Sto accendendo le luci delle scale."
    action:
      - action: light.turn_on
        target:
          entity_id: light.luce_scale_switch

  SpegniLuciCucina:
    speech:
      text: "Sto spegnendo le luci della cucina."
    action:
      - action: switch.turn_off
        target:
          entity_id: switch.luci_cucina

  SpegniLuciScale:
    speech:
      text: "Sto spegnendo le luci delle scale."
    action:
      - action: light.turn_off
        target:
          entity_id: light.luce_scale_switch

# ============================================================================
# LOGGER
# ============================================================================
logger:
  default: warning
  filters:
    homeassistant.components.emulated_hue.hue_api:
      - "Entity not found"
      - "Entity not exposed"
    aioamazondevices:
      - debug
  logs:
    homeassistant.components.emulated_hue: warning
    homeassistant.components.emulated_hue.hue_api: warning
    homeassistant.components.template: warning
    homeassistant.components.light: warning
    homeassistant.components.homeassistant: warning
    custom_components.localtuya: info
    custom_components.entity_duplicates_manager: info
    fancoil_system: error
    homeassistant.components.shell_command: error
    homeassistant.components.script: warning
    system_log.external: error
    homeassistant.components.mqtt: error
    homeassistant.components.automation: error
    custom_components.cronostar: error
    custom_components.azure_openai_sdk_conversation: error
    custom_components.mg_saic: warning
    esphome: error
    homeassistant.helpers.script: warning
    # DEBUG xiaomi_ble troubleshooting
    homeassistant.components.xiaomi_ble: error
    homeassistant.components.bluetooth: error
    homeassistant.components.bluetooth.manager: error
    homeassistant.components.bluetooth.scanner: error
    custom_components.pyscript: warning
