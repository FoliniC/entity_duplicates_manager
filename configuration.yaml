# ============================================================================
# HOME ASSISTANT CONFIGURATION
# Versione: 2026.3
# Ultimo aggiornamento: 2026-03-06
# ============================================================================

# Core Configuration
default_config:

# Watchdog interno: dump stack Python se l'event loop si blocca
faulthandler_watch:

# Frontend
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js
# Automation & Scripts
automation: !include_dir_merge_list automations
script: !include_dir_merge_named yaml_generator/scripts
shell_command: !include_dir_merge_named yaml_generator/shell_command/
rest_command: !include_dir_merge_named yaml_generator/rest_command/

# Media
ffmpeg:
stream:


# ============================================================================
# HOMEASSISTANT CORE
# ============================================================================
homeassistant:
  customize: !include customize.yaml
  allowlist_external_dirs:
    - /config
    - /config/cronostar
    - /config/www/cronostar_profiles
  packages: !include_dir_named packages

# ============================================================================
# NOTIFY GROUP - per inviare notifiche a più dispositivi mobile
# ============================================================================
notify:
  - name: all_devices
    platform: group
    services:
      - action: mobile_app_ultra17
      - action: mobile_app_redmi_note_13_pro_5g

# ============================================================================
# GROUPS
# ============================================================================

group: !include groups.yaml

# ============================================================================
# TEMPLATE ENTITIES (CONSOLIDATO)
# ============================================================================
template: !include yaml_generator/fancoil_templates_master.yaml

# ============================================================================
# CLIMATE
# ============================================================================
climate: !include_dir_merge_list yaml_generator/generated_climates/

# ============================================================================
# SENSORS (PLATFORM)
# ============================================================================
sensor:
  # Reboot Service
  # - platform: reboot_service

  # Statistics Sensors
  - platform: statistics
    name: statistics_temperatura_bagno_variance
    state_characteristic: variance
    entity_id: sensor.temperatura_bagno
    unique_id: sensor.temperatura_bagno_variance
    max_age:
      minutes: 4

  - platform: statistics
    name: statistics_temperatura_cucina_variance
    state_characteristic: variance
    entity_id: sensor.th1a_temperature
    unique_id: sensor.temperatura_cucina_variance
    max_age:
      minutes: 5

  - platform: statistics
    name: statistics_temperatura_camera_grande_variance
    state_characteristic: variance
    entity_id: sensor.temperatura_camera_grande
    unique_id: sensor.temperatura_camera_grande_variance
    max_age:
      minutes: 4

  - platform: statistics
    name: statistics_temperatura_camera_variance
    state_characteristic: variance
    entity_id: sensor.temperatura_camera
    unique_id: sensor.temperatura_camera_variance
    max_age:
      minutes: 4

  - platform: statistics
    name: statistics_temperatura_sala_variance
    state_characteristic: variance
    entity_id: sensor.temperatura_sala
    unique_id: sensor.temperatura_sala_variance
    max_age:
      minutes: 4

  # Humidity Statistics Sensors for Window Detection
  - platform: statistics
    name: statistics_umidita_bagno_variance
    state_characteristic: variance
    entity_id: sensor.umidita_bagno_pilota
    unique_id: sensor.umidita_bagno_variance
    max_age:
      minutes: 5

  - platform: statistics
    name: statistics_umidita_cucina_variance
    state_characteristic: variance
    entity_id: sensor.umidita_cucina_pilota
    unique_id: sensor.umidita_cucina_variance
    max_age:
      minutes: 5

  - platform: statistics
    name: statistics_umidita_camera_grande_variance
    state_characteristic: variance
    entity_id: sensor.umidita_camera_grande_pilota
    unique_id: sensor.umidita_camera_grande_variance
    max_age:
      minutes: 5

  - platform: statistics
    name: statistics_umidita_camera_variance
    state_characteristic: variance
    entity_id: sensor.umidita_camera_pilota
    unique_id: sensor.umidita_camera_variance
    max_age:
      minutes: 5

  - platform: statistics
    name: statistics_umidita_sala_variance
    state_characteristic: variance
    entity_id: sensor.umidita_sala_pilota
    unique_id: sensor.umidita_sala_variance
    max_age:
      minutes: 5

  - platform: statistics
    name: statistics_umidita_corridoio_variance
    state_characteristic: variance
    entity_id: sensor.umidita_corridoio_pilota
    unique_id: sensor.umidita_corridoio_variance
    max_age:
      minutes: 5

  # Humidity Change Statistics Sensors (Short-term: 15 minutes)
  - platform: statistics
    name: statistics_umidita_bagno_change_breve
    unique_id: statistics_umidita_bagno_change_breve
    state_characteristic: change
    entity_id: sensor.umidita_bagno_pilota
    max_age:
      minutes: 15

  - platform: statistics
    name: statistics_umidita_cucina_change_breve
    unique_id: statistics_umidita_cucina_change_breve
    state_characteristic: change
    entity_id: sensor.umidita_cucina_pilota
    max_age:
      minutes: 15

  - platform: statistics
    name: statistics_umidita_camera_grande_change_breve
    unique_id: statistics_umidita_camera_grande_change_breve
    state_characteristic: change
    entity_id: sensor.umidita_camera_grande_pilota
    max_age:
      minutes: 15

  - platform: statistics
    name: statistics_umidita_camera_change_breve
    unique_id: statistics_umidita_camera_change_breve
    state_characteristic: change
    entity_id: sensor.umidita_camera_pilota
    max_age:
      minutes: 15

  - platform: statistics
    name: statistics_umidita_sala_change_breve
    unique_id: statistics_umidita_sala_change_breve
    state_characteristic: change
    entity_id: sensor.umidita_sala_pilota
    max_age:
      minutes: 15

  - platform: statistics
    name: statistics_umidita_corridoio_change_breve
    unique_id: statistics_umidita_corridoio_change_breve
    state_characteristic: change
    entity_id: sensor.umidita_corridoio_pilota
    max_age:
      minutes: 15

  # Humidity Change Statistics Sensors (Medium-term: 60 minutes)
  - platform: statistics
    name: statistics_umidita_bagno_change_medio
    unique_id: statistics_umidita_bagno_change_medio
    state_characteristic: change
    entity_id: sensor.umidita_bagno_pilota
    max_age:
      minutes: 60

  - platform: statistics
    name: statistics_umidita_cucina_change_medio
    unique_id: statistics_umidita_cucina_change_medio
    state_characteristic: change
    entity_id: sensor.umidita_cucina_pilota
    max_age:
      minutes: 60

  - platform: statistics
    name: statistics_umidita_camera_grande_change_medio
    unique_id: statistics_umidita_camera_grande_change_medio
    state_characteristic: change
    entity_id: sensor.umidita_camera_grande_pilota
    max_age:
      minutes: 60

  - platform: statistics
    name: statistics_umidita_camera_change_medio
    unique_id: statistics_umidita_camera_change_medio
    state_characteristic: change
    entity_id: sensor.umidita_camera_pilota
    max_age:
      minutes: 60

  - platform: statistics
    name: statistics_umidita_sala_change_medio
    unique_id: statistics_umidita_sala_change_medio
    state_characteristic: change
    entity_id: sensor.umidita_sala_pilota
    max_age:
      minutes: 60

  - platform: statistics
    name: statistics_umidita_corridoio_change_medio
    unique_id: statistics_umidita_corridoio_change_medio
    state_characteristic: change
    entity_id: sensor.umidita_corridoio_pilota
    max_age:
      minutes: 60

  # InfluxDB
  - platform: influxdb
    api_version: 2
    ssl: false
    host: 192.168.0.3
    port: 8086
    token: !secret influxdb_token
    organization: ViaGrande50
    bucket: HAData
    queries_flux:
      - range_start: "-10d"
        name: "Camera Grande Current Temperature Influx"
        query: >
          filter(fn: (r) => r["_measurement"] == "climate.controllo_temperatura_camera_grande" )
          |> filter(fn: (r) => r["_field"] == "current_temperature")
          |> last()

  # Media Mobile per Ricarica EV
  - platform: filter
    name: "EV Charge 2025 Solar Max Ampere Smoothed"
    unique_id: ev_charge_2025_solar_max_ampere_smoothed
    entity_id: sensor.ev_charge_2025_solar_max_ampere
    filters:
      - filter: time_simple_moving_average
        window_size: "00:00:10"
        precision: 1

  # Bitcoin Investment Tracker

# ============================================================================
# BINARY SENSORS
# ============================================================================
