# ============================================================================
sql: !include_dir_merge_list sql_sensors/

# ============================================================================
# INPUT HELPERS
# ============================================================================
input_boolean: !include_dir_merge_named yaml_generator/input_boolean
input_button: !include_dir_merge_named yaml_generator/input_buttons
input_select: !include_dir_merge_named yaml_generator/input_select
input_number: !include_dir_merge_named yaml_generator/input_number
input_text: !include_dir_merge_named yaml_generator/input_text
input_datetime: !include_dir_merge_named yaml_generator/input_datetime

timer:
  delay_esecuzione_corto:
    duration: "00:01:00"
  delay_esecuzione_lungo:
    duration: "00:10:00"
  luce_scale_auto_off:
    duration: "00:04:00"

