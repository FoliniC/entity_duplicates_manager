scheduler:
  schedules:
    - name: Accendi Luci Natale Sera
      weekdays: [mon, tue, wed, thu, fri, sat, sun]
      time: "17:40"
      actions:
        - action: switch.turn_on
          target:
            entity_id: switch.presa_luci_natale

    - name: Spegni Luci Natale Sera
      weekdays: [mon, tue, wed, thu, fri, sat, sun]
      time: "23:00"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.presa_luci_natale

    - name: Accendi Luci Natale Mattina
      weekdays: [mon, tue, wed, thu, fri, sat, sun]
      time: "06:30"
      actions:
        - action: switch.turn_on
          target:
            entity_id: switch.presa_luci_natale

    - name: Spegni Luci Natale Mattina
      weekdays: [mon, tue, wed, thu, fri, sat, sun]
      time: "07:30"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.presa_luci_natale

