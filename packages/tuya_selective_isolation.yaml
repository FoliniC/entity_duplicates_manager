shell_command:
  refresh_tuya_selective_isolation: "timeout 120 python3 /config/helpers/tuya_selective_isolation.py apply --strict-battery"
  tuya_selective_isolation_remove: "timeout 60 python3 /config/helpers/tuya_selective_isolation.py remove"
  tuya_selective_isolation_status: "timeout 30 python3 /config/helpers/tuya_selective_isolation.py status"

automation:
  - id: refresh_tuya_selective_isolation
    alias: "Tuya - refresh selective isolation allowlist"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/10"
    action:
      - service: shell_command.refresh_tuya_selective_isolation
