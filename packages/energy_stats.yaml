utility_meter:
  produzione_solare_giornaliera_alfa:
    source: sensor.alfa_new_energy_produced
    name: "Produzione Solare Giornaliera (Alfa)"
    unique_id: produzione_solare_giornaliera_alfa
    cycle: daily
    always_available: true
  produzione_solare_mensile_alfa:
    source: sensor.alfa_new_energy_produced
    name: "Produzione Solare Mensile (Alfa)"
    unique_id: produzione_solare_mensile_alfa
    cycle: monthly
    always_available: true
  produzione_solare_annuale_alfa:
    source: sensor.alfa_new_energy_produced
    name: "Produzione Solare Annuale (Alfa)"
    unique_id: produzione_solare_annuale_alfa
    cycle: yearly
    always_available: true

  energia_inviata_rete_giornaliera_alfa:
    source: sensor.alfa_new_energy_exported
    name: "Energia Inviata Rete Giornaliera (Alfa)"
    unique_id: energia_inviata_rete_giornaliera_alfa
    cycle: daily
    always_available: true
  energia_inviata_rete_mensile_alfa:
    source: sensor.alfa_new_energy_exported
    name: "Energia Inviata Rete Mensile (Alfa)"
    unique_id: energia_inviata_rete_mensile_alfa
    cycle: monthly
    always_available: true
  energia_inviata_rete_annuale_alfa:
    source: sensor.alfa_new_energy_exported
    name: "Energia Inviata Rete Annuale (Alfa)"
    unique_id: energia_inviata_rete_annuale_alfa
    cycle: yearly
    always_available: true

  energia_prelevata_rete_giornaliera_alfa:
    source: sensor.alfa_new_energy_imported
    name: "Energia Prelevata Rete Giornaliera (Alfa)"
    unique_id: energia_prelevata_rete_giornaliera_alfa
    cycle: daily
    always_available: true
  energia_prelevata_rete_mensile_alfa:
    source: sensor.alfa_new_energy_imported
    name: "Energia Prelevata Rete Mensile (Alfa)"
    unique_id: energia_prelevata_rete_mensile_alfa
    cycle: monthly
    always_available: true
  energia_prelevata_rete_annuale_alfa:
    source: sensor.alfa_new_energy_imported
    name: "Energia Prelevata Rete Annuale (Alfa)"
    unique_id: energia_prelevata_rete_annuale_alfa
    cycle: yearly
    always_available: true

input_select:
  energy_stats_period:
    name: "Periodo Statistiche Energia"
    options:
      - "Giornaliero"
      - "Mensile"
      - "Annuale"
    icon: mdi:calendar-clock
