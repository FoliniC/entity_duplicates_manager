# Helpers per Tenda Roam Watchdog
# ─────────────────────────────────────────────────────────────────────────────

command_line:
  - sensor:
      name: Tenda Roam Wakeup Failures
      unique_id: tenda_roam_wakeup_failures
      command: "python3 /config/helpers/tenda_roam_wakeup_failures.py"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - last_message
      scan_interval: 60

counter:
  tenda_roam_failures:
    name: "Tenda Roam Failures Counter"
    initial: 0
    step: 1
    minimum: 0
    maximum: 100
    icon: "mdi:counter"

input_datetime:
  tenda_roam_last_reset:
    name: "Tenda Roam Last Reset"
    has_date: true
    has_time: true
    icon: "mdi:clock-alert"