# Helpers per Tenda Roam Watchdog
# ─────────────────────────────────────────────────────────────────────────────

command_line:
  - sensor:
      name: Tenda Roam Wakeup Failures
      unique_id: tenda_roam_wakeup_failures
      command: 'LOG_FILE="/config/home-assistant.log"; if [ -f "$LOG_FILE" ]; then cnt=$(grep -c "Wake-up failed for 192.168.0.66" "$LOG_FILE" || echo 0); msg=$(grep "Wake-up failed for 192.168.0.66" "$LOG_FILE" | tail -n 1 | sed "s/\"/\\\\\"/g"); else cnt=0; msg=""; fi; echo "{\"count\": $cnt, \"last_message\": \"$msg\"}"'
      value_template: "{{ value_json.count }}"
      json_attributes:
        - last_message
      scan_interval: 60

counter:
  tenda_roam_failures:
    name: "Tenda Roam Failures Counter"
    initial: 0
    step: 1
    minimum: 0
    maximum: 100
    icon: "mdi:counter"

input_datetime:
  tenda_roam_last_reset:
    name: "Tenda Roam Last Reset"
    has_date: true
    has_time: true
    icon: "mdi:clock-alert"