# ============================================================================
# usb_tether.yaml - Controllo tethering USB
# ----------------------------------------------------------------------------
# Tre modalità accessibili con un singolo click:
#   - Normale: ripristina routing normale (restore)
#   - Server: solo il server locale usa il tethering
#   - Intranet: tutta la LAN via host selezionato (WAN router down)
# ============================================================================

# --- Helpers ----------------------------------------------------------------
input_number:
  usb_tether_max_duration:
    name: "Tethering durata (min)"
    icon: mdi:timer-outline
    min: 5
    max: 120
    step: 5
    initial: 60
    unit_of_measurement: "min"

input_text:
  usb_tether_status_message:
    name: "Messaggio stato tethering"
    icon: mdi:message-text
    max: 255
    initial: ""

input_select:
  usb_tether_host:
    name: "Server tethering"
    icon: mdi:server-network
    options:
      - "Debian (192.168.0.3)"
      - "Windows 11 (192.168.0.8)"
    initial: "Debian (192.168.0.3)"
  usb_tether_mode:
    name: "Modalità tethering"
    icon: mdi:lan-connect
    options:
      - "Normale"
      - "Server"
      - "Intranet"
    initial: "Normale"

# --- Sensore di stato (poll 10s) -------------------------------------------
command_line:
  - sensor:
      name: USB Tether Status
      unique_id: usb_tether_status
      command: >
        /config/helpers/usb_tether_ha.sh status server auto "{{ states('input_number.usb_tether_max_duration') | int(60) }}"
      value_template: "{{ value_json.state | default('error') }}"
      command_timeout: 60
      json_attributes:
        - mode
        - phone_if
        - phone_gw
        - lan_gw
        - active_since
        - remaining_min
        - auto_expire
        - message
      scan_interval: 60
  - sensor:
      name: USB Tether Log
      unique_id: usb_tether_log
      command: "python3 /config/helpers/read_usb_tether_log.py"
      value_template: "{{ value_json.state | default('empty') }}"
      command_timeout: 10
      json_attributes:
        - line_count
        - updated
        - text
        - lines
      scan_interval: 15

  # --- Diagnostica router: rotta primaria + ping dal router stesso ----------
  # Rileva il bug "intranet con WAN prioritaria": la LAN perde internet mentre
  # il tethering risulta attivo, perche' la route usb0 (metric 10) resta
  # davanti alla fallback Debian (br-lan, metric 30).
  - sensor:
      name: "Router Internet Check"
      unique_id: router_internet_check
      command: "/config/helpers/usb_tether_ha.sh router_check"
      value_template: >-
        {% if value_json is defined and value_json.problem is defined %}
          {{ value_json.problem if value_json.problem != "" else "ok" }}
        {% else %} unknown {% endif %}
      command_timeout: 20
      json_attributes:
        - router_primary_route
        - router_internet
        - router_ping_ms
        - wan_down_expected
        - problem
        - connection_reality
      scan_interval: 60

# --- Sensore template: messaggio diagnosi router ----------------------------
template:
  - sensor:
      - name: "Router Diagnosi Messaggio"
        unique_id: router_diagnosis_message
        icon: mdi:router-wireless
        # Stato breve usato dalla dashboard per scegliere colore/visibilita'.
        # Basato sullo STATE di router_internet_check (sempre disponibile),
        # non sugli attributi (che possono essere vuoti al primo render).
        state: >-
          {% set s = states('sensor.router_internet_check') %}
          {% if s in ['wan_route_priority_intranet', 'no_default_route', 'primary_route_no_internet'] %} PROBLEMA
          {% elif s == 'ok' %} OK
          {% else %} IN_AGGIORNAMENTO
          {% endif %}
        attributes:
          causa: >-
            {% set s = states('sensor.router_internet_check') %}
            {% set route = state_attr('sensor.router_internet_check', 'router_primary_route') | default('') %}
            {% if s == 'wan_route_priority_intranet' %}
              In modalità Intranet la LAN dovrebbe uscire da Debian/Windows (gateway 192.168.0.3), ma il router sta ancora usando la porta WAN (USB telefono sul router, metrica 10) come rotta prioritaria. Poiché in Intranet il telefono è collegato all'host e non al router, quella porta è morta: la LAN perde Internet anche se il tethering risulta attivo.
            {% elif s == 'no_default_route' %}
              Il router non ha nessuna rotta predefinita verso Internet: la LAN è completamente isolata.
            {% elif s == 'primary_route_no_internet' %}
              La rotta primaria del router ({{ route }}) non riesce a raggiungere Internet (ping 8.8.8.8 fallito).
            {% elif s == 'ok' %}
              Il router raggiunge Internet correttamente attraverso la rotta attiva.
            {% else %}
              Diagnostica in aggiornamento ( SSH router non ancora risposto o sensore in polling ).
            {% endif %}
          soluzione: >-
            {% set s = states('sensor.router_internet_check') %}
            {% if s == 'wan_route_priority_intranet' %}
              Nella dashboard "Tethering USB" premi 🌐 Intranet per riapplicare il routing corretto (disattiva la WAN e forza il fallback su Debian). Se persiste: su Debian esegui "sudo /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh force_activate 30 intranet".
            {% elif s == 'no_default_route' %}
              Premi 🔄 Normale su "Tethering USB" per ripristinare il routing standard, oppure verifica che il router abbia una connessione WAN (USB telefono o modem) attiva.
            {% elif s == 'primary_route_no_internet' %}
              Verifica che l'host upstream (Debian/Windows o modem WAN) abbia Internet. Prova a riattivare il tethering o ricollegare il cavo WAN.
            {% elif s == 'ok' %}
              Nessuna azione necessaria.
            {% else %}
              Attendi il prossimo aggiornamento (60s) o ricarica la dashboard.
            {% endif %}
          detail: >-
            {% set route = state_attr('sensor.router_internet_check', 'router_primary_route') | default('N/D') %}
            {% set net = state_attr('sensor.router_internet_check', 'router_internet') | default('N/D') %}
            {% set ms = state_attr('sensor.router_internet_check', 'router_ping_ms') | default('N/D') %}
            Rotta attiva: {{ route }} | Internet: {{ net }} | Ping dal router: {{ ms }} ms

# --- Sensore template: connessione ATTIVA REALE (misurata, non dai flag script)
# Mostra QUALI device stanno realmente instradando il traffico del router, letto
# dalla default route reale (usb0 = Note 11 sul router / 192.168.0.3 = Debian/Note 13).
# Questo e' la fonte di verita' della dashboard, indipendente da usb_tether_status.
  - sensor:
      - name: "Connessione Attiva Reale"
        unique_id: connessione_attiva_reale
        icon: mdi:network-route
        state: >-
          {% set cr = state_attr('sensor.router_internet_check', 'connection_reality') | default('') %}
          {% if 'Normale' in cr %} WAN_NOTE11
          {% elif 'Intranet' in cr %} INTRANET_DEBIAN
          {% elif 'Isolata' in cr %} ISOLATA
          {% else %} N/D
          {% endif %}
        attributes:
          descrizione: >-
            {% set cr = state_attr('sensor.router_internet_check', 'connection_reality') | default('Misura in corso...') %}
            {{ cr }}
          rotta_attiva: >-
            {{ state_attr('sensor.router_internet_check', 'router_primary_route') | default('N/D') }}
          internet: >-
            {{ state_attr('sensor.router_internet_check', 'router_internet') | default('N/D') }}
          ping_ms: >-
            {{ state_attr('sensor.router_internet_check', 'router_ping_ms') | default('N/D') }}

# --- Sensore template: messaggio dashboard ---------------------------------
  - sensor:
      - name: "USB Tether Dashboard"
        unique_id: usb_tether_dashboard
        icon: mdi:usb
        state: >-
          {% set s = states('sensor.usb_tether_status') %}
          {% set m = state_attr('sensor.usb_tether_status', 'mode') | default(states('input_select.usb_tether_mode') | lower) %}
          {% set msg = states('input_text.usb_tether_status_message') %}
          {% set host = states('input_select.usb_tether_host') | default('') %}
          {% set ts = state_attr('sensor.usb_tether_status', 'active_since') | default('') %}
          {% set upd = state_attr('sensor.usb_tether_status', 'last_updated') | default('') %}
          {% set disp_ts = ts if ts else upd %}
          {% set display_ts = disp_ts if disp_ts else now().strftime('%Y-%m-%d %H:%M:%S') %}
          {% set line = '' %}
          {% if msg != '' and ('in corso' in msg or 'ERRORE' in msg) %}
            {% set line = msg %}
          {% elif s == 'activating' %}
            {% set line = 'Attivazione modalità ' ~ (m | upper) ~ ' in corso...' %}
          {% elif s == 'restoring' %}
            {% set line = 'Ripristino routing normale in corso...' %}
          {% elif s == 'idle' %}
            {% set line = 'NORMALE - route via router' %}
          {% elif s == 'unavailable' %}
            {% set line = 'ERRORE: comando non eseguibile - controlla log e connessione SSH' %}
          {% elif s == 'error' %}
            {% set line = 'ERRORE: ' ~ (state_attr('sensor.usb_tether_status', 'message') | default('controlla log')) %}
          {% elif s == 'active' and m == 'intranet' %}
            {% set line = 'INTRANET ATTIVA - tutta la LAN via ' ~ host.split('(')[0].strip() ~ ' (gateway internet)' %}
          {% elif s == 'active' and m == 'server' %}
            {% set line = 'SERVER ATTIVO - solo server via ' ~ host.split('(')[0].strip() ~ ' (gateway internet)' %}
          {% else %}
            {% set line = 'NORMALE - route via router' %}
          {% endif %}
          {{ line }} @ {{ display_ts }}
        attributes:
          mode: "{{ state_attr('sensor.usb_tether_status', 'mode') | default(states('input_select.usb_tether_mode') | lower) }}"
          phone_if: "{{ state_attr('sensor.usb_tether_status', 'phone_if') }}"
          phone_gw: "{{ state_attr('sensor.usb_tether_status', 'phone_gw') }}"
          remaining_min: "{{ state_attr('sensor.usb_tether_status', 'remaining_min') | int(0) }}"
          active_since: "{{ state_attr('sensor.usb_tether_status', 'active_since') }}"

# --- Comandi remoti ---------------------------------------------------------
shell_command:
  usb_tether_activate: >
    /config/helpers/usb_tether_ha.sh activate server "{{ states('input_select.usb_tether_host') }}" "{{ states('input_number.usb_tether_max_duration') | int(60) }}"

  usb_tether_activate_intranet: >
    /config/helpers/usb_tether_ha.sh activate intranet "{{ states('input_select.usb_tether_host') }}" "{{ states('input_number.usb_tether_max_duration') | int(60) }}"

  usb_tether_restore: >-
    /config/helpers/usb_tether_ha.sh restore server "{{ states('input_select.usb_tether_host') }}" "{{ states('input_number.usb_tether_max_duration') | int(60) }}"

  usb_tether_reset: >-
    /config/helpers/usb_tether_ha.sh reset server "{{ states('input_select.usb_tether_host') }}" "{{ states('input_number.usb_tether_max_duration') | int(60) }}"

  usb_tether_reactivate_router: >
    ssh -i /config/.ssh/router_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.0.11 "/usr/bin/enable_usb_tether.sh"

  usb_tether_launch_scrcpy: >
    ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no carlo@192.168.0.3 "DISPLAY=:0 /home/carlo/Desktop/scrcpy-redmi.sh >/dev/null 2>&1 &"

  usb_tether_renat: >
    ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no carlo@192.168.0.3 "sudo /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh renat"

  # Disabilita Wi-Fi sul telefono router (69a47f6d3a61) via ADB_ROUTER.
  # Usare quando il Wi-Fi del telefono è attivo e causa loop di routing (internet assente).
  usb_tether_wifi_off_router: >
    ssh -i /config/.ssh/router_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.0.11 "/usr/bin/adb_router -s 69a47f6d3a61 shell 'cmd wifi set-wifi-enabled disabled'"

  # Riabilita Wi-Fi sul telefono router (69a47f6d3a61) via ADB_ROUTER.
  # Usare per connettere il telefono alla LAN (192.168.0.14) per ADB/scrcpy senza disabilitare il tethering.
  usb_tether_wifi_on_router: >-
    ssh -i /config/.ssh/router_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.0.11 "/usr/bin/adb_router -s 69a47f6d3a61 shell 'cmd wifi set-wifi-enabled enabled'"

  # Disabilita/riabilita solo il WiFi Calling (IWLAN) sul telefono router (69a47f6d3a61) via ADB_ROUTER.
  # Lasciandolo OFF, il bearer LTE resta aperto anche con il WiFi attivo sulla LAN di casa,
  # cosi' il tethering USB da' internet al router senza loop (router->WiFi->telefono->tethering->router).
  usb_tether_wificall_off_router: >-
    ssh -i /config/.ssh/router_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.0.11 "/usr/bin/adb_router -s 69a47f6d3a61 shell 'settings put global wifi_calling_enabled 0'"

  usb_tether_wificall_on_router: >-
    ssh -i /config/.ssh/router_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.0.11 "/usr/bin/adb_router -s 69a47f6d3a61 shell 'settings put global wifi_calling_enabled 1'"

  usb_tether_configure_streampack: >-
    ssh -i /config/.ssh/router_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.0.11 "/usr/bin/streampack-rndis-configure.sh"

# --- Script: azioni con messaggio e gestione errori ----------\n
script:
  usb_tether_riavvia_streampack:
    alias: "StreamPack: Riavvia & Configura RTMP"
    icon: mdi:video-wireless
    sequence:
      - action: shell_command.usb_tether_configure_streampack
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "StreamPack configurato su rtmp://10.203.33.10:1935/live/telefono"

  usb_tether_normale:
    alias: "Tethering: routing normale"
    icon: mdi:router-wireless
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "ripristino routing normale in corso..."
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "AVVIO: Ripristino routing normale (host: {{ states('input_select.usb_tether_host') }})"
      # Il comando restore e' asincrono (ritorna subito "restoring"), il lavoro
      # prosegue in background su Debian. Non aspettiamo il sensore qui: il
      # wait_template bloccante causava il timeout di HA (script appeso >4min
      # quando il restore impiegava molto). Il sensore si aggiorna da solo.
      - action: shell_command.usb_tether_restore
      - delay: "00:00:03"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      # Nessun wait_template: se il restore fallisce, il sensore resta in stato
      # di errore e la dashboard lo mostra. Non blocchiamo HA per questo.

  usb_tether_reset:
    alias: "Tethering: Reset di emergenza"
    icon: mdi:alert-octagon
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "🔴 Reset di emergenza in corso..."
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: WARN
          message: "AVVIO: 🔴 Reset di emergenza premuto. Interruzione watchdog e ripristino forzato rete normale."
      - action: shell_command.usb_tether_reset
      - delay: "00:00:03"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: ""

  usb_tether_server:
    alias: "Tethering: modalita server"
    icon: mdi:server
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.usb_tether_mode
        data:
          option: "Server"
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "attivazione modalita' server in corso..."
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "AVVIO: Attivazione modalità Server (host: {{ states('input_select.usb_tether_host') }})"
      - action: shell_command.usb_tether_activate
      - delay: "00:00:03"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - wait_template: "{{ is_state('sensor.usb_tether_status', 'active') }}"
        timeout: "00:01:30"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "active"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "ERRORE: tethering server non attivato - controlla log"
          - event: halog2026_write_event
            event_data:
              subsystem: usb_tether
              level: ERROR
              message: "ERRORE: Attivazione Server fallita"
        else:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: ""

  usb_tether_intranet:
    alias: "Tethering: modalita intranet"
    icon: mdi:wan
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.usb_tether_mode
        data:
          option: "Intranet"
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "attivazione modalita' intranet in corso..."
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "AVVIO: Attivazione modalità Intranet (host: {{ states('input_select.usb_tether_host') }})"
      - action: shell_command.usb_tether_activate_intranet
      - delay: "00:00:08"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - wait_template: "{{ is_state('sensor.usb_tether_status', 'active') }}"
        timeout: "00:01:30"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "active"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "ERRORE: intranet non attivata - controlla log"
          - event: halog2026_write_event
            event_data:
              subsystem: usb_tether
              level: ERROR
              message: "ERRORE: Attivazione Intranet fallita"
        else:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: ""

  usb_tether_riattiva_router:
    alias: "Tethering: Riattiva Router (ADB)"
    icon: mdi:cellphone-link
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "riattivazione tethering router via ADB in corso..."
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "AVVIO: Riattivazione USB Tethering sul Router via ADB"
      - action: shell_command.usb_tether_reactivate_router
      - delay: "00:00:03"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "Tethering router riattivato via ADB"

  usb_tether_launch_scrcpy:
    alias: "Tethering: Avvia SCRCPY (Debian)"
    icon: mdi:cellphone-screenshot
    sequence:
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "AVVIO: Connessione ADB 192.168.0.14:5555 ed avvio SCRCPY su Debian (DISPLAY :0)"
      - action: shell_command.usb_tether_launch_scrcpy

# --- Automazione: aggiorna messaggio dopo cambio stato ----------------------
automation:
  - alias: "USB Tether - aggiorna messaggio dashboard"
    id: usb_tether_aggiorna_messaggio
    description: "Pulisce il messaggio temporaneo quando il sensore si aggiorna. Pulisce sempre se lo stato torna a idle."
    trigger:
      - platform: state
        entity_id: sensor.usb_tether_status
      - platform: homeassistant
        event: start
    action:
      - choose:
          # idle ha la precedenza: pulisce SEMPRE il messaggio (anche se conteneva
          # "in corso"), altrimenti un restore fallito lasciava il messaggio di
          # transizione appeso per sempre. active pulisce anch'esso (operazione
          # completata). I messaggi "in corso" restano SOLO durante le transizioni
          # attive (activating/restoring), non a stato consolidato.
          - conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "idle"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.usb_tether_status_message
                data:
                  value: ""
          - conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "active"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.usb_tether_status_message
                data:
                  value: ""
          # ERRORE resta visibile (cosi' l'utente vede cosa e' andato storto),
          # ma solo se lo stato NON e' idle/active (es. durante una transizione
          # andata in errore). Se lo stato e' idle, ha gia' pulito sopra.
          - conditions:
              - condition: template
                value_template: "{{ 'ERRORE' in states('input_text.usb_tether_status_message') }}"
            sequence: []
          - conditions: []
            sequence: []
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "Stato: {{ states('sensor.usb_tether_status') }}, Modalità: {{ state_attr('sensor.usb_tether_status', 'mode') | default('N/A') }}"
  - alias: "USB Tether - messaggio fallback automatico"
    id: usb_tether_notifica_failback
    description: "Avvisa quando il tethering si disattiva da solo."
    trigger:
      - platform: state
        entity_id: sensor.usb_tether_status
        from: "active"
        to: "idle"
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.attributes.get('auto_expire') == true }}"
    action:
      - action: persistent_notification.create
        data:
          title: "Tethering USB disattivato"
          message: >-
            Il tethering e' scaduto automaticamente alle
            {{ now().strftime('%H:%M:%S') }}. Route e WAN router ripristinate.
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: SYSTEM
          message: "AUTO-RESTORE: Tethering scaduto, routing normale ripristinato"
  - alias: "USB Tether - salva modalità attivata"
    id: usb_tether_salva_modalita
    description: "Aggiorna input_select.usb_tether_mode quando uno script attiva Server/Intranet"
    trigger:
      - platform: event
        event_type: halog2026_write_event
        event_data:
          subsystem: usb_tether
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.level in ['INFO'] and ('AVVIO: Attivazione modalità Server' in trigger.event.data.message or 'AVVIO: Attivazione modalità Intranet' in trigger.event.data.message) }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "'AVVIO: Attivazione modalità Server' in trigger.event.data.message"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.usb_tether_mode
                data:
                  option: "Server"
          - conditions:
              - condition: template
                value_template: "'AVVIO: Attivazione modalità Intranet' in trigger.event.data.message"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.usb_tether_mode
                data:
                  option: "Intranet"
  - alias: "USB Tether - salva host selezionato"
    id: usb_tether_salva_host
    description: "Aggiorna input_select.usb_tether_host quando cambia (già fatto dall'UI, ma qui per completezza)"
    trigger:
      - platform: state
        entity_id: input_select.usb_tether_host
    action:
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "Host tethering cambiato: {{ states('input_select.usb_tether_host') }}"
  - alias: "USB Tether - ripristino stato all'avvio"
    id: usb_tether_ripristino_avvio
    description: "All'avvio di HA, legge lo stato reale dai sensori e aggiorna input_select.mode/host"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:10"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - delay: "00:00:10"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - delay: "00:00:05"
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "active"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.usb_tether_mode
                data:
                  option: >-
                    {% set m = state_attr('sensor.usb_tether_status', 'mode') %}
                    {{ m | capitalize if m else 'Normale' }}
              - action: input_select.select_option
                target:
                  entity_id: input_select.usb_tether_host
                data:
                  option: >-
                    {% set phone_if = state_attr('sensor.usb_tether_status', 'phone_if') | default('') %}
                    {{ 'Windows 11 (192.168.0.8)' if phone_if == 'Ethernet 2' else states('input_select.usb_tether_host') }}
          - conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "idle"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.usb_tether_mode
                data:
                  option: "Normale"
          # Fallback: se il sensore non è ancora pronto (unavailable/unknown), leggi dai valori persistiti
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.usb_tether_status') not in ['active', 'idle'] }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_select.usb_tether_mode
                        state: "Normale"
                    sequence: []
                  - conditions:
                      - condition: state
                        entity_id: input_select.usb_tether_mode
                        state: "Server"
                    sequence:
                      - action: input_select.select_option
                        target:
                          entity_id: input_select.usb_tether_mode
                        data:
                          option: "Server"
                  - conditions:
                      - condition: state
                        entity_id: input_select.usb_tether_mode
                        state: "Intranet"
                    sequence:
                      - action: input_select.select_option
                        target:
                          entity_id: input_select.usb_tether_mode
                        data:
                          option: "Intranet"
                default:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.usb_tether_mode
                    data:
                      option: "Normale"
