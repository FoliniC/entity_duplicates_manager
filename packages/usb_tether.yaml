# ============================================================================
# usb_tether.yaml - Controllo tethering USB
# ----------------------------------------------------------------------------
# Tre modalità accessibili con un singolo click:
#   - Normale: ripristina routing normale (restore)
#   - Server: solo il server locale usa il tethering
#   - Intranet: tutta la LAN via server (WAN router down)
# ============================================================================

# --- Helpers ----------------------------------------------------------------
input_number:
  usb_tether_max_duration:
    name: "Tethering durata (min)"
    icon: mdi:timer-outline
    min: 5
    max: 120
    step: 5
    initial: 60
    unit_of_measurement: "min"

input_text:
  usb_tether_status_message:
    name: "Messaggio stato tethering"
    icon: mdi:message-text
    max: 255
    initial: ""

input_select:
  usb_tether_host:
    name: "Server tethering"
    icon: mdi:server-network
    options:
      - "Debian (192.168.0.3)"
      - "Windows 11 (192.168.0.8)"
    initial: "Debian (192.168.0.3)"

# --- Sensore di stato (poll 10s) -------------------------------------------
command_line:
  - sensor:
      name: USB Tether Status
      unique_id: usb_tether_status
      command: >
        /bin/bash -c '
        H="{{ states("input_select.usb_tether_host") }}";
        if [[ "$H" == *"Windows"* ]]; then
          ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo_2@192.168.0.8 "powershell -ExecutionPolicy Bypass -File C:/Scripts/usb_tether.ps1 status" 2>&1 | tail -1;
        else
          ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo@192.168.0.3 "/home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh status" 2>&1;
        fi'
      value_template: "{{ value_json.state | default('error') }}"
      command_timeout: 30
      json_attributes:
        - mode
        - phone_if
        - phone_gw
        - lan_gw
        - active_since
        - remaining_min
        - auto_expire
        - message
      scan_interval: 30

# --- Sensore template: messaggio dashboard ---------------------------------
template:
  - sensor:
      - name: "USB Tether Dashboard"
        unique_id: usb_tether_dashboard
        icon: mdi:usb
        state: >-
          {% set s = states('sensor.usb_tether_status') %}
          {% set m = state_attr('sensor.usb_tether_status', 'mode') | default('') %}
          {% set msg = states('input_text.usb_tether_status_message') %}
          {% set host = states('input_select.usb_tether_host') | default('') %}
          {% if msg != '' %}
            {{ msg }}
          {% elif s == 'unavailable' %}
            ERRORE: comando non eseguibile - controlla log e connessione SSH
          {% elif s == 'error' %}
            ERRORE: {{ state_attr('sensor.usb_tether_status', 'message') | default('controlla log') }}
          {% elif s == 'active' and m == 'intranet' %}
            INTRANET ATTIVA - tutta la LAN via {{ host.split('(')[0].strip() }} (gateway internet)
          {% elif s == 'active' and m == 'server' %}
            SERVER ATTIVO - solo server via {{ host.split('(')[0].strip() }} (gateway internet)
          {% else %}
            INATTIVO - route normale via router
          {% endif %}
        attributes:
          mode: "{{ state_attr('sensor.usb_tether_status', 'mode') | default('') }}"
          phone_if: "{{ state_attr('sensor.usb_tether_status', 'phone_if') }}"
          phone_gw: "{{ state_attr('sensor.usb_tether_status', 'phone_gw') }}"
          remaining_min: "{{ state_attr('sensor.usb_tether_status', 'remaining_min') | int(0) }}"
          active_since: "{{ state_attr('sensor.usb_tether_status', 'active_since') }}"

# --- Comandi remoti ---------------------------------------------------------
shell_command:
  usb_tether_activate: >
    /bin/bash -c '
    H="{{ states("input_select.usb_tether_host") }}";
    DUR="{{ states("input_number.usb_tether_max_duration") | int(60) }}";
    if [[ "$H" == *"Windows"* ]]; then
      ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo_2@192.168.0.8 "powershell -ExecutionPolicy Bypass -File C:/Scripts/usb_tether.ps1 -Action activate -MaxMinutes $DUR -Mode server" 2>&1 &
      echo "{\"state\":\"activating\",\"mode\":\"server\",\"message\":\"Attivazione in corso...\"}"
    else
      ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo@192.168.0.3 "sudo /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh activate $DUR server" 2>&1 &
      echo "{\"state\":\"activating\",\"mode\":\"server\",\"message\":\"Attivazione in corso...\"}"
    fi'

  usb_tether_activate_intranet: >
    /bin/bash -c '
    H="{{ states("input_select.usb_tether_host") }}";
    DUR="{{ states("input_number.usb_tether_max_duration") | int(60) }}";
    if [[ "$H" == *"Windows"* ]]; then
      # Windows: usa powershell -File con -Action activate (script fa async via Scheduled Task watchdog)
      # NOTA: su Windows "intranet" e' solo locale (nessun controllo router) - vedi guardia in script.usb_tether_intranet
      ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo_2@192.168.0.8 "powershell -NoProfile -ExecutionPolicy Bypass -File C:/Scripts/usb_tether.ps1 -Action activate -MaxMinutes $DUR -Mode intranet" 2>&1 &
      echo "{\"state\":\"activating\",\"mode\":\"intranet\",\"message\":\"Attivazione in corso...\"}"
    else
      # Debian: nohup + setsid. Usa 'activate' (non piu' 'rndis_activate'): il fallback
      # RNDIS/Xiaomi e' gia' incluso in cmd_activate, cosi' Server e Intranet usano
      # lo stesso percorso di rilevamento telefono.
      ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo@192.168.0.3 "nohup setsid sudo /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh activate $DUR intranet >/dev/null 2>&1 &" 2>&1;
      echo "{\"state\":\"activating\",\"mode\":\"intranet\",\"message\":\"Attivazione in corso...\"}"
    fi'

  usb_tether_restore: >
    /bin/bash -c '
    H="{{ states("input_select.usb_tether_host") }}";
    if [[ "$H" == *"Windows"* ]]; then
      ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo_2@192.168.0.8 "powershell -NoProfile -ExecutionPolicy Bypass -File C:/Scripts/usb_tether.ps1 -Action restore" 2>&1 &
      echo "{\"state\":\"restoring\",\"mode\":\"server\",\"message\":\"Ripristino in corso...\"}"
    else
      ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=10 -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/config/.ssh/cm/%C carlo@192.168.0.3 "sudo /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh restore" 2>&1 &
      echo "{\"state\":\"restoring\",\"mode\":\"server\",\"message\":\"Ripristino in corso...\"}"
    fi'

# --- Script: azioni con messaggio e gestione errori ----------
script:
  usb_tether_normale:
    alias: "Tethering: routing normale"
    icon: mdi:router-wireless
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "ripristino routing normale in corso..."
      - action: shell_command.usb_tether_restore
      - delay: "00:00:02"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - wait_template: "{{ is_state('sensor.usb_tether_status', 'idle') or is_state('sensor.usb_tether_status', 'restoring') }}"
        timeout: "00:01:00"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "idle"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "ERRORE: routing normale non ripristinate - controlla log"

  usb_tether_server:
    alias: "Tethering: modalita server"
    icon: mdi:server
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "attivazione modalita' server in corso..."
      - action: shell_command.usb_tether_activate
      - delay: "00:00:03"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - wait_template: "{{ is_state('sensor.usb_tether_status', 'active') or is_state('sensor.usb_tether_status', 'activating') }}"
        timeout: "00:01:30"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "active"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "ERRORE: tethering server non attivato - controlla log"

  usb_tether_intranet:
    alias: "Tethering: modalita intranet"
    icon: mdi:wan
    sequence:
      - if:
          - condition: template
            value_template: "{{ 'Windows' in states('input_select.usb_tether_host') }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "ERRORE: Intranet richiede il server Debian (solo lui controlla il router via SSH) - seleziona Debian come host"
          - stop: "Intranet non disponibile su Windows: nessun controllo del router OpenWrt da questo host"
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "attivazione modalita' intranet in corso..."
      - action: shell_command.usb_tether_activate_intranet
      - delay: "00:00:03"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - wait_template: "{{ is_state('sensor.usb_tether_status', 'active') or is_state('sensor.usb_tether_status', 'activating') }}"
        timeout: "00:01:30"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "active"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "ERRORE: intranet non attivata - controlla log"

# --- Automazione: aggiorna messaggio dopo cambio stato ----------------------
automation:
  - alias: "USB Tether - aggiorna messaggio dashboard"
    id: usb_tether_aggiorna_messaggio
    description: "Pulisce il messaggio temporaneo quando il sensore si aggiorna."
    trigger:
      - platform: state
        entity_id: sensor.usb_tether_status
    action:
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: ""
  - alias: "USB Tether - messaggio fallback automatico"
    id: usb_tether_notifica_failback
    description: "Avvisa quando il tethering si disattiva da solo."
    trigger:
      - platform: state
        entity_id: sensor.usb_tether_status
        from: "active"
        to: "idle"
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.attributes.get('auto_expire') == true }}"
    action:
      - action: persistent_notification.create
        data:
          title: "Tethering USB disattivato"
          message: >-
            Il tethering e' scaduto automaticamente alle
            {{ now().strftime('%H:%M:%S') }}. Route e WAN router ripristinate.
