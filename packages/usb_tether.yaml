# ============================================================================
# usb_tether.yaml - Controllo tethering USB
# ----------------------------------------------------------------------------
# Permette di instradare il traffico Internet verso un telefono in USB tethering.
# Supporta due server host:
#   - Debian 13 (192.168.0.3) via script bash usb_tether.sh
#   - Windows 11 (192.168.0.8) via PowerShell usb_tether.ps1
#
# Modalità:
#   - server: solo il server locale usa il tethering (LAN resta su router).
#   - intranet: tutto il traffico LAN viene forzato via server (router WAN down).
# ============================================================================

# --- Helpers configurabili --------------------------------------------------
input_number:
  usb_tether_max_duration:
    name: "Tethering USB - durata massima (min)"
    icon: mdi:timer-outline
    min: 5
    max: 120
    step: 5
    initial: 30
    unit_of_measurement: "min"

input_select:
  usb_tether_mode:
    name: "Modalità tethering"
    icon: mdi:usb
    options:
      - "server"
      - "intranet"
    initial: "server"

  usb_tether_host:
    name: "Server tethering"
    icon: mdi:server
    options:
      - "192.168.0.3 (Debian)"
      - "192.168.0.8 (Windows)"
    initial: "192.168.0.3 (Debian)"

input_text:
  usb_tether_last_error:
    name: "Tethering USB - ultimo errore"
    icon: mdi:alert-circle-outline
    max: 255
    initial: ""

# --- Sensore di stato (poll 30s) -------------------------------------------
# Il sensore interroga il server attualmente selezionato.
command_line:
  - sensor:
      name: USB Tether Status
      unique_id: usb_tether_status
      command: >-
        /bin/bash -c 'HOST="{{ states("input_select.usb_tether_host") }}"; if echo "$HOST" | grep -q "Windows"; then ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=5 carlo_2@192.168.0.8 "powershell -ExecutionPolicy Bypass -File C:\\Scripts\\usb_tether.ps1 -Action status" 2>&1; else ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=QUIET -o ConnectTimeout=5 carlo@localhost "/home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh status" 2>&1; fi'
      value_template: "{{ value_json.state | default('error') }}"
      command_timeout: 15
      json_attributes:
        - mode
        - phone_if
        - phone_gw
        - lan_gw
        - active_since
        - remaining_min
        - auto_expire
        - message
      scan_interval: 30

# --- Switch di controllo ----------------------------------------------------
template:
  - switch:
      - name: "USB Tether"
        unique_id: usb_tether
        icon: >-
          {% if is_state('sensor.usb_tether_status', 'active') %}
            mdi:usb-port
          {% elif is_state('sensor.usb_tether_status', 'error') %}
            mdi:alert-circle
          {% else %}
            mdi:usb
          {% endif %}
        state: "{{ is_state('sensor.usb_tether_status', 'active') }}"
        turn_on:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state('input_select.usb_tether_mode', 'intranet') }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ 'Windows' in states('input_select.usb_tether_host') }}"
                        sequence:
                          - action: shell_command.usb_tether_activate_intranet_win
                      - conditions:
                          - condition: template
                            value_template: "{{ 'Debian' in states('input_select.usb_tether_host') }}"
                        sequence:
                          - action: shell_command.usb_tether_activate_intranet
                            data:
                              max_min: "{{ states('input_number.usb_tether_max_duration') | int(30) }}"
              - conditions:
                  - condition: template
                    value_template: "{{ is_state('input_select.usb_tether_mode', 'server') }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ 'Windows' in states('input_select.usb_tether_host') }}"
                        sequence:
                          - action: shell_command.usb_tether_activate_win
                      - conditions:
                          - condition: template
                            value_template: "{{ 'Debian' in states('input_select.usb_tether_host') }}"
                        sequence:
                          - action: shell_command.usb_tether_activate
                            data:
                              max_min: "{{ states('input_number.usb_tether_max_duration') | int(30) }}"
          - delay: "00:00:02"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.usb_tether_status
        turn_off:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ 'Windows' in states('input_select.usb_tether_host') }}"
                sequence:
                  - action: shell_command.usb_tether_restore_win
              - conditions:
                  - condition: template
                    value_template: "{{ 'Debian' in states('input_select.usb_tether_host') }}"
                sequence:
                  - action: shell_command.usb_tether_restore
          - delay: "00:00:02"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.usb_tether_status

  # Sensore template: descrizione umana dello stato
  - sensor:
      - name: "USB Tether Descrizione"
        unique_id: usb_tether_descrizione
        icon: mdi:cellphone-information
        state: "{{ state_attr('sensor.usb_tether_status', 'message') }}"
        attributes:
          server: "{{ states('input_select.usb_tether_host') }}"
          mode: "{{ state_attr('sensor.usb_tether_status', 'mode') | default('') }}"
          remaining_min: "{{ state_attr('sensor.usb_tether_status', 'remaining_min') | int(0) }}"
          auto_expire: "{{ state_attr('sensor.usb_tether_status', 'auto_expire') }}"

# --- Comandi remoti ---------------------------------------------------------
# Debian 192.168.0.3 (server locale via SSH loopback)
shell_command:
  usb_tether_activate: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o LogLevel=QUIET -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh activate {{ max_min }}' 2>&1; true

  usb_tether_activate_intranet: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o LogLevel=QUIET -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh activate {{ max_min }} intranet' 2>&1; true

  usb_tether_restore: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o LogLevel=QUIET -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh restore' 2>&1; true

  # Windows 192.168.0.8 (via SSH remoto)
  usb_tether_activate_win: >-
    ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o LogLevel=QUIET -o ConnectTimeout=10
    carlo_2@192.168.0.8
    'powershell -ExecutionPolicy Bypass -File C:\Scripts\usb_tether.ps1 -Action activate -MaxMinutes {{ states("input_number.usb_tether_max_duration") | int(30) }}' 2>&1; true

  usb_tether_activate_intranet_win: >-
    ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o LogLevel=QUIET -o ConnectTimeout=10
    carlo_2@192.168.0.8
    'powershell -ExecutionPolicy Bypass -File C:\Scripts\usb_tether.ps1 -Action activate -MaxMinutes {{ states("input_number.usb_tether_max_duration") | int(30) }}' 2>&1; true

  usb_tether_restore_win: >-
    ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o LogLevel=QUIET -o ConnectTimeout=10
    carlo_2@192.168.0.8
    'powershell -ExecutionPolicy Bypass -File C:\Scripts\usb_tether.ps1 -Action restore' 2>&1; true

  usb_tether_detect_win: >-
    ssh -i /config/.ssh/win_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o LogLevel=QUIET -o ConnectTimeout=10
    carlo_2@192.168.0.8
    'powershell -ExecutionPolicy Bypass -File C:\Scripts\usb_tether.ps1 -Action detect' 2>&1; true

# --- Automazione: notifica al failback -------------------------------------
automation:
  - alias: "USB Tether - notifica failback automatico"
    id: usb_tether_notifica_failback
    description: "Avvisa quando il tethering si disattiva da solo."
    trigger:
      - platform: state
        entity_id: sensor.usb_tether_status
        from: "active"
        to: "idle"
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.attributes.get('auto_expire') == true }}"
    action:
      - action: persistent_notification.create
        data:
          title: "Tethering USB disattivato"
          message: >-
            Il tethering USB su {{ states('input_select.usb_tether_host') }}
            e' scaduto automaticamente alle {{ now().strftime('%H:%M:%S') }}.
            Route e WAN router ripristinate.