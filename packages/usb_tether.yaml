# ============================================================================
# usb_tether.yaml - Controllo tethering USB per aggiornamenti del server
# ----------------------------------------------------------------------------
# Permette di instradare temporaneamente la default route del server Debian
# verso un telefono in USB tethering, in modo che apt usi i giga del cellulare.
# Lo swap di route e la safety-net (watcher) vivono sul server; HA legge lo
# stato reale via SSH e comanda attivazione/ripristino.
#
# Modalità:
#   - server: solo il server usa il tethering (LAN resta su router).
#   - intranet: tutto il traffico LAN viene forzato via server (router WAN down).
#
# Fonte di verita': sensor.usb_tether_status (command_line, poll 30s).
# ============================================================================

# --- Helpers configurabili --------------------------------------------------
input_number:
  usb_tether_max_duration:
    name: "Tethering USB - durata massima (min)"
    icon: mdi:timer-outline
    min: 5
    max: 120
    step: 5
    initial: 30
    unit_of_measurement: "min"

input_select:
  usb_tether_mode:
    name: "Modalità tethering"
    icon: mdi:usb
    options:
      - "server"
      - "intranet"
    initial: "server"

input_text:
  usb_tether_last_error:
    name: "Tethering USB - ultimo errore"
    icon: mdi:alert-circle-outline
    max: 255
    initial: ""

# --- Sensore di stato (fonte di verita', poll 30s) --------------------------
command_line:
  - sensor:
      name: USB Tether Status
      unique_id: usb_tether_status
      command: >-
        ssh -i /config/.ssh/host_key
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ControlMaster=auto -o ControlPath=/config/temp/ssh_mux_%h_%p_%r -o ControlPersist=60s
        -o ConnectTimeout=5
        carlo@localhost
        'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh status'
      value_template: "{{ value_json.state }}"
      command_timeout: 15
      json_attributes:
        - mode
        - phone_if
        - phone_gw
        - lan_gw
        - active_since
        - remaining_min
        - auto_expire
        - message
      scan_interval: 30

# --- Switch di controllo ----------------------------------------------------
template:
  - switch:
      - name: "USB Tether"
        unique_id: usb_tether
        icon: >-
          {% if is_state('sensor.usb_tether_status', 'active') %}
            mdi:usb-port
          {% elif is_state('sensor.usb_tether_status', 'error') %}
            mdi:alert-circle
          {% else %}
            mdi:usb
          {% endif %}
        state: "{{ is_state('sensor.usb_tether_status', 'active') }}"
        turn_on:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state('input_select.usb_tether_mode', 'intranet') }}"
                sequence:
                  - action: shell_command.usb_tether_activate_intranet
                    data:
                      max_min: "{{ states('input_number.usb_tether_max_duration') | int(30) }}"
              - conditions:
                  - condition: template
                    value_template: "{{ is_state('input_select.usb_tether_mode', 'server') }}"
                sequence:
                  - action: shell_command.usb_tether_activate
                    data:
                      max_min: "{{ states('input_number.usb_tether_max_duration') | int(30) }}"
          - delay: "00:00:02"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.usb_tether_status
        turn_off:
          - action: shell_command.usb_tether_restore
          - delay: "00:00:02"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.usb_tether_status

  # Sensore template: descrizione umana dello stato
  - sensor:
      - name: "USB Tether Descrizione"
        unique_id: usb_tether_descrizione
        icon: mdi:cellphone-information
        state: "{{ state_attr('sensor.usb_tether_status', 'message') }}"
        attributes:
          mode: "{{ state_attr('sensor.usb_tether_status', 'mode') | default('idle') }}"
          remaining_min: "{{ state_attr('sensor.usb_tether_status', 'remaining_min') | int(0) }}"
          auto_expire: "{{ state_attr('sensor.usb_tether_status', 'auto_expire') }}"

# --- Comandi remoti ---------------------------------------------------------
# Eseguono lo script host-side via SSH.
shell_command:
  usb_tether_activate: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o ControlMaster=auto -o ControlPath=/config/temp/ssh_mux_%h_%p_%r -o ControlPersist=60s
    -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh activate {{ max_min }}' 2>&1; true

  usb_tether_activate_intranet: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o ControlMaster=auto -o ControlPath=/config/temp/ssh_mux_%h_%p_%r -o ControlPersist=60s
    -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh activate {{ max_min }} intranet' 2>&1; true

  usb_tether_restore: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o ControlMaster=auto -o ControlPath=/config/temp/ssh_mux_%h_%p_%r -o ControlPersist=60s
    -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh restore' 2>&1; true

  usb_tether_detect: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o ControlMaster=auto -o ControlPath=/config/temp/ssh_mux_%h_%p_%r -o ControlPersist=60s
    -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh detect' 2>&1; true

  usb_tether_wan_up: >-
    ssh -i /config/.ssh/host_key
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    -o ControlMaster=auto -o ControlPath=/config/temp/ssh_mux_%h_%p_%r -o ControlPersist=60s
    -o ConnectTimeout=10
    carlo@localhost
    'sudo -n /home/carlo/docker/homeassistant/config/host_scripts/usb_tether.sh restore' 2>&1; true

# --- Automazione: notifica al failback automatico --------------------------
automation:
  - alias: "USB Tether - notifica failback automatico"
    id: usb_tether_notifica_failback
    description: "Avvisa quando il tethering si disattiva da solo (scadenza timer o watchdog)."
    trigger:
      - platform: state
        entity_id: sensor.usb_tether_status
        from: "active"
        to: "idle"
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.attributes.get('auto_expire') == true }}"
    action:
      - action: persistent_notification.create
        data:
          title: "Tethering USB disattivato"
          message: >-
            Il tethering USB e' scaduto automaticamente alle {{ now().strftime('%H:%M:%S') }}.
            La default route e' tornata alla LAN
            ({{ state_attr('sensor.usb_tether_status', 'lan_gw') }}),
            WAN router ripristinata se necessario.