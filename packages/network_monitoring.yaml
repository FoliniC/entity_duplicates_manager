            {% set devices = state_attr('sensor.realtime_per_device_speed', 'devices') %}
            {{ devices[3].name if devices and devices|length > 3 else 'N/A' }}
        unit_of_measurement: "kbps"

      - name: "Top Device 5 Speed"
        unique_id: top_device_5_kbps
        state: >
