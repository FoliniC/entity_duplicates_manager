command_line:
  - sensor:
      name: Router Traffic Stats
      unique_id: router_traffic_stats
      command: "python3 /config/helpers/router_traffic.py"
      unit_of_measurement: "MB"
      value_template: >
        {% if value_json and value_json.total_rx_gb is defined %}
          {{ (value_json.total_rx_gb * 1024) | round(2) }}
        {% else %}
          {{ states('sensor.router_traffic_stats') | float(0) }}
        {% endif %}
      json_attributes:
        - top_consumers
        - total_rx_gb
        - total_tx_gb
        - timestamp
      scan_interval: 60

  - sensor:
      name: WAN Traffic Realtime
      unique_id: wan_traffic_realtime
      command: "python3 /config/helpers/wan_traffic_realtime.py"
      value_template: "{{ value_json.rx_kbps | default(0) }}"
      json_attributes:
        - rx_kbps
        - tx_kbps
        - rx_bytes
        - tx_bytes
      scan_interval: 10

  - sensor:
      name: Internet Ping CLI
      unique_id: internet_ping_cli
      command: "ping -c 1 1.1.1.1 | grep 'time=' | sed 's/.*time=\\([0-9.]*\\) ms/\\1/'"
      value_template: "{{ value if value != '' else '0' }}"
      unit_of_measurement: "ms"
      scan_interval: 30

input_boolean:
  network_boost_mode:
    name: "Network Boost Mode"
    icon: mdi:rocket-launch

input_number:
  network_boost_duration:
    name: "Durata Boost"
    min: 0
    max: 9999
    step: 1
    unit_of_measurement: "s"
    mode: box

  network_boost_interval:
    name: "Intervallo Boost"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "s"
    mode: box

  network_boost_remaining:
    name: "Tempo Rimanente Boost"
    min: 0
    max: 600
    unit_of_measurement: "s"
    mode: box

  network_boost_stats_dl_max:
    name: "Boost DL Max Speed"
    min: 0
    max: 1000000
    unit_of_measurement: "kbps"

  network_boost_stats_dl_min:
    name: "Boost DL Min Speed"
    min: 0
    max: 1000000
    unit_of_measurement: "kbps"

  network_boost_stats_dl_avg_sum:
    name: "Boost DL Avg Sum"
    min: 0
    max: 100000000
    unit_of_measurement: "kbps"

  network_boost_stats_ul_max:
    name: "Boost UL Max Speed"
    min: 0
    max: 1000000
    unit_of_measurement: "kbps"

  network_boost_stats_ul_min:
    name: "Boost UL Min Speed"
    min: 0
    max: 1000000
    unit_of_measurement: "kbps"

  network_boost_stats_ul_avg_sum:
    name: "Boost UL Avg Sum"
    min: 0
    max: 100000000
    unit_of_measurement: "kbps"

  network_boost_stats_count:
    name: "Boost Sample Count"
    min: 0
    max: 1000

input_select:
  network_graph_span:
    name: "Range Grafico"
    options:
      - "15 minuti"
      - "30 minuti"
      - "1 ora"
      - "3 ore"
      - "6 ore"
      - "12 ore"
      - "24 ore"
    initial: "15 minuti"
    icon: mdi:timer-outline

input_button:
  start_network_boost:
    name: "Avvia Boost Monitoraggio"
    icon: mdi:timer-play
  reset_network_counters:
    name: "Azzera Statistiche Rete"
    icon: mdi:counter

shell_command:
  reset_router_counters: >
    ssh -i /config/.ssh/router_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.0.11 "nft reset counters table inet bwmon ; /usr/sbin/nlbwmon -c"

automation:
  - alias: "Network Boost Mode Rapid Update"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.network_boost_mode
        to: "on"
    action:
      - action: input_number.set_value
        target:
          entity_id: 
            - input_number.network_boost_remaining
            - input_number.network_boost_stats_dl_max
            - input_number.network_boost_stats_dl_min
            - input_number.network_boost_stats_dl_avg_sum
            - input_number.network_boost_stats_ul_max
            - input_number.network_boost_stats_ul_min
            - input_number.network_boost_stats_ul_avg_sum
            - input_number.network_boost_stats_count
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.network_boost_remaining
        data:
          value: "{{ states('input_number.network_boost_duration') | float }}"
      - action: input_number.set_value
        target:
          entity_id: 
            - input_number.network_boost_stats_dl_min
            - input_number.network_boost_stats_ul_min
        data:
          value: 999999
      - repeat:
          while:
            - condition: state
              entity_id: input_boolean.network_boost_mode
              state: "on"
            - condition: template
              value_template: "{{ states('input_number.network_boost_remaining') | float > 0 }}"
          sequence:
            - action: homeassistant.update_entity
              target:
                entity_id: 
                  - sensor.wan_traffic_realtime
                  - sensor.realtime_per_device_speed
            - variables:
                curr_dl: "{{ states('sensor.wan_download_speed_realtime') | float(0) }}"
                curr_ul: "{{ states('sensor.wan_upload_speed_realtime') | float(0) }}"
                interval: "{{ states('input_number.network_boost_interval') | float(1) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_stats_dl_max
              data:
                value: "{{ [states('input_number.network_boost_stats_dl_max') | float, curr_dl] | max }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_stats_dl_min
              data:
                value: "{{ [states('input_number.network_boost_stats_dl_min') | float, curr_dl] | min }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_stats_dl_avg_sum
              data:
                value: "{{ states('input_number.network_boost_stats_dl_avg_sum') | float + curr_dl }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_stats_ul_max
              data:
                value: "{{ [states('input_number.network_boost_stats_ul_max') | float, curr_ul] | max }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_stats_ul_min
              data:
                value: "{{ [states('input_number.network_boost_stats_ul_min') | float, curr_ul] | min }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_stats_ul_avg_sum
              data:
                value: "{{ states('input_number.network_boost_stats_ul_avg_sum') | float + curr_ul }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_stats_count
              data:
                value: "{{ states('input_number.network_boost_stats_count') | int + 1 }}"
            - delay:
                seconds: "{{ interval }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.network_boost_remaining
              data:
                value: >
                  {% set rem = states('input_number.network_boost_remaining') | float %}
                  {{ [0, (rem - interval)] | max }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.network_boost_mode

  - alias: "Network Boost Mode Trigger"
    trigger:
      - platform: state
        entity_id: input_button.start_network_boost
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.network_boost_mode

  - alias: "Network Boost Mode Boot Safety"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.network_boost_mode
      - action: input_number.set_value
        target:
          entity_id: input_number.network_boost_remaining
        data:
          value: 0

  - alias: "Reset Network Counters"
    trigger:
      - platform: state
        entity_id: input_button.reset_network_counters
    action:
      - action: shell_command.reset_router_counters
      - action: homeassistant.update_entity
        target:
          entity_id: 
            - sensor.router_traffic_stats
            - sensor.realtime_per_device_speed

template:
  - sensor:
      - name: "Network Boost Countdown"
        unique_id: network_boost_countdown
        state: "{{ states('input_number.network_boost_remaining') | int(0) }}"
        unit_of_measurement: "s"
        icon: mdi:timer-sand

      - name: "Network Boost DL Max"
        unique_id: network_boost_dl_max
        state: "{{ states('input_number.network_boost_stats_dl_max') | float(0) | round(1) }}"
        unit_of_measurement: "kbps"
        icon: mdi:download-speed

      - name: "Network Boost DL Min"
        unique_id: network_boost_dl_min
        state: >
          {% set val = states('input_number.network_boost_stats_dl_min') | float(0) %}
          {{ val | round(1) if val < 999999 else 0 }}
        unit_of_measurement: "kbps"
        icon: mdi:download-lock

      - name: "Network Boost DL Avg"
        unique_id: network_boost_dl_avg
        state: >
          {% set sum = states('input_number.network_boost_stats_dl_avg_sum') | float(0) %}
          {% set count = states('input_number.network_boost_stats_count') | int(0) %}
          {{ (sum / count) | round(1) if count > 0 else 0 }}
        unit_of_measurement: "kbps"
        icon: mdi:download-multiple

      - name: "Network Boost UL Max"
        unique_id: network_boost_ul_max
        state: "{{ states('input_number.network_boost_stats_ul_max') | float(0) | round(1) }}"
        unit_of_measurement: "kbps"
        icon: mdi:upload-speed

      - name: "Network Boost UL Min"
        unique_id: network_boost_ul_min
        state: >
          {% set val = states('input_number.network_boost_stats_ul_min') | float(0) %}
          {{ val | round(1) if val < 999999 else 0 }}
        unit_of_measurement: "kbps"
        icon: mdi:upload-lock

      - name: "Network Boost UL Avg"
        unique_id: network_boost_ul_avg
        state: >
          {% set sum = states('input_number.network_boost_stats_ul_avg_sum') | float(0) %}
          {% set count = states('input_number.network_boost_stats_count') | int(0) %}
          {{ (sum / count) | round(1) if count > 0 else 0 }}
        unit_of_measurement: "kbps"
        icon: mdi:upload-multiple

      - name: "Network Boost Validation Error"
        unique_id: network_boost_validation_error
        state: >
          {% set dur = states('input_number.network_boost_duration') | float(0) %}
          {% set intv = states('input_number.network_boost_interval') | float(0) %}
          {% if dur < 30 or dur > 600 %}
            La durata deve essere tra 30 e 600 secondi
          {% elif intv < 1 or intv > 15 %}
            L'intervallo deve essere tra 1 e 15 secondi
          {% else %}
            OK
          {% endif %}

      - name: "Internet Ping"
        unique_id: internet_ping_ms
        state: "{{ states('sensor.internet_ping_cli') | float(0) | round(1) }}"
        unit_of_measurement: "ms"
        icon: mdi:gauge

      - name: "WAN Download Speed Realtime"
        unique_id: wan_download_speed_realtime
        state: "{{ state_attr('sensor.wan_traffic_realtime', 'rx_kbps') | float(0) }}"
        unit_of_measurement: "kbps"
        icon: mdi:download-network-outline

      - name: "WAN Upload Speed Realtime"
        unique_id: wan_upload_speed_realtime
        state: "{{ state_attr('sensor.wan_traffic_realtime', 'tx_kbps') | float(0) }}"
        unit_of_measurement: "kbps"
        icon: mdi:upload-network-outline

      - name: "Router Total Download"
        unique_id: router_total_download
        state: >
          {% set val = state_attr('sensor.router_traffic_stats', 'total_rx_gb') %}
          {{ (val * 1024) | round(2) if val is not none else 0 }}
        unit_of_measurement: "MB"
        state_class: total_increasing

      - name: "Router Total Upload"
        unique_id: router_total_upload
        state: >
          {% set val = state_attr('sensor.router_traffic_stats', 'total_tx_gb') %}
          {{ (val * 1024) | round(2) if val is not none else 0 }}
        unit_of_measurement: "MB"
        state_class: total_increasing

      - name: "Router Realtime Top Consumer"
        unique_id: router_realtime_top_consumer
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {% if top and top|length > 0 %}
            {% set first = top[0] %}
            {{ first.name if first.name != first.ip else first.ip }} 
            (↓{{ first.rx_kbps | round(1) }} ↑{{ first.tx_kbps | round(1) }} kbps | Tot: {{ first.total_rx_mb | round(0) }} MB)
          {% else %}
            In attesa di dati...
          {% endif %}

      - name: "Router Download Speed"
        unique_id: router_download_speed
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {% if top %}
            {{ top | map(attribute='rx_kbps') | sum | round(2) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "kbps"
        icon: mdi:download-network

      - name: "Router Upload Speed"
        unique_id: router_upload_speed
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {% if top %}
            {{ top | map(attribute='tx_kbps') | sum | round(2) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "kbps"
        icon: mdi:upload-network

      - name: "Router Top 1 Consumer Name"
        unique_id: router_top_1_name
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ top[0].name if top and top|length > 0 else 'N/A' }}

      - name: "Router Top 1 Consumer Value"
        unique_id: router_top_1_val
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ top[0].total_rx_mb | round(2) if top and top|length > 0 else 0 }}
        unit_of_measurement: "MB"

      - name: "Router Top 2 Consumer Name"
        unique_id: router_top_2_name
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ top[1].name if top and top|length > 1 else 'N/A' }}

      - name: "Router Top 2 Consumer Value"
        unique_id: router_top_2_val
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ top[1].total_rx_mb | round(2) if top and top|length > 1 else 0 }}
        unit_of_measurement: "MB"

      - name: "Router Top 3 Consumer Value"
        unique_id: router_top_3_val
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ top[2].total_rx_mb | round(2) if top and top|length > 2 else 0 }}
        unit_of_measurement: "MB"

      - name: "Router Top 4 Consumer Value"
        unique_id: router_top_4_val
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ top[3].total_rx_mb | round(2) if top and top|length > 3 else 0 }}
        unit_of_measurement: "MB"

      - name: "Router Top 5 Consumer Value"
        unique_id: router_top_5_val
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ top[4].total_rx_mb | round(2) if top and top|length > 4 else 0 }}
        unit_of_measurement: "MB"

      - name: "Top Device 1 MB"
        unique_id: top_device_1_mb
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ (top[0].total_rx_mb | float) if top and top|length > 0 else 0 }}
        attributes:
          device_name: >
            {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
            {{ top[0].name if top and top|length > 0 else 'N/A' }}
        unit_of_measurement: "MB"

      - name: "Top Device 2 MB"
        unique_id: top_device_2_mb
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {{ (top[1].total_rx_mb | float) if top and top|length > 1 else 0 }}
        attributes:
          device_name: >
            {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
            {{ top[1].name if top and top|length > 1 else 'N/A' }}
        unit_of_measurement: "MB"

      - name: "Top Device 3 MB"
        unique_id: top_device_3_mb
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
