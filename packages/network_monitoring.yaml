command_line:
  - sensor:
      name: Router Traffic Stats
      unique_id: router_traffic_stats
      command: "python3 /config/helpers/router_traffic.py"
      unit_of_measurement: "MB"
      value_template: >
        {% if value_json is defined and value_json.total_rx_gb is defined %}
          {{ (value_json.total_rx_gb * 1024) | round(2) }}
        {% else %}
          {{ states('sensor.router_traffic_stats') }}
        {% endif %}
      json_attributes:
        - top_consumers
        - total_rx_gb
        - total_tx_gb
        - timestamp
      scan_interval: 60

template:
  - sensor:
      - name: "Router Total Download"
        unique_id: router_total_download
        state: >
          {% set val = state_attr('sensor.router_traffic_stats', 'total_rx_gb') %}
          {{ (val * 1024) | round(2) if val is not none else 'unknown' }}
        unit_of_measurement: "MB"
        state_class: total_increasing
      
      - name: "Router Total Upload"
        unique_id: router_total_upload
        state: >
          {% set val = state_attr('sensor.router_traffic_stats', 'total_tx_gb') %}
          {{ (val * 1024) | round(2) if val is not none else 'unknown' }}
        unit_of_measurement: "MB"
        state_class: total_increasing

      - name: "Router Realtime Top Consumer"
        unique_id: router_realtime_top_consumer
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {% if top and top|length > 0 %}
            {% set first = top[0] %}
            {{ first.name if first.name != first.ip else first.ip }} 
            (↓{{ first.rx_kbps | round(1) }} ↑{{ first.tx_kbps | round(1) }} kbps | Tot: {{ first.total_rx_mb | round(0) }} MB)
          {% else %}
            In attesa di dati...
          {% endif %}

      - name: "Router Download Speed"
        unique_id: router_download_speed
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {% if top %}
            {{ top | map(attribute='rx_kbps') | sum | round(2) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "kbps"
        icon: mdi:download-network

      - name: "Router Upload Speed"
        unique_id: router_upload_speed
        state: >
          {% set top = state_attr('sensor.router_traffic_stats', 'top_consumers') %}
          {% if top %}
            {{ top | map(attribute='tx_kbps') | sum | round(2) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "kbps"
        icon: mdi:upload-network
