# ============================================================================
# BITCOIN INVESTMENT TRACKER - Package (sensor + input helpers)
# ============================================================================
# Tassazione Italia 2026+: 33% su tutte le plusvalenze (Art.1 c.24 L.Bilancio 2025)
# Dati: 5000€ investiti il 2026-06-29 a 54000€/BTC = 0.09259259 BTC
# Telefono target: Xiaomi 17 Ultra 16/512GB ~ 1300€
# ============================================================================

input_number:
  btc_investment_eur:
    name: "BTC Investment EUR"
    min: 0
    max: 1000000
    step: 10
    unit_of_measurement: "EUR"
    icon: "mdi:cash-multiple"
    mode: box
    initial: 5000

  btc_amount:
    name: "BTC Amount"
    min: 0
    max: 100
    step: 0.00000001
    unit_of_measurement: "BTC"
    icon: "mdi:bitcoin"
    mode: box
    initial: 0.09259259

  btc_avg_buy_price:
    name: "BTC Avg Buy Price EUR"
    min: 0
    max: 200000
    step: 1
    unit_of_measurement: "EUR"
    icon: "mdi:calculator"
    mode: box
    initial: 54000

  target_phone_price:
    name: "Target Phone Price EUR"
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: "EUR"
    icon: "mdi:cellphone"
    mode: box
    initial: 1300

input_text:
  target_phone_name:
    name: "Modello telefono target"
    icon: "mdi:cellphone-information"
    initial: "Xiaomi 17 Ultra 16/512GB"

  target_phone_url:
    name: "URL monitoraggio prezzo telefono"
    icon: "mdi:link"
    initial: "https://www.trovaprezzi.it/prezzo_cellulari_xiaomi_17_ultra"

# REST sensors for Bitcoin price (CoinGecko)
sensor:
  - platform: rest
    name: "Bitcoin Price EUR"
    unique_id: bitcoin_price_eur
    resource: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true&include_last_updated_at=true"
    scan_interval: 300
    headers:
      Accept: "application/json"
      User-Agent: "HomeAssistant-BTC-Tracker/1.0"
    value_template: "{{ value_json.bitcoin.eur | float(0) }}"
    unit_of_measurement: "EUR"
    device_class: monetary
    state_class: measurement
    json_attributes:
      - "bitcoin.eur_24h_change"
      - "bitcoin.last_updated_at"
    icon: "mdi:currency-btc"

  - platform: rest
    name: "Bitcoin 24h Change %"
    unique_id: bitcoin_24h_change_pct
    resource: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true"
    scan_interval: 300
    headers:
      Accept: "application/json"
    value_template: "{{ value_json.bitcoin.eur_24h_change | float(0) }}"
    unit_of_measurement: "%"
    state_class: measurement
    icon: "mdi:chart-line"

# Template sensors for BTC investment tracking
# Using English names so entity_id becomes sensor.btc_* (HA 2026 slugifies name)
# The friendly_name in dashboards/automations can still reference entity_id
template:
  - sensor:
      # Parametri investimento (read from input helpers)
      - name: "BTC Investment EUR"
        unique_id: btc_investment_eur
        icon: "mdi:cash-multiple"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: "{{ states('input_number.btc_investment_eur') | float(0) }}"

      - name: "BTC Amount"
        unique_id: btc_amount
        icon: "mdi:bitcoin"
        state_class: measurement
        unit_of_measurement: "BTC"
        state: "{{ states('input_number.btc_amount') | float(0) }}"

      - name: "BTC Cost Basis EUR Template"
        unique_id: btc_avg_buy_price_template
        icon: "mdi:calculator"
        unit_of_measurement: "EUR"
        state: "{{ states('input_number.btc_avg_buy_price') | float(0) }}"

      # Calcoli valore attuale e profitto
      - name: "BTC Current Value"
        unique_id: btc_current_value
        icon: "mdi:currency-eur"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set btc = states('sensor.btc_amount') | float(0) %}
          {% set price = states('sensor.bitcoin_price_eur') | float(0) %}
          {{ (btc * price) | round(2) }}

      - name: "BTC Profit Loss"
        unique_id: btc_profit_loss
        icon: "mdi:chart-line"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set current = states('sensor.btc_current_value') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {{ (current - invested) | round(2) }}

      - name: "BTC Profit Loss Pct"
        unique_id: btc_profit_loss_pct
        icon: "mdi:percent"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% if invested > 0 %}
            {{ ((profit / invested) * 100) | round(2) }}
          {% else %}
            0
          {% endif %}

      # Telefono target
      - name: "Target Phone Price"
        unique_id: target_phone_price
        icon: "mdi:cellphone"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: "{{ states('input_number.target_phone_price') | float(0) }}"

      - name: "Target Phone Name"
        unique_id: target_phone_name
        icon: "mdi:cellphone-information"
        state: "{{ states('input_text.target_phone_name') }}"

      - name: "Target Phone URL"
        unique_id: target_phone_url
        icon: "mdi:link"
        state: "{{ states('input_text.target_phone_url') }}"

      # Delta per telefono (LORDO)
      - name: "BTC Delta To Phone"
        unique_id: btc_delta_to_phone
        icon: "mdi:calculator-variant"
        unit_of_measurement: "EUR"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {{ (phone - profit) | round(2) }}

      - name: "BTC Can Buy Phone"
        unique_id: btc_can_buy_phone
        icon: "mdi:check-circle-outline"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if profit >= phone %}
            "SÌ ✅"
          {% else %}
            "NO ❌"
          {% endif %}

      - name: "BTC Progress To Phone Pct"
        unique_id: btc_progress_to_phone_pct
        icon: "mdi:progress-clock"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if phone > 0 %}
            {{ ([(profit / phone * 100), 100] | min) | round(1) }}
          {% else %}
            0
          {% endif %}

      # Statistiche e tassazione 33% (Italia 2026+)
      - name: "BTC ROI Pct"
        unique_id: btc_roi_pct
        icon: "mdi:chart-line"
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ states('sensor.btc_profit_loss_pct') | float(0) }}"

      - name: "BTC Taxable Gain"
        unique_id: btc_taxable_gain
        icon: "mdi:calculator"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% if profit > 0 %}
            {{ profit | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Tax Amount"
        unique_id: btc_tax_amount
        icon: "mdi:cash-minus"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set taxable = states('sensor.btc_taxable_gain') | float(0) %}
          {{ (taxable * 0.33) | round(2) }}

      - name: "BTC Profit Loss Net"
        unique_id: btc_profit_loss_net
        icon: "mdi:chart-line"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set tax = states('sensor.btc_tax_amount') | float(0) %}
          {{ (profit - tax) | round(2) }}

      - name: "BTC ROI Pct Net"
        unique_id: btc_roi_pct_net
        icon: "mdi:chart-line"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% if invested > 0 %}
            {{ ((net_profit / invested) * 100) | round(2) }}
          {% else %}
            0
          {% endif %}

      # Prezzo netto equivalente per BTC (formula 33%)
      - name: "BTC Net Price Per BTC"
        unique_id: btc_net_price_per_btc
        icon: "mdi:cash-multiple"
        device_class: monetary
        state_class: measurement
        unit_of_measurement: "EUR"
        state: >
          {% set price = states('sensor.bitcoin_price_eur') | float(0) %}
          {% set cost = states('sensor.btc_cost_basis_eur_template') | float(0) %}
          {% if price >= cost %}
            {{ (price * 0.67 + cost * 0.33) | round(2) }}
          {% else %}
            {{ price | round(2) }}
          {% endif %}

      - name: "BTC To Sell For Phone"
        unique_id: btc_to_sell_for_phone
        icon: "mdi:bitcoin"
        state_class: measurement
        unit_of_measurement: "BTC"
        state: >
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% set net_price = states('sensor.btc_net_price_per_btc') | float(0) %}
          {% if net_price > 0 %}
            {{ (phone / net_price) | round(8) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Break Even Phone Price"
        unique_id: btc_break_even_phone_price
        icon: "mdi:target-account"
        device_class: monetary
        state_class: measurement
        unit_of_measurement: "EUR"
        state: >
          {% set btc = states('sensor.btc_amount') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% set cost = states('sensor.btc_cost_basis_eur_template') | float(0) %}
          {% set numerator = phone + invested - btc * cost * 0.33 %}
          {% set denominator = btc * 0.67 %}
          {% if denominator > 0 %}
            {{ (numerator / denominator) | round(0) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Progress To Phone Net Pct"
        unique_id: btc_progress_to_phone_net_pct
        icon: "mdi:progress-clock"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if phone > 0 %}
            {{ ([(net_profit / phone * 100), 100] | min) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Can Buy Phone Net"
        unique_id: btc_can_buy_phone_net
        icon: "mdi:check-circle-outline"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if net_profit >= phone %}
            "SÌ ✅"
          {% else %}
            "NO ❌"
          {% endif %}

      - name: "BTC Delta To Phone Net"
        unique_id: btc_delta_to_phone_net
        icon: "mdi:calculator-variant"
        device_class: monetary
        state_class: measurement
        unit_of_measurement: "EUR"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {{ (phone - net_profit) | round(2) }}

      - name: "BTC Days To Phone Estimate"
        unique_id: btc_days_to_phone_estimate
        icon: "mdi:calendar-clock"
        state_class: measurement
        unit_of_measurement: "days"
        state: >
          {% set profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% set change_24h = states('sensor.bitcoin_24h_change_pct') | float(0) %}
          {% set current_val = states('sensor.btc_current_value') | float(0) %}
          {% set daily_eur_change = (current_val * change_24h / 100) | float(0) %}
          {% set daily_net_change = daily_eur_change * 0.67 %}
          {% set remaining = phone - profit %}
          {% if daily_net_change > 0 and remaining > 0 %}
            {{ (remaining / daily_net_change) | round(1) }}
          {% elif remaining <= 0 %}
            0
          {% else %}
            -1
          {% endif %}