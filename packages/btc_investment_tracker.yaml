# ============================================================================
# BITCOIN INVESTMENT TRACKER - Package (sensori + input helper)
# ============================================================================
# Tassazione Italia 2026+: 33% su tutte le plusvalenze (Art.1 c.24 L.Bilancio 2025)
# Dati: 5000€ investiti il 2026-06-29 a 54000€/BTC = 0.09259259 BTC
# Telefono target: Xiaomi 17 Ultra 16/512GB
#
# PERSISTENZA: gli input helper NON hanno "initial:" nel YAML -> HA salva
# i loro valori in .storage/input_number e .storage/input_text e li ripristina
# da solo a ogni riavvio. I template sensor leggono direttamente dagli helper.
# ============================================================================

template:
  - sensor:
      # ============================================================
      # PARAMETRI (lettura diretta dagli input helper - sempre aggiornati)
      # ============================================================
      - name: "BTC Investment EUR"
        unique_id: btc_investment_eur
        icon: "mdi:cash-multiple"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: "{{ states('input_number.btc_investment_eur') | float(5000) }}"

      - name: "BTC Amount"
        unique_id: btc_amount
        icon: "mdi:bitcoin"
        state_class: measurement
        unit_of_measurement: "BTC"
        state: "{{ states('input_number.btc_amount') | float(0.09259259) }}"

      - name: "BTC Cost Basis EUR Template"
        unique_id: btc_avg_buy_price_template
        icon: "mdi:calculator"
        unit_of_measurement: "EUR"
        state: "{{ states('input_number.btc_avg_buy_price') | float(54000) }}"

      - name: "Target Phone Price"
        unique_id: target_phone_price
        icon: "mdi:cellphone"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: "{{ states('input_number.target_phone_price') | float(0) }}"

      - name: "Target Phone Name"
        unique_id: target_phone_name
        icon: "mdi:cellphone-information"
        state: "{{ states('input_text.target_phone_name') }}"

      - name: "Target Phone URL"
        unique_id: target_phone_url
        icon: "mdi:link"
        state: "{{ states('input_text.target_phone_url') }}"

      # ============================================================
      # CALCOLI VALORE E PROFITTO
      # ============================================================
      - name: "BTC Current Value"
        unique_id: btc_current_value
        icon: "mdi:currency-eur"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% set price = states('sensor.bitcoin_price_eur') | float(0) %}
          {% set cost = 54000 %}
          {% set btc = invested / cost %}
          {{ (btc * price) | round(2) }}

      - name: "BTC Profit Loss"
        unique_id: btc_profit_loss
        icon: "mdi:chart-line"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set current = states('sensor.btc_current_value') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {{ (current - invested) | round(2) }}

      - name: "BTC Profit Loss Pct"
        unique_id: btc_profit_loss_pct
        icon: "mdi:percent"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% if invested > 0 %}
            {{ ((profit / invested) * 100) | round(2) }}
          {% else %}
            0
          {% endif %}

      # ============================================================
      # OBIETTIVO TELEFONO (LORDO)
      # ============================================================
      - name: "BTC Delta To Phone"
        unique_id: btc_delta_to_phone
        icon: "mdi:calculator-variant"
        unit_of_measurement: "EUR"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {{ (phone - profit) | round(2) }}

      - name: "BTC Can Buy Phone"
        unique_id: btc_can_buy_phone
        icon: "mdi:check-circle-outline"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if profit >= phone %}
            "SÌ ✅"
          {% else %}
            "NO ❌"
          {% endif %}

      - name: "BTC Progress To Phone Pct"
        unique_id: btc_progress_to_phone_pct
        icon: "mdi:progress-clock"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if phone > 0 %}
            {{ ([(profit / phone * 100), 100] | min) | round(1) }}
          {% else %}
            0
          {% endif %}

      # ============================================================
      # TASSAZIONE 33% (Italia 2026+) E CALCOLI NETTI
      # ============================================================
      - name: "BTC ROI Pct"
        unique_id: btc_roi_pct
        icon: "mdi:chart-line"
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ states('sensor.btc_profit_loss_pct') | float(0) }}"

      - name: "BTC Taxable Gain"
        unique_id: btc_taxable_gain
        icon: "mdi:calculator"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% if profit > 0 %}
            {{ profit | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Tax Amount"
        unique_id: btc_tax_amount
        icon: "mdi:cash-minus"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set taxable = states('sensor.btc_taxable_gain') | float(0) %}
          {{ (taxable * 0.33) | round(2) }}

      - name: "BTC Profit Loss Net"
        unique_id: btc_profit_loss_net
        icon: "mdi:chart-line"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set profit = states('sensor.btc_profit_loss') | float(0) %}
          {% set tax = states('sensor.btc_tax_amount') | float(0) %}
          {{ (profit - tax) | round(2) }}

      - name: "BTC ROI Pct Net"
        unique_id: btc_roi_pct_net
        icon: "mdi:chart-line"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% if invested > 0 %}
            {{ ((net_profit / invested) * 100) | round(2) }}
          {% else %}
            0
          {% endif %}

      # Prezzo netto equivalente per BTC (formula 33%)
      - name: "BTC Net Price Per BTC"
        unique_id: btc_net_price_per_btc
        icon: "mdi:cash-multiple"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set price = states('sensor.bitcoin_price_eur') | float(0) %}
          {% set cost = states('sensor.btc_cost_basis_eur_template') | float(0) %}
          {% if price >= cost %}
            {{ (price * 0.67 + cost * 0.33) | round(2) }}
          {% else %}
            {{ price | round(2) }}
          {% endif %}

      - name: "BTC To Sell For Phone"
        unique_id: btc_to_sell_for_phone
        icon: "mdi:bitcoin"
        state_class: measurement
        unit_of_measurement: "BTC"
        state: >
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% set net_price = states('sensor.btc_net_price_per_btc') | float(0) %}
          {% if net_price > 0 %}
            {{ (phone / net_price) | round(8) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Break Even Phone Price"
        unique_id: btc_break_even_phone_price
        icon: "mdi:target-account"
        device_class: monetary
        state_class: total
        unit_of_measurement: "EUR"
        state: >
          {% set btc = states('sensor.btc_amount') | float(0) %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% set cost = states('sensor.btc_cost_basis_eur_template') | float(0) %}
          {% set numerator = phone + invested - btc * cost * 0.33 %}
          {% set denominator = btc * 0.67 %}
          {% if denominator > 0 %}
            {{ (numerator / denominator) | round(0) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Progress To Phone Net Pct"
        unique_id: btc_progress_to_phone_net_pct
        icon: "mdi:progress-clock"
        state_class: measurement
        unit_of_measurement: "%"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if phone > 0 %}
            {{ ([(net_profit / phone * 100), 100] | min) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "BTC Can Buy Phone Net"
        unique_id: btc_can_buy_phone_net
        icon: "mdi:check-circle-outline"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% if net_profit >= phone and net_profit > 0 %}
            "SÌ ✅"
          {% else %}
            "NO ❌"
          {% endif %}
        attributes:
          last_refresh: "{{ states('input_text.btc_can_buy_phone_net_last_update') | default('Mai aggiornato') }}"

      - name: "BTC Delta To Phone Net"
        unique_id: btc_delta_to_phone_net
        icon: "mdi:calculator-variant"
        unit_of_measurement: "EUR"
        state: >
          {% set net_profit = states('sensor.btc_profit_loss_net') | float(0) %}
          {% set phone = states('sensor.target_phone_price') | float(0) %}
          {% set delta = (phone - net_profit) | round(2) %}
          {% if delta > 0 %}
            {{ delta }}
          {% else %}
            0
          {% endif %}

  # ============================================================
  # PHONE PRICE PROJECTION (pattern storico Xiaomi Ultra)
  # Calcoli in Jinja usando i dati storici normalizzati.
  # Launch 17 Ultra: 2026-03-10, prezzo lancio 1499.90€
  # ============================================================
  - sensor:
      # Mesi dall'uscita del 17 Ultra
      - name: "Phone Months Since Launch"
        unique_id: phone_months_since_launch
        icon: "mdi:calendar-clock"
        unit_of_measurement: "months"
        state_class: measurement
        state: >-
          {% set launch = strptime('2026-03-10', '%Y-%m-%d').timestamp() %}
          {% set now = now().timestamp() %}
          {{ ((now - launch) / 86400 / 30.4375) | round(1) }}

      # % del prezzo di lancio attuale
      - name: "Phone Current % of Launch"
        unique_id: phone_current_pct_of_launch
        icon: "mdi:percent"
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set price = states('input_number.target_phone_price') | float(0) %}
          {% set launch_price = 1499.90 %}
          {{ (price / launch_price * 100) | round(1) }}

      # Sconto vs lancio
      - name: "Phone Discount vs Launch"
        unique_id: phone_discount_vs_launch
        icon: "mdi:trending-down"
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set price = states('input_number.target_phone_price') | float(0) %}
          {% set launch_price = 1499.90 %}
          {{ (100 - (price / launch_price * 100)) | round(1) }}

      # Giorni al lancio del successore (stimato 2027-03-10)
      - name: "Phone Days To Successor"
        unique_id: phone_days_to_successor
        icon: "mdi:calendar-clock"
        unit_of_measurement: "days"
        state: >-
          {% set succ = strptime('2027-03-10', '%Y-%m-%d').timestamp() %}
          {% set now = now().timestamp() %}
          {{ ((succ - now) / 86400) | round(0) | int }}

      # Proiezione 12m (successore) - mediana storica ~67% del prezzo lancio
      - name: "Phone Projection 12m"
        unique_id: phone_projection_12m
        icon: "mdi:chart-line"
        device_class: monetary
        unit_of_measurement: "EUR"
        state: >-
          {% set launch_price = 1499.90 %}
          {% set median_discount_pct = 66.7 %}
          {{ (launch_price * median_discount_pct / 100) | round(2) }}

      # Proiezione 6m - mediana storica ~80% del prezzo lancio
      - name: "Phone Projection 6m"
        unique_id: phone_projection_6m
        icon: "mdi:chart-line"
        device_class: monetary
        unit_of_measurement: "EUR"
        state: >-
          {% set launch_price = 1499.90 %}
          {% set median_discount_pct = 79.9 %}
          {{ (launch_price * median_discount_pct / 100) | round(2) }}

      # Proiezione 3m - mediana storica ~75% del prezzo lancio
      - name: "Phone Projection 3m"
        unique_id: phone_projection_3m
        icon: "mdi:chart-line"
        device_class: monetary
        unit_of_measurement: "EUR"
        state: >-
          {% set launch_price = 1499.90 %}
          {% set median_discount_pct = 75.0 %}
          {{ (launch_price * median_discount_pct / 100) | round(2) }}

      # Stato proiezione (testo)
      - name: "Phone Projection Status"
        unique_id: phone_projection_status
        icon: "mdi:chart-line"
        state: >-
          {% set price = states('input_number.target_phone_price') | float(0) %}
          {% set pct = states('sensor.phone_current_pct_of_launch') | float(0) %}
          {% set months = states('sensor.phone_months_since_launch') | float(0) %}
          €{{ '%.2f' | format(price) }} | {{ pct }}% lancio | {{ months }}m

# ============================================================================
# INPUT HELPERS - SENZA "initial:" -> i valori persistono in .storage
# ============================================================================
# Trailing Stop Sensor — suggerisce quando attivare lo stop loss
# ============================================================
      - name: "BTC Trailing Stop Suggestion"
        unique_id: btc_trailing_stop_suggestion
        icon: mdi:chart-arrow-up
        state: >
          {% set current_price = states('sensor.bitcoin_price_eur') | float(0) %}
          {% set cost_price = 54000 %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% set btc = invested / cost_price %}
          {% set net_profit_after_tax = ((btc * current_price) - invested) * 0.67 %}
          {% set trailing_pct = 3 %}
          {% set trailing_stop = current_price * (1 - trailing_pct / 100) %}
          {% set gain_pct = (current_price / cost_price - 1) * 100 %}
          {% if current_price == 0 %}
            unknown
          {% elif gain_pct <= 0 %}
            WAIT
          {% elif gain_pct < 10 %}
            WAIT
          {% elif net_profit_after_tax >= states('input_number.target_phone_price') | float(0) %}
            VENDI
          {% elif current_price <= trailing_stop %}
            VENDI
          {% else %}
            TRAIL
          {% endif %}

      - name: "BTC Trailing Stop Price"
        unique_id: btc_trailing_stop_price
        icon: mdi:flag-checkered
        state: >
          {% set current_price = states('sensor.bitcoin_price_eur') | float(0) %}
          {% set trailing_pct = 3 %}
          {% if current_price == 0 %}
            unknown
          {% else %}
            {{ (current_price * (1 - trailing_pct / 100)) | round(0) }}
          {% endif %}
        unit_of_measurement: EUR

      - name: "BTC Trailing Stop Suggestion Short"
        unique_id: btc_trailing_stop_suggestion_short
        icon: mdi:signal
        state: >
          {% set current_price = states('sensor.bitcoin_price_eur') | float(0) %}
          {% set cost_price = 54000 %}
          {% set invested = states('sensor.btc_investment_eur') | float(0) %}
          {% set btc = invested / cost_price %}
          {% set net_profit_after_tax = ((btc * current_price) - invested) * 0.67 %}
          {% set trailing_stop = current_price * 0.97 %}
          {% set gain_pct = (current_price / cost_price - 1) * 100 %}
          {% if current_price == 0 %}
            unknown
          {% elif gain_pct <= 0 %}
            LOSS
          {% elif net_profit_after_tax >= states('input_number.target_phone_price') | float(0) %}
            SELL
          {% elif current_price <= trailing_stop %}
            STOP
          {% else %}
            TRAIL
          {% endif %}

# ============================================================================
# LOG SENSOR - read BTC tracker operation history (like usb_tether_log pattern)
# ============================================================================
command_line:
  - sensor:
      name: "BTC Tracker Log"
      unique_id: btc_tracker_log
      command: "python3 /config/helpers/read_btc_tracker_log.py"
      value_template: "{{ value_json.state | default('empty') }}"
      command_timeout: 10
      json_attributes:
        - line_count
        - updated
        - text
        - lines
      scan_interval: 15

input_number:
  btc_investment_eur:
    name: "BTC Investment EUR"
    min: 0
    max: 1000000
    step: 10
    unit_of_measurement: "EUR"
    icon: "mdi:cash-multiple"
    mode: box

  btc_amount:
    name: "BTC Amount"
    min: 0
    max: 100
    step: 0.00000001
    unit_of_measurement: "BTC"
    icon: "mdi:bitcoin"
    mode: box

  btc_avg_buy_price:
    name: "BTC Avg Buy Price EUR"
    min: 0
    max: 200000
    step: 1
    unit_of_measurement: "EUR"
    icon: "mdi:calculator"
    mode: box

  target_phone_price:
    name: "Target Phone Price EUR"
    min: 0
    max: 5000
    step: 0.01
    unit_of_measurement: "EUR"
    icon: "mdi:cellphone"
    mode: box

input_text:
  target_phone_name:
    name: "Modello telefono target"
    icon: mdi:cellphone-information

  target_phone_url:
    name: "URL monitoraggio prezzo telefono"
    icon: mdi:link

  btc_can_buy_phone_net_last_update:
    name: "Last update of btc_can_buy_phone_net"
    icon: mdi:update
    max: 255

# ============================================================================
# SCRIPT per forzare aggiornamento template sensors (usato dalla dashboard)
# ============================================================================
script:
  phone_projection_refresh:
    alias: "Aggiorna Proiezione Telefono"
    sequence:
      # Log: avvio refresh via HALog2026
      - event: halog2026_write_event
        event_data:
          subsystem: btc_tracker
          level: INFO
          message: "🔄 Refresh avviato alle {{ now().strftime('%H:%M:%S') }} - Aggiornamento sensori in corso..."
      # Proiezione telefono (template)
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.phone_months_since_launch
            - sensor.phone_current_of_launch
            - sensor.phone_discount_vs_launch
            - sensor.phone_days_to_successor
            - sensor.phone_projection_3m
            - sensor.phone_projection_6m
            - sensor.phone_projection_12m
            - sensor.phone_projection_status
            # Calcolo BTC netto (template) → permette aggiornamento btc_can_buy_phone_net
            - sensor.btc_profit_loss_net
            - sensor.btc_current_value
            - sensor.btc_profit_loss
            - sensor.btc_can_buy_phone_net
            # Trailing Stop Suggestion
            - sensor.btc_trailing_stop_suggestion
            - sensor.btc_trailing_stop_price
            # Trailing Stop Suggestion Short
            - sensor.btc_trailing_stop_suggestion_short
      # Attendi brevemente il riconoscimento dei sensori aggiornati
      - delay: "00:00:02"
      # Timestamp aggiornamento per btc_can_buy_phone_net (PRIMA del log, per evidenza)
      - action: input_text.set_value
        target:
          entity_id: input_text.btc_can_buy_phone_net_last_update
        data:
          value: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # Log: completamento refresh via HALog2026 — include il timestamp dell'entità
      - event: halog2026_write_event
        event_data:
          subsystem: btc_tracker
          level: INFO
          message: "✅ Refresh completato alle {{ now().strftime('%H:%M:%S') }} - Trailing stop aggiornati - Last refresh sensor.btc_can_buy_phone_net: {{ state_attr('sensor.btc_can_buy_phone_net', 'last_refresh') | default('N/A') }}"
      # Aggiorna anche il log command_line sensor (force re-read)
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.btc_tracker_log
      # Aggiorna anche input_text.refresh_ops_log con timestamp ultimo refresh
      - action: input_text.set_value
        target:
          entity_id: input_text.refresh_ops_log
        data:
          value: "{{ states('sensor.btc_tracker_log') if states('sensor.btc_tracker_log') not in ['unavailable', 'unknown'] else '' }}"

# ============================================================================

# ============================================================
# REST sensors per prezzo Bitcoin (CoinGecko)
# ============================================================================
sensor:
  - platform: rest
    name: "Bitcoin Price EUR"
    unique_id: bitcoin_price_eur
    resource: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true&include_last_updated_at=true"
    scan_interval: 300
    headers:
      Accept: "application/json"
      User-Agent: "HomeAssistant-BTC-Tracker/1.0"
    value_template: "{{ value_json.bitcoin.eur | float(0) }}"
    unit_of_measurement: "EUR"
    device_class: monetary
    state_class: total
    json_attributes:
      - "bitcoin.eur_24h_change"
      - "bitcoin.last_updated_at"
    icon: "mdi:currency-btc"

  - platform: rest
    name: "Bitcoin 24h Change %"
    unique_id: bitcoin_24h_change_pct
    resource: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true"
    scan_interval: 300
    headers:
      Accept: "application/json"
    value_template: "{{ value_json.bitcoin.eur_24h_change | float(0) }}"
    unit_of_measurement: "%"
    state_class: measurement
    icon: "mdi:chart-line"

  # ============================================================
  # ============================================================
