command_line:
  - binary_sensor:
      name: Cloudflare Tunnel External Status
      unique_id: cloudflare_tunnel_external_status
      # Controlla se l'URL risponde (GET, non HEAD: Cloudflare/HA rifiutano
      # HEAD con 405 anche quando il tunnel e' attivo). Accetta 2xx/3xx.
      command: "code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 5 https://home.vialeformica.org); if [ \"$code\" -ge 200 ] && [ \"$code\" -lt 400 ]; then echo ON; else echo OFF; fi"
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 60

template:
  - switch:
      - name: "Cloudflare Tunnel"
        unique_id: cloudflare_tunnel
        state: "{{ is_state('binary_sensor.cloudflare_tunnel_external_status', 'on') }}"
        turn_on:
          action: shell_command.start_cloudflare
        turn_off:
          action: shell_command.stop_cloudflare
        icon: >-
          {% if is_state('binary_sensor.cloudflare_tunnel_external_status', 'on') %}
            mdi:cloud-check
          {% else %}
            mdi:cloud-off-outline
          {% endif %}


automation:
  - alias: "Cloudflare Tunnel Watchdog"
    id: cloudflare_tunnel_watchdog
    description: "Riavvia il tunnel Cloudflare se l'URL esterno non risponde per 5 minuti"
    trigger:
      - platform: state
        entity_id: binary_sensor.cloudflare_tunnel_external_status
        to: "off"
        for:
          minutes: 5
    condition:
      - condition: template
        value_template: "{{ states('person.carlo') not in ['home', 'Casa'] }}"
    action:
      - action: shell_command.restart_cloudflare_tunnel
      - action: notify.persistent_notification
        data:
          title: "Cloudflare Watchdog"
          message: "Il tunnel Cloudflare non rispondeva da 5 minuti. Riavvio effettuato alle {{ now().strftime('%H:%M:%S') }}."
      - event: system_log_event
        event_data:
          level: "WARNING"
          message: "Watchdog: Cloudflare tunnel riavviato per mancata risposta dell'URL esterno."

