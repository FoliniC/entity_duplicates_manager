trigger:
  - platform: state
    entity_id:
      - sensor.th1a_temperature_humidity_temperature
      - sensor.th1a_temperature_humidity_humidity
      - sensor.th1a_temperature_humidity_battery
      - sensor.th2b_temperature_humidity_temperature
      - sensor.th2b_temperature_humidity_humidity
      - sensor.th2b_temperature_humidity_battery
      - sensor.th3c_temperature_humidity_temperature
      - sensor.th3c_temperature_humidity_humidity
      - sensor.th3c_temperature_humidity_battery_level
      - sensor.th4d_temperature_humidity_temperature
      - sensor.th4d_temperature_humidity_humidity
      - sensor.th4d_temperature_humidity_battery_level
    to: ~
  - platform: homeassistant
    event: start
  - platform: time_pattern
    minutes: "/1"

sensor:
  - name: "th1a Temperature"
    unique_id: "th1a_temperature"
    state_class: "measurement"
    device_class: "temperature"
    unit_of_measurement: "°C"
    attributes:
      persistence: trigger_based
      managed_by: generate_sensors.py
      area: cucina
    state: >
      {% set sensor_id = 'sensor.th1a_temperature_humidity_temperature' %}
      {% set val = states(sensor_id) %}
      {% if val | is_number and val | float > -100 %}
        {{ val | float }}
      {% else %}
        {{ this.state | float(default=21.0) }}
      {% endif %}

  - name: "th1a Humidity"
    unique_id: "th1a_humidity"
    state_class: "measurement"
    device_class: "humidity"
    unit_of_measurement: "%"
    attributes:
      persistence: trigger_based
      managed_by: generate_sensors.py
      area: cucina
    state: >
      {% set sensor_id = 'sensor.th1a_temperature_humidity_humidity' %}
      {% set val = states(sensor_id) %}
      {% if val | is_number and val | float > -100 %}
        {{ val | float }}
      {% else %}
        {{ this.state | float(default=50.0) }}
      {% endif %}

  - name: "th1a Battery"
    unique_id: "th1a_battery"
    device_class: "battery"
    unit_of_measurement: "%"
    attributes:
      persistence: trigger_based
      managed_by: generate_sensors.py
      area: cucina
    state: >
      {% set sensor_id = 'sensor.th1a_temperature_humidity_battery' %}
