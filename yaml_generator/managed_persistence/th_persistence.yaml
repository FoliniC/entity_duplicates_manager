trigger:
  - platform: state
    entity_id:
      - sensor.th1a_temperature_humidity_temperature
      - sensor.th1a_temperature_humidity_humidity
      - sensor.th1a_temperature_humidity_battery
      - sensor.th2b_temperature_humidity_temperature
      - sensor.th2b_temperature_humidity_humidity
      - sensor.th2b_temperature_humidity_battery
      - sensor.th3c_temperature_humidity_temperature
      - sensor.th3c_temperature_humidity_humidity
      - sensor.th3c_temperature_humidity_battery
      - sensor.th4d_temperature_humidity_temperature
      - sensor.th4d_temperature_humidity_humidity
      - sensor.th4d_temperature_humidity_battery
    to: ~
sensor:
  - name: "th1a Temperature"
    unique_id: "th1a_temperature"
    state_class: "measurement"
    device_class: "temperature"
    unit_of_measurement: "°C"
    attributes:
      area: "{{ area_name('sensor.th1a_temperature_humidity_temperature') }}"
      last_update: >
        {% set sensor_id = 'sensor.th1a_temperature_humidity_temperature' %}
        {% set new_value = states(sensor_id) %}
        {% if new_value | is_number and new_value | float > -100 %}
          {{ now().isoformat() }}
        {% else %}
          {{ this.attributes.last_update | default('unknown') }}
        {% endif %}
    state: >
      {% set sensor_id = 'sensor.th1a_temperature_humidity_temperature' %}
      {% set new_value = states(sensor_id) %}
      {% if new_value | is_number and new_value | float > -100 %}
        {{ new_value | float }}
      {% else %}
        {{ this.state | float(0) }}
      {% endif %}
    availability: >
      {{ this.state is defined }}
    
  - name: "th1a Humidity"
    unique_id: "th1a_humidity"
    state_class: "measurement"
    device_class: "humidity"
