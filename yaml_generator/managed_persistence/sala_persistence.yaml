# Trigger-based sensors for better persistence across restarts
trigger:
    - platform: state
      entity_id:
        - input_select.fancoil_sala_temp_source
        - sensor.temperatura_sala_reale_calcolata
        - input_select.fancoil_system_hvac_mode
        - input_boolean.fancoil_sala_hvac_mode_follow_master
        - input_select.fancoil_sala_hvac_mode_local
        - input_number.master_setpoint_heat
        - input_number.master_setpoint_cool
        - input_number.fancoil_sala_sp_offset
        - input_boolean.fancoil_sala_sp_follow_master
        - input_number.fancoil_sala_setpoint
        - sensor.fancoil_sala_humidity
    - platform: state
      entity_id:
        - input_text.fancoil_sala_add_temp_entity
    - platform: state
      entity_id:
        - climate.controllo_temperatura_sala
      attribute: temperature
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/15"
sensor:
    - name: "Fancoil Sala Saved Temp Source"
      unique_id: fancoil_sala_saved_temp_source
      state: >-
        {% if trigger.get('entity_id') == 'input_select.fancoil_sala_temp_source' %}
          {{ states('input_select.fancoil_sala_temp_source') }}
        {% elif trigger.get('entity_id') == 'input_text.fancoil_sala_add_temp_entity' and states('input_text.fancoil_sala_add_temp_entity') != "" %}
          {{ states('input_text.fancoil_sala_add_temp_entity') }}
        {% else %}
          {{ this.state | default('sensor.fancoil_sala_temperature') }}
        {% endif %}

    - name: "Fancoil Sala Temp Sources History"
      unique_id: fancoil_sala_temp_sources_history
      state: >-
        {% set defaults = ['sensor.fancoil_sala_temperature'] %}
        {% if "sensor.fancoil_sala_temperature" != "%%" ~ "ref_sensor" ~ "%%" and "sensor.fancoil_sala_temperature" != "" and "sensor.fancoil_sala_temperature" != "sensor.fancoil_sala_temperature" %}
          {% set defaults = defaults + ["sensor.fancoil_sala_temperature"] %}
        {% endif %}
        {% if "sensor.temperatura_sala" != "%%" ~ "knx_temp_sensor" ~ "%%" and "sensor.temperatura_sala" != "" and "sensor.temperatura_sala" != "sensor.fancoil_sala_temperature" %}
          {% set defaults = defaults + ["sensor.temperatura_sala"] %}
        {% endif %}

        {# CORREZIONE: i set dentro un for non escono dal ciclo in Jinja -> servono i namespace.
           Prima clean_prev/deduped restavano vuoti e la cronologia tornava sempre ai default. #}
        {% set prev_state = this.state | default(defaults | join(',')) %}
        {% set ns = namespace(lst=[]) %}
        {% for opt in prev_state.split(',') %}
          {% set o = opt | trim %}
          {% if o not in ['unknown', 'unavailable', 'none', ''] and o not in ns.lst %}
            {% set ns.lst = ns.lst + [o] %}
          {% endif %}
        {% endfor %}
        {% set current_list = ns.lst if ns.lst | length > 0 else defaults %}

        {% set new_entity = states('input_text.fancoil_sala_add_temp_entity') %}
        {% if trigger.get('entity_id') == 'input_text.fancoil_sala_add_temp_entity' and new_entity != "" and new_entity not in current_list %}
          {% set current_list = current_list + [new_entity] %}
        {% endif %}
        {# CORREZIONE: lo stato non puo' superare 255 caratteri (HA lo sostituisce con 'unknown' e la
           cronologia si azzera). Si scartano le voci piu' vecchie (dopo i default) finche' rientra. #}
        {% set ns2 = namespace(lst=current_list) %}
        {% for i in range(20) %}
          {% if ns2.lst | join(',') | length > 250 and ns2.lst | length > defaults | length %}
            {% set ns2.lst = ns2.lst[:defaults | length] + ns2.lst[defaults | length + 1:] %}
          {% endif %}
        {% endfor %}
        {{ ns2.lst | join(',') }}

    - name: "Fancoil Sala HVAC Temp Mode"
      unique_id: fancoil_sala_hvac_temp_mode
      state: >-
        {% set follow_master = is_state('input_boolean.fancoil_sala_hvac_mode_follow_master','on') %}
        {% set master_hvac_mode = states('input_select.fancoil_system_hvac_mode') %}
        {% set local_mode = states('input_select.fancoil_sala_hvac_mode_local') %}

        {% if follow_master and master_hvac_mode not in ['unavailable', 'unknown', None] %}
            {{ master_hvac_mode }}
        {% elif not follow_master and local_mode not in ['unavailable', 'unknown', None] %}
            {{ local_mode }}
        {% else %}
            {{ this.state | default('off') }}
        {% endif %}

    - name: "Fancoil Sala Temperature Difference"
      unique_id: fancoil_sala_temperature_difference
      unit_of_measurement: "°C"
      state: >-
        {% set hvac_mode = states('sensor.fancoil_sala_hvac_temp_mode') %}
        {% if hvac_mode == 'off' %}
          0
        {% else %}
          {# Usiamo i valori del CLIMATE per coerenza con la UI #}
          {% set t_curr = state_attr('climate.controllo_temperatura_sala', 'current_temperature') %}
          {% set target_sp = state_attr('climate.controllo_temperatura_sala', 'temperature') %}

          {% if t_curr is not none and target_sp is not none %}
            {% if hvac_mode == 'heat' %}
              {{ (target_sp - t_curr) | round(1) }}
            {% elif hvac_mode == 'cool' %}
              {{ (t_curr - target_sp) | round(1) }}
            {% else %}
              0
            {% endif %}
          {% else %}
            {# Fallback ai calcoli manuali se climate non disponibile #}
            {% set t_curr_fallback = states('sensor.temperatura_sala_reale_calcolata') | float(21.0) %}

            {# Calcoliamo il setpoint teorico #}
            {% set master_hvac = states('input_select.fancoil_system_hvac_mode') %}
            {% set sp_heat = states('input_number.master_setpoint_heat') | float(20) %}
            {% set sp_cool = states('input_number.master_setpoint_cool') | float(26) %}
            {% set offset = states('input_number.fancoil_sala_sp_offset') | float(0) | round(1) %}
            {% set follow = is_state('input_boolean.fancoil_sala_sp_follow_master', 'on') %}
            {% set local_sp = states('input_number.fancoil_sala_setpoint') | float(21) %}

            {% set target_sp_fallback = local_sp %}
            {% if follow and master_hvac not in ['unknown', 'unavailable', None] %}
               {% if master_hvac == 'heat' %}
                 {% set target_sp_fallback = sp_heat + offset %}
               {% elif master_hvac == 'cool' %}
                 {% set target_sp_fallback = sp_cool + offset %}
               {% endif %}
            {% endif %}

            {% if hvac_mode == 'heat' %}
              {{ (target_sp_fallback - t_curr_fallback) | round(1) }}
            {% elif hvac_mode == 'cool' %}
              {{ (t_curr_fallback - target_sp_fallback) | round(1) }}
            {% else %}
               0
            {% endif %}
          {% endif %}
        {% endif %}

    - name: "Fancoil Sala Saved Offset"
      unique_id: fancoil_sala_saved_offset
      unit_of_measurement: "°C"
      state: >-
        {% set current_offset = states('input_number.fancoil_sala_sp_offset') %}
        {% if trigger.get('entity_id') == 'input_number.fancoil_sala_sp_offset' %}
          {% if current_offset not in ['unavailable', 'unknown', None, ''] %}
            {{ current_offset | float }}
          {% else %}
            {{ this.state | float(0) }}
          {% endif %}
        {% else %}
          {{ this.state | float(0) }}
        {% endif %}

    - name: "Fancoil Sala Last Temperature"
      unique_id: fancoil_sala_last_temperature
      unit_of_measurement: "°C"
      attributes:
        persistence: trigger_based
        managed_by: yaml_generator
      state: >-
        {% set current = states('sensor.temperatura_sala_reale_calcolata') %}
        {% if current not in ['unavailable', 'unknown', None, ''] %}
          {{ current | float }}
        {% else %}
          {{ this.state | float(21.0) }}
        {% endif %}

    - name: "Fancoil Sala Last Humidity"
      unique_id: fancoil_sala_last_humidity
      unit_of_measurement: "%"
      attributes:
        persistence: trigger_based
        managed_by: yaml_generator
      state: >-
        {% set current = states('sensor.fancoil_sala_humidity') %}
        {% if current not in ['unavailable', 'unknown', None, ''] %}
          {{ current | float }}
        {% else %}
          {{ this.state | float(50.0) }}
        {% endif %}
