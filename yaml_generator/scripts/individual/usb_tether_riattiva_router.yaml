alias: "Tethering: Riattiva Router (ADB)"
icon: mdi:cellphone-link
mode: single
sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.usb_tether_status_message
    data:
      value: "riattivazione tethering router via ADB in corso..."
  - event: halog2026_write_event
    event_data:
      subsystem: usb_tether
      level: INFO
      message: "AVVIO: Riattivazione USB Tethering sul Router via ADB"
  - action: shell_command.usb_tether_reactivate_router
  - delay: "00:00:03"
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.usb_tether_status
  - action: input_text.set_value
    target:
      entity_id: input_text.usb_tether_status_message
    data:
      value: "Tethering router riattivato via ADB"