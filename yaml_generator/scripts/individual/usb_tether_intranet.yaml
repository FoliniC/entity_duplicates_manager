alias: "Tethering: modalita intranet"
icon: mdi:wan
mode: single
sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.usb_tether_status_message
    data:
      value: "Verifica e attivazione modalità Intranet in corso..."
  - event: halog2026_write_event
    event_data:
      subsystem: usb_tether
      level: INFO
      message: "TENTATIVO: Richiesta attivazione modalità Intranet (host: {{ states('input_select.usb_tether_host') }})"
  - action: shell_command.usb_tether_activate_intranet
    response_variable: activate_result
    continue_on_error: true
  - choose:
      # Pre-flight o comando fallito: abort immediato! Nessuna attesa di 2 minuti.
      - conditions:
          - condition: template
            value_template: "{{ activate_result is not defined or activate_result.returncode != 0 }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.usb_tether_mode
            data:
              option: "Normale"
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "Pre-flight fallito: nessun tethering USB rilevato. Modalità Normale mantenuta."
          - event: halog2026_write_event
            event_data:
              subsystem: usb_tether
              level: WARN
              message: "PRE-FLIGHT FALLITO: Attivazione Intranet abortita. Modalità Normale mantenuta."
          - action: persistent_notification.create
            data:
              title: "⚠️ Attivazione Intranet Annullata"
              message: >-
                Pre-flight check fallito: nessun tethering USB rilevato su {{ states('input_select.usb_tether_host') }} (o connessione internet assente).
                La modalità Normale rimane attiva.
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.usb_tether_status
    default:
      # Pre-flight superato: attiva modalità Intranet e attendi conferma reale
      - action: input_select.select_option
        target:
          entity_id: input_select.usb_tether_mode
        data:
          option: "Intranet"
      - action: input_text.set_value
        target:
          entity_id: input_text.usb_tether_status_message
        data:
          value: "attivazione modalita' intranet in corso..."
      - event: halog2026_write_event
        event_data:
          subsystem: usb_tether
          level: INFO
          message: "AVVIO: Attivazione modalità Intranet (host: {{ states('input_select.usb_tether_host') }})"
      - delay: "00:00:04"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.usb_tether_status
      - wait_template: "{{ is_state('sensor.usb_tether_status', 'active') or is_state('sensor.usb_tether_status', 'error') }}"
        timeout: "00:00:20"
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.usb_tether_status
                state: "active"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.usb_tether_status_message
                data:
                  value: ""
        default:
          # Fallback automatico se non confermata attiva entro 20s
          - action: script.usb_tether_normale
          - action: input_select.select_option
            target:
              entity_id: input_select.usb_tether_mode
            data:
              option: "Normale"
          - action: input_text.set_value
            target:
              entity_id: input_text.usb_tether_status_message
            data:
              value: "ERRORE: Intranet non attiva entro 20s. Ripristinata modalità Normale."
          - event: halog2026_write_event
            event_data:
              subsystem: usb_tether
              level: ERROR
              message: "ERRORE: Intranet non confermata attiva entro 20s. Eseguito rollback a Normale."
          - action: persistent_notification.create
            data:
              title: "⚠️ Attivazione Intranet Fallita"
              message: "Intranet non confermata attiva entro 20s. Routing normale ripristinato automaticamente."
