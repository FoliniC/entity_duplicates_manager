fancoil_log_v2:
  alias: "Fancoil: Logger con Buffer v2"
  mode: queued
  icon: mdi:format-list-bulleted
  fields:
    level:
      description: "Livello del log"
      example: "info"
    message:
      description: "Messaggio da loggare"
      example: "Test messaggio"
  sequence:
    # 1. Specchia sempre nel log di sistema di Home Assistant
    - action: system_log.write
      data:
        level: "{{ level if level in ['debug', 'info', 'warning', 'error', 'critical'] else 'info' }}"
        logger: fancoil_system
        message: >
          {% set uptime = states('sensor.uptime') %}
          {% set age = (as_timestamp(now()) - as_timestamp(uptime)) | int if uptime not in ['unknown', 'unavailable', None] else -1 %}
          [DEBUG: Uptime={{ age }}s] {{ message }}

    # 2. Gestione buffer di boot o scrittura su file tramite Pyscript
    - choose:
        # CASO 1: Buffering attivo 
        # Attivo se:
        # - il flag fancoil_boot_buffering è ON
        # - lo stato del flag è ancora sconosciuto o non disponibile (fase di avvio)
        # - l'uptime del sistema è inferiore a 60 secondi (pyscript potrebbe non essere ancora pronto)
        - conditions:
            - condition: template
              value_template: >
                {% set uptime = states('sensor.uptime') %}
                {% set age = (as_timestamp(now()) - as_timestamp(uptime)) | int if uptime not in ['unknown', 'unavailable', None] else -1 %}
                {{ is_state('input_boolean.fancoil_boot_buffering', 'on') or 
                   states('input_boolean.fancoil_boot_buffering') in ['unknown', 'unavailable'] or
                   (age >= 0 and age < 60) }}
          sequence:
            - action: python_script.set_state
              data:
                entity_id: input_boolean.fancoil_boot_buffering
                log_queue: >-
                  {% set current = state_attr('input_boolean.fancoil_boot_buffering', 'log_queue') %}
                  {% if current is not string or current == 'unknown' or current == 'None' %}{% set current = '' %}{% endif %}
                  {% set ts = now().strftime('%Y-%m-%d %H:%M:%S') %}
                  {% set lvl = level | upper if level is defined else 'INFO' %}
                  {% set new_entry = ts ~ ' [' ~ lvl ~ '] ' ~ (message | trim) ~ '[[BR]]' %}
                  {{ (current ~ new_entry)[-16000:] }}

      # CASO 2: Normale operatività (Pyscript pronto e buffering OFF)
      default:
        - action: script.fancoil_log_direct
          continue_on_error: true
          data:
            level: "{{ level.upper() if level is defined else 'INFO' }}"
            message: "{{ message if message is defined else '' }}"

fancoil_log_direct:
  alias: "Fancoil: Scrittura Diretta Pyscript"
  mode: parallel
  sequence:
    - action: "{{ 'pyscript.fancoil_events_write' }}"
      continue_on_error: true
      data:
        level: "{{ level }}"
        message: "{{ message }}"

fancoil_flush_logs:
  alias: "Fancoil: Svuota Buffer Log"
  sequence:
    - action: "{{ 'pyscript.fancoil_flush_boot_buffer' }}"
      continue_on_error: true
      data:
        entity_id: input_boolean.fancoil_boot_buffering
    - action: python_script.set_state
      data:
        entity_id: input_boolean.fancoil_boot_buffering
        log_queue: ""
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.fancoil_boot_buffering

alexa_play_music_with_volume_check:
  alias: "Alexa: Avvia musica con controllo volume"
  description: "Controlla il volume prima di avviare la musica; se > 20% lo abbassa"
  fields:
    media_player:
      description: "Entity ID del media_player (es. media_player.cucina)"
      example: "media_player.cucina"
    radio_script:
      description: "Script radio da eseguire dopo il controllo volume"
      example: "script.alexa_radio_m2o_custom"
  sequence:
    # 1. Controlla e abbassa volume se > 20%
    - variables:
        target_players: "{{ media_player if media_player is not string else [media_player] }}"
    - repeat:
        for_each: "{{ target_players }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(repeat.item, 'volume_level') | float(0) > 0.2 }}"
                sequence:
                  - service: media_player.volume_set
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      volume_level: 0.2
                  - action: system_log.write
                    data:
                      level: info
                      message: "Alexa Volume Check: abbassato volume {{ repeat.item }} da {{ state_attr(repeat.item, 'volume_level') | float(0) }} a 20%"
    # 2. Esegue lo script radio
    - service: script.turn_on
      target:
        entity_id: "{{ radio_script }}"
  mode: queued
  max: 5

verify_tether_normale:
  alias: "Verifica Tethering Normale via Traceroute"
  description: "Esegue traceroute verso 8.8.8.8; se il primo hop è 192.168.0.11 (router), imposta usb_tether_mode a 'Normale'"
  mode: queued
  max: 2
  sequence:
    - action: shell_command.verify_tether_normale
      response_variable: traceroute_result
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ traceroute_result.stdout.strip() == '192.168.0.11' }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.usb_tether_mode
              data:
                option: "Normale"
            - action: system_log.write
              data:
                level: info
                logger: tether_verify
                message: "Tether verify: primo hop 192.168.0.11 confermato → usb_tether_mode impostato a Normale"
        - conditions:
            - condition: template
              value_template: "{{ traceroute_result.stdout.strip() != '192.168.0.11' }}"
          sequence:
            - action: system_log.write
              data:
                level: info
                logger: tether_verify
                message: "Tether verify: primo hop '{{ traceroute_result.stdout.strip() }}' (non 192.168.0.11) → usb_tether_mode NON modificato"

anti_accensione_balcone_check:
  alias: "Anti-Accensione Balcone: Verifica Cloud Tuya"
  description: "Verifica traffico cloud Tuya real-time sul router (<15s). Se c'è traffico -> Alexa/SmartLife legittimo -> NON spegne. Se NON c'è traffico -> Pulsante fisico/RF spurio -> SPEGNE."
  sequence:
    # 1) Esegui controllo real-time sul router
    - action: shell_command.check_tuya_balcone_cloud
      response_variable: tuya_check

    # 2) Log del risultato
    - event: balcone_log_event
      event_data:
        level: INFO
        action: "CHECK_CLOUD_TRAFFIC"
        message: "Verifica traffico cloud Tuya: {{ tuya_check.stdout }}"
        wait: 0

    # 3) Se c'è traffico cloud (exit 0) -> EXIT (non spegnere)
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ tuya_check.returncode == 0 }}"
          sequence:
            - event: balcone_log_event
              event_data:
                level: INFO
                action: "CLOUD_TRAFFIC_DETECTED"
                message: "Traffico cloud Tuya rilevato (Alexa/SmartLife) -> accensione legittima, NON spengo"
                wait: 0
            - stop: "Traffico cloud Tuya rilevato - accensione legittima"

    # 4) Altrimenti (exit 1) -> Spegni (pulsante fisico/RF anomalo)
    - event: balcone_log_event
      event_data:
        level: WARNING
        action: "SPENTO (anti-accensione)"
        message: "Accensione esterna NON voluta rilevata (nessun traffico cloud Tuya) -> luce spenta automaticamente"
        wait: 0
    - action: switch.turn_off
      target:
        entity_id: switch.luce_balcone_switch_1
    - action: notify.all_devices
      data:
        title: "🚫 Luce balcone spenta (anti-accensione)"
        message: "Rilevata accensione esterna non voluta (nessun traffico cloud) -> spenta automaticamente"
        tag: balcone_anti_accensione
        importance: high
        notification_icon: "mdi:shield-alert"
  mode: single

# USB Tethering Scripts (spostati da package usb_tether.yaml per evitare conflitto script:)
usb_tether_riavvia_streampack:
  alias: "StreamPack: Riavvia & Configura RTMP"
  icon: mdi:video-wireless
  sequence:
    - action: shell_command.usb_tether_configure_streampack
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: "StreamPack configurato su rtmp://10.203.33.10:1935/live/telefono"

usb_tether_normale:
  alias: "Tethering: routing normale"
  icon: mdi:router-wireless
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: "ripristino routing normale in corso..."
    - event: halog2026_write_event
      event_data:
        subsystem: usb_tether
        level: INFO
        message: "AVVIO: Ripristino routing normale (host: {{ states('input_select.usb_tether_host') }})"
    - action: shell_command.usb_tether_restore
    - delay: "00:00:03"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.usb_tether_status

usb_tether_reset:
  alias: "Tethering: Reset di emergenza"
  icon: mdi:alert-octagon
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: "🔴 Reset di emergenza in corso..."
    - event: halog2026_write_event
      event_data:
        subsystem: usb_tether
        level: WARN
        message: "AVVIO: 🔴 Reset di emergenza premuto. Interruzione watchdog e ripristino forzato rete normale."
    - action: shell_command.usb_tether_reset
    - delay: "00:00:03"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.usb_tether_status
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: ""

usb_tether_server:
  alias: "Tethering: modalita server"
  icon: mdi:server
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.usb_tether_mode
      data:
        option: "Server"
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: "attivazione modalita' server in corso..."
    - event: halog2026_write_event
      event_data:
        subsystem: usb_tether
        level: INFO
        message: "AVVIO: Attivazione modalità Server (host: {{ states('input_select.usb_tether_host') }})"
    - action: shell_command.usb_tether_activate
    - delay: "00:00:03"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.usb_tether_status
    - wait_template: "{{ is_state('sensor.usb_tether_status', 'active') }}"
      timeout: "00:02:00"
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: sensor.usb_tether_status
              state: "active"
      then:
        - action: input_text.set_value
          entity_id: input_text.usb_tether_status_message
          data:
            value: "ERRORE: tethering server non attivato - controlla log"
        - event: halog2026_write_event
          event_data:
            subsystem: usb_tether
            level: ERROR
            message: "ERRORE: Attivazione Server fallita"
      else:
        - action: input_text.set_value
          entity_id: input_text.usb_tether_status_message
          data:
            value: ""

usb_tether_intranet:
  alias: "Tethering: modalita intranet"
  icon: mdi:wan
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.usb_tether_mode
      data:
        option: "Intranet"
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: "attivazione modalita' intranet in corso..."
    - event: halog2026_write_event
      event_data:
        subsystem: usb_tether
        level: INFO
        message: "AVVIO: Attivazione modalità Intranet (host: {{ states('input_select.usb_tether_host') }})"
    - action: shell_command.usb_tether_activate_intranet
    - delay: "00:00:08"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.usb_tether_status
    - wait_template: "{{ is_state('sensor.usb_tether_status', 'active') }}"
      timeout: "00:02:00"
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: sensor.usb_tether_status
              state: "active"
      then:
        - action: input_text.set_value
          entity_id: input_text.usb_tether_status_message
          data:
            value: "ERRORE: intranet non attivata - controlla log"
        - event: halog2026_write_event
          event_data:
            subsystem: usb_tether
            level: ERROR
            message: "ERRORE: Attivazione Intranet fallita"
      else:
        - action: input_text.set_value
          entity_id: input_text.usb_tether_status_message
          data:
            value: ""

usb_tether_riattiva_router:
  alias: "Tethering: Riattiva Router (ADB)"
  icon: mdi:cellphone-link
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: "riattivazione tethering router via ADB in corso..."
    - event: halog2026_write_event
      event_data:
        subsystem: usb_tether
        level: INFO
        message: "AVVIO: Riattivazione USB Tethering sul Router via ADB"
    - action: shell_command.usb_tether_reactivate_router
    - delay: "00:00:03"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.usb_tether_status
    - action: input_text.set_value
      target:
        entity_id: input_text.usb_tether_status_message
      data:
        value: "Tethering router riattivato via ADB"

