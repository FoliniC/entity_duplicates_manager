fancoil_vars:
  cucina:
    id: cucina
    friendly_name: Cucina
    filename: cucina
    unique_id: cucina
    ref_sensor: sensor.th1a_temperature
    # Fase 4 - Sensore pilota umidità (Fancoil prioritario, Tuya TH come fallback)
    humidity_sensor: sensor.fancoil_cucina_humidity
    humidity_fallback_sensors:
      - sensor.th1a_humidity
  camera_grande:
    id: camera_grande
    friendly_name: Camera grande
    filename: camera_grande
    unique_id: camera_grande
    ref_sensor: sensor.th2b_temperature
    knx_temp_sensor: sensor.temperatura_camera_grande
    # Fase 4 - Sensore pilota umidità (Fancoil prioritario, Tuya TH come fallback)
    humidity_sensor: sensor.fancoil_camera_grande_humidity
    humidity_fallback_sensors:
      - sensor.th2b_humidity
  camera:
    id: camera
    friendly_name: Camera
    filename: camera
    unique_id: camera
    ref_sensor: sensor.th3c_temperature
    knx_temp_sensor: sensor.temperatura_camera
    # Fase 4 - Sensore pilota umidità (Fancoil prioritario, Tuya TH come fallback)
    humidity_sensor: sensor.fancoil_camera_humidity
    humidity_fallback_sensors:
      - sensor.th3c_humidity
  corridoio:
    id: corridoio
    friendly_name: Corridoio
    filename: corridoio
    unique_id: corridoio
    ref_sensor: sensor.fancoil_corridoio_temperature
    # Fase 4 - Sensore pilota umidità (unico sensore disponibile: fancoil interno)
    humidity_sensor: sensor.fancoil_corridoio_humidity
    humidity_fallback_sensors: []
  bagno:
    id: bagno
    friendly_name: Bagno
    filename: bagno
    unique_id: bagno
    ref_sensor: sensor.fancoil_bagno_temperature
    knx_temp_sensor: sensor.temperatura_bagno
    # Fase 4 - Sensore pilota umidità (unico sensore disponibile: fancoil interno)
    humidity_sensor: sensor.fancoil_bagno_humidity
    humidity_fallback_sensors: []
  sala:
    id: sala
    friendly_name: Sala
    filename: sala
    unique_id: sala
    ref_sensor: sensor.fancoil_sala_temperature
    knx_temp_sensor: sensor.temperatura_sala
    # Fase 4 - Sensore pilota umidità (fancoil interno; th4d resta associato al "Locale"/Corridoio)
    humidity_sensor: sensor.fancoil_sala_humidity
    humidity_fallback_sensors: []
