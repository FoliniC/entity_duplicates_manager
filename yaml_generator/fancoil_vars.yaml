    th_humidity_sensor: ""
    # External humidity sensor for fallback
    external_humidity_sensor: sensor.meteo_castionetto_umidita
    # Fase 13 - Soglie di verifica (opzionale, può essere sovrascritte da utente)
    verifica_thresholds:
