fancoil_vars:
  cucina:
    id: cucina
    friendly_name: Cucina
    filename: cucina
    unique_id: cucina
    ref_sensor: sensor.th1a_temperature
    # Fase 4 - Sensore pilota umidità (Fancoil prioritario, Tuya TH come fallback)
    humidity_sensor: sensor.fancoil_cucina_humidity
    humidity_fallback_sensors:
      - sensor.th1a_humidity
    # Fase 13 - TH humidity sensor per cross-validation
    th_humidity_sensor: sensor.th1a_humidity
    # External humidity sensor for fallback
    external_humidity_sensor: sensor.meteo_castionetto_umidita
    # Sensore contatto finestra (automatico) - binary_sensor che comunica solo su cambio stato
    # Quando definito, sostituisce l'input_boolean.finestra_<stanza>_aperta e rende
    # il rilevamento della finestra completamente automatico senza intervento manuale.
    # Il sensore risulta generalmente unavailable e invia aggiornamenti solo quando la
    # finestra viene aperta o chiusa.
    window_contact_sensor: binary_sensor.contact_sensor_doorcontact_state
    # Fase 13 - Soglie di verifica (opzionale, può essere sovrascritte da utente)
    verifica_thresholds:
      delta_omega_apertura: 1.5
      delta_omega_chiusura: 0.3
      confidence_penalty_active_fancoil: -25

  camera_grande:
    id: camera_grande
    friendly_name: Camera grande
    filename: camera_grande
    unique_id: camera_grande
    ref_sensor: sensor.th2b_temperature
    knx_temp_sensor: sensor.temperatura_camera_grande
    # Fase 4 - Sensore pilota umidità (Fancoil prioritario, Tuya TH come fallback)
    humidity_sensor: sensor.fancoil_camera_grande_humidity
    humidity_fallback_sensors:
      - sensor.th2b_humidity
    # Fase 13 - TH humidity sensor per cross-validation
    th_humidity_sensor: sensor.th2b_humidity
    # External humidity sensor for fallback
    external_humidity_sensor: sensor.meteo_castionetto_umidita
    # Fase 13 - Soglie di verifica (opzionale, può essere sovrascritte da utente)
    verifica_thresholds:
      delta_omega_apertura: 1.5
      delta_omega_chiusura: 0.3
      confidence_penalty_active_fancoil: -25

  camera:
    id: camera
    friendly_name: Camera
    filename: camera
    unique_id: camera
    ref_sensor: sensor.th3c_temperature
    knx_temp_sensor: sensor.temperatura_camera
    # Fase 4 - Sensore pilota umidità (Fancoil prioritario, Tuya TH come fallback)
    humidity_sensor: sensor.fancoil_camera_humidity
    humidity_fallback_sensors:
      - sensor.th3c_humidity
    # Fase 13 - TH humidity sensor per cross-validation
    th_humidity_sensor: sensor.th3c_humidity
    # External humidity sensor for fallback
    external_humidity_sensor: sensor.meteo_castionetto_umidita
    # Fase 13 - Soglie di verifica (opzionale, può essere sovrascritte da utente)
    verifica_thresholds:
      delta_omega_apertura: 1.5
      delta_omega_chiusura: 0.3
      confidence_penalty_active_fancoil: -25

  corridoio:
    id: corridoio
    friendly_name: Corridoio
    filename: corridoio
    unique_id: corridoio
    ref_sensor: sensor.fancoil_corridoio_temperature
    # Fase 4 - Sensore pilota umidità (unico sensore disponibile: fancoil interno)
    humidity_sensor: sensor.fancoil_corridoio_humidity
    humidity_fallback_sensors: []
    # Corridoio non ha finestre - solo porte verso altre stanze
    has_window: false
    # Fase 13 - TH humidity sensor per cross-validation (non disponibile per corridoio)
    th_humidity_sensor: ""
    # External humidity sensor for fallback
    external_humidity_sensor: sensor.meteo_castionetto_umidita
    # Fase 13 - Soglie di verifica (opzionale, può essere sovrascritte da utente)
    verifica_thresholds:
      delta_omega_apertura: 1.5
      delta_omega_chiusura: 0.3
      confidence_penalty_active_fancoil: -25

  bagno:
