trigger:
  - platform: time_pattern
    seconds: "/1"
sensor:
  - name: "EV Charge 2025 Remaining Time HMS"
    unique_id: ev_charge_2025_remaining_time_hms
    state: >-
      {% set minutes = states('sensor.ev_charge_2025_remaining_time') | int(0) %}
      {% if minutes <= 0 %}
        00:00:00
      {% else %}
        {% set h = (minutes // 60) %}
        {% set m = (minutes % 60) %}
        {{ '%02d:%02d:00' % (h, m) }}
      {% endif %}
