task_name: "EV Charging Configuration"
description: "Configuration for Home Assistant EV Charging Control."
base_dir: "/usr/share/hassio/homeassistant"
output_type: txt # Default: 'txt' oppure 'zip'
output_filename_prefix: ha_ev_charging
output_dir: "temp/for_IA"
files:
  - path: "configuration.yaml"
    process_yaml: true
    sections_to_remove:
      - "conversation"
      - "intent_script"
      - "light"
      - "knx"
      - "modbus"
      - "scheduler"
  - path: "yaml_generator/managed_sensors/template_sensors_static.yaml"
    process_yaml: true
  - path: "automations/generated_automations/automations_not_generated_keep_it.yaml"
    process_yaml: true
  - path: "yaml_generator/input_boolean/ev_charging_control.yaml"
    process_yaml: true
  - path: "yaml_generator/input_datetime/ev_charging_control.yaml"
    process_yaml: true
  - path: "yaml_generator/input_buttons/ev_charging_control.yaml"
    process_yaml: true
  - path: "yaml_generator/input_number/ev_charging_control.yaml"
    process_yaml: true
  - path: "yaml_generator/input_select/ev_charging_control.yaml"
    process_yaml: true
  - path: "automations/generated_automations/ev_charging_control.yaml"
    process_yaml: true
  - path: "yaml_generator/managed_sensors/template_sensors_ev_charging.yaml"
    process_yaml: true
  - path: "yaml_generator/managed_sensors/template_sensors_ev_charging_status.yaml"
    process_yaml: true
  #  - path: "ui/charge_control.yaml"
  #    process_yaml: true
  - path: "ui/charge_control_new.yaml"
    process_yaml: true
