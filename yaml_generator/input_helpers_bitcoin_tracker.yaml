# ============================================================================
# BITCOIN INVESTMENT TRACKER - Input Helpers
# ============================================================================
# Parametri configurabili dall'utente via UI
# Dati reali: 5000€ investiti il 2026-06-29 a 54000€/BTC = 0.09259259 BTC
# Telefono target: Xiaomi 17 Ultra 16/512GB ~ 1300€
# ============================================================================

# Input Numbers
input_number:
  btc_investment_eur:
    name: "Investimento BTC (EUR)"
    min: 0
    max: 1000000
    step: 10
    unit_of_measurement: "EUR"
    icon: "mdi:cash-multiple"
    mode: box
    initial: 5000

  btc_amount:
    name: "Quantità BTC posseduta"
    min: 0
    max: 100
    step: 0.00000001
    unit_of_measurement: "BTC"
    icon: "mdi:bitcoin"
    mode: box
    initial: 0.09259259

  btc_avg_buy_price:
    name: "Prezzo medio acquisto BTC (EUR)"
    min: 0
    max: 200000
    step: 1
    unit_of_measurement: "EUR"
    icon: "mdi:calculator"
    mode: box
    initial: 54000

  target_phone_price:
    name: "Prezzo telefono target (EUR)"
    min: 0
    max: 5000
    step: 1
    unit_of_measurement: "EUR"
    icon: "mdi:cellphone"
    mode: box
    initial: 1300

# Input Texts
input_text:
  target_phone_name:
    name: "Modello telefono target"
    icon: "mdi:cellphone-information"
    initial: "Xiaomi 17 Ultra 16/512GB"

  target_phone_url:
    name: "URL monitoraggio prezzo telefono"
    icon: "mdi:link"
    initial: "https://www.mi.com/it/xiaomi-17-ultra/"