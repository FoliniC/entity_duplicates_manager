# Tuya Battery Sensors
- sensor:
    - name: "Contact Cucina Battery"
      unique_id: "tuya_contact_cucina_battery_pct"
      icon: "mdi:battery"
      state: >
        {% set val = states("sensor.contact_cucina_battery_2") %}
        {% if val in ["high", "High", "HIGH"] %}100
        {% elif val in ["medium", "Medium", "MEDIUM"] %}50
        {% elif val in ["low", "Low", "LOW"] %}20
        {% else %}{{ val }}{% endif %}
      unit_of_measurement: "%"
      device_class: "battery"
      state_class: "measurement"

    - name: "Contact Cucina Battery Raw"
      unique_id: "tuya_contact_cucina_battery_raw"
      icon: "mdi:battery-outline"
      state: "{{ states('sensor.contact_cucina_battery_2') }}"
