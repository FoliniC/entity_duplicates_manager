- light:
    - name: "Uscita"
      unique_id: light_uscita
      icon: mdi:exit-run
      state: "{{ states('input_boolean.alexa_accendi_uscita') }}"
      turn_on:
        - service: system_log.write
          data:
            level: info
            message: "Template light Uscita turn_on called"
        - service: input_boolean.turn_on
          entity_id: input_boolean.alexa_accendi_uscita
      turn_off:
        - service: input_boolean.turn_off
