        {% set trend = states('sensor.trend_umidita_camera') %}
        {% set pred_h = state_attr('sensor.previsione_finestra_camera', 'horizon_minutes') | default('') %}
        {% set pred_rh = state_attr('sensor.previsione_finestra_camera', 'predicted_humidity') | default('') %}
        {% set pred_t = state_attr('sensor.previsione_finestra_camera', 'predicted_temperature') | default('') %}
        {% set pred_source = state_attr('sensor.previsione_finestra_camera', 'external_source') | default('') %}
        [Camera] WINDOW: Finestra {{ 'APERTA' if finestra else 'CHIUSA' }} | Consiglio: {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | Trend={{ trend }} | Prediction horizon={{ pred_h }}min source={{ pred_source }} RH_pred={{ pred_rh }}% T_pred={{ pred_t }}°C

sensor:
  - name: "Finestra Camera Logger"
    unique_id: finestra_camera_logger
    state: >
      {% set finestra = is_state('input_boolean.finestra_camera_aperta', 'on') %}
      {% set consiglio = states('sensor.consiglio_finestra_camera') %}
      {% set rh = states('sensor.umidita_camera_pilota') | float(0) %}
      {% set omega_int = states('sensor.omega_camera') | float(0) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(0) %}
