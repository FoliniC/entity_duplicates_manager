      {% set trend = states('sensor.trend_umidita_camera') %}
      {{ 'aperta' if finestra else 'chiusa' }} | {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | trend={{ trend }}
    attributes:
      finestra_aperta: "{{ is_state('input_boolean.finestra_camera_aperta', 'on') }}"
      consiglio_finestra: "{{ states('sensor.consiglio_finestra_camera') }}"
