      omega_ext: "{{ states('sensor.omega_esterno') | float(0) }}"
      delta_omega: "{{ (states('sensor.omega_camera') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) }}"
      trend_umidita: "{{ states('sensor.trend_umidita_camera') }}"
      temp_int: "{{ states('sensor.temperatura_camera_reale_calcolata') | float(0) }}"
      prediction_horizon: "{{ state_attr('sensor.previsione_finestra_camera', 'horizon_minutes') | default('') }}"
      prediction_text: "{{ state_attr('sensor.previsione_finestra_camera', 'prediction_text') | default('') }}"
      predicted_humidity: "{{ state_attr('sensor.previsione_finestra_camera', 'predicted_humidity') | default('') }}"
      predicted_temperature: "{{ state_attr('sensor.previsione_finestra_camera', 'predicted_temperature') | default('') }}"
      prediction_external_source: "{{ state_attr('sensor.previsione_finestra_camera', 'external_source') | default('') }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_camera_switch_1', 'on') or is_state('switch.fancoil_camera_switch_2', 'on') or is_state('switch.fancoil_camera_switch_3', 'on') or is_state('switch.fancoil_camera_switch_4', 'on') }}"
    availability: >
