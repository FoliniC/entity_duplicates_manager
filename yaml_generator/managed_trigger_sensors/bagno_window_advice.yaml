        {{ is_state('switch.fancoil_bagno_switch_1', 'on') or is_state('switch.fancoil_bagno_switch_2', 'on') or is_state('switch.fancoil_bagno_switch_3', 'on') or is_state('switch.fancoil_bagno_switch_4', 'on')
           or action in ['cooling', 'heating', 'drying'] }}
      dati_validi: >-
        {% set t_primary = states('sensor.temperatura_bagno_reale_calcolata') %}
        {% set t_fallback = states('sensor.fancoil_bagno_temperature') %}
        {% set rh_primary = states('sensor.umidita_bagno_pilota') %}
