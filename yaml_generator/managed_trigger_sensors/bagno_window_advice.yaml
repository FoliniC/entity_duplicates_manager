          {% else %}
            0
          {% endif %}
        {% else %}
          0
        {% endif %}
      piove: "{{ states('sensor.castionetto_precipitazione') | float(0) > 0.0 }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_bagno_switch_1', 'on') or is_state('switch.fancoil_bagno_switch_2', 'on') or is_state('switch.fancoil_bagno_switch_3', 'on') or is_state('switch.fancoil_bagno_switch_4', 'on') }}"
      impianto_attivo: >-
