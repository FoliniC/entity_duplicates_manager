        {% set primary = states('sensor.umidita_bagno_pilota') %}
        {% set fallback = states('sensor.fancoil_bagno_humidity') %}
        {{ primary if is_number(primary) and primary | float(0) > 0 else fallback }}
      omega_int: "{{ states('sensor.omega_bagno') | float(none) }}"
      omega_ext: "{{ states('sensor.omega_esterno') | float(none) }}"
      trend: "{{ states('sensor.trend_umidita_bagno') }}"
      finestra_aperta: "{{ is_state('input_boolean.finestra_bagno_aperta', 'on') if has_window == true else false }}"
      minuti_aperta: >-
