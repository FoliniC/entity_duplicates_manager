# FASE 8 - Window State & Advice Logger
# Logga i cambiamenti di stato finestra e consiglio finestra nel log fancoil_events
trigger:
  - platform: state
    entity_id:
      - input_boolean.finestra_corridoio_aperta
      - sensor.consiglio_finestra_corridoio

action:
  - action: logbook.log
    data:
      name: "Finestra Corridoio"
      message: >
        {% set finestra = is_state('input_boolean.finestra_corridoio_aperta', 'on') %}
        {% set consiglio = states('sensor.consiglio_finestra_corridoio') %}
        {% set rh = states('sensor.umidita_corridoio_pilota') | float(0) %}
        {% set delta_omega = (states('sensor.omega_corridoio') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) %}
        {% set trend = states('sensor.trend_umidita_corridoio') %}
        {% set pred_h = state_attr('sensor.previsione_finestra_corridoio', 'horizon_minutes') | default('') %}
        {% set pred_rh = state_attr('sensor.previsione_finestra_corridoio', 'predicted_humidity') | default('') %}
        {% set pred_t = state_attr('sensor.previsione_finestra_corridoio', 'predicted_temperature') | default('') %}
        Finestra {{ 'APERTA' if finestra else 'CHIUSA' }} | Consiglio: {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | Trend={{ trend }} | Pred={{ pred_h }}min RH→{{ pred_rh }}% T→{{ pred_t }}°C
  - event: fancoil_log_event
    event_data:
      level: INFO
      message: >
        {% set finestra = is_state('input_boolean.finestra_corridoio_aperta', 'on') %}
        {% set consiglio = states('sensor.consiglio_finestra_corridoio') %}
        {% set rh = states('sensor.umidita_corridoio_pilota') | float(0) %}
        {% set delta_omega = (states('sensor.omega_corridoio') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) %}
        {% set trend = states('sensor.trend_umidita_corridoio') %}
        {% set pred_h = state_attr('sensor.previsione_finestra_corridoio', 'horizon_minutes') | default('') %}
        {% set pred_rh = state_attr('sensor.previsione_finestra_corridoio', 'predicted_humidity') | default('') %}
        {% set pred_t = state_attr('sensor.previsione_finestra_corridoio', 'predicted_temperature') | default('') %}
        {% set pred_source = state_attr('sensor.previsione_finestra_corridoio', 'external_source') | default('') %}
        [Corridoio] WINDOW: Finestra {{ 'APERTA' if finestra else 'CHIUSA' }} | Consiglio: {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | Trend={{ trend }} | Prediction horizon={{ pred_h }}min source={{ pred_source }} RH_pred={{ pred_rh }}% T_pred={{ pred_t }}°C

sensor:
  - name: "Finestra Corridoio Logger"
    unique_id: finestra_corridoio_logger
    state: >
      {% set finestra = is_state('input_boolean.finestra_corridoio_aperta', 'on') %}
      {% set consiglio = states('sensor.consiglio_finestra_corridoio') %}
      {% set rh = states('sensor.umidita_corridoio_pilota') | float(0) %}
      {% set omega_int = states('sensor.omega_corridoio') | float(0) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(0) %}
      {% set delta_omega = (omega_int - omega_ext) | round(2) %}
      {% set trend = states('sensor.trend_umidita_corridoio') %}
      {{ 'aperta' if finestra else 'chiusa' }} | {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | trend={{ trend }}
    attributes:
      finestra_aperta: "{{ is_state('input_boolean.finestra_corridoio_aperta', 'on') }}"
      consiglio_finestra: "{{ states('sensor.consiglio_finestra_corridoio') }}"
      rh_int: "{{ states('sensor.umidita_corridoio_pilota') | float(0) }}"
      omega_int: "{{ states('sensor.omega_corridoio') | float(0) }}"
      omega_ext: "{{ states('sensor.omega_esterno') | float(0) }}"
      delta_omega: "{{ (states('sensor.omega_corridoio') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) }}"
      trend_umidita: "{{ states('sensor.trend_umidita_corridoio') }}"
      temp_int: "{{ states('sensor.temperatura_corridoio_reale_calcolata') | float(0) }}"
      prediction_horizon: "{{ state_attr('sensor.previsione_finestra_corridoio', 'horizon_minutes') | default('') }}"
      prediction_text: "{{ state_attr('sensor.previsione_finestra_corridoio', 'prediction_text') | default('') }}"
      predicted_humidity: "{{ state_attr('sensor.previsione_finestra_corridoio', 'predicted_humidity') | default('') }}"
      predicted_temperature: "{{ state_attr('sensor.previsione_finestra_corridoio', 'predicted_temperature') | default('') }}"
      prediction_external_source: "{{ state_attr('sensor.previsione_finestra_corridoio', 'external_source') | default('') }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_corridoio_switch_1', 'on') or is_state('switch.fancoil_corridoio_switch_2', 'on') or is_state('switch.fancoil_corridoio_switch_3', 'on') or is_state('switch.fancoil_corridoio_switch_4', 'on') }}"
    availability: >
      {{ has_value('input_boolean.finestra_corridoio_aperta') and has_value('sensor.consiglio_finestra_corridoio') }}
