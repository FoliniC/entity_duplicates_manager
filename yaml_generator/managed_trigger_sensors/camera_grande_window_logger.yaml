# FASE 8 - Window State & Advice Logger
# Logga i cambiamenti di stato finestra e consiglio finestra nel log fancoil_events
trigger:
  - platform: state
    entity_id:

      - sensor.consiglio_finestra_camera_grande
      - input_boolean.finestra_camera_grande_aperta

sensor:
  - name: "Finestra Camera grande Logger"
    unique_id: finestra_camera_grande_logger
    variables:
      window_contact_sensor:
    state: >
      {% if window_contact_sensor %}
        {% set finestra = is_state(window_contact_sensor, 'on') %}
      {% else %}
        {% set finestra = is_state('input_boolean.finestra_camera_grande_aperta', 'on') %}
      {% endif %}
      {% set consiglio = states('sensor.consiglio_finestra_camera_grande') %}
      {% set rh = states('sensor.umidita_camera_grande_pilota') | float(0) %}
      {% set omega_int = states('sensor.omega_camera_grande') | float(0) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(0) %}
      {% set delta_omega = (omega_int - omega_ext) | round(2) %}
      {% set trend = states('sensor.trend_umidita_camera_grande') %}
      {{ 'aperta' if finestra else 'chiusa' }} | {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | trend={{ trend }}
    attributes:
      finestra_aperta: >-
        {% if window_contact_sensor %}
          {{ is_state(window_contact_sensor, 'on') }}
        {% else %}
          {{ is_state('input_boolean.finestra_camera_grande_aperta', 'on') }}
        {% endif %}
      consiglio_finestra: "{{ states('sensor.consiglio_finestra_camera_grande') }}"
      rh_int: "{{ states('sensor.umidita_camera_grande_pilota') | float(0) }}"
      omega_int: "{{ states('sensor.omega_camera_grande') | float(0) }}"
      omega_ext: "{{ states('sensor.omega_esterno') | float(0) }}"
      delta_omega: "{{ (states('sensor.omega_camera_grande') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) }}"
      trend_umidita: "{{ states('sensor.trend_umidita_camera_grande') }}"
      temp_int: "{{ states('sensor.temperatura_camera_grande_reale_calcolata') | float(0) }}"
      prediction_horizon: "{{ state_attr('sensor.previsione_finestra_camera_grande', 'horizon_minutes') | default('') }}"
      prediction_text: "{{ state_attr('sensor.previsione_finestra_camera_grande', 'prediction_text') | default('') }}"
      predicted_humidity: "{{ state_attr('sensor.previsione_finestra_camera_grande', 'predicted_humidity') | default('') }}"
      predicted_temperature: "{{ state_attr('sensor.previsione_finestra_camera_grande', 'predicted_temperature') | default('') }}"
      prediction_external_source: "{{ state_attr('sensor.previsione_finestra_camera_grande', 'external_source') | default('') }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_camera_grande_switch_1', 'on') or is_state('switch.fancoil_camera_grande_switch_2', 'on') or is_state('switch.fancoil_camera_grande_switch_3', 'on') or is_state('switch.fancoil_camera_grande_switch_4', 'on') }}"
    availability: >
      {% if window_contact_sensor %}
        {{ has_value(window_contact_sensor) and has_value('sensor.consiglio_finestra_camera_grande') }}
      {% else %}
        {{ has_value('input_boolean.finestra_camera_grande_aperta') and has_value('sensor.consiglio_finestra_camera_grande') }}
      {% endif %}
