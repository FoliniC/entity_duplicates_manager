# FASE 13 - Sensore di Consiglio Manuale (Temporaneo) per stanza
# Registra il consiglio manuale temporaneo assegnato durante la modalità di verifica interattiva.
# Espone il consiglio originale, quello manuale assegnato e il motivo.

- id: "consiglio_manuale_corridoio"
  alias: "Consiglio Manuale Corridoio (Fase 13)"
  description: >-
    Consiglia manuale temporaneo per la stanza Corridoio registrato durante
    la modalità di verifica interattiva (Fase 13). Deriva da azione manuale utente o
    sostituzione del consiglio automatico per tuning algorithmico.
  initial_state: "nessuna_azione"
  mode: single
  max: 10
  min: 10

  trigger:
    - trigger: state
      entity_id: sensor.log_attivita_manuali_corridoio
      to:
        - 'open_15m'
        - 'close_5m'

  variables:
    consulenza_originale: "{{ states('sensor.consiglio_finestra_corridoio') }}"
    azione_manual: "{{ trigger.to_state.attributes.get('azione', 'unknown') }}"
    timestamp: "{{ trigger.to_state.attributes.get('timestamp', '') }}"
    user_id: "{{ trigger.to_state.attributes.get('user_id', '') }}"
    finoa_prima: "{{ trigger.to_state.attributes.get('finestra_prima', false) }}"
    finoa_dopo: "{{ trigger.to_state.attributes.get('finestra_dopo', false) }}"

  actions:
    - variables:
        consiglio_target: "{{ '' }}"
        motivo: "{{ '' }}"
        auth: "{{ 'manual' }}"

      - if:
          - condition: template
            value_template: "{{ azione_manual in ['open_15m', 'open_override'] }}"
        then:
          - set_variable:
              consiglio_target: "apri"
          - set_variable:
              motivo: >-
                Azione manuale da parte di {{ user_id }} in modalità verifica: aprire la finestra
                per {{ timestamp }} (finestra: {{ finoa_prima }} -> {{ finoa_dopo }})

      - if:
          - condition: template
            value_template: "{{ azione_manual in ['close_5m', 'close_override'] }}"
        then:
          - set_variable:
              consiglio_target: "chiudi"
          - set_variable:
              motivo: >-
                Azione manuale da parte di {{ user_id }} in modalità verifica: chiudere la finestra
                per {{ timestamp }} (finestra: {{ finoa_prima }} -> {{ finoa_dopo }})

      - if:
          - condition: template
            value_template: "{{ azione_manual in ['pause'] }}"
        then:
          - set_variable:
              consiglio_target: "mantieni_{{ 'aperta' if finoa_dopo else 'chiusa' }}"
          - set_variable:
              motivo: >-
                Pausa manuale da parte di {{ user_id }} in modalità verifica: mantenere stato finestra
                {{ finoa_dopo }} per {{ timestamp }}

      - if:
          - condition: template
            value_template: "{{ azione_manual in ['reset'] }}"
        then:
          - set_variable:
              consiglio_target: "nessuna_azione"
          - set_variable:
              motivo: >-
                Reset manuale da parte di {{ user_id }} in modalità verifica: ripristinare normale comportamento
                automatico per {{ timestamp }}

  state: "{{ consiglio_target if consiglio_target else 'nessuna_azione' }}"
  icon: >-
    {% if consiglio_target == 'apri' %}mdi:window-open-variant
    {% elif consiglio_target == 'chiudi' %}mdi:window-closed-variant
    {% elif consiglio_target.startswith('mantieni_') %}mdi:window-open
    {% else %}mdi:window-closed
    {% endif %}
  attributes:
    consiglio_originale: "{{ consulenza_originale }}"
    manuale_assegnato: "{{ consiglio_target }}"
    motivo: "{{ motivo }}"
    azione_utente: "{{ azione_manual }}"
    utente_id: "{{ user_id }}"
    timestamp: "{{ timestamp }}"
    finestra_prima: "{{ finoa_prima }}"
    finestra_dopo: "{{ finoa_dopo }}"
    stato_finestra: "{{ finoa_dopo }}"
    fancoil_attivo: "{{ is_state('switch.fancoil_corridoio_switch_1', 'on') or is_state('switch.fancoil_corridoio_switch_2', 'on') or is_state('switch.fancoil_corridoio_switch_3', 'on') or is_state('switch.fancoil_corridoio_switch_4', 'on') }}"
