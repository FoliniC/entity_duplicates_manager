# FASE 8 - Window State & Advice Logger
# Logga i cambiamenti di stato finestra e consiglio finestra nel log fancoil_events
trigger:
  - platform: state
    entity_id:

      - sensor.consiglio_finestra_bagno
      - input_boolean.finestra_bagno_aperta

sensor:
  - name: "Finestra Bagno Logger"
    unique_id: finestra_bagno_logger
    variables:
      window_contact_sensor:
    state: >
      {% if window_contact_sensor %}
        {% set finestra = is_state(window_contact_sensor, 'on') %}
      {% else %}
        {% set finestra = is_state('input_boolean.finestra_bagno_aperta', 'on') %}
      {% endif %}
      {% set consiglio = states('sensor.consiglio_finestra_bagno') %}
      {% set rh = states('sensor.umidita_bagno_pilota') | float(0) %}
      {% set omega_int = states('sensor.omega_bagno') | float(0) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(0) %}
      {% set delta_omega = (omega_int - omega_ext) | round(2) %}
      {% set trend = states('sensor.trend_umidita_bagno') %}
      {{ 'aperta' if finestra else 'chiusa' }} | {{ consiglio }} | RH={{ rh }}% | Δω={{ delta_omega }} | trend={{ trend }}
    attributes:
      finestra_aperta: >-
        {% if window_contact_sensor %}
          {{ is_state(window_contact_sensor, 'on') }}
        {% else %}
          {{ is_state('input_boolean.finestra_bagno_aperta', 'on') }}
        {% endif %}
      consiglio_finestra: "{{ states('sensor.consiglio_finestra_bagno') }}"
      rh_int: "{{ states('sensor.umidita_bagno_pilota') | float(0) }}"
      omega_int: "{{ states('sensor.omega_bagno') | float(0) }}"
      omega_ext: "{{ states('sensor.omega_esterno') | float(0) }}"
      delta_omega: "{{ (states('sensor.omega_bagno') | float(0) - states('sensor.omega_esterno') | float(0)) | round(2) }}"
      trend_umidita: "{{ states('sensor.trend_umidita_bagno') }}"
      temp_int: "{{ states('sensor.temperatura_bagno_reale_calcolata') | float(0) }}"
      prediction_horizon: "{{ state_attr('sensor.previsione_finestra_bagno', 'horizon_minutes') | default('') }}"
      prediction_text: "{{ state_attr('sensor.previsione_finestra_bagno', 'prediction_text') | default('') }}"
      predicted_humidity: "{{ state_attr('sensor.previsione_finestra_bagno', 'predicted_humidity') | default('') }}"
      predicted_temperature: "{{ state_attr('sensor.previsione_finestra_bagno', 'predicted_temperature') | default('') }}"
      prediction_external_source: "{{ state_attr('sensor.previsione_finestra_bagno', 'external_source') | default('') }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_bagno_switch_1', 'on') or is_state('switch.fancoil_bagno_switch_2', 'on') or is_state('switch.fancoil_bagno_switch_3', 'on') or is_state('switch.fancoil_bagno_switch_4', 'on') }}"
    availability: >
      {% if window_contact_sensor %}
        {{ has_value(window_contact_sensor) and has_value('sensor.consiglio_finestra_bagno') }}
      {% else %}
        {{ has_value('input_boolean.finestra_bagno_aperta') and has_value('sensor.consiglio_finestra_bagno') }}
      {% endif %}
