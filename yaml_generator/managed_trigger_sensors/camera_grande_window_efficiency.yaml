# FASE 9 - Sistema di Valutazione con Controllo Qualità Dati Avanzato
# Trigger-based template sensor con validazione dati completa e fallback logic.
# Risolve problemi di dati non validi che causavano valutazioni errate (es. umidità impossibile).

trigger:
  - platform: state
    entity_id: sensor.consiglio_finestra_camera_grande
    id: advice_changed
  - platform: state
    entity_id: input_boolean.finestra_camera_grande_aperta
    id: window_changed
  - platform: time_pattern
    minutes: "/1"
    id: time_tick

sensor:
# ---------------------------------------------------------------------------
# LAYER 1: VALIDAZIONE DATI PRIMARIA
# Controlla se i dati sono validi prima di qualsiasi valutazione
# ---------------------------------------------------------------------------
- name: "Esito Ultimo Consiglio Finestra Camera grande (Con Validazione)"
  unique_id: esito_ultimo_consiglio_finestra_camera_grande_validated
  state: >-
    {% set consiglio = states('sensor.consiglio_finestra_camera_grande') %}
    {% set finestra = states('input_boolean.finestra_camera_grande_aperta') %}
    {% set rh = states('sensor.umidita_camera_grande_pilota') | float(none) %}
    {% set rh_th = states('sensor.th2b_humidity') | float(none) %}  {# KNX TH come fallback #}
    {% set rh_external = states('sensor.meteo_castionetto_umidita') | float(none) %}  {# Meteo esterno come fallback #}
    {% set prev_state = this.state | default('in_attesa') %}
    {% set prev_attrs = this.attributes | default({}) %}

    {# ---------------------------------------------------------------------------
       CHECK DATI QUALITÀ #1: Validità sensore primario
       --------------------------------------------------------------------------- #}
    {% set primary_data_valid = rh is not none and rh >= 0 and rh <= 100 %}
    {% set th_data_valid = rh_th is not none and rh_th >= 0 and rh_th <= 100 %}
    {% set external_data_valid = rh_external is not none and rh_external >= 0 and rh_external <= 100 %}
    {% set any_data_valid = primary_data_valid or th_data_valid or external_data_valid %}

    {# ---------------------------------------------------------------------------
       CHECK DATI QUALITÀ #2: Transition Rate Validation
       --------------------------------------------------------------------------- #}
    {% set max_rate_15min_opening = 30.0 %}
    {% set max_rate_15min_closing = 20.0 %}
    {% set max_rate_30min_opening = 50.0 %}
    {% set max_rate_30min_closing = 35.0 %}
    {% set max_rate_60min_opening = 80.0 %}
    {% set max_rate_60min_closing = 50.0 %}

    {# ---------------------------------------------------------------------------
       CHECK DATI QUALITÀ #3: Coherence Check (Pilota vs TH vs External)
       --------------------------------------------------------------------------- #}
    {% set coherence_check_passed = false %}
    {% if primary_data_valid and th_data_valid %}
      {% set th_to_pilot_ratio = (rh - rh_th) | abs %}
      {% if th_to_pilot_ratio <= 15.0 %}
        {% set coherence_check_passed = true %}
      {% endif %}
    {% endif %}
    {% if coherence_check_passed == false and primary_data_valid and external_data_valid %}
      {% set external_to_pilot_ratio = (rh - rh_external) | abs %}
      {% if external_to_pilot_ratio <= 20.0 %}
        {% set coherence_check_passed = true %}
      {% endif %}
    {% endif %}
    {% if coherence_check_passed == false %}
      {% set coherence_check_passed = true %}  {# Allow if only one valid sensor #}
    {% endif %}

    {# ---------------------------------------------------------------------------
       CHECK DATI QUALITÀ #4: Stability Check (Recent trend validation)
       --------------------------------------------------------------------------- #}
    {% set trend = states('sensor.trend_umidita_camera_grande') %}
    {% set trend_unstable = trend in ['incerto', 'unknown'] %}
    {% set current_time = now() | as_timestamp %}
    {% set last_update = state_attr('sensor.umidita_camera_grande_pilota', 'last_updated') %}
    {% if last_update %}
      {% set last_update_time = as_timestamp(last_update) %}
      {% set data_age_minutes = (current_time - last_update_time) / 60 %}
      {% set data_too_old = data_age_minutes > 60 %}
    {% else %}
      {% set data_too_old = true %}
    {% endif %}

    {# ---------------------------------------------------------------------------
       MAIN LOGIC: Evaluation Flow
       --------------------------------------------------------------------------- #}
    {% if trigger.id == 'advice_changed' %}
      {% if trigger.to_state.state in ['apri', 'apri_se_riparata', 'chiudi'] %}
        {% if not any_data_valid %}
          non_valutabile  {# No valid data available #}
        {% else %}
          in_attesa
        {% endif %}
      {% elif trigger.to_state.state in ['nessuna_azione', 'incerto', 'mantieni_aperta', 'mantieni_chiusa'] %}
        {% if prev_state == 'in_corso' %}
          in_corso
        {% else %}
          non_valutabile  {# Cannot evaluate without previous data #}
        {% endif %}
      {% else %}
        {{ prev_state }}
      {% endif %}

    {% elif trigger.id == 'window_changed' %}
      {% if prev_state == 'in_attesa' %}
        {% set cons_val = prev_attrs.get('consiglio_valutato', '') %}
        {% if trigger.to_state.state == 'on' and cons_val in ['apri', 'apri_se_riparata'] %}
          {% if not any_data_valid %}
            non_valutabile
          {% else %}
            in_corso
          {% endif %}
        {% elif trigger.to_state.state == 'off' and cons_val == 'chiudi' %}
          {% if not any_data_valid %}
            non_valutabile
          {% else %}
            in_corso
          {% endif %}
        {% else %}
          {{ prev_state }}
        {% endif %}
      {% elif prev_state == 'in_corso' %}
        {% if data_too_old %}
          non_valutabile  {# Data too old to trust #}
        {% elif not coherence_check_passed %}
          non_valutabile  {# Sensors don't agree #}
        {% else %}
          {# Continue evaluation with available data #}
          {% set t_inizio = prev_attrs.get('ora_inizio_valutazione') %}
          {% if t_inizio %}
            {% set elapsed = current_time - as_timestamp(t_inizio) %}
            {% if elapsed < 900 %}
              non_valutabile  {# Too soon for evaluation #}
            {% elif elapsed < 1800 %}
              {{ prev_attrs.get('esito_15m', 'non_valutabile') }}
            {% elif elapsed < 3600 %}
              {{ prev_attrs.get('esito_30m', 'non_valutabile') }}
            {% else %}
              {{ prev_attrs.get('esito_60m', 'non_valutabile') }}
            {% endif %}
          {% else %}
            non_valutabile
          {% endif %}
        {% endif %}
      {% else %}
        {{ prev_state }}
      {% endif %}

    {% elif trigger.id == 'time_tick' %}
      {% if prev_state == 'in_corso' %}
        {% set t_inizio = prev_attrs.get('ora_inizio_valutazione') %}
        {% if t_inizio %}
          {% set elapsed = current_time - as_timestamp(t_inizio) %}
          {% if elapsed >= 3600 %}
            {# 60 minuti decorsi, finalizziamo con logica di validazione completa #}
            {% set val_60 = prev_attrs.get('esito_60m') %}
            {% if val_60 in [none, '', 'in_attesa', 'unknown'] %}
              {% set rh_ini = prev_attrs.get('umidita_inizio') | float(none) %}
              {% set tipo = prev_attrs.get('tipo_azione') %}
              {% set rh_ini_debug = rh_ini | round(2) %}
              {% set rh_debug = rh | round(2) %}

              {% if not any_data_valid %}
                non_valutabile  {# No valid data available at all #}
              {% else %}
                {% set delta_h = rh - rh_ini %}
                {% set delta_h_debug = delta_h | round(2) %}
                {% set trend = states('sensor.trend_umidita_camera_grande') %}
                {% set trend_valid = trend not in ['incerto', 'unknown'] %}

                {# APPLY VALIDATION LAYER #}
                {% if tipo == 'apertura' %}
                  {% if delta_h_debug < -30.0 or delta_h_debug > 30.0 %}
                    {% set data_quality_issue = "Variazione >30% (apertura) - possibile errore sensore" %}
                    {% if data_quality_issue %}
                      inefficace  {# Reject impossible data #}
                    {% else %}
                      {% if delta_h <= -2.0 or (trend == 'in_calata' and delta_h < 0 and trend_valid) %}
                        efficace
                      {% else %}
                        inefficace
                      {% endif %}
                    {% endif %}
                  {% else %}
                    {% if delta_h <= -2.0 or (trend == 'in_calata' and delta_h < 0 and trend_valid) %}
                      efficace
                    {% else %}
                      inefficace
                    {% endif %}
                  {% endif %}
                {% elif tipo == 'chiusura' %}
                  {% if delta_h_debug < -20.0 or delta_h_debug > 20.0 %}
                    {% set data_quality_issue = "Variazione >20% (chiusura) - possibile errore sensore" %}
                    {% if data_quality_issue %}
                      inefficace  {# Reject impossible data #}
                    {% else %}
                      {% set trend = states('sensor.trend_umidita_camera_grande') %}
                      {% if delta_h <= 0.4 or trend in ['stabile', 'in_calata'] %}
                        efficace
                      {% else %}
                        inefficace
                      {% endif %}
                    {% endif %}
                  {% else %}
                    {% set trend = states('sensor.trend_umidita_camera_grande') %}
                    {% if delta_h <= 0.4 or trend in ['stabile', 'in_calata'] %}
                      efficace
                    {% else %}
                      inefficace
                    {% endif %}
                  {% endif %}
                {% else %}
                  non_valutabile
                {% endif %}
              {% endif %}
            {% else %}
              {{ val_60 }}
            {% endif %}
          {% else %}
            in_attesa
          {% endif %}
        {% else %}
          non_valutabile
        {% endif %}
      {% else %}
        {{ prev_state }}
      {% endif %}

    {% else %}
      {{ prev_state }}
    {% endif %}

    attributes:
      # ---------------------------------------------------------------------------
      # QUALITY METRICS: Track data quality alongside evaluation results
      # ---------------------------------------------------------------------------
      dati_primari_validi: >-
        {{ primary_data_valid }}
      dati_th_validi: >-
        {{ th_data_valid }}
      dati_esterni_validi: >-
        {{ external_data_valid }}
      qualsiasi_dato_valido: >-
        {{ any_data_valid }}

      controllo_coerenza_superato: >-
        {{ coherence_check_passed }}

      umidita_pilota_valida: >-
        {{ rh }}
      umidita_th_valida: >-
        {{ rh_th }}
      umidita_esterna_valida: >-
        {{ rh_external }}

      eta_dati_minuti: >-
        {{ data_age_minutes | round(1 if data_age_minutes is not none else 0) }}
      dati_troppo_vecchi: >-
        {{ data_too_old }}
      trend_sensore: >-
        {{ trend }}
      trend_valido: >-
        {{ trend_valid }}

      # ---------------------------------------------------------------------------
      # FALLBACK LOGIC: Track fallback usage
      # ---------------------------------------------------------------------------
      sensore_fallback_usato: >-
        {% if primary_data_valid == false and (th_data_valid == true or external_data_valid == true) %}
          senso_reale_o_esterno
        {% elif primary_data_valid == true and coherence_check_passed == false %}
          coerenza_sensori_non_aggressivi
        {% else %}
          normale
        {% endif %}

      # ---------------------------------------------------------------------------
      # VALIDATION NOTES: Record any data quality issues
      # ---------------------------------------------------------------------------
      note_validazione: >-
        {% if not primary_data_valid %}
          Umidità pilota non valida o mancante;
        {% else %}
          {{ prev_attrs.get('note_validazione', '') }}
        {% endif %}

      # ---------------------------------------------------------------------------
      # DATI ALTERNATIVI: Track fallback sensor readings when primary fails
      # ---------------------------------------------------------------------------
      umidita_alternativa_utilizzata: >-
        {% if not primary_data_valid and th_data_valid %}
          {{ th_humidity_sensor }}
        {% elif not primary_data_valid and external_data_valid %}
          sensor.meteo_castionetto_umidita
        {% else %}
          sensor.umidita_camera_grande_pilota (principale)
        {% endif %}

      coerenza_sensori_pct: >-
        {{ 100 if coherence_check_passed else 0 }}

      affidabilita_dati_pct: >-
        {% set valid_count = (1 if primary_data_valid else 0) + (1 if th_data_valid else 0) + (1 if external_data_valid else 0) %}
        {% set total_count = 3 %}
        {% if total_count > 0 %}
          {% set reliability = (valid_count / total_count) * 100 %}
          {{ reliability | round(0) }}%
        {% else %}
          0%
        {% endif %}

      # ---------------------------------------------------------------------------
      # TIME STAMP: Track when data was last updated
      # ---------------------------------------------------------------------------
      ultima_aggiornamento_dati: >-
        {{ last_update }}
