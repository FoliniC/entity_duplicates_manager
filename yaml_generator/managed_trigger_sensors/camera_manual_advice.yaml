# FASE 13 - Sensore di Consiglio Manuale (Temporaneo) per stanza
# Trigger-based template sensor che registra il consiglio manuale temporaneo
# assegnato durante la modalità di verifica interattiva.

trigger:
  - platform: state
    entity_id: sensor.log_attivita_manuali_camera
    to:
      - 'open_15m'
      - 'close_5m'

sensor:
  - name: "Consiglio Manuale Camera"
    unique_id: consiglio_manuale_camera
    variables:
      consulenza_originale: "{{ states('sensor.consiglio_finestra_camera') }}"
      azione_manual: "{{ trigger.to_state.attributes.get('azione', 'unknown') }}"
      timestamp: "{{ trigger.to_state.attributes.get('timestamp', '') }}"
      user_id: "{{ trigger.to_state.attributes.get('user_id', '') }}"
      finoa_prima: "{{ trigger.to_state.attributes.get('finestra_prima', false) }}"
      finoa_dopo: "{{ trigger.to_state.attributes.get('finestra_dopo', false) }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_camera_switch_1', 'on') or is_state('switch.fancoil_camera_switch_2', 'on') or is_state('switch.fancoil_camera_switch_3', 'on') or is_state('switch.fancoil_camera_switch_4', 'on') }}"
      stato_manuale: >-
        {% if azione_manual in ['open_15m', 'open_override'] %}apri
        {% elif azione_manual in ['close_5m', 'close_override'] %}chiudi
        {% elif azione_manual == 'pause' %}mantieni_{{ 'aperta' if finoa_dopo else 'chiusa' }}
        {% elif azione_manual == 'reset' %}nessuna_azione
        {% else %}nessuna_azione{% endif %}
    state: "{{ stato_manuale }}"
    icon: >-
      {% set target = 'apri' if azione_manual in ['open_15m', 'open_override'] else ('chiudi' if azione_manual in ['close_5m', 'close_override'] else ('mantieni_aperta' if azione_manual == 'pause' and finoa_dopo else ('mantieni_chiusa' if azione_manual == 'pause' else 'nessuna_azione'))) %}
      {% if target == 'apri' %}mdi:window-open-variant
      {% elif target == 'chiudi' %}mdi:window-closed-variant
      {% elif target.startswith('mantieni_') %}mdi:window-open
      {% else %}mdi:window-closed{% endif %}
    attributes:
      consiglio_originale: "{{ consulenza_originale }}"
      manuale_assegnato: "{{ stato_manuale }}"
      motivo: >
        {% if azione_manual in ['open_15m', 'open_override'] %}
          Azione manuale da parte di {{ user_id }} in modalità verifica: aprire la finestra per {{ timestamp }} (finestra: {{ finoa_prima }} -> {{ finoa_dopo }})
        {% elif azione_manual in ['close_5m', 'close_override'] %}
          Azione manuale da parte di {{ user_id }} in modalità verifica: chiudere la finestra per {{ timestamp }} (finestra: {{ finoa_prima }} -> {{ finoa_dopo }})
        {% elif azione_manual == 'pause' %}
          Pausa manuale da parte di {{ user_id }} in modalità verifica: mantenere stato finestra {{ finoa_dopo }} per {{ timestamp }}
        {% elif azione_manual == 'reset' %}
          Reset manuale da parte di {{ user_id }} in modalità verifica: ripristinare normale comportamento automatico per {{ timestamp }}
        {% else %}
          Nessuna azione
        {% endif %}
      azione_utente: "{{ azione_manual }}"
      utente_id: "{{ user_id }}"
      timestamp: "{{ timestamp }}"
      finestra_prima: "{{ finoa_prima }}"
      finestra_dopo: "{{ finoa_dopo }}"
      stato_finestra: "{{ finoa_dopo }}"
      fancoil_attivo: "{{ fancoil_attivo }}"
