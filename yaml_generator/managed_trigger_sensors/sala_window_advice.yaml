# Template: fancoil_window_advice.j2
# Generated at: 2026-07-03 01:37:32

# FASE 6 - Consiglio apertura/chiusura finestre per stanza
# Trigger-based template con variables: la logica decisionale e` calcolata UNA VOLTA
# nel blocco variables e riusata da state, icon e attributes senza duplicazione.
trigger:
  - platform: state
    entity_id:
      - sensor.temperatura_sala_reale_calcolata
      - sensor.umidita_sala_pilota
      - sensor.omega_sala
      - sensor.omega_esterno
      - sensor.trend_umidita_sala
      - input_boolean.finestra_sala_aperta
      - sensor.castionetto_precipitazione
sensor:
  - name: "Consiglio Finestra Sala"
    unique_id: consiglio_finestra_sala
    variables:
      t_int: "{{ states('sensor.temperatura_sala_reale_calcolata') | float(none) }}"
      rh_int: "{{ states('sensor.umidita_sala_pilota') | float(none) }}"
      omega_int: "{{ states('sensor.omega_sala') | float(none) }}"
      omega_ext: "{{ states('sensor.omega_esterno') | float(none) }}"
      trend: "{{ states('sensor.trend_umidita_sala') }}"
      finestra_aperta: "{{ is_state('input_boolean.finestra_sala_aperta', 'on') }}"
      piove: "{{ states('sensor.castionetto_precipitazione') | float(0) > 0.0 }}"
      fancoil_attivo: "{{ is_state('switch.fancoil_sala_switch_1', 'on') or is_state('switch.fancoil_sala_switch_2', 'on') or is_state('switch.fancoil_sala_switch_3', 'on') or is_state('switch.fancoil_sala_switch_4', 'on') }}"
      dati_validi: "{{ t_int is not none and rh_int is not none and omega_int is not none and omega_ext is not none and trend not in ['unknown', 'unavailable', 'incerto'] }}"
      delta_omega: "{{ (omega_int - omega_ext) if omega_int is not none and omega_ext is not none else none }}"
      # azione e` il risultato dell'albero decisionale, valutato una volta sola
      azione: >
        {% if not dati_validi %}incerto
        {% elif finestra_aperta %}
          {%- if piove %}chiudi
          {%- elif delta_omega < 0.2 %}chiudi
          {%- elif trend == 'in_salita' and delta_omega < 0.5 %}chiudi
          {%- elif rh_int <= 55.0 %}chiudi
          {%- elif trend == 'in_calata' or delta_omega >= 1.0 %}mantieni_aperta
          {%- else %}nessuna_azione{% endif %}
        {% else %}
          {%- if piove %}
            {%- if delta_omega >= 1.0 and rh_int > 55.0 %}apri_se_riparata
            {%- else %}mantieni_chiusa{% endif %}
          {%- elif delta_omega >= 1.0 and rh_int > 55.0 %}apri
          {%- elif delta_omega < 0.2 %}mantieni_chiusa
          {%- else %}nessuna_azione{% endif %}
        {% endif %}
    state: "{{ azione }}"
    icon: >
      {% if azione == 'incerto' %}mdi:help-circle-outline
      {% elif azione == 'apri' %}mdi:window-open-variant
      {% elif azione == 'apri_se_riparata' %}mdi:window-open-variant
      {% elif azione == 'chiudi' %}mdi:window-closed-variant
      {% elif azione == 'mantieni_aperta' %}mdi:window-open
      {% else %}mdi:window-closed
      {% endif %}
    attributes:
      delta_omega: "{{ delta_omega if delta_omega is not none else 'none' }}"
      trend_umidita: "{{ trend }}"
      finestra_aperta: "{{ finestra_aperta }}"
      confidenza: >
        {% if not dati_validi %}0{% else %}
        {% set base_conf = 100 %}
        {% if fancoil_attivo and finestra_aperta %}
          {% set base_conf = base_conf - 30 %}
        {% endif %}
        {% if delta_omega is not none and delta_omega | abs < 0.2 %}
          {% set base_conf = base_conf - 10 %}
        {% endif %}
        {{ base_conf }}{% endif %}
      motivo: >
        {% if not dati_validi %}Dati sensori non completi o non disponibili.
        {% else %}
        {% set ns = namespace(motivi=[]) %}
        {% if piove %}
          {% set ns.motivi = ns.motivi + ['Rilevata pioggia all\'esterno. Chiudere la finestra per evitare infiltrazioni.'] %}
        {% endif %}
        {% if azione == 'apri' %}
          {% set ns.motivi = ns.motivi + ['Umidita` interna elevata (' ~ rh_int | round(1) ~ '%) e aria esterna secca (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Si consiglia di aprire la finestra.'] %}
        {% elif azione == 'apri_se_riparata' %}
          {% set ns.motivi = ns.motivi + ['Pioggia rilevata ma aria esterna molto secca (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Se la finestra e\' riparata dalla pioggia, si consiglia di aprirla per deumidificare.'] %}
        {% elif azione == 'chiudi' and finestra_aperta %}
          {% if delta_omega < 0.2 %}
            {% set ns.motivi = ns.motivi + ['L\'aria esterna e` piu` umida o uguale a quella interna (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Si consiglia di chiudere.'] %}
          {% elif trend == 'in_salita' and delta_omega < 0.5 %}
            {% set ns.motivi = ns.motivi + ['L\'umidita` interna sta aumentando (trend in salita) nonostante la finestra aperta. Si consiglia di chiudere.'] %}
          {% elif rh_int <= 55.0 %}
            {% set ns.motivi = ns.motivi + ['Umidita` interna a livello ottimale (' ~ rh_int | round(1) ~ '%). Chiudere per evitare dispersione termica.'] %}
          {% else %}
            {% set ns.motivi = ns.motivi + ['Condizioni non favorevoli. Si consiglia di chiudere.'] %}
          {% endif %}
        {% elif azione == 'mantieni_aperta' %}
          {% if trend == 'in_calata' %}
            {% set ns.motivi = ns.motivi + ['L\'umidita` interna e` in calo (trend in calata). Mantenere la finestra aperta.'] %}
          {% elif delta_omega >= 1.0 %}
            {% set ns.motivi = ns.motivi + ['L\'aria esterna e` significativamente piu` secca (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Mantenere la finestra aperta.'] %}
          {% else %}
            {% set ns.motivi = ns.motivi + ['Umidita` interna stabile. Nessuna azione necessaria.'] %}
          {% endif %}
        {% elif azione in ['mantieni_chiusa', 'nessuna_azione'] %}
          {% if not piove and delta_omega is not none and delta_omega < 0.2 %}
            {% set ns.motivi = ns.motivi + ['L\'aria esterna e` piu` umida o uguale (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Mantenere la finestra chiusa.'] %}
          {% elif not piove %}
            {% set ns.motivi = ns.motivi + ['Nessuna azione necessaria. Condizioni di umidita` accettabili.'] %}
          {% endif %}
        {% endif %}
        {% if fancoil_attivo and finestra_aperta %}
          {% set ns.motivi = ns.motivi + ['ATTENZIONE: Conflitto energetico! Il fancoil e` attivo mentre la finestra e` aperta.'] %}
        {% endif %}
        {{ ns.motivi | join(' ') }}{% endif %}
