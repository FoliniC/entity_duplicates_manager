# FASE 9 (v3) - Valutazione esito aperture finestra, riscritta.
#
# Cosa corregge rispetto alla versione precedente:
#  - La sessione di valutazione ora VIENE SCRITTA negli attributi (prima venivano solo letti:
#    l'esito non poteva mai arrivare a efficace/inefficace).
#  - L'esito si misura su omega (umidita' specifica, g/kg), non sull'RH: l'RH cambia anche solo
