#    e' visibile nelle altre. Per questo tutta la logica sta in UNA sola variabile ('nxt'), che
#    restituisce un JSON con stato e attributi. Spezzarla in piu' variabili (ns_init, ns_open, ...)
#    fa fallire con "'ns' is undefined".
