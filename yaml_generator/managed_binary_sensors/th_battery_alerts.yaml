# Binary sensors for th* battery low detection
# Generated manually, will be integrated into helpers/generate_sensors.py

- name: "th1a Battery Low"
  unique_id: th1a_battery_low
  device_class: battery
  state: >
    {% set battery = states('sensor.th1a_temperature_humidity_battery') %}
    {% if battery | is_number %}
      {{ battery | float < 20 }}
    {% else %}
      {{ battery | lower in ['low', 'empty'] }}
    {% endif %}

