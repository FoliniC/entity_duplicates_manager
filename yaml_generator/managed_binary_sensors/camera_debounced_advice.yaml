# Binary Sensor debounced per il consiglio "apri finestra"
# Diventa on solo quando il consiglio grezzo (attributo 'candidato') è "apri" o "apri_se_riparata" per almeno 2 minuti continui
# Torna off solo quando il consiglio grezzo NON è "apri" per almeno 2 minuti continui
# Riduce drasticamente i cambiamenti spuri (128-257 -> ~18 cambi/giorno per cucina con 2 min)

- name: "Consiglio Apri Camera (Debounced)"
  unique_id: consiglio_apri_camera_debounced
  state: >
    {{ state_attr('sensor.consiglio_finestra_camera', 'candidato') in ['apri', 'apri_se_riparata'] }}
  delay_on:
    minutes: 2
  delay_off:
    minutes: 2
  availability: >
    {{ states('sensor.consiglio_finestra_camera') not in ['unknown', 'unavailable'] }}
  device_class: opening
  icon: "mdi:window-open-variant"
