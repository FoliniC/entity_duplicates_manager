tempo_ricarica_clessidra:
  name: Tempo ricarica rimanente (minuti)
  min: 0
  max: 720 # 12 ore in minuti
  step: 5
  unit_of_measurement: minuti
  mode: slider # Può essere 'slider' o 'box' a seconda di come vuoi visualizzarlo

fan_distance_high:
  name: "Soglia Ventola HIGH"
  min: -10
  max: 10
  step: 0.1
  unit_of_measurement: "°C"

fan_distance_medium:
  name: "Soglia Ventola MEDIUM"
  min: -10
  max: 10
  step: 0.1
  unit_of_measurement: "°C"

fan_distance_low:
  name: "Soglia Ventola LOW"
  min: -10
  max: 10
  step: 0.1
  unit_of_measurement: "°C"
fan_distance_idle:
  name: "Soglia Ventola idle"
  min: -10
  max: 10
  step: 0.1
  unit_of_measurement: "°C"

fan_distance_stop:
  name: "Soglia Ventola STOP"
  min: -10
  max: 10
  step: 0.1
  unit_of_measurement: "°C"

# Nuova soglia di ripartenza (isteresi ampiezza): la ventola/main riparte solo se diff >= questa soglia
fan_distance_resume:
  name: "Soglia Ventola RESUME"
  min: -10
  max: 10
  step: 0.1
  unit_of_measurement: "°C"

# Ritardo minimo in minuti per la ripartenza (isteresi temporale)
fancoil_resume_delay_minutes:
  name: "Ritardo Ripartenza Fancoil (min)"
  min: 0
  max: 60
  step: 1
  unit_of_measurement: "min"

fancoil_debounce_seconds:
  name: "Inerzia Cambio Velocità (sec)"
  min: 0
  max: 300
  step: 10
  unit_of_measurement: "sec"
