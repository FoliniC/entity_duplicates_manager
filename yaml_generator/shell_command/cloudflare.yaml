stop_cloudflare: "ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no carlo@192.168.0.3 'docker stop cloudflare-tunnel'"
start_cloudflare: "ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no carlo@192.168.0.3 'docker start cloudflare-tunnel'"
restart_cloudflare_tunnel: "ssh -i /config/.ssh/host_key -o StrictHostKeyChecking=no carlo@192.168.0.3 'docker restart cloudflare-tunnel'"
