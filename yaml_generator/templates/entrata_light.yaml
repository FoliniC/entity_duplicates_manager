# Template Light - Entrata (per controllo vocale Alexa)
light:
  - unique_id: light_entrata
    name: "Entrata"
    icon: mdi:home-import
    state: "{{ states('input_boolean.alexa_accendi_entrata') }}"
    turn_on:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.alexa_accendi_entrata
    turn_off:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.alexa_accendi_entrata