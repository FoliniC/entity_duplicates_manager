light:
  - name: "Verifica"
    unique_id: light_verifica
    icon: mdi:check-circle
    state: "{{ states('input_boolean.verifica_alexa') }}"
    turn_on:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.verifica_alexa
    turn_off:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.verifica_alexa