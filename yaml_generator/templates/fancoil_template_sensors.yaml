# Trigger-based Template Sensors per Fancoil - Logica Computazionale
# Generato per sostituire le variabili inline nelle automazioni
# Usa trigger-based templates (HA 2023.4+) per ricalcolo efficiente
# Tutte le 4 zone combinate in un unico trigger/sensor block

trigger:
  # BAGNO triggers
  - trigger: state
    entity_id:
      - input_boolean.fancoil_bagno_hvac_mode_follow_master
      - input_select.fancoil_system_hvac_mode
      - input_select.fancoil_bagno_hvac_mode_local
  - trigger: state
    entity_id:
      - sensor.fancoil_bagno_temperature_difference
      - binary_sensor.fancoil_bagno_stop_condition
      - input_boolean.fancoil_deumidificazione
      - switch.attiva_fancoil
      - switch.attiva_pdc
      - switch.attiva_pompa_circolazione
      - binary_sensor.pdc_acqua_calda
      - input_number.fan_distance_stop
      - input_number.fan_distance_idle
      - input_number.fan_distance_low
      - input_number.fan_distance_medium
      - input_number.fan_distance_high
      - input_number.fan_distance_resume
      - input_number.fancoil_resume_delay_minutes
  - trigger: state
    entity_id:
      - switch.fancoil_bagno_switch_1
      - switch.fancoil_bagno_switch_2
      - switch.fancoil_bagno_switch_3
      - switch.fancoil_bagno_switch_4
      - switch.stox_fancoil_bagno_switch
  - trigger: state
    entity_id:
      - sensor.fancoil_bagno_temperature
      - sensor.fancoil_bagno_humidity

  # CAMERA GRANDE triggers
  - trigger: state
    entity_id:
      - input_boolean.fancoil_camera_grande_hvac_mode_follow_master
      - input_select.fancoil_system_hvac_mode
      - input_select.fancoil_camera_grande_hvac_mode_local
