    entity_id:
      - sensor.fancoil_camera_grande_temperature_difference
      - binary_sensor.fancoil_camera_grande_stop_condition
      - input_boolean.fancoil_deumidificazione
      - switch.attiva_fancoil
      - switch.attiva_pdc
      - switch.attiva_pompa_circolazione
      - binary_sensor.pdc_acqua_calda
      - input_number.fan_distance_stop
      - input_number.fan_distance_idle
      - input_number.fan_distance_low
      - input_number.fan_distance_medium
      - input_number.fan_distance_high
      - input_number.fan_distance_resume
      - input_number.fancoil_resume_delay_minutes
  - trigger: state
    entity_id:
      - switch.fancoil_camera_grande_switch_1
      - switch.fancoil_camera_grande_switch_2
      - switch.fancoil_camera_grande_switch_3
      - switch.fancoil_camera_grande_switch_4
      - switch.stox_fancoil_camera_grande_switch
  - trigger: state
    entity_id:
      - sensor.fancoil_camera_grande_temperature
      - sensor.fancoil_camera_grande_humidity

  # CORRIDOIO triggers
  - trigger: state
    entity_id:
      - input_boolean.fancoil_corridoio_hvac_mode_follow_master
      - input_select.fancoil_system_hvac_mode
      - input_select.fancoil_corridoio_hvac_mode_local
  - trigger: state
    entity_id:
      - sensor.fancoil_corridoio_temperature_difference
      - binary_sensor.fancoil_corridoio_stop_condition
      - input_boolean.fancoil_deumidificazione
      - switch.attiva_fancoil
      - switch.attiva_pdc
      - switch.attiva_pompa_circolazione
      - binary_sensor.pdc_acqua_calda
      - input_number.fan_distance_stop
      - input_number.fan_distance_idle
      - input_number.fan_distance_low
      - input_number.fan_distance_medium
      - input_number.fan_distance_high
