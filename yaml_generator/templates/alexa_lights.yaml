light:
  - name: "Uscita"
    unique_id: light_uscita
    icon: mdi:exit-run
    state: "{{ states('input_boolean.alexa_accendi_uscita') }}"
    turn_on:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.alexa_accendi_uscita
    turn_off:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.alexa_accendi_uscita
