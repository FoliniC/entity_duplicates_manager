light:
  - unique_id: luce_scale_switch
    name: Luce scale
    state: >-
      {% set p1 = states('sensor.sonoff_10024024c4_power_1') %}
      {% set p2 = states('sensor.sonoff_10024024c4_power_2') %}
      {% if has_value('sensor.sonoff_10024024c4_power_1') or has_value('sensor.sonoff_10024024c4_power_2') %}
        {{ (p1 | float(0) + p2 | float(0)) > 7 }}
      {% else %}
        {{ states('light.luce_scale_switch') == 'on' }}
      {% endif %}
    availability: >-
      {{ has_value('sensor.sonoff_10024024c4_power_1') or has_value('sensor.sonoff_10024024c4_power_2') }}
    turn_on:
      - condition: template
        value_template: >
          {{ (states('sensor.sonoff_10024024c4_power_1') | float(0) +
              states('sensor.sonoff_10024024c4_power_2') | float(0)) < 7 }}
      - if:
          - condition: template
            value_template: "{{ states('input_text.scale_light_source') == '' }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.scale_light_source
            data:
              value: "Interfaccia HA"
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "off"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "off"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_10024024c4_1

          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "off"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10024024c4_2
              - delay: "0:00:00.300000"
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_10024024c4_1

          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "on"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10024024c4_1

          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "on"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "off"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10024024c4_1
              - delay: "0:00:00.300000"
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_10024024c4_2

      - action: system_log.write
        data:
          level: info
          message: "Luce scale Turn ON - Switch1: {{ states('switch.sonoff_10024024c4_1') }}, Switch2: {{ states('switch.sonoff_10024024c4_2') }}, Power: {{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}W"
      - delay: "0:00:02"
      - action: input_text.set_value
        target:
          entity_id: input_text.scale_light_source
        data:
          value: ""

    turn_off:
      - condition: template
        value_template: >
          {{ (states('sensor.sonoff_10024024c4_power_1') | float(0) +
              states('sensor.sonoff_10024024c4_power_2') | float(0)) > 7 }}
      - if:
          - condition: template
            value_template: "{{ states('input_text.scale_light_source') == '' }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.scale_light_source
            data:
              value: "Interfaccia HA"
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "on"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "off"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10024024c4_1
              - delay: "0:00:00.300000"
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_10024024c4_2

          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "off"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10024024c4_2
              - delay: "0:00:00.300000"
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_10024024c4_1

          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "on"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10024024c4_1

          - conditions:
              - condition: state
                entity_id: switch.sonoff_10024024c4_1
                state: "off"
              - condition: state
                entity_id: switch.sonoff_10024024c4_2
                state: "off"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_10024024c4_1
              - delay: "0:00:00.300000"
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_10024024c4_1

      - action: system_log.write
        data:
          level: info
          message: "Luce scale Turn OFF - Switch1: {{ states('switch.sonoff_10024024c4_1') }}, Switch2: {{ states('switch.sonoff_10024024c4_2') }}, Power: {{ (states('sensor.sonoff_10024024c4_power_1') | float(0)) + (states('sensor.sonoff_10024024c4_power_2') | float(0)) }}W"
      - delay: "0:00:02"
      - action: input_text.set_value
        target:
          entity_id: input_text.scale_light_source
        data:
          value: ""