# Template lights for emulated_hue - con azioni turn_on/turn_off che chiamano gli input_boolean
# Questi sono nel dominio 'light' (in SUPPORTED_DOMAINS) e mantengono lo stato

template:
  - light:
      - name: "Buongiorno"
        unique_id: "alexa_buongiorno_light"
        state: "{{ is_state('input_boolean.buongiorno_alexa', 'on') }}"
        turn_on:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.buongiorno_alexa
        turn_off:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.buongiorno_alexa

      - name: "Uscita"
        unique_id: "alexa_uscita_light"
        state: "{{ is_state('input_boolean.alexa_accendi_uscita', 'on') }}"
