  # ============================================================
  # CORRIDOIO - Fanmode Dinamica (Semplificata)
  # ============================================================
  - id: "fancoil_corridoio_fanmode_dinamica_v3"
    alias: "Fancoil Corridoio fanmode dinamica"
    initial_state: true
    mode: single
    description: "Regola velocità ventola basandosi su sensor.fancoil_corridoio_fan_target"
    triggers:
      - trigger: state
        entity_id: sensor.fancoil_corridoio_fan_target
        for: "00:00:10"
      - trigger: event
        event_type: fancoil_start_initialization
        event_data:
          fancoil_id: "corridoio"
    conditions:
      - condition: state
        entity_id: input_boolean.fancoil_corridoio_enabled
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.platform == 'event' and trigger.event.event_type == 'fancoil_start_initialization' }}"
            sequence:
              - wait_template: >
                  {{ states('sensor.fancoil_corridoio_hvac_temp_mode') not in ['unknown', 'unavailable', None] and
                     is_state('switch.attiva_fancoil', 'on') and
                     is_state('switch.attiva_pdc', 'on') and
                     is_state('switch.attiva_pompa_circolazione', 'on') }}
                timeout: "00:02:00"
                continue_on_timeout: true
              - action: switch.turn_on
                target:
                  entity_id: switch.stox_fancoil_corridoio_switch
              - delay: "00:00:02"
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.controllo_temperatura_corridoio
                data:
                  hvac_mode: "{{ states('sensor.fancoil_corridoio_hvac_temp_mode') if states('sensor.fancoil_corridoio_hvac_temp_mode') != 'off' else 'heat' }}"
              - delay: "00:00:02"
              - event: fancoil_log_event
                event_data:
                  level: info
                  message: "[Corridoio] INIT: hvac_mode={{ states('sensor.fancoil_corridoio_hvac_temp_mode') }}, fan_target={{ states('sensor.fancoil_corridoio_fan_target') }}"

          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.fancoil_corridoio_fan_target') in ['off', 'idle'] and
                     (is_state('binary_sensor.fancoil_corridoio_stop_condition', 'on') or
                      states('sensor.fancoil_corridoio_hvac_temp_mode') == 'off') }}
            sequence:
              - condition: template
                value_template: >
                  {{ is_state('switch.fancoil_corridoio_switch_1','on') or
                     is_state('switch.fancoil_corridoio_switch_2','on') or
                     is_state('switch.fancoil_corridoio_switch_3','on') or
                     is_state('switch.fancoil_corridoio_switch_4','on') }}
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.fancoil_corridoio_switch_1
                    - switch.fancoil_corridoio_switch_2
                    - switch.fancoil_corridoio_switch_3
                    - switch.fancoil_corridoio_switch_4
              - delay: "00:00:02"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.fancoil_corridoio_last_main_off
                data:
                  datetime: "{{ now().isoformat() }}"
              - event: fancoil_log_event
                event_data:
                  level: info
                  message: >
                    {% if states('sensor.fancoil_corridoio_hvac_temp_mode') == 'off' %}
                    [Corridoio] STOP: modalità OFF
                    {% else %}
                    [Corridoio] STOP: diff={{ states('sensor.fancoil_corridoio_diff') | float | round(2) }}°C ≤ {{ states('sensor.fancoil_corridoio_soglia_stop') | float }}, mode={{ states('sensor.fancoil_corridoio_hvac_temp_mode') }}
                    {% endif %}

          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.fancoil_corridoio_fan_target') not in ['off', 'idle', 'unknown'] and
                     is_state('sensor.fancoil_corridoio_main_available', 'True') and
                     is_state('sensor.fancoil_corridoio_resume_allowed', 'True') and
                     is_state('switch.stox_fancoil_corridoio_switch', 'off') }}
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.stox_fancoil_corridoio_switch
              - delay: "00:00:07"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.fancoil_corridoio_last_main_on
                data:
                  datetime: "{{ now().isoformat() }}"
              - event: fancoil_log_event
                event_data:
                  level: info
                  message: "[Corridoio] RESUME: diff={{ states('sensor.fancoil_corridoio_diff') | float | round(2) }}°C ≥ {{ states('sensor.fancoil_corridoio_soglia_resume') | float }}"

          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.fancoil_corridoio_fan_target') != states('sensor.fancoil_corridoio_fan_attuale_hw') and
                     states('sensor.fancoil_corridoio_fan_target') not in ['off', 'idle', 'unknown'] and
                     is_state('switch.stox_fancoil_corridoio_switch', 'on') and
                     is_state('sensor.fancoil_corridoio_main_available', 'True') and
                     states('sensor.fancoil_corridoio_hvac_temp_mode') != 'off' }}
            sequence:
              - delay: "{{ '%02d' % (states('input_number.fancoil_debounce_seconds') | int(30) % 60) }}"
              - event: fancoil_log_event
                event_data:
                  level: info
                  message: "[Corridoio] Velocità: {{ states('sensor.fancoil_corridoio_fan_attuale_hw') }} -> {{ states('sensor.fancoil_corridoio_fan_target') }} (Delta: {{ states('sensor.fancoil_corridoio_diff') | float | round(2) }}°C)"
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.controllo_temperatura_corridoio
                data:
                  fan_mode: "{{ states('sensor.fancoil_corridoio_fan_target') }}"

