# Generated by: yaml_generator/generate_fancoil_climates.py
# Template: fancoil_climate.j2
# Generated at: 2026-06-05 16:14:52

# File: yaml_generator/templates/fancoil_climate.j2
# MODIFIED for HA 2025.10 syntax, template sensors, and prioritized temperature reading

- platform: climate_template
  name: "controllo temperatura Sala"
  unique_id: controllo_temperatura_sala_template
  temp_step: 0.1
  precision: 0.1
  availability_template: "{{ True }}"

  modes:
    - "off"
    - "cool"
    - "heat"
    - "dry"
    - "fan_only"
  fan_modes:
    - "off"
    - "idle"
    - "low"
    - "medium"
    - "high"
  min_temp: 5
  max_temp: 35

  # Temperatura attuale basata sulla sorgente selezionata
  current_temperature_template: >-
    {{ states('sensor.fancoil_sala_real_calculated') | float(21.0) }}

  # Temperatura target con gestione follow master
  target_temperature_template: >-
    {% set follow = is_state('input_boolean.fancoil_sala_sp_follow_master','on') %}
    {% set offset = states('input_number.fancoil_sala_sp_offset') | float(0) %}
    {% set local = states('input_number.fancoil_sala_setpoint') | float(21) %}
    {% set master_hvac_mode = states('input_select.fancoil_system_hvac_mode') %}
    {% set sp_heat = states('input_number.master_setpoint_heat') | float(20) %}
    {% set sp_cool = states('input_number.master_setpoint_cool') | float(26) %}
    {% if follow and master_hvac_mode not in ['unknown', 'unavailable', None] %}
      {% if master_hvac_mode == 'heat' %}
        {{ ((sp_heat + offset) | float | clamp(5, 35)) | round(1) }}
      {% elif master_hvac_mode == 'cool' %}
        {{ ((sp_cool + offset) | float | clamp(5, 35)) | round(1) }}
      {% else %}
        {{ local | float | clamp(5, 35) | round(1) }}
      {% endif %}
    {% else %}
      {{ local | float | clamp(5, 35) | round(1) }}
    {% endif %}

  # Modalità HVAC con gestione follow master
  hvac_mode_template: "{{ states('sensor.fancoil_sala_hvac_temp_mode') }}"

  # Stato operativo (heating, cooling, idle, off)
  hvac_action_template: >-
    {% set vlv = is_state('switch.fancoil_sala_switch_4', 'on') %}
    {% set mode = states('sensor.fancoil_sala_hvac_temp_mode') %}
    {% if mode == 'off' %} off
    {% elif not vlv %} idle
    {% elif mode == 'heat' %} heating
    {% elif mode == 'cool' %} cooling
    {% else %} fan
    {% endif %}

  # Modalità ventola basata sugli switch hardware
  fan_mode_template: >-
    {% set s1 = is_state('switch.fancoil_sala_switch_1', 'on') %}
    {% set s2 = is_state('switch.fancoil_sala_switch_2', 'on') %}
    {% set s3 = is_state('switch.fancoil_sala_switch_3', 'on') %}
    {% set s4 = is_state('switch.fancoil_sala_switch_4', 'on') %}
    {% if not s4 %}       off
    {% elif s3 %}       high
    {% elif s2 %}       medium
    {% elif s1 %}       low
    {% elif s4 and not (s1 or s2 or s3) %} off
    {% else %}           off
    {% endif %}

  # Impostazione velocità ventola
  set_fan_mode:
    - variables:
        verbosity_level: "{{ states('input_select.fancoil_verbosity_level_master') | default('info') }}"
        main_state: "{{ states('switch.stox_fancoil_sala_switch') }}"

    # Accendi lo stox solo se è esplicitamente OFF. Se è unavailable, procediamo comunque con gli switch velocità.
    - if:
        - condition: template
          value_template: "{{ fan_mode != 'off' and main_state == 'off' }}"
      then:
        - action: switch.turn_on
          target:
            entity_id: switch.stox_fancoil_sala_switch
        - delay: "00:00:02"

    # Gestione velocità ventola
    - choose:
        # OFF: spegni le velocità e la valvola
        - conditions:
            - condition: template
              value_template: "{{ fan_mode == 'off' }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_sala_switch_1
                  - switch.fancoil_sala_switch_2
                  - switch.fancoil_sala_switch_3
                  - switch.fancoil_sala_switch_4

        # IDLE: solo valvola (switch 4)
        - conditions:
            - condition: template
              value_template: "{{ fan_mode == 'idle' }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.fancoil_sala_switch_4
            - delay: "00:00:01"
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_sala_switch_1
                  - switch.fancoil_sala_switch_2
                  - switch.fancoil_sala_switch_3

        # LOW: velocità 1 + valvola
        - conditions:
            - condition: template
              value_template: "{{ fan_mode == 'low' }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.fancoil_sala_switch_4
            - delay: "00:00:01"
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_sala_switch_2
                  - switch.fancoil_sala_switch_3
            - delay: "00:00:02"
            - action: switch.turn_on
              target:
                entity_id: switch.fancoil_sala_switch_1

        # MEDIUM: velocità 2 + valvola
        - conditions:
            - condition: template
              value_template: "{{ fan_mode == 'medium' }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.fancoil_sala_switch_4
            - delay: "00:00:01"
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_sala_switch_1
                  - switch.fancoil_sala_switch_3
            - delay: "00:00:02"
            - action: switch.turn_on
              target:
                entity_id: switch.fancoil_sala_switch_2

        # HIGH: velocità 3 + valvola
        - conditions:
            - condition: template
              value_template: "{{ fan_mode == 'high' }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.fancoil_sala_switch_4
            - delay: "00:00:01"
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_sala_switch_1
                  - switch.fancoil_sala_switch_2
            - delay: "00:00:02"
            - action: switch.turn_on
              target:
                entity_id: switch.fancoil_sala_switch_3


    # Log verbose se richiesto
    - if:
        - condition: template
          value_template: "{{ verbosity_level in ['verbose'] }}"
      then:
        - action: persistent_notification.create
          data:
            title: "Fancoil Sala"
            message: "Velocità impostata: {{ fan_mode }}"
        - action: "script.fancoil_log_v2"
          data:
            message: "[Sala] Set fan mode: {{ fan_mode }}"
            level: "DEBUG"

  # Impostazione temperatura
  set_temperature:
    - variables:
        called_from_user: "{{ context is not none and context.user_id is not none and context.parent_id is none }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.fancoil_sala_setpoint
      data:
        value: "{{ temperature | round(1) }}"
    # Se in follow master e la chiamata è manuale, disattiva follow
    - if:
        - condition: template
          value_template: "{{ called_from_user }}"
        - condition: state
          entity_id: input_boolean.fancoil_sala_sp_follow_master
          state: "on"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.fancoil_sala_sp_follow_master

  # Impostazione modalità HVAC
  set_hvac_mode:
    - variables:
        called_from_user: "{{ context is not none and context.user_id is not none and context.parent_id is none }}"
        follow_master: "{{ is_state('input_boolean.fancoil_sala_hvac_mode_follow_master', 'on') }}"
    - choose:
        # Modalità OFF
        - conditions:
            - condition: template
              value_template: "{{ hvac_mode == 'off' }}"
          sequence:
            # Spegni le velocità e la valvola, non lo stox
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.fancoil_sala_switch_1
                  - switch.fancoil_sala_switch_2
                  - switch.fancoil_sala_switch_3
                  - switch.fancoil_sala_switch_4
            # Se chiamato dall'utente, disattiva follow e imposta local su off
            - if:
                - condition: template
                  value_template: "{{ called_from_user }}"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.fancoil_sala_hvac_mode_follow_master
                - action: input_select.select_option
                  target:
                    entity_id: input_select.fancoil_sala_hvac_mode_local
                  data:
                    option: "off"

        # Altre modalità (heat, cool, dry, fan_only)
        - conditions:
            - condition: template
              value_template: "{{ hvac_mode in ['heat','cool','dry','fan_only'] }}"
          sequence:
            # Se chiamato dall'utente, disattiva follow e aggiorna modalità locale
            - if:
                - condition: template
                  value_template: "{{ called_from_user }}"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.fancoil_sala_hvac_mode_follow_master
                - action: input_select.select_option
                  target:
                    entity_id: input_select.fancoil_sala_hvac_mode_local
                  data:
                    option: "{{ hvac_mode }}"
