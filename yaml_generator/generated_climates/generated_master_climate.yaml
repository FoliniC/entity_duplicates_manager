# MODIFIED to use min/max for current temperature
- platform: climate_template
  name: "Climatizzazione Appartamento"
  unique_id: hvac_master_template
  temp_step: 0.1
  modes: ["off", "cool", "heat", "dry", "fan_only"]

  current_temperature_template: >-
    {% set hvac_mode = states('input_select.fancoil_system_hvac_mode') %}
    {% set room_sensors = ['sensor.stox_fancoil_cucina', 'sensor.stox_fancoil_camera_grande', 'sensor.stox_fancoil_camera', 'sensor.stox_fancoil_corridoio', 'sensor.stox_fancoil_bagno', 'sensor.stox_fancoil_sala'] %}
    {# Filter out unavailable/unknown sensors before calculating #}
    {% set temps = room_sensors | map('states') | map('float', 'unavailable') | reject('==', 'unavailable') | list %}
    {% if temps | length > 0 %}
      {% if hvac_mode == 'heat' %}
        {{ temps | min }}
      {% elif hvac_mode == 'cool' %}
        {{ temps | max }}
      {% else %}
        {{ (temps | sum / (temps | length)) | round(1) }}
      {% endif %}
    {% else %}
      21 {# Fallback value if no sensors are available #}
    {% endif %}

  hvac_mode_template: >-
    {{ states('input_select.fancoil_system_hvac_mode') | default('off') }}

  target_temperature_template: >-
    {% set hvac_mode = states('input_select.fancoil_system_hvac_mode') %}
    {% set profile = states('input_select.hvac_profile') %}
    {% set sp_heat = states('input_number.master_setpoint_heat') | float(20) %}
    {% set sp_cool = states('input_number.master_setpoint_cool') | float(26) %}
    {% if profile == 'Eco' %}
      {% set sp_heat = sp_heat + (states('input_number.profile_delta_eco_heat') | float(-2)) %}
      {% set sp_cool = sp_cool + (states('input_number.profile_delta_eco_cool') | float(2)) %}
    {% elif profile == 'Night' %}
      {% set sp_heat = sp_heat - 1 %}
      {% set sp_cool = sp_cool + 1 %}
    {% elif profile == 'Away' %}
      {% set sp_heat = sp_heat - 3 %}
      {% set sp_cool = sp_cool + 3 %}
    {% endif %}
    {{ sp_heat if hvac_mode == 'heat' else sp_cool }}

  set_hvac_mode:
    - action: input_select.select_option
      target:
        entity_id: input_select.fancoil_system_hvac_mode
      data:
        option: "{{ hvac_mode }}"

    # Propagazione: se il master NON è OFF e tutti i climate stanza sono OFF ? riallinea le stanze che seguono il master
    - variables:
        rooms: [{'id': 'cucina', 'climate': 'climate.controllo_temperatura_cucina', 'follow': 'input_boolean.fancoil_cucina_hvac_mode_follow_master'}, {'id': 'camera_grande', 'climate': 'climate.controllo_temperatura_camera_grande', 'follow': 'input_boolean.fancoil_camera_grande_hvac_mode_follow_master'}, {'id': 'camera', 'climate': 'climate.controllo_temperatura_camera', 'follow': 'input_boolean.fancoil_camera_hvac_mode_follow_master'}, {'id': 'corridoio', 'climate': 'climate.controllo_temperatura_corridoio', 'follow': 'input_boolean.fancoil_corridoio_hvac_mode_follow_master'}, {'id': 'bagno', 'climate': 'climate.controllo_temperatura_bagno', 'follow': 'input_boolean.fancoil_bagno_hvac_mode_follow_master'}, {'id': 'sala', 'climate': 'climate.controllo_temperatura_sala', 'follow': 'input_boolean.fancoil_sala_hvac_mode_follow_master'}]
        climates: ['climate.controllo_temperatura_cucina', 'climate.controllo_temperatura_camera_grande', 'climate.controllo_temperatura_camera', 'climate.controllo_temperatura_corridoio', 'climate.controllo_temperatura_bagno', 'climate.controllo_temperatura_sala']
        all_rooms_off: "{{ climates | map('states') | select('!=', 'off') | list | length == 0 }}"

    - if:
        - condition: template
          value_template: "{{ hvac_mode != 'off' and all_rooms_off }}"
      then:
        - repeat:
            for_each: "{{ rooms }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ is_state(repeat.item.follow, 'on') }}"
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ repeat.item.climate }}"
                    data:
                      hvac_mode: "{{ hvac_mode }}"

  set_temperature:
    - choose:
        - conditions: "{{ is_state('input_select.fancoil_system_hvac_mode','heat') }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.master_setpoint_heat
              data:
                value: "{{ temperature }}"
      default:
        - action: input_number.set_value
          target:
            entity_id: input_number.master_setpoint_cool
          data:
            value: "{{ temperature }}"

    # Propagazione: se la modalita' corrente del master NON e' OFF e tutti i climate stanza sono OFF -> riallinea le stanze che seguono il master
    - variables:
        mode_now: "{{ states('input_select.fancoil_system_hvac_mode') }}"
        rooms: [{'id': 'cucina', 'climate': 'climate.controllo_temperatura_cucina', 'follow': 'input_boolean.fancoil_cucina_hvac_mode_follow_master'}, {'id': 'camera_grande', 'climate': 'climate.controllo_temperatura_camera_grande', 'follow': 'input_boolean.fancoil_camera_grande_hvac_mode_follow_master'}, {'id': 'camera', 'climate': 'climate.controllo_temperatura_camera', 'follow': 'input_boolean.fancoil_camera_hvac_mode_follow_master'}, {'id': 'corridoio', 'climate': 'climate.controllo_temperatura_corridoio', 'follow': 'input_boolean.fancoil_corridoio_hvac_mode_follow_master'}, {'id': 'bagno', 'climate': 'climate.controllo_temperatura_bagno', 'follow': 'input_boolean.fancoil_bagno_hvac_mode_follow_master'}, {'id': 'sala', 'climate': 'climate.controllo_temperatura_sala', 'follow': 'input_boolean.fancoil_sala_hvac_mode_follow_master'}]
        climates: ['climate.controllo_temperatura_cucina', 'climate.controllo_temperatura_camera_grande', 'climate.controllo_temperatura_camera', 'climate.controllo_temperatura_corridoio', 'climate.controllo_temperatura_bagno', 'climate.controllo_temperatura_sala']
        all_rooms_off: "{{ climates | map('states') | select('!=', 'off') | list | length == 0 }}"

    - if:
        - condition: template
          value_template: "{{ mode_now != 'off' and all_rooms_off }}"
      then:
        - repeat:
            for_each: "{{ rooms }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ is_state(repeat.item.follow, 'on') }}"
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ repeat.item.climate }}"
                    data:
                      hvac_mode: "{{ mode_now }}"
