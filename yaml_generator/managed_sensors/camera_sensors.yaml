        {% set hvac_strength = 0.85 if hvac_strength_raw > 0.85 else hvac_strength_raw %}
        {% if hvac_on and setpoint is not none and hvac_mode == 'cool' and temp_window > setpoint %}
          {% set temp_pred = temp_window - ((temp_window - setpoint) * hvac_strength) %}
        {% elif hvac_on and setpoint is not none and hvac_mode == 'heat' and temp_window < setpoint %}
          {% set temp_pred = temp_window + ((setpoint - temp_window) * hvac_strength) %}
        {% elif hvac_on and setpoint is not none and hvac_mode == 'dry' and temp_window > setpoint %}
          {% set temp_pred = temp_window - ((temp_window - setpoint) * (hvac_strength * 0.65)) %}
        {% else %}
          {% set temp_pred = temp_window %}
        {% endif %}
        Se apri la finestra, tra circa {{ horizon | round(0) }} minuti l'umidita passera da {{ rh | round(0) }}% a {{ rh_pred | round(0) }}% e la temperatura da {{ temp | round(1) }}°C a {{ temp_pred | round(1) }}°C. Oltre questo tempo il ricambio dovrebbe essere vicino alla stabilizzazione.
      {% endif %}
