- name: "Consumo appartamento template"
  unique_id: consumo_appartamento_template
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >
    {% set p = states('sensor.wifi_dual_meter_b_new_a_old_power_a') %}
    {{ (p | float(0)) | round(2) if p not in ['unavailable', 'unknown', 'none'] else 0 }}
- name: Potenza prelevata attuale
  unique_id: potenza_prelevata_attuale
  device_class: power
  unit_of_measurement: W
  state_class: measurement
  state: >
    {# Priorità 1: Smart Meter (Più reattivo) - Positivo = Import #}
    {% set smart_meter = states('sensor.smart_meter_ts_100a_1_real_power') %}
    {% if smart_meter not in ['unavailable', 'unknown', 'none'] %}
      {% set val = smart_meter | float(0) %}
      {% set unit = state_attr('sensor.smart_meter_ts_100a_1_real_power', 'unit_of_measurement') %}
      {% set val_w = (val * 1000 if unit == 'kW' else val) %}
      {{ (val_w if val_w > 0 else 0) | round(2) }}
    {% else %}
      {# Fallback: Alfa New #}
      {% set alfa = states('sensor.alfa_new_power_imported') %}
      {% if alfa not in ['unavailable', 'unknown', 'none'] %}
        {% set val = alfa | float(0) %}
        {% set unit = state_attr('sensor.alfa_new_power_imported', 'unit_of_measurement') %}
        {{ (val * 1000 if unit == 'kW' else val) | round(2) }}
      {% else %}
        0
      {% endif %}
    {% endif %}

- name: Potenza esportata attuale
  unique_id: potenza_esportata_attuale
  device_class: power
  unit_of_measurement: W
  state_class: measurement
  state: >
    {# Priorità 1: Smart Meter (Più reattivo) - Negativo = Export #}
    {% set smart_meter = states('sensor.smart_meter_ts_100a_1_real_power') %}
    {% if smart_meter not in ['unavailable', 'unknown', 'none'] %}
      {% set val = smart_meter | float(0) %}
      {% set unit = state_attr('sensor.smart_meter_ts_100a_1_real_power', 'unit_of_measurement') %}
      {% set val_w = (val * 1000 if unit == 'kW' else val) %}
      {{ (val_w | abs if val_w < 0 else 0) | round(2) }}
    {% else %}
      {# Fallback: Alfa New #}
      {% set alfa = states('sensor.alfa_new_power_exported') %}
      {% if alfa not in ['unavailable', 'unknown', 'none'] %}
        {% set val = alfa | float(0) %}
        {% set unit = state_attr('sensor.alfa_new_power_exported', 'unit_of_measurement') %}
        {{ (val * 1000 if unit == 'kW' else val) | round(2) }}
      {% else %}
        0
      {% endif %}
    {% endif %}

- name: Potenza consumata attuale
  unique_id: potenza_consumata_attuale
  state_class: measurement
  state: >
    {# Priorità 1: Smart Meter (Più reattivo) - Positivo = Consumo #}
    {% set smart_meter = states('sensor.smart_meter_ts_100a_1_real_power') %}
    {% if smart_meter not in ['unavailable', 'unknown', 'none'] %}
      {% set val = smart_meter | float(0) %}
      {% set unit = state_attr('sensor.smart_meter_ts_100a_1_real_power', 'unit_of_measurement') %}
      {% set val_w = (val * 1000 if unit == 'kW' else val) %}
      {{ (val_w if val_w > 0 else 0) | round(2) }}
    {% else %}
      {# Fallback: Alfa New #}
      {% set alfa = states('sensor.alfa_new_power_consumed') %}
      {% if alfa not in ['unavailable', 'unknown', 'none'] %}
        {% set val = alfa | float(0) %}
        {% set unit = state_attr('sensor.alfa_new_power_consumed', 'unit_of_measurement') %}
        {{ (val * 1000 if unit == 'kW' else val) | round(2) }}
      {% else %}
        0
      {% endif %}
    {% endif %}
  unit_of_measurement: W
  device_class: power

- name: "Consumo impianto nuovo"
  unique_id: consumo_impianto_nuovo
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >
    {# Priorità 1: Misuratore Totale Impianto Nuovo (Canale B del Dual Meter) #}
    {% set p_tot = states('sensor.wifi_dual_meter_b_new_a_old_power_b') %}
    {% if p_tot not in ['unavailable', 'unknown', 'none'] %}
      {{ (p_tot | float(0)) | round(2) }}
    {% else %}
      {# Fallback: Somma dei carichi noti #}
      {% set pdc = states('sensor.smart_meter_2026_a_pdc_power_a') | float(0) %}
      {% set lava = states('sensor.lavastoviglie_wifi_digital_meter_lavastoviglie_potenza') | float(0) %}
      {% set indu = states('sensor.wifi_digital_meter_2_induzione_wifi_digital_meter_2_induzione_power') | float(0) %}
      {% set knx = states('sensor.smart_meter_2026_a_pdc_power_b') | float(0) %}
      {{ (pdc + lava + indu + knx) | round(2) }}
    {% endif %}


- name: "Produzione Solare"
  unique_id: produzione_solare_combined
  state: >-
    {# Priorità 1: Envoy #}
    {% if states('sensor.envoy_122134037538_current_power_production') not in ['unavailable', 'unknown', 'none'] %}
      {% set value = states('sensor.envoy_122134037538_current_power_production') | float(0) %}
      {% if 'kW' in state_attr('sensor.envoy_122134037538_current_power_production', 'unit_of_measurement') | string %}
        {{ (value * 1000) | round(1) }}
      {% else %}
        {{ value }}
      {% endif %}
    {# Priorità 2: Alfa New #}
    {% elif states('sensor.alfa_new_power_produced') not in ['unavailable', 'unknown', 'none'] %}
      {% set value = states('sensor.alfa_new_power_produced') | float(0) %}
      {% if 'kW' in state_attr('sensor.alfa_new_power_produced', 'unit_of_measurement') | string %}
        {{ (value * 1000) | round(1) }}
      {% else %}
        {{ value }}
      {% endif %}
    {% else %}
      {{ 0 }}
    {% endif %}
  unit_of_measurement: "W"
  device_class: power
  state_class: measurement
  availability: >-
    {{ states('sensor.alfa_new_power_produced') not in ['unavailable', 'unknown', 'none']
        or states('sensor.envoy_122134037538_current_power_production') not in ['unavailable', 'unknown', 'none'] }}
- name: Minutes Remaining
  unique_id: minutes_remaining_sensor
  state: >
    {% set start_time_raw = state_attr('automation.blocca_ricarica_temporaneamente', 'last_triggered') %}
    {% set start_time = as_datetime(start_time_raw) if start_time_raw else None %}
    {% if start_time and is_state('automation.regola_carica_colonnina', 'off') %}
      {{ ([0, (states('input_number.MinutiColonnina_input') | int - ((now() - start_time).total_seconds() / 60))] | max) | round }}
    {% else %}
      0
    {% endif %}
  unit_of_measurement: "min"
- name: "sonoff state"
  unique_id: "cover_sonoff_state"
  state: "{{ states('cover.sonoff_10024024c4') }}"
- name: "sonoff current position"
  unique_id: "cover_sonoff_current_position"
  state: "{{ state_attr('cover.sonoff_10024024c4', 'current_position') }}"
- name: "Prism Potenza kW"
  unique_id: "prism_potenza_kw"
  state_class: "measurement"
  device_class: "power"
  unit_of_measurement: "kW"
  state: >
    {% set p = states('sensor.prism_potenza') | float(0) %}
    {% set unit = state_attr('sensor.prism_potenza', 'unit_of_measurement') %}
    {{ (p / 1000 if unit == 'W' else p) | round(3) }}
- name: "Consumo totale casa"
  unique_id: "consumo_totale_casa"
  state_class: "measurement"
  device_class: "power"
  unit_of_measurement: "kW"
  state: >
    {# Uso del sensore nativo Alfa_new (Carico totale misurato dal contatore) converted in kW #}
    {% set p = states('sensor.alfa_new_power_consumed') %}
    {{ (p | float(0)) | round(3) if p not in ['unavailable', 'unknown', 'none'] else 0 }}
- name: "Consumo stox scale (template)"
  unique_id: consumo_stox_scale
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >
    {% set misuratore_energia_dual_consumo_impianto_nuovo = state_attr('switch.misuratore_energia_dual_consumo_impianto_nuovo', 'current_consumption') | float(0) %}
    {{ misuratore_energia_dual_consumo_impianto_nuovo }}

