# --- Bilancio energetico rapido (dashboard Panoramica) -------------------------
# Modello chiuso: fonti = produzione FV + prelievo rete + scarica batteria
#                  usi   = carichi misurati + carica batteria + esportazione rete
# Priorita' TS100A (Smart Meter, rapido) con fallback Alfa/Sinapsi: gia' gestito
# nei template potenza_prelevata_attuale / potenza_esportata_attuale.
# "Carichi non misurati" = quota non coperta dai sotto-misuratori: e' il nodo che
# chiude il bilancio (non una seconda FV). Residuo interno del ramo B = quota
# fissa di B non dettagliata dai suoi figli.
# Batteria: canali derivati (charge/discharge) con ripiego sul canale con segno
# (negativo = carica); uno stato non numerico non viene mai trattato come 0.
#
# NOTA coercizione: in Jinja gli stati HA sono STRINGHE, quindi il test
# "is number" e' sempre falso. Si controlla esplicitamente la validita' dello
# stato e si usa | float(0): unavailable/unknown valgono 0 (e non entrano nei
# calcoli), mai un valore inventato.
- name: "Potenza scarica batteria"
  unique_id: potenza_scarica_batteria
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set dis = states('sensor.solarnet_power_battery_discharge') %}
    {% set batt = states('sensor.solarnet_power_battery') %}
    {% if dis not in ['unavailable', 'unknown', 'none', ''] %}
      {{ ([dis | float(0), 0] | max) | round(2) }}
    {% elif batt not in ['unavailable', 'unknown', 'none', ''] %}
      {{ ([batt | float(0), 0] | max) | round(2) }}
    {% else %}
      0
    {% endif %}

- name: "Potenza carica batteria"
  unique_id: potenza_carica_batteria
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set car = states('sensor.solarnet_power_battery_charge') %}
    {% set batt = states('sensor.solarnet_power_battery') %}
    {% if car not in ['unavailable', 'unknown', 'none', ''] %}
      {{ ([car | float(0), 0] | max) | round(2) }}
    {% elif batt not in ['unavailable', 'unknown', 'none', ''] %}
      {{ ([-(batt | float(0)), 0] | max) | round(2) }}
    {% else %}
      0
    {% endif %}

- name: "Potenza totale entrante"
  unique_id: potenza_totale_entrante
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set prod = states('sensor.produzione_solare') %}
    {% set imp = states('sensor.potenza_prelevata_attuale') %}
    {% set dis = states('sensor.potenza_scarica_batteria') %}
    {% set p_prod = (prod | float(0)) if prod not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_imp = (imp | float(0)) if imp not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_dis = (dis | float(0)) if dis not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {{ ([p_prod, 0] | max + p_imp + [p_dis, 0] | max) | round(2) }}

- name: "Potenza carichi non misurati"
  unique_id: potenza_carichi_non_misurati
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set tot = states('sensor.potenza_totale_entrante') %}
    {% set casa = states('sensor.consumo_casa_rapido') %}
    {% set esporta = states('sensor.potenza_esportata_attuale') %}
    {% set carica = states('sensor.potenza_carica_batteria') %}
    {% set p_tot = (tot | float(0)) if tot not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_casa = (casa | float(0)) if casa not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_exp = (esporta | float(0)) if esporta not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_car = (carica | float(0)) if carica not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {{ ([p_tot - p_casa - p_car - p_exp, 0] | max) | round(2) }}

- name: "Consumo casa rapido"
  unique_id: consumo_casa_rapido
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set vecchio = states('sensor.consumo_appartamento_template') %}
    {% set nuovo = states('sensor.consumo_impianto_nuovo') %}
    {% set colonnina = states('sensor.prism_potenza') %}
    {% set p_vecchio = (vecchio | float(0)) if vecchio not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_nuovo = (nuovo | float(0)) if nuovo not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_colonnina = (colonnina | float(0)) if colonnina not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {{ (p_vecchio + p_nuovo + p_colonnina) | round(2) }}

# Residuo interno del canale B (dual meter "impianto nuovo"): B e' un TOTALE,
# i suoi figli (PDC-A, KNX-B, Lavastoviglie, Induzione) sono il dettaglio.
# B - (PDC-A + KNX-B + Lavastoviglie + Induzione) = +20.1 W (MAD 1.5 su 26h):
# residuo stabile che chiude il ramo senza doppio conteggio.
- name: "Potenza residua impianto nuovo"
  unique_id: potenza_residua_impianto_nuovo
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set nuovo = states('sensor.consumo_impianto_nuovo') %}
    {% set pdc = states('sensor.smart_meter_2026_a_pdc_power_a') %}
    {% set knx = states('sensor.smart_meter_2026_a_pdc_power_b') %}
    {% set lava = states('sensor.lavastoviglie_wifi_digital_meter_lavastoviglie_potenza') %}
    {% set indu = states('sensor.wifi_digital_meter_2_induzione_wifi_digital_meter_2_induzione_power') %}
    {% set p_nuovo = (nuovo | float(0)) if nuovo not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_pdc = (pdc | float(0)) if pdc not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_knx = (knx | float(0)) if knx not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_lava = (lava | float(0)) if lava not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_indu = (indu | float(0)) if indu not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {{ ([p_nuovo - p_pdc - p_knx - p_lava - p_indu, 0] | max) | round(2) }}

# --- Chiusura del bilancio per la card Sankey ---------------------------------
# Il nodo centrale "Totale" deve valere uguale sia alla somma delle fonti
# (Solare + Rete import + Batteria scarica) sia alla somma degli usi
# (Consumo casa + Batteria carica + Rete export). I due lati NON coincidono
# mai perfettamente a causa dello skew temporale fra contatori (TS100A 60-120 s)
# e sotto-misuratori (10 s): la differenza viene resa esplicita.
#
#   F = fonti = sensor.potenza_totale_entrante
#   U = usi   = consumo_casa_rapido + potenza_carica_batteria + potenza_esportata_attuale
#   TOTALE   = max(F, U)          -> nodo centrale, uguale a entrambe le somme
#   Differenza contatori = max(0, U - F)   (flusso in ingresso, lato fonti)
#   Carichi non misurati  = max(0, F - U)   (flusso in uscita, lato usi)
#
# Nota coercizione: in Jinja gli stati HA sono STRINGHE, quindi "is number" e'
# sempre falso. Si controlla esplicitamente la validita' dello stato e si usa
# | float(0): unavailable/unknown valgono 0 (e non entrano nei calcoli).
- name: "Potenza totale bilancio"
  unique_id: potenza_totale_bilancio
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set f = states('sensor.potenza_totale_entrante') %}
    {% set casa = states('sensor.consumo_casa_rapido') %}
    {% set car = states('sensor.potenza_carica_batteria') %}
    {% set esp = states('sensor.potenza_esportata_attuale') %}
    {% set p_f = (f | float(0)) if f not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_casa = (casa | float(0)) if casa not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_car = (car | float(0)) if car not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_esp = (esp | float(0)) if esp not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set u = p_casa + p_car + p_esp %}
    {{ ([p_f, u] | max) | round(2) }}

- name: "Potenza differenza contatori"
  unique_id: potenza_differenza_contatori
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set f = states('sensor.potenza_totale_entrante') %}
    {% set casa = states('sensor.consumo_casa_rapido') %}
    {% set car = states('sensor.potenza_carica_batteria') %}
    {% set esp = states('sensor.potenza_esportata_attuale') %}
    {% set p_f = (f | float(0)) if f not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_casa = (casa | float(0)) if casa not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_car = (car | float(0)) if car not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_esp = (esp | float(0)) if esp not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {{ ([p_casa + p_car + p_esp - p_f, 0] | max) | round(2) }}

# "Consumo casa reale" = tutto quello che la casa assorbe davvero:
# fonti (produzione + prelievo + scarica batteria) - usi che non sono casa
# (esportazione + carica batteria). E' il valore che la Power Flow Card
# mostra al centro del cerchio Home, cosi' coincide con l'anello di flussi
# calcolato dalla card (fonti - export - carica) e con il nodo "Consumo casa"
# del Sankey piu' il nodo "Carichi non misurati".
- name: "Potenza consumo casa reale"
  unique_id: potenza_consumo_casa_reale
  device_class: power
  state_class: measurement
  unit_of_measurement: "W"
  state: >-
    {% set f = states('sensor.potenza_totale_entrante') %}
    {% set car = states('sensor.potenza_carica_batteria') %}
    {% set esp = states('sensor.potenza_esportata_attuale') %}
    {% set p_f = (f | float(0)) if f not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_car = (car | float(0)) if car not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {% set p_esp = (esp | float(0)) if esp not in ['unavailable', 'unknown', 'none', ''] else 0 %}
    {{ ([p_f - p_car - p_esp, 0] | max) | round(2) }}
