# ---------------------------------------------------------------------------
# Sensore: Umidità Assoluta Esterna (omega_esterno)
# Calcola l'umidità specifica esterna in g/kg da temperatura e umidità esterne.
# Espone attributi temperatura e umidità per uso downstream (previsioni, dashboard).
# ---------------------------------------------------------------------------
- name: "Omega Esterno"
  unique_id: omega_esterno
  unit_of_measurement: "g/kg"
  state_class: measurement
  state: >-
    {% set temp = states('sensor.meteo_castionetto_temperatura') | float(none) %}
    {% set rh = states('sensor.meteo_castionetto_umidita') | float(none) %}
    {% if temp is not none and rh is not none and temp != 0 and rh != 0 %}
      {% set e_sat = 6.112 * (2.718281828459 ** (17.67 * temp / (temp + 243.5))) %}
      {% set e = e_sat * rh / 100 %}
      {% set omega = 0.622 * e / (1013.25 - e) * 1000 %}
      {{ omega | round(2) }}
    {% else %}
      unavailable
    {% endif %}
  availability: >-
    {{ states('sensor.meteo_castionetto_temperatura') not in ['unavailable','unknown'] and
       states('sensor.meteo_castionetto_umidita') not in ['unavailable','unknown'] }}
  attributes:
    temperatura: "{{ states('sensor.meteo_castionetto_temperatura') }}"
    umidita: "{{ states('sensor.meteo_castionetto_umidita') }}"
    source: "meteo_castionetto"
    formula: "omega = 0.622 * e / (1013.25 - e) * 1000, e = 6.112 * exp(17.67*T/(T+243.5)) * RH/100"

# ---------------------------------------------------------------------------
# Sensore: Punto di Rugiada Esterno (T_dew esterno)
# Calcola il punto di rugiada esterno in °C usando la formula di Magnus semplificata.
# ---------------------------------------------------------------------------
- name: "Punto di Rugiada Esterno"
  unique_id: punto_di_rugiada_esterno
  unit_of_measurement: "°C"
  state_class: measurement
  device_class: temperature
  state: >-
    {% set temp = states('sensor.meteo_castionetto_temperatura') | float(none) %}
    {% set rh = states('sensor.meteo_castionetto_umidita') | float(none) %}
    {% if temp is not none and rh is not none and temp != 0 and rh != 0 %}
      {{ (temp - (100 - rh) / 5) | round(1) }}
    {% else %}
      unavailable
    {% endif %}
  availability: >-
    {{ states('sensor.meteo_castionetto_temperatura') not in ['unavailable','unknown'] and
       states('sensor.meteo_castionetto_umidita') not in ['unavailable','unknown'] }}
  attributes:
    temperatura: "{{ states('sensor.meteo_castionetto_temperatura') }}"
    umidita: "{{ states('sensor.meteo_castionetto_umidita') }}"
    source: "meteo_castionetto"
    formula: "T_dew = T - (100 - RH) / 5"
