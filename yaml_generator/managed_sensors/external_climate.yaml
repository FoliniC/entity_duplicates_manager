# Sensors for Climate Comfort Evaluation and Advice (External sensors)
# NOTA: i sensori PER-STANZA (Omega / T_dew / Comfort / Advice) sono generati
# automaticamente da climate_comfort_per_room.j2 -> climate_comfort_per_room.yaml.
# Qui restano solo i sensori ESTERNI (non per-stanza).

# ---------------------------------------------------------------------------
# Omega Esterno con filtro outlier
# Filtra valori impossibili da sensore_clima (T > 45°C o < 5°C, RH > 100% o < 10%)
# Se outlier, mantiene l'ultimo valore valido via self.state
# ---------------------------------------------------------------------------
- name: "Omega Esterno"
  unique_id: omega_esterno
  unit_of_measurement: "g/kg"
  state: >-
    {% set T_clima = states('sensor.sensore_clima_temp_current') | float(none) %}
    {% set RH_clima = states('sensor.sensore_clima_humidity_value') | float(none) %}
    {% set T_meteo = states('sensor.meteo_castionetto_temperatura') | float(none) %}
    {% set RH_meteo = states('sensor.meteo_castionetto_umidita') | float(none) %}

    {# Valida fonte clima_locale: range fisiologici plausibili #}
    {% set clima_valid = T_clima is not none and RH_clima is not none
                       and 5 <= T_clima <= 45 and 10 <= RH_clima <= 100 %}
    {# Valida fonte meteo_locale #}
    {% set meteo_valid = T_meteo is not none and RH_meteo is not none
                       and 5 <= T_meteo <= 45 and 10 <= RH_meteo <= 100 %}

    {# Seleziona fonte valida con priorità clima_locale se valida #}
    {% if clima_valid %}
      {% set T = T_clima %}
      {% set RH = RH_clima %}
      {% set src = 'clima_locale' %}
    {% elif meteo_valid %}
      {% set T = T_meteo %}
      {% set RH = RH_meteo %}
      {% set src = 'meteo_locale' %}
    {% else %}
      {# Nessuna fonte valida: restituisci ultimo valore noto (self.state) #}
      {{ this.state if this.state is not none and this.state != 'unavailable' else 'unavailable' }}
    {% endif %}

    {% if clima_valid or meteo_valid %}
      {% set P = states('sensor.castionetto_pressione') | float(1013.25) * 100 %}
      {% set psat = 610.78 * (2.718281828459 ** (17.27 * T / (T + 237.3))) %}
      {% set pvap = (RH / 100) * psat %}
      {{ (622 * pvap / (P - pvap)) | round(2) }}
    {% endif %}

  availability: >-
    {{ (states('sensor.sensore_clima_temp_current') | float(none) is not none
        and states('sensor.sensore_clima_humidity_value') | float(none) is not none
        and 5 <= states('sensor.sensore_clima_temp_current') | float(-999) <= 45
        and 10 <= states('sensor.sensore_clima_humidity_value') | float(-999) <= 100)
       or (states('sensor.meteo_castionetto_temperatura') | float(none) is not none
        and states('sensor.meteo_castionetto_umidita') | float(none) is not none
        and 5 <= states('sensor.meteo_castionetto_temperatura') | float(-999) <= 45
        and 10 <= states('sensor.meteo_castionetto_umidita') | float(-999) <= 100) }}

  attributes:
    source: >-
      {% set T_clima = states('sensor.sensore_clima_temp_current') | float(none) %}
      {% set RH_clima = states('sensor.sensore_clima_humidity_value') | float(none) %}
      {% set clima_valid = T_clima is not none and RH_clima is not none
                         and 5 <= T_clima <= 45 and 10 <= RH_clima <= 100 %}
      {% if clima_valid %}clima_locale{% else %}meteo_locale{% endif %}
    temperature_sensor: >-
      {% set T_clima = states('sensor.sensore_clima_temp_current') | float(none) %}
      {% set RH_clima = states('sensor.sensore_clima_humidity_value') | float(none) %}
      {% set clima_valid = T_clima is not none and RH_clima is not none
                         and 5 <= T_clima <= 45 and 10 <= RH_clima <= 100 %}
      {% if clima_valid %}sensor.sensore_clima_temp_current
      {% else %}sensor.meteo_castionetto_temperatura{% endif %}
    humidity_sensor: >-
      {% set T_clima = states('sensor.sensore_clima_temp_current') | float(none) %}
      {% set RH_clima = states('sensor.sensore_clima_humidity_value') | float(none) %}
      {% set clima_valid = T_clima is not none and RH_clima is not none
                         and 5 <= T_clima <= 45 and 10 <= RH_clima <= 100 %}
      {% if clima_valid %}sensor.sensore_clima_humidity_value
      {% else %}sensor.meteo_castionetto_umidita{% endif %}
    temperatura: >-
      {% set T_clima = states('sensor.sensore_clima_temp_current') | float(none) %}
      {% set RH_clima = states('sensor.sensore_clima_humidity_value') | float(none) %}
      {% set T_meteo = states('sensor.meteo_castionetto_temperatura') | float(none) %}
      {% set clima_valid = T_clima is not none and RH_clima is not none
                         and 5 <= T_clima <= 45 and 10 <= RH_clima <= 100 %}
      {{ T_clima | round(1) if clima_valid else T_meteo | round(1) }}
    umidita: >-
      {% set T_clima = states('sensor.sensore_clima_temp_current') | float(none) %}
      {% set RH_clima = states('sensor.sensore_clima_humidity_value') | float(none) %}
      {% set RH_meteo = states('sensor.meteo_castionetto_umidita') | float(none) %}
      {% set clima_valid = T_clima is not none and RH_clima is not none
                         and 5 <= T_clima <= 45 and 10 <= RH_clima <= 100 %}
      {{ RH_clima | round(1) if clima_valid else RH_meteo | round(1) }}

# ---------------------------------------------------------------------------
# T_dew Esterno (punto di rugiada) con stesso filtro outlier
# ---------------------------------------------------------------------------
- name: "Punto di Rugiada Esterno"
  unique_id: punto_di_rugiada_esterno
  unit_of_measurement: "°C"
  state: >-
    {% set T_clima = states('sensor.sensore_clima_temp_current') | float(none) %}
    {% set RH_clima = states('sensor.sensore_clima_humidity_value') | float(none) %}
    {% set T_meteo = states('sensor.meteo_castionetto_temperatura') | float(none) %}
    {% set RH_meteo = states('sensor.meteo_castionetto_umidita') | float(none) %}

    {% set clima_valid = T_clima is not none and RH_clima is not none
                       and 5 <= T_clima <= 45 and 10 <= RH_clima <= 100 %}
    {% set meteo_valid = T_meteo is not none and RH_meteo is not none
                       and 5 <= T_meteo <= 45 and 10 <= RH_meteo <= 100 %}

    {% if clima_valid %}
      {% set T = T_clima %}
      {% set RH = RH_clima %}
    {% elif meteo_valid %}
      {% set T = T_meteo %}
      {% set RH = RH_meteo %}
    {% else %}
      {{ this.state if this.state is not none and this.state != 'unavailable' else 'unavailable' }}
    {% endif %}

    {% if clima_valid or meteo_valid %}
      {{ (T - (100 - RH) / 5) | round(1) }}
    {% endif %}

  availability: >-
    {{ (states('sensor.sensore_clima_temp_current') | float(none) is not none
        and states('sensor.sensore_clima_humidity_value') | float(none) is not none
        and 5 <= states('sensor.sensore_clima_temp_current') | float(-999) <= 45
        and 10 <= states('sensor.sensore_clima_humidity_value') | float(-999) <= 100)
       or (states('sensor.meteo_castionetto_temperatura') | float(none) is not none
        and states('sensor.meteo_castionetto_umidita') | float(none) is not none
        and 5 <= states('sensor.meteo_castionetto_temperatura') | float(-999) <= 45
        and 10 <= states('sensor.meteo_castionetto_umidita') | float(-999) <= 100) }}
