- name: "Fancoil Camera grande Sensors Coherence Status"
  unique_id: fancoil_camera_grande_sensors_coherence_status
  state: >
    {% set t_th = states('sensor.fancoil_camera_grande_temp_delta_th_internal') | float(None) %}
    {% set h_th = states('sensor.fancoil_camera_grande_hum_delta_th_internal') | float(None) %}
