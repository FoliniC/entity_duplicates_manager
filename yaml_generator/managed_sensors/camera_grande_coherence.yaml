      {% set ns.problems = ns.problems + ['Offset T KNX (' ~ t_knx ~ '°C)'] %}
    {% endif %}
    {% if t_knx_change is not none and t_knx_change > t_change_limit %}
      {% set ns.problems = ns.problems + ['T KNX non lineare (' ~ t_knx_change ~ '°C)'] %}
    {% endif %}

    {% if ns.problems | length > 0 %}
      Problema: {{ ns.problems | join(' | ') }}
    {% elif t_th is none and h_th is none and t_knx is none %}
      Nessun confronto
    {% else %}
