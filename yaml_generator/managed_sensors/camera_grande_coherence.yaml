    {% set h_th_change = state_attr('sensor.fancoil_camera_grande_hum_delta_th_internal', 'delta_change') | float(None) %}
    {% set t_knx_change = state_attr('sensor.fancoil_camera_grande_temp_delta_knx_th', 'delta_change') | float(None) %}

    {# Soglie: offset alto = possibile taratura; delta_change alto = andamento non lineare/instabile #}
    {% set t_limit = 3.5 %}
    {% set h_limit = 20.0 %}
    {% set t_change_limit = 0.8 %}
    {% set h_change_limit = 6.0 %}

    {% set ns = namespace(problems=[]) %}

    {% if t_th is not none and t_th > t_limit %}
      {% set ns.problems = ns.problems + ['Offset T TH (' ~ t_th ~ '°C)'] %}
    {% endif %}
    {% if t_th_change is not none and t_th_change > t_change_limit %}
      {% set ns.problems = ns.problems + ['T TH non lineare (' ~ t_th_change ~ '°C)'] %}
    {% endif %}

    {% if h_th is not none and h_th > h_limit %}
      {% set ns.problems = ns.problems + ['Offset H TH (' ~ h_th ~ '%)'] %}
    {% endif %}
    {% if h_th_change is not none and h_th_change > h_change_limit %}
      {% set ns.problems = ns.problems + ['H TH non lineare (' ~ h_th_change ~ '%)'] %}
    {% endif %}

