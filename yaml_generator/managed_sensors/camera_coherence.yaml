- name: "Fancoil Camera Sensors Coherence Status"
  unique_id: fancoil_camera_sensors_coherence_status
  state: >
    {% set t_th = states('sensor.fancoil_camera_temp_delta_th_vs_internal') | float(None) %}
    {% set h_th = states('sensor.fancoil_camera_hum_delta_th_vs_internal') | float(None) %}
    {% set t_knx = states('sensor.fancoil_camera_temp_delta_knx_vs_ref') | float(None) %}

    {# Soglie di tolleranza ampie per via dei posizionamenti diversi #}
    {% set t_limit = 3.5 %}
    {% set h_limit = 20.0 %}

    {% set ns = namespace(problems=[]) %}

    {# TH vs Internal #}
    {% if t_th is not none and t_th > t_limit %}
      {% set ns.problems = ns.problems + ['Divergenza TH (' ~ t_th ~ '°C)'] %}
    {% endif %}
    {% if h_th is not none and h_th > h_limit %}
      {% set ns.problems = ns.problems + ['Umidità TH (' ~ h_th ~ '%)'] %}
    {% endif %}

    {# KNX vs Ref #}
    {% if t_knx is not none and t_knx > t_limit %}
      {% set ns.problems = ns.problems + ['Divergenza KNX (' ~ t_knx ~ '°C)'] %}
    {% endif %}

    {% if ns.problems | length > 0 %}
      Problema: {{ ns.problems | join(' | ') }}
    {% else %}
      Coerente
    {% endif %}
  attributes:
    managed_by: yaml_generator
    room: "Camera"
