# Sensors for cross-checking consistency between different sensors in the same room

- name: "Fancoil Camera Temp Delta TH Internal"
  unique_id: fancoil_camera_temp_delta_th_vs_internal
  unit_of_measurement: "°C"
  state_class: measurement
  device_class: temperature
  state: >
    {% set s1 = states('sensor.th3c_temperature') | float(0) %}
    {% set s2 = states('sensor.fancoil_camera_temperature') | float(0) %}
    {{ (s1 - s2) | abs | round(2) }}
  availability: >
    {{ is_number(states('sensor.th3c_temperature')) and is_number(states('sensor.fancoil_camera_temperature')) }}

