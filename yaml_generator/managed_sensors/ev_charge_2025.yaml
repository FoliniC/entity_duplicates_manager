# Sensori Template Rev. 40 - Fix finale Reason e Stabilità
- name: "EV Charge 2025 Solar Max Ampere"
  unique_id: ev_charge_2025_solar_max_ampere
  unit_of_measurement: "A"
  state: >
    {% set smart_meter = states('sensor.smart_meter_ts_100a_1_potenza_reale') | float(0) %}
    {% set unit_sm = state_attr('sensor.smart_meter_ts_100a_1_potenza_reale', 'unit_of_measurement') %}
    {% set grid_p_w = (smart_meter * 1000) if unit_sm == 'kW' else smart_meter %}
    
    {% set prism_p = states('sensor.prism_potenza_assorbita') | float(0) %}
    {% set soc = states('sensor.byd_battery_box_premium_hv_state_of_charge') | float(0) %}
    {% set voltage = states('sensor.folini_carlo_voltage_ac') | float(230) | round(1) %}
    {% set b_discharge = states('sensor.solarnet_power_battery_discharge') | float(0) %}
    {% set b_charge = states('sensor.solarnet_power_battery_charge') | float(0) %}
    
    {# Calcolo Surplus Solare REALE: #}
    {# (Potenza Auto - Prelievo Rete) - Scarica Batteria + Carica Batteria #}
    {# Esempio: (5000W auto - 0W rete) - 2000W scarica + 0W carica = 3000W di solo sole #}
    {% set w_surplus = (prism_p - grid_p_w) - b_discharge + b_charge %}
    
    {% set margine = 300 %}
    {% set w_battery_bonus = 0 %}
    {% if soc > 50 %}
      {# Sopra il 50% usiamo la batteria generosamente #}
      {% set bonus_val = [0, (soc - 50) * 150] | max %}
      {% set w_battery_bonus = [bonus_val, 3500] | min %}
    {% elif soc > 30 %}
      {# Tra 30% e 50% usiamo la batteria con molta cautela #}
      {% set bonus_val = [0, (soc - 30) * 50] | max %}
      {% set w_battery_bonus = [bonus_val, 1000] | min %}
    {% endif %}
    
    {% set w_totale = w_surplus + w_battery_bonus - margine %}
    {{ [0, (w_totale / voltage) | int] | max }}

- name: "EV Charge 2025 Reason"
  unique_id: ev_charge_2025_reason
  state: >
    {% set active = is_state('input_boolean.ev_charge_2025_charging_active', 'on') %}
    {% set mode = states('input_select.ev_charge_2025_mode') %}
    {% set crono = states('input_number.ev_charge_2025_cronostar_power_target') | float(0) %}
    {% set cur_soc = states('sensor.ev_charge_2025_current_soc') | float(0) %}
    {% set limit_soc = states('input_number.ev_charge_2025_vehicle_limit_soc') | float(100) %}
    
    {% if not active %}
      Inattivo (OFF)
    {% elif cur_soc >= limit_soc %}
      Carica Completa
    {% elif mode == 'Manuale' %}
      Manuale
    {% elif crono >= 7.9 %}
      Solar Full
    {% elif crono <= 0.1 %}
      Sospeso (Zero Surplus)
    {% else %}
      Modulazione Auto
    {% endif %}

- name: "EV Charge 2025 Current SOC"
  unique_id: ev_charge_2025_current_soc
  unit_of_measurement: "%"
  device_class: battery
  state: >
    {% set mg_soc = states('sensor.piazzale_mg_mg4_electric_state_of_charge') %}
    {% set veh_soc = states('sensor.selected_vehicle_soc') %}
    {% if is_number(mg_soc) and mg_soc | float > 0 %}
      {{ mg_soc | float | round(1) }}
    {% elif is_number(veh_soc) and veh_soc | float >= 0 %}
      {{ veh_soc | float | round(1) }}
    {% elif is_number(mg_soc) and mg_soc | float >= 0 %}
      {{ mg_soc | float | round(1) }}
    {% else %}
      {{ None }}
    {% endif %}
  availability: >
    {% set mg_soc = states('sensor.piazzale_mg_mg4_electric_state_of_charge') %}
    {% set veh_soc = states('sensor.selected_vehicle_soc') %}
    {{ (is_number(mg_soc) and mg_soc | float >= 0) or (is_number(veh_soc) and veh_soc | float >= 0) }}


- name: "EV Charge 2025 Remaining Time"
  unique_id: ev_charge_2025_remaining_time
  unit_of_measurement: "min"
  state: >
    {% set end_time = states('input_datetime.ev_charge_2025_end_time') %}
    {% set active = is_state('input_boolean.ev_charge_2025_charging_active', 'on') %}
    {% if active and end_time not in ['unavailable', 'unknown'] %}
      {% set t_now = as_timestamp(now()) %}
      {% set t_end = as_timestamp(today_at(end_time)) %}
      {% if t_end < t_now %}
        {% set t_end = t_end + 86400 %}
      {% endif %}
      {{ [0, ((t_end - t_now) / 60) | int] | max }}
    {% else %}
      0
    {% endif %}

- name: "EV Charge 2025 Power From Solar"
  unique_id: ev_charge_2025_power_from_solar
  unit_of_measurement: "W"
  state: >
    {% set prism = states('sensor.prism_potenza_assorbita') | float(0) %}
    {% set smart_meter = states('sensor.smart_meter_ts_100a_1_potenza_reale') | float(0) %}
    {% set battery = states('sensor.solarnet_power_battery') | float(0) %}
    {% set solar_avail = [0, prism - smart_meter - (battery if battery > 0 else 0)] | max %}
    {{ [prism, solar_avail] | min | round(0) }}

- name: "EV Charge 2025 Power From Battery"
  unique_id: ev_charge_2025_power_from_battery
  unit_of_measurement: "W"
  state: >
    {% set prism = states('sensor.prism_potenza_assorbita') | float(0) %}
    {% set solar_used = states('sensor.ev_charge_2025_power_from_solar') | float(0) %}
    {% set battery = states('sensor.solarnet_power_battery') | float(0) %}
    {% set battery_used = [0, battery] | max %}
    {{ [prism - solar_used, battery_used] | min | round(0) }}

- name: "EV Charge 2025 Power From Grid"
  unique_id: ev_charge_2025_power_from_grid
  unit_of_measurement: "W"
  state: >
    {% set prism = states('sensor.prism_potenza_assorbita') | float(0) %}
    {% set solar_used = states('sensor.ev_charge_2025_power_from_solar') | float(0) %}
    {% set battery_used = states('sensor.ev_charge_2025_power_from_battery') | float(0) %}
    {{ [0, prism - solar_used - battery_used] | max | round(0) }}
- name: "Potenza immessa in rete"
  unique_id: potenza_immessa_in_rete
  unit_of_measurement: W
  state_class: measurement
  device_class: power
  state: "{{ states('sensor.potenza_esportata_attuale') | float(0) }}"