# FASE 6 - Consiglio apertura/chiusura finestre per stanza
# Suggerisce l'azione migliore per ottimizzare l'umidità interna
# basandosi sulla differenza di umidità specifica (delta omega), trend interno e stato finestra.

- name: "Consiglio Finestra Camera"
  unique_id: consiglio_finestra_camera
  state: >
    {% set t_int = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
    {% set rh_int = states('sensor.umidita_camera_pilota') | float(none) %}
    {% set omega_int = states('sensor.omega_camera') | float(none) %}
    {% set omega_ext = states('sensor.omega_esterno') | float(none) %}
    {% set trend = states('sensor.trend_umidita_camera') %}
    {% set finestra_aperta = is_state('input_boolean.finestra_camera_aperta', 'on') %}
    {% set piove = states('sensor.castionetto_precipitazione') | float(0) > 0.0 %}

    {% if t_int is none or rh_int is none or omega_int is none or omega_ext is none or trend in ['unknown', 'unavailable', 'incerto'] %}
      incerto
    {% else %}
      {% set delta_omega = omega_int - omega_ext %}
      {% if finestra_aperta %}
        {# Finestra aperta #}
        {% if piove %}
          chiudi
        {% elif delta_omega < 0.2 %}
          chiudi
        {% elif trend == 'in_salita' and delta_omega < 0.5 %}
          chiudi
        {% elif trend == 'in_calata' or delta_omega >= 1.0 %}
          mantieni_aperta
        {% else %}
          nessuna_azione
        {% endif %}
      {% else %}
        {# Finestra chiusa #}
        {% if piove %}
          mantieni_chiusa
        {% elif delta_omega >= 1.0 and rh_int > 55.0 %}
          apri
        {% elif delta_omega < 0.2 %}
          mantieni_chiusa
        {% else %}
          nessuna_azione
        {% endif %}
      {% endif %}
    {% endif %}
  icon: >
    {% set t_int = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
    {% set rh_int = states('sensor.umidita_camera_pilota') | float(none) %}
    {% set omega_int = states('sensor.omega_camera') | float(none) %}
    {% set omega_ext = states('sensor.omega_esterno') | float(none) %}
    {% set trend = states('sensor.trend_umidita_camera') %}
    {% set finestra_aperta = is_state('input_boolean.finestra_camera_aperta', 'on') %}
    {% set piove = states('sensor.castionetto_precipitazione') | float(0) > 0.0 %}

    {% if t_int is none or rh_int is none or omega_int is none or omega_ext is none or trend in ['unknown', 'unavailable', 'incerto'] %}
      mdi:help-circle-outline
    {% else %}
      {% set delta_omega = omega_int - omega_ext %}
      {% if finestra_aperta %}
        {% if piove or delta_omega < 0.2 or (trend == 'in_salita' and delta_omega < 0.5) %}
          mdi:window-closed-variant
        {% else %}
          mdi:window-open
        {% endif %}
      {% else %}
        {% if not piove and delta_omega >= 1.0 and rh_int > 55.0 %}
          mdi:window-open-variant
        {% else %}
          mdi:window-closed
        {% endif %}
      {% endif %}
    {% endif %}
  attributes:
    delta_omega: >
      {% set omega_int = states('sensor.omega_camera') | float(none) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(none) %}
      {% if omega_int is not none and omega_ext is not none %}
        {{ (omega_int - omega_ext) | round(2) }}
      {% else %}
        none
      {% endif %}
    trend_umidita: "{{ states('sensor.trend_umidita_camera') }}"
    finestra_aperta: "{{ is_state('input_boolean.finestra_camera_aperta', 'on') }}"
    confidenza: >
      {% set t_int = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
      {% set rh_int = states('sensor.umidita_camera_pilota') | float(none) %}
      {% set omega_int = states('sensor.omega_camera') | float(none) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(none) %}
      {% set trend = states('sensor.trend_umidita_camera') %}
      {% if t_int is none or rh_int is none or omega_int is none or omega_ext is none or trend in ['unknown', 'unavailable', 'incerto'] %}
        0
      {% else %}
        {% set fancoil_attivo = is_state('switch.fancoil_camera_switch_4', 'on') %}
        {% set base_conf = 100 %}
        {# Riduci confidenza se c'è conflitto fancoil + finestra aperta #}
        {% if fancoil_attivo and is_state('input_boolean.finestra_camera_aperta', 'on') %}
          {% set base_conf = base_conf - 30 %}
        {% endif %}
        {# Riduci confidenza se i dati sono al limite #}
        {% set delta_omega = omega_int - omega_ext %}
        {% if delta_omega | abs < 0.2 %}
          {% set base_conf = base_conf - 10 %}
        {% endif %}
        {{ base_conf }}
      {% endif %}
    motivo: >
      {% set t_int = states('sensor.temperatura_camera_reale_calcolata') | float(none) %}
      {% set rh_int = states('sensor.umidita_camera_pilota') | float(none) %}
      {% set omega_int = states('sensor.omega_camera') | float(none) %}
      {% set omega_ext = states('sensor.omega_esterno') | float(none) %}
      {% set trend = states('sensor.trend_umidita_camera') %}
      {% set finestra_aperta = is_state('input_boolean.finestra_camera_aperta', 'on') %}
      {% set piove = states('sensor.castionetto_precipitazione') | float(0) > 0.0 %}
      {% set fancoil_attivo = is_state('switch.fancoil_camera_switch_4', 'on') %}

      {% if t_int is none or rh_int is none or omega_int is none or omega_ext is none or trend in ['unknown', 'unavailable'] %}
        Dati sensori non completi o non disponibili.
      {% else %}
        {% set delta_omega = omega_int - omega_ext %}
        {% set ns = namespace(motivi=[]) %}

        {% if piove %}
          {% set ns.motivi = ns.motivi + ['Rilevata pioggia all\'esterno. Chiudere la finestra per evitare infiltrazioni.'] %}
        {% endif %}

        {% if finestra_aperta %}
          {% if not piove %}
            {% if delta_omega < 0.2 %}
              {% set ns.motivi = ns.motivi + ['L\'aria esterna è più umida o uguale a quella interna (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Si consiglia di chiudere.'] %}
            {% elif trend == 'in_salita' and delta_omega < 0.5 %}
              {% set ns.motivi = ns.motivi + ['L\'umidità interna sta aumentando (trend in salita) nonostante la finestra aperta. Si consiglia di chiudere.'] %}
            {% elif trend == 'in_calata' %}
              {% set ns.motivi = ns.motivi + ['L\'umidità interna è in calo (trend in calata). Mantenere la finestra aperta.'] %}
            {% elif delta_omega >= 1.0 %}
              {% set ns.motivi = ns.motivi + ['L\'aria esterna è significativamente più secca (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Mantenere la finestra aperta.'] %}
            {% else %}
              {% set ns.motivi = ns.motivi + ['Umidità interna stabile. Nessuna azione necessaria.'] %}
            {% endif %}
          {% endif %}
        {% else %}
          {% if not piove %}
            {% if delta_omega >= 1.0 and rh_int > 55.0 %}
              {% set ns.motivi = ns.motivi + ['Umidità interna elevata (' ~ rh_int | round(1) ~ '%) e aria esterna secca (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Si consiglia di aprire la finestra.'] %}
            {% elif delta_omega < 0.2 %}
              {% set ns.motivi = ns.motivi + ['L\'aria esterna è più umida o uguale (delta: ' ~ delta_omega | round(2) ~ ' g/kg). Mantenere la finestra chiusa.'] %}
            {% else %}
              {% set ns.motivi = ns.motivi + ['Nessuna azione necessaria. Condizioni di umidità accettabili.'] %}
            {% endif %}
          {% endif %}
        {% endif %}

        {% if fancoil_attivo and finestra_aperta %}
          {% set ns.motivi = ns.motivi + ['ATTENZIONE: Conflitto energetico! Il fancoil è attivo mentre la finestra è aperta.'] %}
        {% endif %}

        {{ ns.motivi | join(' ') }}
      {% endif %}
