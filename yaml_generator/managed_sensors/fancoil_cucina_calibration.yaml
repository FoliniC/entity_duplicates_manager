# Generated by: yaml_generator
# Template: fancoil_cucina_calibration.yaml
# Mijia Calibration Statistics for Cucina Fancoil Sensors
# Computes rolling average offsets between Mijia reference and Fancoil internal sensors

# ---------------------------------------------------------------------------
# Template Sensors: Instantaneous Offsets (Mijia - Fancoil)
# ---------------------------------------------------------------------------
- platform: template
  sensors:
    fancoil_cucina_cal_temp_offset_instant:
      friendly_name: "Cucina Calibrazione Temp Offset (Instantaneo)"
      unique_id: fancoil_cucina_cal_temp_offset_instant
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer-check
      state: >-
        {% set mijia = states('sensor.temperature_humidity_sensor_3116_temperature') | float(none) %}
        {% set fancoil = states('sensor.fancoil_cucina_temperature') | float(none) %}
        {% if mijia is not none and fancoil is not none %}
          {{ (mijia - fancoil) | round(2) }}
        {% else %}
          unknown
        {% endif %}
      availability: >-
        {{ states('sensor.temperature_humidity_sensor_3116_temperature') not in ['unavailable', 'unknown', 'none', ''] and
           states('sensor.fancoil_cucina_temperature') not in ['unavailable', 'unknown', 'none', ''] }}

    fancoil_cucina_cal_hum_offset_instant:
      friendly_name: "Cucina Calibrazione Umidità Offset (Instantaneo)"
      unique_id: fancoil_cucina_cal_hum_offset_instant
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      icon: mdi:water-percent
      state: >-
        {% set mijia = states('sensor.temperature_humidity_sensor_3116_humidity') | float(none) %}
        {% set fancoil = states('sensor.fancoil_cucina_humidity') | float(none) %}
        {% if mijia is not none and fancoil is not none %}
          {{ (mijia - fancoil) | round(1) }}
        {% else %}
          unknown
        {% endif %}
      availability: >-
        {{ states('sensor.temperature_humidity_sensor_3116_humidity') not in ['unavailable', 'unknown', 'none', ''] and
           states('sensor.fancoil_cucina_humidity') not in ['unavailable', 'unknown', 'none', ''] }}

    # ---------------------------------------------------------------------------
    # Summary Sensor - Current Calibration Status
    # ---------------------------------------------------------------------------
    fancoil_cucina_calibration_summary:
      friendly_name: "Cucina Calibrazione Riepilogo"
      unique_id: fancoil_cucina_calibration_summary
      icon: mdi:clipboard-check
      state: >-
        {% set temp_off = states('sensor.fancoil_cucina_cal_temp_offset_24h') | float(none) %}
        {% set hum_off = states('sensor.fancoil_cucina_cal_hum_offset_24h') | float(none) %}
        {% if temp_off is not none and hum_off is not none %}
          OK
        {% else %}
          RACCOLTA_DATI
        {% endif %}
      attributes:
        temp_offset_24h: "{{ states('sensor.fancoil_cucina_cal_temp_offset_24h') }}"
        hum_offset_24h: "{{ states('sensor.fancoil_cucina_cal_hum_offset_24h') }}"
        temp_count_24h: "{{ states('sensor.statistics_fancoil_cucina_cal_temp_count_24h') }}"
        hum_count_24h: "{{ states('sensor.statistics_fancoil_cucina_cal_hum_count_24h') }}"
        temp_change_24h: "{{ states('sensor.statistics_fancoil_cucina_cal_temp_change_24h') }}"
        hum_change_24h: "{{ states('sensor.statistics_fancoil_cucina_cal_hum_change_24h') }}"
        temp_offset_7d: "{{ states('sensor.fancoil_cucina_cal_temp_offset_7d') }}"
        hum_offset_7d: "{{ states('sensor.fancoil_cucina_cal_hum_offset_7d') }}"
        last_update: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        recommendation: >-
          {% set temp_off = states('sensor.fancoil_cucina_cal_temp_offset_24h') | float(none) %}
          {% set hum_off = states('sensor.fancoil_cucina_cal_hum_offset_24h') | float(none) %}
          {% set temp_change = states('sensor.statistics_fancoil_cucina_cal_temp_change_24h') | float(none) %}
          {% set hum_change = states('sensor.statistics_fancoil_cucina_cal_hum_change_24h') | float(none) %}
          {% set temp_cnt = states('sensor.statistics_fancoil_cucina_cal_temp_count_24h') | int(none) %}
          {% if temp_off is not none and hum_off is not none and temp_cnt > 50 %}
            Offset T: {{ temp_off | round(2) }}°C, Offset RH: {{ hum_off | round(1) }}%.
            {% if temp_change is not none and temp_change | abs < 0.5 and hum_change is not none and hum_change | abs < 5 %}
              Dati stabili - pronto per applicazione calibrazione.
            {% else %}
              Variabilità rilevata (change T: {{ temp_change | round(2) }}°C, change RH: {{ hum_change | round(1) }}%) - attendere più dati.
            {% endif %}
          {% else %}
            Raccolta dati in corso... ({{ temp_cnt }} campioni T)
          {% endif %}

    # ---------------------------------------------------------------------------
    # Sensori Calibrati (Template) - Valori Corretti
    # ---------------------------------------------------------------------------
    fancoil_cucina_temp_calibrated:
      friendly_name: "Cucina Temperatura Calibrata"
      unique_id: fancoil_cucina_temp_calibrated
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer-check
      state: >-
        {% set Tf = states('sensor.fancoil_cucina_temperature') | float(none) %}
        {% if Tf is none %}
          unknown
        {% elif Tf <= 24.5 %}
          {{ Tf | round(1) }}
        {% else %}
          {% set delta = Tf - 24.5 %}
          {% set corr = 0.042 * delta * delta - 0.15 * delta %}
          {{ (Tf + corr) | round(1) }}
        {% endif %}
      availability: >-
        {{ states('sensor.fancoil_cucina_temperature') not in ['unavailable', 'unknown', 'none', ''] }}

    fancoil_cucina_hum_calibrated:
      friendly_name: "Cucina Umidità Calibrata"
      unique_id: fancoil_cucina_hum_calibrated
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      icon: mdi:water-percent
      state: >-
        {% set RHf = states('sensor.fancoil_cucina_humidity') | float(none) %}
        {% set Tf = states('sensor.fancoil_cucina_temperature') | float(none) %}
        {% if RHf is none %}
          unknown
        {% elif RHf >= 60 %}
          {{ RHf | round(0) }}
        {% else %}
          {% set corr = 0.45 * (60 - RHf) %}
          {% set temp_factor = 1 + 0.02 * [0, Tf - 24] | max %}
          {{ (RHf + corr * temp_factor) | round(0) }}
        {% endif %}
      availability: >-
        {{ states('sensor.fancoil_cucina_humidity') not in ['unavailable', 'unknown', 'none', ''] }}

