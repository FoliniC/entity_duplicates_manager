# Sensors for Climate Comfort Evaluation and Advice
# Based on @yaml_generator/benessere_domotica_fancoil_ok.md
#
# NOTA: i sensori PER-STANZA (Omega / T_dew / Comfort / Advice) sono ora generati
# automaticamente da climate_comfort_per_room.j2 -> climate_comfort_per_room.yaml.
# Qui restano solo i sensori ESTERNI (non per-stanza).

- name: "Omega Esterno"
  unique_id: omega_esterno
  unit_of_measurement: "g/kg"
  state: >
    {% set T = states('sensor.meteo_castionetto_temperatura') | float(0) %}
    {% set RH = states('sensor.meteo_castionetto_umidita') | float(0) %}
    {% set P = states('sensor.castionetto_pressione') | float(1013.25) * 100 %}
    {% set psat = 610.78 * (2.718281828459 ** (17.27 * T / (T + 237.3))) %}
    {% set pvap = (RH / 100) * psat %}
    {{ (622 * pvap / (P - pvap)) | round(2) }}
  attributes:
    temperature_sensor: sensor.meteo_castionetto_temperatura
    humidity_sensor: sensor.meteo_castionetto_umidita
    temperatura: "{{ states('sensor.meteo_castionetto_temperatura') | float(0) }}"
    umidita: "{{ states('sensor.meteo_castionetto_umidita') | float(0) }}"

- name: "T_dew Esterno"
  unique_id: punto_di_rugiada_esterno
  unit_of_measurement: "°C"
  state: >
    {{ states('sensor.meteo_castionetto_punto_di_rugiada') | float(0) }}
