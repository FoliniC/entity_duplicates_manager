# Sensors for Climate Comfort Evaluation and Advice
# Based on @yaml_generator/benessere_domotica_fancoil_ok.md

- name: "Omega Esterno"
  unique_id: omega_esterno
  unit_of_measurement: "g/kg"
  state: >
    {% set T = states('sensor.meteo_castionetto_temperatura') | float(0) %}
    {% set RH = states('sensor.meteo_castionetto_umidita') | float(0) %}
    {% set psat = 610.78 * (2.718281828459 ** (17.27 * T / (T + 237.3))) %}
    {% set pvap = (RH / 100) * psat %}
    {{ (622 * pvap / (101325 - pvap)) | round(2) }}

- name: "T_dew Esterno"
  unique_id: punto_di_rugiada_esterno
  unit_of_measurement: "°C"
  state: >
    {{ states('sensor.meteo_castionetto_punto_di_rugiada') | float(0) }}

# CUCINA
- name: "Omega Cucina"
  unique_id: omega_cucina
  unit_of_measurement: "g/kg"
  state: >
    {% set T = states('sensor.temperatura_cucina_reale_calcolata') | float(0) %}
    {% set RH = states('sensor.th1a_humidity') | float(0) %}
    {% set psat = 610.78 * (2.718281828459 ** (17.27 * T / (T + 237.3))) %}
    {% set pvap = (RH / 100) * psat %}
    {{ (622 * pvap / (101325 - pvap)) | round(2) }}

- name: "T_dew Cucina"
  unique_id: punto_di_rugiada_cucina
  unit_of_measurement: "°C"
  state: >
    {% set T = states('sensor.temperatura_cucina_reale_calcolata') | float(0) %}
    {% set RH = states('sensor.th1a_humidity') | float(0) %}
    {{ (T - (100 - RH) / 5) | round(1) }}

- name: "Comfort Evaluation Cucina"
  unique_id: comfort_evaluation_cucina
  state: >
    {% set t = states('sensor.temperatura_cucina_reale_calcolata') | float(0) %}
    {% set rh = states('sensor.th1a_humidity') | float(0) %}
    {% set mode = states('input_select.fancoil_system_hvac_mode') %}
    {% if mode == 'cool' %}
      {% if t >= 24 and t <= 26 and rh >= 50 and rh <= 60 %} Ottimale
      {% elif t > 26 or rh > 60 %} Caldo/Umido
      {% elif t < 24 or rh < 50 %} Fresco/Secco
      {% else %} Accettabile
      {% endif %}
    {% elif mode == 'heat' %}
      {% if t >= 20 and t <= 22 and rh >= 40 and rh <= 60 %} Ottimale
      {% elif t < 20 or rh < 40 %} Freddo/Secco
      {% elif t > 22 or rh > 60 %} Caldo/Umido
      {% else %} Accettabile
      {% endif %}
    {% else %} Inattivo {% endif %}

- name: "Climate Advice Cucina"
  unique_id: climate_advice_cucina
  state: >
    {% set rh = states('sensor.th1a_humidity') | float(0) %}
    {% set omega_int = states('sensor.omega_cucina') | float(0) %}
    {% set omega_ext = states('sensor.omega_esterno') | float(0) %}
    {% set variance = states('sensor.statistics_umidita_cucina_variance') | float(0) %}
    {% set delta_omega = omega_int - omega_ext %}
    {% set ns = namespace(advices=[]) %}
    {% if rh > 65 %}{% set ns.advices = ns.advices + ['Accendi Fancoil (Deumidifica)'] %}{% endif %}
    {% if delta_omega > 1.0 %}
      {% if variance < 0.2 and delta_omega < 1.3 %}
        {% set ns.advices = ns.advices + ['Puoi chiudere (Umidità stabilizzata)'] %}
      {% else %}
        {% set ns.advices = ns.advices + ['Apri Finestra (Aria esterna secca)'] %}
      {% endif %}
    {% elif delta_omega < 0.2 and rh > 60 %}
      {% set ns.advices = ns.advices + ['Tieni chiuso (Esterno più umido)'] %}
    {% endif %}
    {{ ns.advices | join(' | ') if ns.advices | length > 0 else 'Nessuna azione necessaria' }}

