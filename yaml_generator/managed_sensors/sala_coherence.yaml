# Sensors for cross-checking consistency between different sensors in the same room



- name: "Fancoil Sala Temp Delta (KNX vs Ref)"
  unique_id: fancoil_sala_temp_delta_knx_th
  unit_of_measurement: "°C"
  state_class: measurement
  device_class: temperature
  state: >
    {% set s1 = states('sensor.temperatura_sala') | float(None) %}
    {% set s2 = states('sensor.fancoil_sala_temperature') | float(None) %}
    {% if s1 is not none and s2 is not none %}
      {{ (s1 - s2) | abs | round(2) }}
    {% else %}
      unavailable
    {% endif %}

- name: "Fancoil Sala Sensors Coherence Status"
  unique_id: fancoil_sala_sensors_coherence_status
  state: >
    {% set t_delta = states('sensor.fancoil_sala_temp_delta_th_internal') | float(None) %}
    {% set h_delta = states('sensor.fancoil_sala_hum_delta_th_internal') | float(None) %}

    {# Soglie di tolleranza ampie per via dei posizionamenti diversi #}
    {% set t_limit = 3.5 %}
    {% set h_limit = 20.0 %}

    {% set ns = namespace(problems=[]) %}
    {% if t_delta is not none and t_delta > t_limit %}
      {% set ns.problems = ns.problems + ['Temp Diverge (' ~ t_delta ~ '°C)'] %}
    {% endif %}
    {% if h_delta is not none and h_delta > h_limit %}
      {% set ns.problems = ns.problems + ['Hum Diverge (' ~ h_delta ~ '%)'] %}
    {% endif %}

    {% if ns.problems | length > 0 %}
      Problema: {{ ns.problems | join(' | ') }}
    {% else %}
      Coerente
    {% endif %}
  attributes:
    managed_by: yaml_generator
    room: "Sala"

