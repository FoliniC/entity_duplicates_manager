# FASE 4 - Sensori pilota per stanza
# Centralizza la scelta del sensore (temperatura + umidita) usato dai calcoli climatici.
# Affidabilita definita a priori dalla lista ordinata in fancoil_vars.yaml:
# il primo sensore disponibile (non unknown/unavailable) vince.

# ---------------------------------------------------------------------------
# Umidita pilota: prima sorgente disponibile nell'ordine [primary] + fallback.
# Se nessuna e disponibile -> stato 'unavailable'.
# ---------------------------------------------------------------------------
- name: "Umidità Corridoio Pilota"
  unique_id: umidita_corridoio_pilota
  unit_of_measurement: "%"
  state_class: measurement
  device_class: humidity
  state: >
    {% set primary_ent = 'sensor.fancoil_corridoio_humidity' %}
    {% set fallback_ents = [] %}
    {% set ns = namespace(value=none, source='') %}
    {% for ent in [primary_ent] + fallback_ents %}
      {% if ns.value is none and has_value(ent) %}
        {% set ns.value = states(ent) | float(0) %}
        {% set ns.source = ent %}
      {% endif %}
    {% endfor %}
    {% if ns.value is none %}unavailable{% else %}{{ ns.value | round(1) }}{% endif %}
  availability: >
    {{ has_value('sensor.fancoil_corridoio_humidity') }}
  attributes:
    primary_sensor: "sensor.fancoil_corridoio_humidity"
    fallback_sensors: "[]"
    active_sensor: >
      {% set primary_ent = 'sensor.fancoil_corridoio_humidity' %}
      {% set fallback_ents = [] %}
      {% set ns = namespace(source='') %}
      {% for ent in [primary_ent] + fallback_ents %}
        {% if ns.source == '' and has_value(ent) %}
          {% set ns.source = ent %}
        {% endif %}
      {% endfor %}
      {{ ns.source if ns.source != '' else 'none' }}

# ---------------------------------------------------------------------------
# Sensore: Temperatura Corridoio Reale Calcolata
# Seleziona la fonte di temperatura in base a input_select.fancoil_corridoio_temp_source
# PrioritÃ  configurabile tra: Internal, Stox Fancoil, KNX
# ---------------------------------------------------------------------------
- name: "Temperatura Corridoio Reale Calcolata"
  unique_id: temperatura_corridoio_reale_calcolata
  unit_of_measurement: "°C"
  state_class: measurement
  device_class: temperature
  state: >-
    {% set source = states('input_select.fancoil_corridoio_temp_source') %}
    {% set internal = 'sensor.fancoil_corridoio_temperature' %}
    {% set knx = 'sensor.temperatura_corridoio' %}
    {% set internal_val = states(internal) | float(-99) %}
    {% set knx_val = states(knx) | float(-99) %}
    {% set ns = namespace(val=none) %}
    {% if source in [internal, 'Fancoil Internal', 'sensor.fancoil_corridoio_temperature'] %}
      {% if internal_val not in [-99, 0.0] %}
        {% set ns.val = internal_val %}
      {% elif knx_val not in [-99, 0.0] %}
        {% set ns.val = knx_val %}
      {% endif %}
    {% elif source in [knx, 'KNX', 'sensor.temperatura_corridoio'] %}
      {% if knx_val not in [-99, 0.0] %}
        {% set ns.val = knx_val %}
      {% elif internal_val not in [-99, 0.0] %}
        {% set ns.val = internal_val %}
      {% endif %}
    {% else %}
      {% if internal_val not in [-99, 0.0] %}
        {% set ns.val = internal_val %}
      {% elif knx_val not in [-99, 0.0] %}
        {% set ns.val = knx_val %}
      {% endif %}
    {% endif %}
    {{ ns.val if ns.val is not none else 'unavailable' }}
  availability: >-
    {% set internal_val = states('sensor.fancoil_corridoio_temperature') | float(-99) %}
    {% set knx_val = states('sensor.temperatura_corridoio') | float(-99) %}
    {{ (internal_val not in [-99, 0.0]) or (knx_val not in [-99, 0.0]) }}
  attributes:
    source_selector: "input_select.fancoil_corridoio_temp_source"
    internal_sensor: "sensor.fancoil_corridoio_temperature"
    knx_sensor: "sensor.temperatura_corridoio"

# ---------------------------------------------------------------------------
# Temperatura pilota: delega al sensore 'reale_calcolata' esistente, che gia
# gestisce la selezione interattiva (input_select.fancoil_<id>_temp_source)
# e il fallback automatico al sensore interno. Delegare evita di duplicare
# quella logica stanza per stanza. Unique_id uniforme *_pilota per i consumer.
# ---------------------------------------------------------------------------
- name: "Temperatura Corridoio Pilota"
  unique_id: temperatura_corridoio_pilota
  unit_of_measurement: "°C"
  state_class: measurement
  device_class: temperature
  state: >
    {% set primary = states('sensor.temperatura_corridoio_reale_calcolata') | float(none) %}
    {% set fallback = states('sensor.fancoil_corridoio_temperature') | float(none) %}
    {% set val = primary if primary is not none and primary != 0 else fallback %}
    {{ val if val is not none else 'unavailable' }}
  availability: >
    {% set primary = states('sensor.temperatura_corridoio_reale_calcolata') | float(none) %}
    {% set fallback = states('sensor.fancoil_corridoio_temperature') | float(none) %}
    {{ (primary is not none and primary != 0) or fallback is not none }}
  attributes:
    source_sensor: sensor.temperatura_corridoio_reale_calcolata
