# FASE 5 - Trend umidità per stanza
# Determina se l'umidità sta salendo, scendendo o è stabile,
# basandosi sulle variazioni a breve termine (15 min) e medio termine (60 min).

- name: "Trend Umidità Corridoio"
  unique_id: trend_umidita_corridoio
  state: >
    {% set cb = states('sensor.statistics_umidita_corridoio_change_breve') | float(none) %}
    {% set cm = states('sensor.statistics_umidita_corridoio_change_medio') | float(none) %}
    {% if cb is none or cm is none %}
      incerto
    {% else %}
      {% if cb >= 0.5 or (cb >= 0.2 and cm >= 1.0) %}
        in_salita
      {% elif cb <= -0.5 or (cb <= -0.2 and cm <= -1.0) %}
        in_calata
      {% elif cb | abs <= 0.3 and cm | abs <= 0.6 %}
        stabile
      {% else %}
        stabile
      {% endif %}
    {% endif %}
  icon: >
    {% set cb = states('sensor.statistics_umidita_corridoio_change_breve') | float(none) %}
    {% set cm = states('sensor.statistics_umidita_corridoio_change_medio') | float(none) %}
    {% if cb is none or cm is none %}
      mdi:trending-neutral
    {% elif cb >= 0.5 or (cb >= 0.2 and cm >= 1.0) %}
      mdi:trending-up
    {% elif cb <= -0.5 or (cb <= -0.2 and cm <= -1.0) %}
      mdi:trending-down
    {% else %}
      mdi:trending-neutral
    {% endif %}
  attributes:
    delta_breve: >
      {{ states('sensor.statistics_umidita_corridoio_change_breve') | float(none) }}
    delta_medio: >
      {{ states('sensor.statistics_umidita_corridoio_change_medio') | float(none) }}
    finestra_osservata: "15m / 60m"
    sensore_sorgente: "sensor.umidita_corridoio_pilota"
