# Template for simple fancoil sensors (live data)

- name: "Fancoil Camera grande Status Comunicazione"
  unique_id: fancoil_camera_grande_status_comunicazione
  state: >-
    {% set source = states('input_select.fancoil_camera_grande_temp_source') %}
    {% set active_temp_entity = 'sensor.fancoil_camera_grande_temperature' if (source == 'sensor.fancoil_camera_grande_temperature' or source == 'sensor.stox_fancoil_camera_grande_temperature' or source == 'Fancoil Internal') else source %}

    {% set t_err = states(active_temp_entity) in ['unavailable', 'unknown', None, ''] %}
    {% set m_err = states('switch.stox_fancoil_camera_grande_switch') in ['unavailable', 'unknown'] %}
    {% set stox_off = is_state('switch.stox_fancoil_camera_grande_switch', 'off') %}

    {% set s1_err = states('switch.fancoil_camera_grande_switch_1') in ['unavailable', 'unknown'] %}
    {% set s2_err = states('switch.fancoil_camera_grande_switch_2') in ['unavailable', 'unknown'] %}
    {% set s3_err = states('switch.fancoil_camera_grande_switch_3') in ['unavailable', 'unknown'] %}
    {% set s4_err = states('switch.fancoil_camera_grande_switch_4') in ['unavailable', 'unknown'] %}

    {% set diff = states('sensor.fancoil_camera_grande_temperature_difference') | float(0) %}
    {% set enabled = is_state('input_boolean.fancoil_camera_grande_enabled', 'on') %}
    {% set stop = is_state('binary_sensor.fancoil_camera_grande_stop_condition', 'on') %}
    {% set mode = states('sensor.fancoil_camera_grande_hvac_temp_mode') %}
    {% set soglia = states('input_number.fan_distance_low') | float(0.5) %}
    {% set all_off = is_state('switch.fancoil_camera_grande_switch_1', 'off') and
                     is_state('switch.fancoil_camera_grande_switch_2', 'off') and
                     is_state('switch.fancoil_camera_grande_switch_3', 'off') and
                     is_state('switch.fancoil_camera_grande_switch_4', 'off') %}
    {% set stuck = enabled and mode != 'off' and not stop and diff >= soglia and all_off %}

    {% set ns = namespace(errors=[]) %}
    {% if t_err %}{% set ns.errors = ns.errors + ['Sensore Temp (' ~ active_temp_entity.split(".")[-1] ~ ')'] %}{% endif %}
    {% if m_err %}{% set ns.errors = ns.errors + ['Hardware Stox'] %}{% endif %}
    {% if not m_err and stox_off %}{% set ns.errors = ns.errors + ['Alimentazione OFF'] %}{% endif %}
    {% if s1_err or s2_err or s3_err or s4_err %}{% set ns.errors = ns.errors + ['WiFi Fancoil'] %}{% endif %}
    {% if not t_err and not m_err and not stox_off and not s1_err and stuck %}
      {% set ns.errors = ns.errors + ['Blocco Automazione'] %}
    {% endif %}

    {% if ns.errors | length > 0 %}
      Errore: {{ ns.errors | join(' + ') }}
    {% else %}
      OK
    {% endif %}

# Temperatura della stanza basata sulla sorgente selezionata
- name: "Temperatura Camera grande Reale Calcolata"
  unique_id: fancoil_camera_grande_real_calculated
  unit_of_measurement: "°C"
  state_class: measurement
  device_class: temperature
  state: >
    {% set source = states('input_select.fancoil_camera_grande_temp_source') %}
    {% set internal = states('sensor.fancoil_camera_grande_temperature') | float(-99) %}
    {% set val = -99.0 %}

    {% if source in ['sensor.fancoil_camera_grande_temperature', 'sensor.stox_fancoil_camera_grande_temperature', 'Fancoil Internal'] %}
      {% set val = internal %}
    {% else %}
      {% set val = states(source) | float(-99) %}
      {# Fallback automatico al sensore interno se la sorgente preferita è offline #}
      {% if val == -99 or val == 0.0 %}
        {% set val = internal %}
      {% endif %}
    {% endif %}

    {% if val == -99 or val == 0.0 %}
      unavailable
    {% else %}
      {{ val | round(1) }}
    {% endif %}
  availability: >
    {% set source = states('input_select.fancoil_camera_grande_temp_source') %}
    {% set internal_val = states('sensor.fancoil_camera_grande_temperature') | float(-99) %}
    {% set primary_val = states(source) | float(-99) if source not in ['sensor.fancoil_camera_grande_temperature', 'sensor.stox_fancoil_camera_grande_temperature', 'Fancoil Internal'] else internal_val %}
    {{ (primary_val != -99 and primary_val != 0.0) or (internal_val != -99 and internal_val != 0.0) }}
