# Per-room climate comfort sensors for: Cucina (cucina)
# Temperature source: sensor.temperatura_cucina_reale_calcolata (pilota temperatura)
# Humidity source:    sensor.umidita_cucina_pilota (pilota umidita)

# ---------------------------------------------------------------------------
# Omega (umidita assoluta, g/kg) + attributes con id entita e valori sorgente
# Attributes mostrano il device FISICO effettivamente in uso (non il pilota):
#  - temperatura: replica la logica di reale_calcolata (selettore + fallback interno)
#  - umidita:    legge active_sensor dal sensore pilota
# ---------------------------------------------------------------------------
- name: "Omega Cucina"
  unique_id: omega_cucina
  unit_of_measurement: "g/kg"
  state: >
    {% set T = states('sensor.temperatura_cucina_reale_calcolata') | float(0) %}
    {% set RH = states('sensor.umidita_cucina_pilota') | float(0) %}
    {% set P = states('sensor.castionetto_pressione') | float(1013.25) * 100 %}
    {% set psat = 610.78 * (2.718281828459 ** (17.27 * T / (T + 237.3))) %}
    {% set pvap = (RH / 100) * psat %}
    {{ (622 * pvap / (P - pvap)) | round(2) }}
  attributes:
    # Entita DIRETTE consumate dalla formula Omega (con valore)
    omega_temperature_id: sensor.temperatura_cucina_reale_calcolata
    omega_temperature_value: "{{ states('sensor.temperatura_cucina_reale_calcolata') | float(0) }}"
    omega_humidity_id: sensor.umidita_cucina_pilota
    omega_humidity_value: "{{ states('sensor.umidita_cucina_pilota') | float(0) }}"
    # Device FISICO effettivamente in uso dietro le entita intermedie
    temperature_device_id: >
      {% set source = states('input_select.fancoil_cucina_temp_source') %}
      {% set internal = 'sensor.fancoil_cucina_temperature' %}
      {% set internal_val = states(internal) | float(-99) %}
      {% set ns = namespace(dev='') %}
      {% if source in [internal, 'sensor.stox_fancoil_cucina_temperature', 'Fancoil Internal'] %}
        {% set ns.dev = internal %}
      {% else %}
        {% set v = states(source) | float(-99) %}
        {% if v != -99 and v != 0.0 %}{% set ns.dev = source %}{% else %}{% set ns.dev = internal %}{% endif %}
      {% endif %}
      {{ ns.dev }}
    temperature_device_value: >
      {% set source = states('input_select.fancoil_cucina_temp_source') %}
      {% set internal = 'sensor.fancoil_cucina_temperature' %}
      {% set internal_val = states(internal) | float(-99) %}
      {% if source in [internal, 'sensor.stox_fancoil_cucina_temperature', 'Fancoil Internal'] %}
        {{ internal_val if internal_val not in [-99, 0.0] else 'unavailable' }}
      {% else %}
        {% set v = states(source) | float(-99) %}
        {% if v != -99 and v != 0.0 %}{{ v }}{% else %}{{ internal_val if internal_val not in [-99, 0.0] else 'unavailable' }}{% endif %}
      {% endif %}
    humidity_device_id: "{{ state_attr('sensor.umidita_cucina_pilota', 'active_sensor') }}"
    humidity_device_value: "{{ states(state_attr('sensor.umidita_cucina_pilota', 'active_sensor')) | float(0) if state_attr('sensor.umidita_cucina_pilota', 'active_sensor') not in [None, 'none'] else 'unavailable' }}"

# ---------------------------------------------------------------------------
# T_dew (punto di rugiada, C)
# ---------------------------------------------------------------------------
- name: "T_dew Cucina"
  unique_id: punto_di_rugiada_cucina
  unit_of_measurement: "°C"
  state: >
    {% set T = states('sensor.temperatura_cucina_reale_calcolata') | float(0) %}
    {% set RH = states('sensor.umidita_cucina_pilota') | float(0) %}
    {{ (T - (100 - RH) / 5) | round(1) }}

# ---------------------------------------------------------------------------
# Comfort Evaluation (Ottimale / Caldo-Umido / Fresco-Secco / Accettabile)
# ---------------------------------------------------------------------------
- name: "Comfort Evaluation Cucina"
  unique_id: comfort_evaluation_cucina
  state: >
    {% set t = states('sensor.temperatura_cucina_reale_calcolata') | float(0) %}
    {% set rh = states('sensor.umidita_cucina_pilota') | float(0) %}
    {% set mode = states('input_select.fancoil_system_hvac_mode') %}
    {% if mode == 'cool' %}
      {% if t >= 24 and t <= 26 and rh >= 50 and rh <= 60 %} Ottimale
      {% elif t > 26 or rh > 60 %} Caldo/Umido
      {% elif t < 24 or rh < 50 %} Fresco/Secco
      {% else %} Accettabile
      {% endif %}
    {% elif mode == 'heat' %}
      {% if t >= 20 and t <= 22 and rh >= 40 and rh <= 60 %} Ottimale
      {% elif t < 20 or rh < 40 %} Freddo/Secco
      {% elif t > 22 or rh > 60 %} Caldo/Umido
      {% else %} Accettabile
      {% endif %}
    {% else %} Inattivo {% endif %}
