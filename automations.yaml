- id: cronostar_profilo_presenza
  alias: 'CronoStar: Profilo in base a presenza e finestre'
  description: Imposta Default / Away / Eco per CronoStar in base alla presenza e
    allo stato finestra.
  triggers:
  - trigger: state
    id: away
    entity_id: group.famiglia
    to: not_home
  - trigger: state
    id: home
    entity_id: group.famiglia
    from: not_home
    to: home
  - trigger: state
    id: window_eco
    entity_id: binary_sensor.finestra_cucina
    to: 'on'
    for:
      minutes: 5
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: away
      sequence:
      - action: select.select_option
        target:
          entity_id: select.cronostar_generic_switch_tavolo_current_profile
        data:
          option: Away
    - conditions:
      - condition: trigger
        id: home
      sequence:
      - action: select.select_option
        target:
          entity_id: select.cronostar_generic_switch_tavolo_current_profile
        data:
          option: Default
    - conditions:
      - condition: trigger
        id: window_eco
      sequence:
      - action: select.select_option
        target:
          entity_id: select.cronostar_generic_switch_tavolo_current_profile
        data:
          option: Eco
    default: []
  mode: single
- id: '1783200935292'
  alias: Telecamera - Persona rilevata
  description: Notifica persistente quando Agent DVR rileva una persona
  triggers:
  - webhook_id: movimento_camera1
    allowed_methods:
    - POST
    - GET
    local_only: true
    trigger: webhook
  conditions: []
  actions:
  - data:
      title: "\U0001F6A8 Persona rilevata"
      message: "Persona rilevata dalla **Camera 1** alle {{ now().strftime('%H:%M:%S') }}\n        del {{ now().strftime('%d/%m/%Y') }}"
      notification_id: persona_camera1
    action: persistent_notification.create
  mode: single
- id: 'tuya_device_activity'
  alias: Tuya Device Activity Detection
  description: Detects when the Tuya device BC:35:1E:FF:4A:B9 sends network packets
  triggers:
  - webhook_id: tuya_activity
    allowed_methods:
    - POST
    - GET
    local_only: true
    trigger: webhook
  conditions: []
  actions:
  - service: persistent_notification.create
    data:
      title: "Tuya Device Activity"
      message: "Tuya device BC:35:1E:FF:4A:B9 detected network activity at {{ now().strftime('%H:%M:%S') }}"
  - service: notify.mobile_app_iphone_car
    data:
      title: "Tuya Device Activity"
      message: "Tuya device BC:35:1E:FF:4A:B9 detected network activity"
  mode: single
- id: 'frigate_locale_tecnico_person'
  alias: 'Frigate: Persona rilevata locale tecnico'
  description: Notifica su Redmi Note 13 Pro 5G quando Frigate rileva una persona nel locale tecnico
  triggers:
    - platform: mqtt
      topic: frigate/events
      value_template: '{{ value_json.type == "new" and value_json.label == "person" and value_json.camera == "locale_tecnico" }}'
  conditions: []
  actions:
    - service: notify.redmi_note_13_pro_5g
      data:
        title: "🚨 Persona rilevata - Locale Tecnico"
        message: "Persona rilevata dalla camera **Locale Tecnico** alle {{ now().strftime('%H:%M:%S') }} del {{ now().strftime('%d/%m/%Y') }}"
        notification_id: frigate_locale_tecnico_person
      target: []
  mode: single