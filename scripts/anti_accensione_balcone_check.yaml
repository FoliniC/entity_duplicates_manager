# Script: Anti-Accensione Balcone con verifica cloud Tuya real-time
# Chiamato dall'automazione quando la luce si accende (user_id=None, parent_id=None)
# Controlla il log router per traffico cloud Tuya recente (<15s)
# Se c'è traffico -> Alexa/SmartLife legittimo -> NON spegne
# Se NON c'è traffico -> Pulsante fisico/RF spurio -> SPEGNE

sequence:
  # 1) Esegui controllo real-time sul router
  - action: shell_command.check_tuya_balcone_cloud
    response_variable: tuya_check

  # 2) Log del risultato
  - event: balcone_log_event
    event_data:
      level: INFO
      action: "CHECK_CLOUD_TRAFFIC"
      message: "Verifica traffico cloud Tuya: {{ tuya_check.stdout }}"
      wait: 0

  # 3) Se c'è traffico cloud (exit 0) -> EXIT (non spegnere)
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ tuya_check.returncode == 0 }}"
        sequence:
          - event: balcone_log_event
            event_data:
              level: INFO
              action: "CLOUD_TRAFFIC_DETECTED"
              message: "Traffico cloud Tuya rilevato (Alexa/SmartLife) -> accensione legittima, NON spengo"
              wait: 0
          - stop: "Traffico cloud Tuya rilevato - accensione legittima"

  # 4) Altrimenti (exit 1) -> Spegni (pulsante fisico/RF anomalo)
  - event: balcone_log_event
    event_data:
      level: WARNING
      action: "SPENTO (anti-accensione)"
      message: "Accensione esterna NON voluta rilevata (nessun traffico cloud Tuya) -> luce spenta automaticamente"
      wait: 0
  - action: switch.turn_off
    target:
      entity_id: switch.luce_balcone_switch_1
  # Usare notify group per notifiche device-agnostic
  - action: notify.send_message
    target:
      entity_id: notify.notify_mobile_devices
    data:
      title: "🚫 Luce balcone spenta (anti-accensione)"
      message: "Rilevata accensione esterna non voluta (nessun traffico cloud) -> spenta automaticamente"
      tag: balcone_anti_accensione
      importance: high
      notification_icon: "mdi:shield-alert"