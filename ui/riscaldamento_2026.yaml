  - title: Informazioni
    path: riscaldamento-info
    badges: []
    cards:
      - graph: line
        type: sensor
        entity: sensor.temperatura_circuito_riscaldamento
        detail: 2
      - type: entities
        entities:
          - entity: sensor.temperatura_acqua_calda
          - entity: sensor.temperatura_circuito_riscaldamento
          - entity: binary_sensor.pdc_heating
          - entity: binary_sensor.pdc_acqua_calda
          - entity: binary_sensor.pdc_cooling
          - entity: binary_sensor.pdc_standby
          - entity: binary_sensor.pdc_acqua_calda
          - entity: sensor.temperatura_strenscia
  - title: Impostazioni
    path: riscaldamento-impostazioni1
    badges: []
    cards:
      - type: custom:cronostar-card
        preset_type: thermostat
        hour_base:
          value: 0
          determined: false
        logging_enabled: true
        pause_entity: switch.cronostar_thermostat_appartamento_paused
        profiles_select_entity: select.cronostar_thermostat_appartamento_current_profile
        target_entity: climate.climatizzazione_appartamento
        allow_max_value: false
        title: CronoStar Thermostat
        y_axis_label: Temperature
        unit_of_measurement: °C
        min_value: '15'
        max_value: 30
        step_value: 0.5
        is_switch_preset: false
        missing_yaml_style: named
        global_prefix: cronostar_thermostat_appartamento_
        step: 5
