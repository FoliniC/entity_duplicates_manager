title: EV Charging 2025 effettivo
views:
  # ============================================================================
  # TAB 1: CONTROLLI
  # ============================================================================
  - title: Controlli
    path: controlli
    cards:
      # HEADER STATO
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ev_charge_2025_reason') }}"
            secondary: "Prism: {{ states('sensor.prism_stato') }} (Rev. 54)"
            icon_color: >
              {% if is_state('binary_sensor.ev_charge_2025_can_charge', 'off') %} orange
              {% elif is_state('input_boolean.ev_charge_2025_charging_active', 'on') %} green
              {% else %} blue {% endif %}

          - type: custom:mushroom-template-card
            primary: "Gestione"
            secondary: "{{ states('input_select.ev_charge_2025_mode') }}"
            icon: >
              {% if is_state('input_select.ev_charge_2025_mode', 'Manuale') %} mdi:hand-back-right
              {% else %} mdi:robot {% endif %}
            icon_color: indigo
            tap_action:
              action: call-service
              service: input_select.select_next
              target: { entity_id: input_select.ev_charge_2025_mode }

      # RIEPILOGO STATO
      - type: markdown
        content: >
          {% set mins = states('sensor.ev_charge_2025_time_to_limit_sim') | int(0) %}
          {% set h = mins // 60 %}
          {% set m = mins % 60 %}
          {% set end_time = (now() + timedelta(minutes=mins)).strftime('%H:%M') %}
          **Stato Operativo:** {{ states('sensor.ev_charge_2025_reason') }}

          **Tempo Stimato alla Fine:** {{ end_time }} ({{h}}h{{ "%02d"|format(m) }}'00")

          **Parametri Real-time:**
          - **Solar Max:** {{ states('sensor.ev_charge_2025_solar_max_ampere') }} A
          - **Tensione:** {{ states('sensor.prism_tensione_attuale') }} V
          - **MQTT Inviato:** {{ states("input_text.ev_charge_2025_last_mqtt_payload") }} A ({{ states("input_text.ev_charge_2025_last_mqtt_time") }})

      # DIAGNOSTICA INVIO CORRENTE
      - type: markdown
        title: "Diagnostica invio corrente"
        content: |
          {% set smart_meter = states('sensor.smart_meter_ts_100a_1_potenza_reale') | float(0) %}
          {% set unit_sm = state_attr('sensor.smart_meter_ts_100a_1_potenza_reale', 'unit_of_measurement') %}
          {% set grid_p_w = (smart_meter * 1000) if unit_sm == 'kW' else smart_meter %}
          {% set prism_p = states('sensor.prism_potenza') | float(0) %}
          {% set prism_is_charging = prism_p > 500 %}
          {% set b_discharge = states('sensor.solarnet_power_battery_discharge') | float(0) %}
          {% set b_charge = states('sensor.solarnet_power_battery_charge') | float(0) %}
          {% set byd_soc = states('sensor.locale_tecnico_byd_battery_box_premium_hv_state_of_charge') | float(0) %}
          {% set voltage_raw = states('sensor.prism_tensione_attuale') | float(230) %}
          {% set voltage = 230 if voltage_raw <= 0 else voltage_raw %}
          {% set active = is_state('input_boolean.ev_charge_2025_charging_active', 'on') %}
          {% set no_grid = is_state('input_boolean.ev_charge_2025_no_grid', 'on') %}
          {% set connected = is_state('binary_sensor.ev_charge_2025_can_charge', 'on') %}
          {% set mode = states('input_select.ev_charge_2025_mode') %}
          {% set crono = states('input_number.ev_charge_2025_cronostar_power_target') | float(0) %}
          {% set manual_kw = states('input_number.ev_charge_2025_manual_power_kw') | float(2.0) %}
          {% set cur_soc = states('sensor.ev_charge_2025_current_soc') | float(0) %}
          {% set limit_soc = states('input_number.ev_charge_2025_vehicle_limit_soc') | float(100) %}
          {% set min_soc = states('input_number.ev_charge_2025_target_soc') | float(0) %}
          {% set p_prot = states('input_number.ev_charge_2025_byd_protection_soc') | float(10) %}
          {% set p_inv = states('input_number.ev_charge_2025_byd_inversion_soc') | float(30) %}
          {% set p_max_d = states('input_number.ev_charge_2025_byd_max_discharge_soc') | float(90) %}
          {% set w_max_c = states('input_number.ev_charge_2025_byd_max_charge_power') | float(5) * 1000 %}
          {% set w_max_d = states('input_number.ev_charge_2025_byd_max_discharge_power') | float(5) * 1000 %}
          {% set inertia_delta_a = states('input_number.ev_charge_2025_current_min_delta_a') | int(2) %}
          {% set inertia_interval_min = states('input_number.ev_charge_2025_current_min_interval_min') | int(3) %}
          {% set inertia_interval_s = inertia_interval_min * 60 %}
          {% set w_surplus_puro = (prism_p - grid_p_w) - b_discharge + b_charge %}
          {% set surplus = [0, w_surplus_puro - 200] | max %}
          {% if byd_soc < p_prot %}
            {% set w_to_battery = [surplus, w_max_c] | min %}
            {% set w_disponibile = surplus - w_to_battery %}
            {% set bonus_ratio = 0.0 %}
            {% set byd_support_w = 0.0 %}
            {% set byd_policy = 'Protezione batteria casa: tutto il surplus disponibile viene usato prima per ricaricare la BYD.' %}
          {% elif byd_soc < p_inv %}
            {% set byd_span = [1, p_inv - p_prot] | max %}
            {% set ratio = (byd_soc - p_prot) / byd_span %}
            {% set w_auto_raw = surplus * ratio %}
            {% set w_to_battery = [surplus - w_auto_raw, w_max_c] | min %}
            {% set w_disponibile = surplus - w_to_battery %}
            {% set bonus_ratio = 0.0 %}
            {% set byd_support_w = 0.0 %}
            {% set byd_policy = 'Ripartizione graduale: una quota crescente del surplus va alla ricarica EV mentre la BYD sale di SOC.' %}
          {% else %}
            {% set span = [1, p_max_d - p_inv] | max %}
            {% set bonus_ratio = [(byd_soc - p_inv) / span, 1.0] | min %}
            {% set byd_support_w = bonus_ratio * w_max_d %}
            {% set w_disponibile = surplus + byd_support_w %}
            {% set byd_policy = 'Auto prioritaria con supporto BYD: usa tutto il surplus e puo aggiungere una quota controllata dalla batteria casa.' %}
          {% endif %}
          {% if mode == 'Manuale' %}
            {% set manual_amp = (manual_kw * 1000 / 230) | int %}
            {% if no_grid %}
              {% set solar_amp = (w_disponibile / voltage) | int %}
              {% set target_amp = [[solar_amp, manual_amp] | min | clamp(6, 32), 0] | max if solar_amp >= 6 else 0 %}
              {% set calc_amp = solar_amp %}
            {% else %}
              {% set target_amp = manual_amp | clamp(6, 32) %}
              {% set calc_amp = target_amp %}
            {% endif %}
            {% set can_force_min = true %}
          {% elif crono >= 7.9 %}
            {% set calc_amp = (w_disponibile / voltage) | int %}
            {% set can_force_min = (cur_soc < min_soc and byd_soc >= p_inv) %}
            {% set target_amp = ([6, calc_amp] | max) if (calc_amp >= 6 or can_force_min) else 0 %}
          {% elif crono > 0.1 %}
            {% set raw_amp = (crono * 1000 / voltage) | int %}
            {% set target_amp = [[raw_amp, 6] | max, 32] | min %}
            {% set calc_amp = target_amp %}
            {% set can_force_min = true %}
          {% else %}
            {% set target_amp = 0 %}
            {% set calc_amp = 0 %}
            {% set can_force_min = false %}
          {% endif %}
          {% set target_mode = 3 if (not active or cur_soc >= limit_soc or target_amp < 6) else 2 %}
          {% set last_current_amp = states('input_text.ev_charge_2025_last_mqtt_payload') | int(0) %}
          {% set last_mode = states('input_text.ev_charge_2025_last_mqtt_mode') | int(0) %}
          {% set last_current_raw = states('input_text.ev_charge_2025_last_current_change_time') %}
          {% set last_current_dt = strptime(last_current_raw, '%Y-%m-%d %H:%M:%S', none) %}
          {% set last_current_ts = as_timestamp(last_current_dt) if last_current_dt else 0 %}
          {% set seconds_since_current_change = ((as_timestamp(now()) - last_current_ts) | int) if last_current_ts > 0 else 999999 %}
          {% set real_prism_mode = states('sensor.prism_mode') %}
          {% set real_prism_mode_num = 1 if real_prism_mode == 'solar' else 2 if real_prism_mode == 'normal' else 3 if real_prism_mode == 'pause' else 7 if real_prism_mode == 'autolimit' else 0 %}
          {% set real_prism_amp = states('sensor.prism_corrente_impostata_dell_utente') | int(0) %}
          {% set amp_delta = (target_amp - last_current_amp) | abs %}
          {% set force_current_sync = target_amp == 0 or last_current_amp < 0 or mode == 'Manuale' or (target_amp < last_current_amp and amp_delta >= inertia_delta_a) or target_mode != last_mode or target_mode != real_prism_mode_num or (target_mode == 2 and last_current_amp < 6) or (target_mode == 2 and real_prism_amp < 6 and target_amp >= 6) %}
          {% set delta_ok = amp_delta >= inertia_delta_a %}
          {% set interval_ok = seconds_since_current_change >= inertia_interval_s %}
          {% set should_send_current = target_amp != last_current_amp and (force_current_sync or (delta_ok and interval_ok)) %}

          {% if ((byd_soc | float(0) < states('input_number.ev_charge_2025_byd_protection_soc') | float(0)) and not is_state('input_boolean.ev_charge_2025_no_grid', 'on') and not is_state('input_boolean.ev_charge_2025_no_grid_2025', 'on') and not (is_state('input_select.ev_charge_2025_mode', 'Manuale') and not is_state('input_boolean.ev_charge_2025_no_grid', 'on'))) %}
          **Motivo blocco:** Batteria BYD ({{ byd_soc | round(1) }}%) sotto la soglia di protezione ({{ states('input_number.ev_charge_2025_byd_protection_soc') | round(1) }}%).
          {% elif not active %}
          **Motivo blocco:** ricarica disattivata dal comando principale.
          {% elif cur_soc >= limit_soc %}
          **Motivo blocco:** SOC auto {{ cur_soc | round(1) }}% >= limite {{ limit_soc | round(1) }}%.
          {% elif not connected %}
          **Motivo blocco:** veicolo o colonnina non pronti (`{{ states('sensor.prism_stato') }}`).
          {% elif mode == 'Manuale' and no_grid and target_amp < 6 %}
          **Motivo blocco:** "Escludi Rete" attivo e surplus utile insufficiente. Disponibili {{ w_disponibile | round(0) }} W = {{ calc_amp }} A, sotto il minimo 6 A.
          {% elif mode == 'Automatico' and crono <= 0.1 %}
          **Motivo blocco:** CronoStar e' a {{ crono | round(1) }} kW, quindi la fascia attuale sospende la ricarica.
          {% elif mode == 'Automatico' and crono >= 7.9 and target_amp < 6 %}
          **Motivo blocco:** surplus utile insufficiente. Disponibili {{ w_disponibile | round(0) }} W = {{ calc_amp }} A, sotto il minimo 6 A.
          {% elif target_mode == 3 %}
          **Motivo blocco:** la logica sta chiedendo pausa alla colonnina.
          {% elif prism_is_charging and target_amp != last_current_amp and not should_send_current %}
          **Ricarica in corso:** la Prism sta assorbendo {{ prism_p | round(0) }} W. {{ '"Escludi Rete" attivo: ' if mode == 'Manuale' and no_grid else '' }}L'inerzia trattiene il nuovo target {{ target_amp }} A: ultimo invio {{ last_current_amp }} A, variazione {{ amp_delta }} A su soglia {{ inertia_delta_a }} A, tempo {{ (seconds_since_current_change / 60) | round(1) }} min su soglia {{ inertia_interval_min }} min.
          {% elif target_amp != last_current_amp and not should_send_current %}
          **Motivo mancato invio:** {{ '"Escludi Rete" attivo e ' if mode == 'Manuale' and no_grid else '' }}inerzia attiva. Nuovo target {{ target_amp }} A, ultimo invio {{ last_current_amp }} A; variazione {{ amp_delta }} A su soglia {{ inertia_delta_a }} A, tempo {{ (seconds_since_current_change / 60) | round(1) }} min su soglia {{ inertia_interval_min }} min.
          {% elif prism_is_charging and target_amp == last_current_amp %}
          **Ricarica in corso:** la Prism sta assorbendo {{ prism_p | round(0) }} W con target {{ target_amp }} A gia' inviato{{ ' (limitato da "Escludi Rete")' if mode == 'Manuale' and no_grid and target_amp < manual_amp else '' }}.
          {% elif target_amp == last_current_amp %}
          **Corrente gia' inviata:** la Prism ha gia' target {{ target_amp }} A{{ ' (limitato da "Escludi Rete")' if mode == 'Manuale' and no_grid and target_amp < manual_amp else '' }}.
          {% elif prism_is_charging %}
          **Ricarica in corso:** la Prism sta assorbendo {{ prism_p | round(0) }} W. {{ '"Escludi Rete" attivo: ' if mode == 'Manuale' and no_grid else '' }}Target calcolato {{ target_amp }} A, ultimo invio {{ last_current_amp }} A; l'automazione aggiornera' la corrente se necessario.
          {% else %}
          **Stato ricarica:** {{ 'ATTIVA' if active else 'DISATTIVA (OFF)' }} — {{ 'manuale attivo' if not active else ('SOC >= limite' if cur_soc >= limit_soc else ('BYD protezione' if (byd_soc | float < states('input_number.ev_charge_2025_byd_protection_soc') | float) else ('pausa (target_mode=3)' if target_mode == 3 else ('prism a 0 W - verificare MQTT/colonnina' if (prism_p | float == 0 and target_mode == 2 and active) else ('inerzia attiva' if not should_send_current else ('invia corrente OK' if target_amp > 0 else 'target 0 A')))))) }}
          **Aggiornamento corrente richiesto:** target {{ target_amp }} A, ultimo invio {{ last_current_amp }} A (inattiva se 0). Potenza Prism: {{ prism_p | round(0) }} W.
          {% endif %}

          **Dettaglio calcolo**
          - Ricarica attiva: **{{ 'si' if active else 'no' }}**
          - Modalita: **{{ mode }}**, CronoStar: **{{ crono | round(1) }} kW**
          {% if mode == 'Manuale' %}
          - Manuale: **{{ manual_kw | round(1) }} kW nominali = {{ manual_amp }} A**
          - Escludi Rete: **{{ 'SI' if no_grid else 'NO' }}**
          {% endif %}
          - Stato Prism: **{{ states('sensor.prism_stato') }}**, mode: **{{ states('sensor.prism_mode') }}**
          - Ricarica fisica Prism: **{{ 'si' if prism_is_charging else 'no' }}** ({{ prism_p | round(0) }} W)
          - SOC auto: **{{ cur_soc | round(1) }}%**, limite: **{{ limit_soc | round(1) }}%**, soglia minima: **{{ min_soc | round(1) }}%**
          - Smart meter: **{{ grid_p_w | round(0) }} W** (negativo = immissione)
          - Potenza Prism: **{{ prism_p | round(0) }} W**
          - Batteria casa: carica **{{ b_charge | round(0) }} W**, scarica **{{ b_discharge | round(0) }} W**, SOC **{{ byd_soc | round(1) }}%**
          - Contributo max BYD (calcolato): **{{ byd_support_w | round(0) }} W** (~**{{ (byd_support_w / voltage) | round(1) }} A**) [Slider: **{{ (w_max_d / 1000) | round(1) }} kW**, Erogazione: **{{ (bonus_ratio * 100) | round(0) }}%**]
          - Surplus puro: **{{ w_surplus_puro | round(0) }} W**

          - Margine: **200 W**
          - Policy BYD: **{{ byd_policy }}**
          - Potenza utile EV: **{{ w_disponibile | round(0) }} W**
          - Ampere calcolati: **{{ calc_amp }} A**, target finale: **{{ target_amp }} A**, modalita target: **{{ target_mode }}**
          - Inerzia corrente: **{{ inertia_delta_a }} A** minimi e **{{ inertia_interval_min }} min** tra variazioni
          - Ultima variazione corrente: **{{ 'non ancora registrata' if last_current_ts == 0 else last_current_raw }}**
          - Variazione richiesta: **{{ amp_delta }} A**, stato inerzia: **{{ 'invio consentito' if should_send_current or target_amp == last_current_amp else 'invio trattenuto' }}**
          - Ultimo invio MQTT: **{{ states('input_text.ev_charge_2025_last_mqtt_payload') }} A**, mode **{{ states('input_text.ev_charge_2025_last_mqtt_mode') }}**

      # GRAFICI SOC E POTENZA
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.piazzale_mg_mg4_electric_state_of_charge
            name: Batteria Auto (MG SAIC)
            unit: "%"
            severity:
              green: 60
              yellow: 20
              red: 0
          - type: gauge
            entity: sensor.locale_tecnico_byd_battery_box_premium_hv_state_of_charge
            name: Batteria Casa
            unit: "%"
            severity:
              green: 50
              yellow: 20
              red: 0

      # POTENZA ASSORBITA E PRODUZIONE SOLARE
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.prism_potenza
            name: Potenza Ricarica
            unit: "W"
            min: 0
            max: 7400
            needle: true
            severity:
              green: 0
              yellow: 3000
              red: 6000
          - type: gauge
            entity: sensor.locale_tecnico_envoy_122134037538_current_power_production
            name: Produzione Solare (Envoy)
            unit: "W"
            min: 0
            max: 6000
            needle: true
            severity:
              green: 3000
              yellow: 1500
              red: 0

      # CONTROLLI PRIORITARI (SLIDER IN EVIDENZA)
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: "🎛️ Regolazioni Principali"
            subtitle: "Controlli prioritari SOC"
          - type: custom:mushroom-number-card
            entity: input_number.ev_charge_2025_vehicle_limit_soc
            name: "Obiettivo Carica Auto (%)"
            icon: mdi:battery-charging-80
            icon_color: green
            display_mode: slider
            secondary_info: state
          - type: custom:mushroom-number-card
            entity: input_number.ev_charge_2025_target_soc
            name: "Soglia Minima Ricarica (%)"
            icon: mdi:battery-alert
            icon_color: orange
            display_mode: slider
            secondary_info: state
          - type: custom:mushroom-number-card
            entity: input_number.ev_charge_2025_byd_min_soc_stop
            name: "Blocco Scarica BYD per EV (%)"
            icon: mdi:battery-minus
            icon_color: red
            display_mode: slider
            secondary_info: state
          - type: custom:mushroom-number-card
            entity: input_number.ev_charge_2025_byd_max_discharge_power
            name: "Potenza Max da Batteria (kW)"
            icon: mdi:battery-charging
            icon_color: blue
            display_mode: slider
            secondary_info: state
          - type: custom:mushroom-number-card
            entity: input_number.ev_charge_2025_grid_max_power
            name: "Potenza Max da Rete (kW)"
            icon: mdi:transmission-tower
            icon_color: purple
            display_mode: slider
            secondary_info: state


      # TASTO AVVIO (Sempre visibile)
      - type: custom:mushroom-template-card
        primary: >
          {% if is_state('input_boolean.ev_charge_2025_charging_active', 'on') %}
            FERMA RICARICA
          {% else %}
            {% if is_state('binary_sensor.ev_charge_2025_can_charge', 'off') %}
              PROGRAMMA AVVIO (al collegamento)
            {% else %}
              AVVIA RICARICA
            {% endif %}
          {% endif %}
        secondary: >
          {% if is_state('input_boolean.ev_charge_2025_charging_active', 'off') and is_state('binary_sensor.ev_charge_2025_can_charge', 'off') %}
            Veicolo non collegato: la ricarica partirà automaticamente al plugin.
          {% endif %}
        icon: >
          {{ 'mdi:stop-circle' if is_state('input_boolean.ev_charge_2025_charging_active', 'on') else 'mdi:play-circle' }}
        icon_color: >
          {{ 'red' if is_state('input_boolean.ev_charge_2025_charging_active', 'on') else 'green' }}
        layout: horizontal
        tap_action:
          action: call-service
          service: input_boolean.toggle
          target: { entity_id: input_boolean.ev_charge_2025_charging_active }

      # --- PROGRAMMAZIONE (Solo Automatico) ---
      - type: conditional
        conditions:
          - entity: input_select.ev_charge_2025_mode
            state: "Automatico"
        card:
          type: custom:cronostar-card
          preset: ev_charging
          title: "Programmazione Oraria"
          hour_base: { value: 0, determined: false }
          logging_enabled: true
          enabled_entity: switch.cronostar_ev_enabled
          target_entity: input_number.ev_charge_2025_cronostar_power_target
          allow_max_value: true
          missing_yaml_style: named
          global_prefix: cronostar_ev_
          profiles_select_entity: select.cronostar_ev_current_profile
          y_axis_label: "Potenza (kW)"
          unit_of_measurement: "kW"
          min_value: 0
          max_value: 12
          step_value: 0.5

      # CONFIGURAZIONE BATTERIA (Senza byd_min_soc_stop che è tra le regolazioni principali)
      - type: conditional
        conditions:
          - entity: input_select.ev_charge_2025_mode
            state: "Automatico"
        card:
          type: entities
          title: "🔋 Configurazione Dinamica BYD"
          entities:
            - entity: input_number.ev_charge_2025_byd_protection_soc
              name: "Soglia Protezione (Stop)"
            - entity: input_number.ev_charge_2025_byd_inversion_soc
              name: "Soglia Inversione (100% Sole)"
            - entity: input_number.ev_charge_2025_byd_max_discharge_soc
              name: "Soglia Scarica Max"
            - entity: input_number.ev_charge_2025_byd_max_charge_power
              name: "Carica Max BYD (kW)"
            - entity: input_number.ev_charge_2025_byd_max_discharge_power
              name: "Scarica Max BYD (kW)"

      # ALTRE IMPOSTAZIONI (Fondo pagina)
      - type: entities
        title: "⚙️ Altre Impostazioni"
        show_header_toggle: false
        entities:
          - type: conditional
            conditions: [{ entity: input_select.ev_charge_2025_mode, state: "Manuale" }]
            row:
              entity: input_number.ev_charge_2025_manual_power_kw
              name: "Potenza Manuale (kW)"
          - type: conditional
            conditions: [{ entity: input_select.ev_charge_2025_mode, state: "Manuale" }]
            row:
              entity: input_boolean.ev_charge_2025_no_grid
              name: "Escludi Rete (Solo Manuale)"
          - entity: input_boolean.ev_charge_2025_no_grid_2025
            name: "Forza Ricarica BYD (Bypass Protezione)"
          - entity: input_number.ev_charge_2025_battery_capacity
            name: "Capacità Batteria (kWh)"
          - entity: input_number.ev_charge_2025_duration
            name: "Durata (minuti)"

      # INERZIA CORRENTE (Fondo pagina)
      - type: entities
        title: "Inerzia variazione corrente"
        show_header_toggle: false
        entities:
          - entity: input_number.ev_charge_2025_current_min_delta_a
            name: "Variazione minima per nuovo invio"
          - entity: input_number.ev_charge_2025_current_min_interval_min
            name: "Tempo minimo tra variazioni"
          - entity: input_text.ev_charge_2025_last_current_change_time
            name: "Ultima variazione inviata"

  # ============================================================================
  # TAB 2: GRAFICI
  # ============================================================================
  - title: Grafici
    path: grafici
    cards:
      - type: custom:apexcharts-card
        graph_span: 12h
        header: { show: true, title: "Potenza Ricarica (W)", show_states: true }
        series: [{ entity: sensor.prism_potenza, name: "Prism", type: area, color: "#03a9f4" }]

      - type: custom:apexcharts-card
        graph_span: 12h
        header: { show: true, title: "Breakdown Sorgenti", show_states: true }
        chart_type: donut
        series:
          - { entity: sensor.ev_charge_2025_power_from_solar, name: Sole, color: "#FFD93D" }
          - { entity: sensor.ev_charge_2025_power_from_battery, name: Batt, color: "#6BCF7F" }
          - { entity: sensor.ev_charge_2025_power_from_grid, name: Rete, color: "#95A5A6" }

      - type: custom:apexcharts-card
        graph_span: 24h
        header: { show: true, title: "Stato Carica (%)", show_states: true }
        series:
