title: EV Charging 2025 effettivo
views:
  # ============================================================================
  # TAB 1: CONTROLLI
  # ============================================================================
  - title: Controlli
    path: controlli
    cards:
      # HEADER STATO
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.ev_charge_2025_reason') }}"
            secondary: "Prism: {{ states('sensor.prism_stato_wallbox') }} (Rev. 31)"
            icon_color: >
              {% if is_state('binary_sensor.ev_charge_2025_can_charge', 'off') %} orange
              {% elif is_state('input_boolean.ev_charge_2025_charging_active', 'on') %} green
              {% else %} blue {% endif %}

          - type: custom:mushroom-template-card
            primary: "Gestione"
            secondary: "{{ states('input_select.ev_charge_2025_mode') }}"
            icon: >
              {% if is_state('input_select.ev_charge_2025_mode', 'Manuale') %} mdi:hand-back-right
              {% else %} mdi:robot {% endif %}
            icon_color: indigo
            tap_action:
              action: call-service
              service: input_select.select_next
              target: { entity_id: input_select.ev_charge_2025_mode }

      # RIEPILOGO STATO
      - type: markdown
        content: >
          {% set mins = states('sensor.ev_charge_2025_time_to_limit') | int(0) %}
          {% set h = mins // 60 %}
          {% set m = mins % 60 %}
          {% set end_time = (now() + timedelta(minutes=mins)).strftime('%H:%M') %}
          **Stato Operativo:** {{ states('sensor.ev_charge_2025_reason') }}

          **Tempo Stimato alla Fine:** {{ end_time }} ({{h}}h{{ "%02d"|format(m) }}'00")

          **Parametri Real-time:**
          - **Solar Max:** {{ states('sensor.ev_charge_2025_solar_max_ampere') }} A
          - **Tensione:** {{ states('sensor.folini_carlo_voltage_ac') }} V
          - **MQTT Inviato:** {{ states("input_text.ev_charge_2025_last_mqtt_payload") }} A ({{ states("input_text.ev_charge_2025_last_mqtt_time") }})

      # GRAFICI SOC E POTENZA
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.ev_charge_2025_current_soc
            name: Batteria Auto
            unit: "%"
            severity:
              green: 60
              yellow: 20
              red: 0
          - type: gauge
            entity: sensor.byd_battery_box_premium_hv_state_of_charge
            name: Batteria Casa
            unit: "%"
            severity:
              green: 50
              yellow: 20
              red: 0

      - type: gauge
        entity: sensor.prism_potenza_assorbita
        name: Potenza Ricarica
        unit: "W"
        min: 0
        max: 7400
        needle: true
        severity:
          green: 0
          yellow: 3000
          red: 6000

      # INPUT PRINCIPALI
      - type: entities
        show_header_toggle: false
        entities:
          - type: conditional
            conditions: [{ entity: input_select.ev_charge_2025_mode, state: "Manuale" }]
            row:
              entity: input_number.ev_charge_2025_manual_power_kw
              name: "Potenza Manuale (kW)"
          - entity: input_number.ev_charge_2025_vehicle_limit_soc
            name: "Obiettivo Carica %"
          - entity: input_number.ev_charge_2025_battery_capacity
            name: "Capacità Batteria (kWh)"
          - entity: input_number.ev_charge_2025_target_soc
            name: "Soglia Minima %"
          - entity: input_number.ev_charge_2025_duration
            name: "Durata (minuti)"

      # TASTO AVVIO
      - type: conditional
        conditions: [{ entity: binary_sensor.ev_charge_2025_can_charge, state: "on" }]
        card:
          type: custom:mushroom-template-card
          primary: >
            {{ 'FERMA RICARICA' if is_state('input_boolean.ev_charge_2025_charging_active', 'on') else 'AVVIA RICARICA' }}
          icon: >
            {{ 'mdi:stop-circle' if is_state('input_boolean.ev_charge_2025_charging_active', 'on') else 'mdi:play-circle' }}
          icon_color: >
            {{ 'red' if is_state('input_boolean.ev_charge_2025_charging_active', 'on') else 'green' }}
          layout: horizontal
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target: { entity_id: input_boolean.ev_charge_2025_charging_active }

      # --- PROGRAMMAZIONE (Solo Automatico) ---
      - type: conditional
        conditions:
          - entity: input_select.ev_charge_2025_mode
            state: "Automatico"
        card:
          type: custom:cronostar-card
          preset: ev_charging
          title: "Programmazione Oraria"
          hour_base: { value: 0, determined: false }
          logging_enabled: true
          enabled_entity: switch.cronostar_ev_enabled
          target_entity: input_number.ev_charge_2025_cronostar_power_target
          allow_max_value: true
          missing_yaml_style: named
          global_prefix: cronostar_ev_
          profiles_select_entity: select.cronostar_ev_current_profile
          y_axis_label: "Potenza (kW)"
          unit_of_measurement: "kW"
          min_value: 0
          max_value: 12
          step_value: 0.5

      # CONFIGURAZIONE BATTERIA
      - type: conditional
        conditions:
          - entity: input_select.ev_charge_2025_mode
            state: "Automatico"
        card:
          type: entities
          title: "🔋 Configurazione Dinamica BYD"
          entities:
            - entity: input_number.ev_charge_2025_byd_protection_soc
              name: "Soglia Protezione (Stop)"
            - entity: input_number.ev_charge_2025_byd_inversion_soc
              name: "Soglia Inversione (100% Sole)"
            - entity: input_number.ev_charge_2025_byd_max_discharge_soc
              name: "Soglia Scarica Max"
            - entity: input_number.ev_charge_2025_byd_max_charge_power
              name: "Carica Max BYD (kW)"
            - entity: input_number.ev_charge_2025_byd_max_discharge_power
              name: "Scarica Max BYD (kW)"

  # ============================================================================
  # TAB 2: GRAFICI
  # ============================================================================
  - title: Grafici
    path: grafici
    cards:
      - type: custom:apexcharts-card
        graph_span: 12h
        header: { show: true, title: "Potenza Ricarica (W)", show_states: true }
        series: [{ entity: sensor.prism_potenza_assorbita, name: "Prism", type: area, color: "#03a9f4" }]

      - type: custom:apexcharts-card
        graph_span: 12h
        header: { show: true, title: "Breakdown Sorgenti", show_states: true }
        chart_type: donut
        series:
          - { entity: sensor.ev_charge_2025_power_from_solar, name: Sole, color: "#FFD93D" }
          - { entity: sensor.ev_charge_2025_power_from_battery, name: Batt, color: "#6BCF7F" }
          - { entity: sensor.ev_charge_2025_power_from_grid, name: Rete, color: "#95A5A6" }

      - type: custom:apexcharts-card
        graph_span: 24h
        header: { show: true, title: "Stato Carica (%)", show_states: true }
        series:
          - { entity: sensor.ev_charge_2025_current_soc, name: "Auto", color: "#FFD93D" }
          - { entity: sensor.byd_battery_box_premium_hv_state_of_charge, name: "Batteria Casa", color: "#6BCF7F" }

  # ============================================================================
  # TAB 3: GUIDA
  # ============================================================================
  - title: Guida
    path: guida
    cards:
      - type: markdown
        title: "📘 Manuale Operativo EV 2025"
        content: >
          ### 🔌 Modalità di Gestione

          1. Manuale

          Il sistema invia alla Prism la potenza esatta impostata nello slider Potenza Manuale. Ignora completamente la produzione solare e lo stato della batteria di casa. Utile per ricariche d'urgenza.

          2. Automatico

          La ricarica viene modulata in tempo reale in base al surplus solare e allo stato della batteria di casa, seguendo una curva dinamica di protezione.

          **🔋 Parametri Batteria BYD**

          - **Soglia Protezione**: Sotto questa percentuale (es. 10%), l'auto viene spenta per dare priorità assoluta alla ricarica della batteria di casa.

          - **Soglia Inversione**: È il punto di equilibrio (es. 30%). Tra Protezione e Inversione, il sole viene diviso tra auto e batteria. Al raggiungimento di questa soglia, l'auto usa il 100% del surplus solare.

          - **Soglia Scarica Max**: Oltre questa soglia (es. 90%), la batteria di casa aiuta l'auto con la massima potenza di scarica impostata.

          - **Carica/Scarica Max (kW)**: Limiti hardware per proteggere la batteria BYD durante le fasi di aiuto alla ricarica EV.

          ---

          ### 🚗 Parametri Veicolo

          - **Obiettivo Carica**: Percentuale di SOC dell'auto oltre la quale la ricarica si ferma automaticamente.

          - **Soglia Minima**: Se il SOC dell'auto è sotto questa soglia, il sistema forzerà la ricarica a 6A anche se non c'è sole (usando la batteria di casa se sopra la soglia di inversione).

          - **Durata**: Timer di spegnimento automatico. Se impostato a 240, il limite è disattivato.
