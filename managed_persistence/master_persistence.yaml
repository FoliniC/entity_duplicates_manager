
trigger:
  - platform: state
    entity_id: climate.climatizzazione_appartamento
    not_to:
      - "unknown"
      - "unavailable"
  - platform: homeassistant
    event: start

sensor:
  - name: "Fancoil System Saved HVAC Mode"
    unique_id: fancoil_system_saved_hvac_mode
    state: >-
      {% set current = states('climate.climatizzazione_appartamento') %}
      {% if current in ['heat', 'cool', 'dry', 'fan_only'] %}
        {{ current }}
      {% else %}
        {{ this.state | default('heat') }}
      {% endif %}
    icon: mdi:hvac
