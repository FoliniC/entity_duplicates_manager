- name: "th1a_temperature_humidity_temperature_last"
  unique_id: th1a_temperature_humidity_temperature_last
  query: >
    SELECT COALESCE ((
      SELECT CAST(states.state AS DOUBLE) as state
      FROM
        states
      LEFT JOIN state_attributes ON (
        states.attributes_id = state_attributes.attributes_id
      )
      WHERE
         metadata_id = (
          SELECT metadata_id FROM states_meta WHERE entity_id = 'sensor.th1a_temperature_humidity_temperature'
        )
       AND states.state IS NOT NULL
       AND NOT states.state in ( 'unavailable', 'unknown')
       AND CAST(states.state AS DOUBLE) > -100
      ORDER BY states.state_id DESC
      LIMIT 1), -100.0 ) AS state;
  column: "state"
