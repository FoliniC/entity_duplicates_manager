- name: Sun state
  unique_id: sun_state_123
  query: >
    SELECT
      states.state
    FROM
      states
      LEFT JOIN state_attributes ON (
        states.attributes_id = state_attributes.attributes_id
      )
    WHERE
      metadata_id = (
        SELECT
          metadata_id
        FROM
          states_meta
        where
          entity_id = 'sun.sun'
      )
    ORDER BY
      state_id DESC
    LIMIT
      1;
  column: "state"
