sensor.fronius_smartmeter_energy_ac_consumed:
  state_class: measurement
  last_reset: 1970-01-01T00:00:00+00:00
sensor.fronius_smartmeter_energy_ac_sold:
  state_class: measurement
  last_reset: 1970-01-01T00:00:00+00:00
sensor.forward_energy:
  unit_of_measurement: kWh
sensor.misuratore_canale_b:
  unit_of_measurement: kWh
sensor.wifi_dual_meter_b_new_a_old_energy_a:
  unit_of_measurement: kWh
sensor.wifi_dual_meter_b_new_a_old_energy_b:
  unit_of_measurement: kWh
sensor.wifi_dual_meter_b_new_a_old_reverse_energy_a:
  unit_of_measurement: kWh
sensor.wifi_dual_meter_b_new_a_old_reverse_energy_b:
  unit_of_measurement: kWh
sensor.wifi_dual_meter_b_new_a_old_power_a:
