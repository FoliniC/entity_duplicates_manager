# Gruppo device Alexa Echo Dot
# Usato per comandi di riproduzione (play/stop/volume) che devono essere eseguiti
# contemporaneamente su entrambi i device.
alexa_echo_dots:
  name: Alexa Echo Dots (Cucina + Camera)
  entities:
    - media_player.cucina
    - media_player.camera

# Gruppo notifiche dispositivi mobile
# Usato per inviare notifiche a tutti i dispositivi mobile dell'utente
# indipendentemente dal device specifico (device-agnostic).
notify_mobile_devices:
  name: Dispositivi Mobile (Notifiche)
  entities:
    - notify.redmi_note_13_pro_5g
    - notify.mobile_app_ultra17