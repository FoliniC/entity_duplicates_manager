# ============================================================================
# MODBUS CONFIGURATION - ALFA SMART METER
# ============================================================================

- name: Alfa new
  type: tcp
  host: 192.168.0.101
  port: 6668
  
  sensors:
    # ========================================
    # POTENZA ISTANTANEA
    # ========================================
    - name: Alfa new Potenza Attiva Prelevata Istantanea
      unique_id: alfa_potenza_attiva_prelevata_istantanea
      device_class: power
      unit_of_measurement: W
      state_class: measurement
      data_type: uint16
      address: 2

    - name: Alfa new Potenza Attiva Immessa Istantanea
      unique_id: alfa_potenza_attiva_immessa_istantanea
