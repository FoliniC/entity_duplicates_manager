views:
  - title: Traffico internet
    path: traffico-internet
    icon: mdi:router-wireless
    type: sidebar
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # --- COLONNA 1 (Sinistra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  # 🩺 Diagnosi Avanzata
                  Analisi automatica della linea.
                  
                  ---
                  🚀 **Boost Mode**: Monitoraggio rapido configurabile.
                  *Ottimizzato con SSH Multiplexing per il minimo carico.*
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: vertical-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_number.network_boost_duration
                        name: "Durata Boost (sec)"
                      - entity: input_number.network_boost_interval
                        name: "Frequenza Boost (sec)"
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(255, 165, 0, 0.1);
                            border: 1px solid orange;
                          {% endif %}
                        }

                  # MESSAGGIO STATO/ERRORE (Sempre presente ma cambia colore)
                  - type: markdown
                    content: >
                      {% set error = states('sensor.network_boost_validation_error') %}
                      {% if error == 'OK' %}
                        <div style="background-color: #4caf50; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center;">
                          ✅ Parametri Corretti
                        </div>
                      {% else %}
                        <div style="background-color: #f44336; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center;">
                          ⚠️ {{ error }}
                        </div>
                      {% endif %}
                    card_mod:
                      style: "ha-card { margin: 5px 0; border: none; background: none; }"

                  # Bottone ATTIVO
                  - type: conditional
                    conditions:
                      - entity: sensor.network_boost_validation_error
                        state: "OK"
                      - entity: input_boolean.network_boost_mode
                        state: "off"
                    card:
                      type: button
                      name: "AVVIA MONITORAGGIO RAPIDO"
                      icon: mdi:timer-play
                      tap_action:
                        action: perform-action
                        perform_action: input_button.press
                        target:
                          entity_id: input_button.start_network_boost

                  # Bottone DISABILITATO (Se Errore)
                  - type: conditional
                    conditions:
                      - entity: sensor.network_boost_validation_error
                        state_not: "OK"
                    card:
                      type: button
                      name: "AVVIO BLOCCATO"
                      icon: mdi:timer-off
                      tap_action: { action: none }
                      card_mod:
                        style: "ha-card { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }"

                  - type: entities
                    entities:
                      - entity: input_boolean.network_boost_mode
                        name: "Stato Boost"
                      - entity: sensor.network_boost_countdown
                        name: "Tempo Rimanente"
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(255, 165, 0, 0.1);
                            border: 1px solid orange;
                          {% endif %}
                        }

              - type: conditional
                conditions:
                  - entity: input_boolean.network_boost_mode
                    state: "off"
                  - entity: sensor.network_boost_speed_max
                    state_not: "0.0"
                card:
                  type: entities
                  title: "🏁 Risultati Ultimo Boost"
                  entities:
                    - entity: sensor.network_boost_speed_min
                      name: "Velocità Minima"
                    - entity: sensor.network_boost_speed_max
                      name: "Velocità Massima"
                    - entity: sensor.network_boost_speed_avg
                      name: "Velocità Media"
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid #4caf50;
                        background: rgba(76, 175, 80, 0.05);
                        user-select: text !important;
                      }

              - type: entity
                entity: sensor.network_status_diagnosis
                name: "Stato Rete"
                card_mod:
                  style: |
                    ha-card { 
                      user-select: text !important;
                      --paper-item-icon-color: {% if is_state('sensor.network_status_diagnosis', 'OK') %} green {% else %} red {% endif %};
                    }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.internet_packet_loss
                    name: Loss (%)
                  - type: sensor
                    entity: sensor.internet_jitter
                    name: Jitter (ms)
                  - type: sensor
                    entity: sensor.wan_saturation_percent
                    name: Saturazione (%)

              - type: markdown
                content: "## 📊 Riepilogo Storico (Top 10)"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: custom:flex-table-card
                entities:
                  - entity: sensor.router_traffic_stats
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Dispositivo
                    data: top_consumers
                    modify: x.name
                  - name: Totale (MB)
                    data: top_consumers
                    modify: x.total_rx_mb
                sort_by: Totale (MB)-

          # --- COLONNA 2 (Destra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "# ⚡ Real-time\nAndamento istantaneo."
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.wan_download_speed_realtime
                    name: Down (kbps)
                    card_mod:
                      style: |
                        ha-card { 
                          user-select: text !important;
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(30, 136, 229, 0.2) !important;
                            border: 1px solid #1e88e5;
                          {% endif %}
                        }
                  - type: sensor
                    entity: sensor.wan_upload_speed_realtime
                    name: Up (kbps)
                    card_mod:
                      style: |
                        ha-card { 
                          user-select: text !important;
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(229, 57, 53, 0.2) !important;
                            border: 1px solid #e53935;
                          {% endif %}
                        }
                  - type: sensor
                    entity: sensor.internet_ping
                    name: Ping (ms)

              - type: custom:apexcharts-card
                graph_span: 15m
                header:
                  show: true
                  show_states: true
                  colorize_states: true
                  title: Velocità di Rete (kbps)
                card_mod: { style: "ha-card { user-select: text !important; }" }
                series:
                  - entity: sensor.wan_download_speed_realtime
                    name: Download
                    color: "#1e88e5"
                    type: area
                  - entity: sensor.wan_upload_speed_realtime
                    name: Upload
                    color: "#e53935"
                    type: area
                yaxis:
                  - min: 0
                    apex_config:
                      forceNiceScale: true

              - type: custom:flex-table-card
                title: "📋 Chi sta usando banda ORA?"
                entities:
                  - entity: sensor.realtime_per_device_speed
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Device
                    data: devices
                    modify: x.name
                  - name: Down (kbps)
                    data: devices
                    modify: x.rx_kbps
                  - name: Up (kbps)
                    data: devices
                    modify: x.tx_kbps
                sort_by: Down (kbps)-
