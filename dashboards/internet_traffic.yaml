views:
  - title: Traffico internet
    path: traffico-internet
    icon: mdi:router-wireless
    cards:
      - type: markdown
        content: "# 📊 Monitoraggio Traffico Internet\nAnalisi della banda in tempo reale."
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.router_total_download
            name: Download Totale (MB)
          - type: sensor
            entity: sensor.router_total_upload
            name: Upload Totale (MB)

      - type: markdown
        content: "## 📋 Dati testuali"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: entities
        entities:
          - entity: sensor.router_top_1_consumer_name
            name: "1° Nome"
          - entity: sensor.router_top_1_consumer_value
            name: "1° Valore"
          - entity: sensor.router_top_2_consumer_name
            name: "2° Nome"
          - entity: sensor.router_top_2_consumer_value
            name: "2° Valore"
          - entity: sensor.router_realtime_top_consumer
            name: "Velocità Istantanea"
        card_mod:
          style: |
            ha-card { 
              user-select: text !important; 
            }
            .card-content {
              user-select: text !important;
            }

      - type: markdown
        content: "## 📈 Top 5 Dispositivi (MB)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        experimental:
          disable_config_validation: true
        header:
          show: true
          title: "Router Top Consumers"
          show_states: true
        apex_config:
          chart:
            type: bar
            height: 400
          plotOptions:
            bar:
              distributed: true
              borderRadius: 6
          xaxis:
            type: category
          yaxis:
            min: 0
          tooltip:
            enabled: true
            shared: false
            intersect: false
        series:
          - entity: sensor.router_top_consumers_chart_data
            name: "Traffico"
            type: column
            data_generator: |
              return function(entity) {
                if (!entity || !entity.attributes || !entity.attributes.data) {
                  return [];
                }
                return entity.attributes.data;
              }

      - type: markdown
        content: "## 📉 Velocità di Rete (kbps)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        graph_span: 30m
        header:
          show: true
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.router_download_speed
            name: Download
            color: "#1e88e5"
            type: area
          - entity: sensor.router_upload_speed
            name: Upload
            color: "#e53935"
            type: area
        yaxis:
          - min: 0
            apex_config:
              forceNiceScale: true

      - type: markdown
        content: "## 📋 Tabella Dettaglio Completa"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:flex-table-card
        entities:
          - entity: sensor.router_traffic_stats
        card_mod:
          style: |
            ha-card { user-select: text !important; }
            tbody tr td { user-select: text !important; }
        columns:
          - name: Dispositivo
            data: top_consumers
            modify: x.name
          - name: IP
            data: top_consumers
            modify: x.ip
          - name: Down (kbps)
            data: top_consumers
            modify: x.rx_kbps
            align: center
          - name: Up (kbps)
            data: top_consumers
            modify: x.tx_kbps
            align: center
          - name: Totale (MB)
            data: top_consumers
            modify: x.total_rx_mb
            align: center
        sort_by: Down (kbps)-
