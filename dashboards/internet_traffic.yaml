views:
  - title: Traffico internet
    path: traffico-internet
    icon: mdi:router-wireless
    type: sidebar
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # --- COLONNA 1 (Sinistra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  # 🩺 Diagnosi Avanzata
                  Analisi automatica della linea.
                  
                  ---
                  🚀 **Boost Mode**: Monitoraggio rapido configurabile.
                  *Ottimizzato con SSH Multiplexing per il minimo carico.*
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: vertical-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_number.network_boost_duration
                        name: "Durata Boost (sec)"
                      - entity: input_number.network_boost_interval
                        name: "Frequenza Boost (sec)"
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(255, 165, 0, 0.1);
                            border: 1px solid orange;
                          {% endif %}
                        }

                  # BOX STATO / ERRORE
                  - type: markdown
                    content: >
                      {% set error = states('sensor.network_boost_validation_error') %}
                      {% if error == 'OK' %}
                        <div style="background-color: #4caf50; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center;">
                          ✅ Parametri Corretti
                        </div>
                      {% else %}
                        <div style="background-color: #f44336; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center;">
                          ⚠️ {{ error }}
                        </div>
                      {% endif %}
                    card_mod:
                      style: "ha-card { margin: 5px 0; border: none; background: none; }"

                  # BOTTONE AVVIA (Solo se OK e OFF)
                  - type: conditional
                    conditions:
                      - entity: sensor.network_boost_validation_error
                        state: "OK"
                      - entity: input_boolean.network_boost_mode
                        state: "off"
                    card:
                      type: button
                      name: "AVVIA MONITORAGGIO RAPIDO"
                      icon: mdi:timer-play
                      tap_action:
                        action: perform-action
                        perform_action: input_button.press
                        target:
                          entity_id: input_button.start_network_boost
                      card_mod:
                        style: |
                          ha-card {
                            background: #1e88e5 !important;
                            --mdc-theme-primary: white;
                          }

                  # BOTTONE DISABILITATO / IN CORSO
                  - type: conditional
                    conditions:
                      - entity: input_boolean.network_boost_mode
                        state: "on"
                    card:
                      type: button
                      name: "BOOST IN CORSO..."
                      icon: mdi:rocket-launch
                      tap_action: { action: none }
                      card_mod:
                        style: |
                          ha-card {
                            background: orange !important;
                            --mdc-theme-primary: white;
                            cursor: wait;
                          }

                  - type: entities
                    entities:
                      - entity: input_boolean.network_boost_mode
                        name: "Stato Boost"
                      - entity: sensor.network_boost_countdown
                        name: "Tempo Rimanente"
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(255, 165, 0, 0.1);
                            border: 1px solid orange;
                          {% endif %}
                        }

              - type: conditional
                conditions:
                  - entity: input_boolean.network_boost_mode
                    state: "off"
                  - entity: sensor.network_boost_dl_max
                    state_not: "0.0"
                card:
                  type: vertical-stack
                  cards:
                    - type: entities
                      title: "🏁 Risultati Ultimo Boost (Download)"
                      entities:
                        - entity: sensor.network_boost_dl_min
                          name: "Velocità Minima DL"
                        - entity: sensor.network_boost_dl_max
                          name: "Velocità Massima DL"
                        - entity: sensor.network_boost_dl_avg
                          name: "Velocità Media DL"
                      card_mod:
                        style: |
                          ha-card {
                            border: 1px solid #1e88e5;
                            background: rgba(30, 136, 229, 0.05);
                            user-select: text !important;
                          }
                    - type: entities
                      title: "🏁 Risultati Ultimo Boost (Upload)"
                      entities:
                        - entity: sensor.network_boost_ul_min
                          name: "Velocità Minima UL"
                        - entity: sensor.network_boost_ul_max
                          name: "Velocità Massima UL"
                        - entity: sensor.network_boost_ul_avg
                          name: "Velocità Media UL"
                      card_mod:
                        style: |
                          ha-card {
                            border: 1px solid #e53935;
                            background: rgba(229, 57, 53, 0.05);
                            user-select: text !important;
                          }

              - type: entities
                title: "☁️ Tunnel Cloudflare"
                entities:
                  - entity: switch.cloudflare_tunnel
                    name: "Stato Tunnel"
                  - entity: automation.gestione_cloudflare_presence
                    name: "Gestione Automatica Presenza"
                  - entity: automation.cloudflare_tunnel_watchdog
                    name: "Watchdog Automatico"

              - type: entity
                entity: sensor.network_status_diagnosis
                name: "Stato Rete"
                card_mod:
                  style: |
                    ha-card { 
                      user-select: text !important;
                      --paper-item-icon-color: {% if is_state('sensor.network_status_diagnosis', 'OK') %} green {% else %} red {% endif %};
                    }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.internet_packet_loss
                    name: Loss (%)
                  - type: sensor
                    entity: sensor.internet_jitter
                    name: Jitter (ms)
                  - type: sensor
                    entity: sensor.wan_saturation_percent
                    name: Saturazione (%)

              - type: markdown
                content: "## 📊 Riepilogo Storico (Top 10)"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: custom:flex-table-card
                entities:
                  - entity: sensor.router_traffic_stats
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Dispositivo
                    data: top_consumers
                    modify: x.name
                  - name: Totale (MB)
                    data: top_consumers
                    modify: x.total_rx_mb
                sort_by: Totale (MB)-

              # --- STATISTICA PERIODO PERSONALIZZATO ---
              - type: markdown
                content: "## 📅 Utilizzo Periodico (dal {{ states('sensor.internet_usage_period_start_date') | default('23') }})"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: entities
                title: "⚙️ Impostazioni Periodo"
                entities:
                  - entity: input_number.internet_usage_start_day
                    name: "Giorno inizio (default: 23)"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: sensor
                entity: sensor.internet_usage_period_total
                name: "Totale Periodo (MB)"
                icon: mdi:web
                card_mod:
                  style: |
                    ha-card { user-select: text !important; background: rgba(30, 136, 229, 0.05); }

              - type: custom:flex-table-card
                entities:
                  - entity: sensor.internet_usage_periodic
                card_mod:
                  style: "ha-card { user-select: text !important; }"
                columns:
                  - name: Dispositivo
                    data: period_by_device
                    modify: x.name
                  - name: Consumo (MB)
                    data: period_by_device
                    modify: x.period_rx_mb
                sort_by: Consumo (MB)-

              - type: button
                name: "Resetta Statistiche Periodo"
                icon: mdi:calendar-refresh
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.reset_period_snapshot
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 165, 0, 0.1) !important;
                      border: 1px solid orange;
                    }

          # --- COLONNA 2 (Destra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "# ⚡ Real-time\nAndamento istantaneo."
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.wan_download_speed_realtime
                    name: Down (kbps)
                    card_mod:
                      style: |
                        ha-card { 
                          user-select: text !important;
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(30, 136, 229, 0.2) !important;
                            border: 1px solid #1e88e5;
                          {% endif %}
                        }
                  - type: sensor
                    entity: sensor.wan_upload_speed_realtime
                    name: Up (kbps)
                    card_mod:
                      style: |
                        ha-card { 
                          user-select: text !important;
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(229, 57, 53, 0.2) !important;
                            border: 1px solid #e53935;
                          {% endif %}
                        }
                  - type: sensor
                    entity: sensor.internet_ping
                    name: Ping (ms)

              - type: custom:apexcharts-card
                graph_span: 15m
                header:
                  show: true
                  show_states: true
                  colorize_states: true
                  title: Velocità di Rete (kbps)
                card_mod: { style: "ha-card { user-select: text !important; }" }
                series:
                  - entity: sensor.wan_download_speed_realtime
                    name: Download
                    color: "#1e88e5"
                    type: area
                  - entity: sensor.wan_upload_speed_realtime
                    name: Upload
                    color: "#e53935"
                    type: area
                yaxis:
                  - min: 0
                    apex_config:
                      forceNiceScale: true

              - type: custom:flex-table-card
                title: "📋 Chi sta usando banda ORA?"
                entities:
                  - entity: sensor.realtime_per_device_speed
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Device
                    data: devices
                    modify: x.name
                  - name: Down (kbps)
                    data: devices
                    modify: x.rx_kbps
                  - name: Up (kbps)
                    data: devices
                    modify: x.tx_kbps
                sort_by: Down (kbps)-

              - type: markdown
                content: "## 📈 Andamento Top 5 Dispositivi"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_select.network_graph_span
                        name: "Range"
                  - type: button
                    name: "RESET DATI"
                    icon: mdi:counter
                    tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.reset_network_counters
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(255, 165, 0, 0.1) !important;
                          height: 100%;
                        }

              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "15 minuti"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 15m
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (15m)" }
                      series: &series_config
                        - entity: sensor.top_device_1_kbps
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_2_kbps
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_3_kbps
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_4_kbps
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_5_kbps
                          type: area
                          group_by: { func: avg, duration: 1m }
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "30 minuti"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 30m
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (30m)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "1 ora"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 1h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (1h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "3 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 3h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (3h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "6 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 6h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (6h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "12 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 12h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (12h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "24 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 24h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (24h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

  # ==========================================================================
  # TAB: TETHERING USB
  # Controllo tethering USB - singolo click per attivare.
  # ==========================================================================
  - title: Tethering USB
    path: tethering-usb
    icon: mdi:usb
    type: sidebar
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # --- COLONNA SINISTRA ---
          - type: vertical-stack
            cards:
              # BANNER STATO PRINCIPALE
              - type: markdown
                content: >
                  {% set st = states('sensor.usb_tether_status') %}
                  {% set msg = states('sensor.usb_tether_dashboard') %}
                  {% set txt_msg = states('input_text.usb_tether_status_message') %}
                  {% set rm = state_attr('sensor.usb_tether_status', 'remaining_min') | int(0) %}
                  {% set active_since = state_attr('sensor.usb_tether_status', 'active_since') %}
                  {% if st == 'active' %}
                    {% set bg = '#2e7d32' %}
                    {% set icon = '✅' %}
                  {% elif st == 'activating' or st == 'restoring' or 'in corso' in txt_msg %}
                    {% set bg = '#e65100' %}
                    {% set icon = '⏳' %}
                  {% elif st == 'error' or st == 'unavailable' or 'ERRORE' in txt_msg %}
                    {% set bg = '#b71c1c' %}
                    {% set icon = '⚠️' %}
                  {% else %}
                    {% set bg = '#37474f' %}
                    {% set icon = '💤' %}
                  {% endif %}
                  <div style="background-color: {{ bg }}; color: white; padding: 16px; border-radius: 8px; font-weight: bold; text-align: center; font-size: 18px;">
                    {{ icon }} {{ msg }}
                  </div>
                  {% if st == 'active' %}
                  <div style="margin-top: 4px; text-align: center; color: #888; font-size: 12px;">
                    attivato {{ active_since }}
                    {% if rm > 0 %}
                    • scade tra ~{{ rm }} min
                    {% endif %}
                  </div>
                  {% endif %}
                card_mod:
                  style: "ha-card { margin: 4px 0; border: none; background: none; }"

              # 4 BOTTONI - SINGOLO CLICK
              - type: horizontal-stack
                cards:
                  - type: button
                    name: "🔄 Normale"
                    icon: mdi:router-wireless
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_normale
                    card_mod:
                      style: |
                        ha-card {
                          {% if not is_state('sensor.usb_tether_status', 'active') %}
                            background: #2e7d32 !important;
                          {% else %}
                            background: #455a64 !important;
                          {% endif %}
                          --mdc-theme-primary: white;
                        }

                  - type: button
                    name: "📱 Server"
                    icon: mdi:server
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_server
                    card_mod:
                      style: |
                        ha-card {
                          {% set m = state_attr('sensor.usb_tether_status', 'mode') | default('') %}
                          {% if is_state('sensor.usb_tether_status', 'active') and (m == 'server' or m == '') %}
                            background: #1e88e5 !important;
                          {% else %}
                            background: #455a64 !important;
                          {% endif %}
                          --mdc-theme-primary: white;
                        }

                  - type: button
                    name: "🌐 Intranet"
                    icon: mdi:wan
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_intranet
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('sensor.usb_tether_status', 'active') and state_attr('sensor.usb_tether_status', 'mode') == 'intranet' %}
                            background: #e65100 !important;
                          {% else %}
                            background: #455a64 !important;
                          {% endif %}
                          --mdc-theme-primary: white;
                        }

                  - type: button
                    name: "🔴 Reset"
                    icon: mdi:alert-circle-outline
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_reset
                    hold_action:
                      action: none
                    card_mod:
                      style: |
                        ha-card {
                          background: #b71c1c !important;
                          --mdc-theme-primary: white;
                          font-weight: bold;
                          border: 2px solid #ff5252;
                        }

              # BOTTONI UTILITÀ SECONDARIE (ADB & SCRCPY)
              - type: horizontal-stack
                cards:
                  - type: button
                    name: "⚡ Riattiva ADB"
                    icon: mdi:cellphone-link
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_riattiva_router
                    card_mod:
                      style: |
                        ha-card {
                          background: #0288d1 !important;
                          --mdc-theme-primary: white;
                          font-size: 13px;
                          margin-top: 4px;
                        }

                  - type: button
                    name: "📱 Avvia SCRCPY"
                    icon: mdi:cellphone-screenshot
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_launch_scrcpy
                    card_mod:
                      style: |
                        ha-card {
                          background: #6a1b9a !important;
                          --mdc-theme-primary: white;
                          font-size: 13px;
                          margin-top: 4px;
                        }

                  - type: button
                    name: "📱 SCRCPY LG-X150"
                    icon: mdi:cellphone-screenshot
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_launch_scrcpy_lg
                    card_mod:
                      style: |
                        ha-card {
                          background: #4a148c !important;
                          --mdc-theme-primary: white;
                          font-size: 13px;
                          margin-top: 4px;
                        }

                  - type: button
                    name: "📹 StreamPack RTMP"
                    icon: mdi:video-wireless
                    tap_action:
                      action: perform-action
                      perform_action: script.usb_tether_riavvia_streampack
                    card_mod:
                      style: |
                        ha-card {
                          background: #e65100 !important;
                          --mdc-theme-primary: white;
                          font-size: 13px;
                          margin-top: 4px;
                        }

                  - type: button
                    name: "Wifi off on phone"
                    icon: mdi:wifi-off
                    tap_action:
                      action: perform-action
                      perform_action: shell_command.usb_tether_wifi_off_router
                    card_mod:
                      style: |
                        ha-card {
                          background: #c62828 !important;
                          --mdc-theme-primary: white;
                          font-size: 13px;
                          margin-top: 4px;
                        }

                  - type: button
                    name: "Wifi on on phone"
                    icon: mdi:wifi
                    tap_action:
                      action: perform-action
                      perform_action: shell_command.usb_tether_wifi_on_router
                    card_mod:
                      style: |
                        ha-card {
                          background: #2e7d32 !important;
                          --mdc-theme-primary: white;
                          font-size: 13px;
                          margin-top: 4px;
                        }

              # Durata
              - type: entities
                title: "Durata (safety-net)"
                entities:
                  - entity: input_number.usb_tether_max_duration
                    name: "Minuti prima ripristino automatico"
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('sensor.usb_tether_status', 'active') %}
                        background: rgba(46, 125, 50, 0.1);
                        border: 1px solid #2e7d32;
                      {% endif %}
                    }

              # Dettagli tecnici
              - type: entities
                title: "Dettagli"
                entities:
                  - entity: sensor.usb_tether_dashboard
                    name: "Stato"
                    attribute: mode
                  - entity: input_select.usb_tether_host
                    name: "Server (tethering host)"
                  - entity: sensor.usb_tether_status
                    name: "Interfaccia telefono"
                    attribute: phone_if
                  - entity: sensor.usb_tether_status
                    name: "Gateway telefono"
                    attribute: phone_gw
                  - entity: sensor.usb_tether_status
                    name: "Attivo dalle"
                    attribute: active_since
                card_mod:
                  style: "ha-card { user-select: text !important; }"

              # LOG OPERAZIONI TETHERING
              - type: markdown
                title: "📋 Log Operazioni Tethering"
                content: >
                  **Stato corrente:** {{ states('sensor.usb_tether_dashboard') }}
                  
                  **Messaggio:** {{ states('input_text.usb_tether_status_message') }}
                  
                  **Dettagli sensore:**
                  - Stato: {{ states('sensor.usb_tether_status') }}
                  - Modalità: {{ state_attr('sensor.usb_tether_status', 'mode') | default('N/A') }}
                  - Interfaccia: {{ state_attr('sensor.usb_tether_status', 'phone_if') | default('N/A') }}
                  - Gateway: {{ state_attr('sensor.usb_tether_status', 'phone_gw') | default('N/A') }}
                  - Attivo da: {{ state_attr('sensor.usb_tether_status', 'active_since') | default('N/A') }}
                  - Minuti rimanenti: {{ state_attr('sensor.usb_tether_status', 'remaining_min') | int(0) }}
                  
                  **Log storico:** {{ state_attr('sensor.usb_tether_log', 'line_count') | int(0) }} righe, aggiornato {{ state_attr('sensor.usb_tether_log', 'updated') | default('N/A') }}
                  {% set log_text = state_attr('sensor.usb_tether_log', 'text') %}
                  {% if log_text %}
                  {{ log_text }}
                  {% else %}
                  _Nessun log disponibile_
                  {% endif %}
                card_mod:
                  style: |
                    ha-card {
                      font-family: monospace;
                      font-size: 12px;
                      line-height: 1.5;
                      white-space: pre-wrap;
                    }

              # Durata
              - type: entities
                title: "Durata (safety-net)"
                entities:
                  - entity: input_number.usb_tether_max_duration
                    name: "Minuti prima ripristino automatico"
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('sensor.usb_tether_status', 'active') %}
                        background: rgba(46, 125, 50, 0.1);
                        border: 1px solid #2e7d32;
                      {% endif %}
                    }

              # Dettagli tecnici
              - type: entities
                title: "Dettagli"
                entities:
                  - entity: sensor.usb_tether_dashboard
                    name: "Stato"
                    attribute: mode
                  - entity: input_select.usb_tether_host
                    name: "Server (tethering host)"
                  - entity: sensor.usb_tether_status
                    name: "Interfaccia telefono"
                    attribute: phone_if
                  - entity: sensor.usb_tether_status
                    name: "Gateway telefono"
                    attribute: phone_gw
                  - entity: sensor.usb_tether_status
                    name: "Attivo dalle"
                    attribute: active_since
                card_mod:
                  style: "ha-card { user-select: text !important; }"

          # --- COLONNA DESTRA ---
          - type: vertical-stack
            cards:
              # Istruzioni
              - type: markdown
                content: |
                  ## 📋 Come usarlo

                  **Modalità di rete**

                  | Bottone | Azione |
                  |---|---|
                  | 🔄 Normale | Ripristina routing normale via Router (4G/5G Phone 1) |
                  | 📱 Server | Solo il server Debian/Win accede a Internet via USB |
                  | 🌐 Intranet | Tutta la LAN va su Internet via host selezionato |
                  | 🔴 Reset | **Emergenza:** forza ripristino immediato del routing via shell, scavalca lo stato di HA |

                  **Utilità**

                  | Bottone | Azione |
                  |---|---|
                  | ⚡ Riattiva ADB | Riattiva il tethering RNDIS su Phone 1 via ADB (se il cavo USB è stato scollegato/ricollegato a caldo) |
                  | 📱 Avvia SCRCPY | Connette ADB a Phone 1 (192.168.0.14:5555) e apre lo schermo del telefono sul display di Debian |
                  | 📹 StreamPack RTMP | Rigenera la configurazione ed avvia lo streaming RTMP su rtmp://10.203.33.10:1935/live/telefono |

                  **Procedura**

                  1. Collega il cavo USB all'host desiderato.
                  2. Sul telefono: attiva **Tethering USB**.
                  3. Premi il bottone di modalità.
                  4. Per disattivare: premi **🔄 Normale**.
                card_mod:
                  style: "ha-card { user-select: text !important; }"

              # --- FLUSSO ARCHITETTURA DI RETE (SVG dinamico) ---
              - type: markdown
                content: >-
                  ![Architettura rete]({% if states('sensor.usb_tether_status') == 'active' and 'Debian' in states('input_select.usb_tether_host') %}/local/architettura-rete-debian.svg{% elif states('sensor.usb_tether_status') == 'active' and 'Windows' in states('input_select.usb_tether_host') %}/local/architettura-rete-win11.svg{% else %}/local/architettura-rete-normale.svg{% endif %})
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      border: none;
                      box-shadow: none;
                      padding: 8px 12px;
                    }
                    .md-block {
                      padding: 0 !important;
                    }

              # Tabella stato
              - type: markdown
                content: |
                  ### 📊 Tabella Stato Attuale

                  | Nodo | IP LAN | Stato Tethering | Percorso Internet |
                  |---|---|---|---|
                  | 📡 **Router OpenWrt** | `192.168.0.11` | {% if states('sensor.usb_tether_status') == 'active' and state_attr('sensor.usb_tether_status', 'mode') == 'intranet' %}⚠️ WAN Offline{% else %}🟢 WAN usb0 Attiva{% endif %} | {% if states('sensor.usb_tether_status') == 'active' and state_attr('sensor.usb_tether_status', 'mode') == 'intranet' %}Redirect su {{ 'Debian' if 'Debian' in states('input_select.usb_tether_host') else 'Win11' }}{% else %}Diretto su 4G/5G{% endif %} |
                  | 🐧 **Server Debian** | `192.168.0.3` | {% if 'Debian' in states('input_select.usb_tether_host') and states('sensor.usb_tether_status') == 'active' %}🟢 **ATTIVO**{% else %}⚪ Standby{% endif %} | {% if 'Debian' in states('input_select.usb_tether_host') and states('sensor.usb_tether_status') == 'active' %}USB Telefono{% else %}Via Router (`.11`){% endif %} |
                  | 💻 **PC Windows 11** | `192.168.0.8` | {% if 'Windows' in states('input_select.usb_tether_host') and states('sensor.usb_tether_status') == 'active' %}🟢 **ATTIVO**{% else %}⚪ Standby{% endif %} | {% if 'Windows' in states('input_select.usb_tether_host') and states('sensor.usb_tether_status') == 'active' %}USB Telefono{% else %}Via Router (`.11`){% endif %} |
                  | 🏠 **Client LAN** | `192.168.0.x` | {% if states('sensor.usb_tether_status') == 'active' and state_attr('sensor.usb_tether_status', 'mode') == 'intranet' %}🔥 **INTRANET**{% else %}🟢 **NORMALE**{% endif %} | {% if states('sensor.usb_tether_status') == 'active' and state_attr('sensor.usb_tether_status', 'mode') == 'intranet' %}LAN ➔ Router ➔ Host ➔ USB{% else %}LAN ➔ Router ➔ USB{% endif %} |
                card_mod:
                  style: "ha-card { user-select: text !important; }"

              # Ultimo errore (se presente)

              # Ultimo errore (se presente)
              - type: conditional
                conditions:
                  - entity: sensor.usb_tether_status
                    state: "error"
                card:
                  type: markdown
                  content: |
                    ## ⚠️ Problema rilevato

                    {{ state_attr('sensor.usb_tether_status', 'message') }}

                    Cause comuni: telefono non collegato, tethering non attivato sul cellulare, o route residua. Premi **Normale** per pulire lo stato.
                  card_mod:
