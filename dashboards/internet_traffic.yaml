# ===========================================================================
# TAB: STATUS APPARATI DI RETE
# Indicatori visivi per AdGuard, USB Tethering, Internet Connectivity.
# ===========================================================================
  - title: Status Apparati
    path: status-apparati
    icon: mdi:lan-connect
    type: sidebar
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "# 📡 Status Apparati di Rete\n\nIndicatori in tempo reale per i componenti critici della rete locale e internet."
            card_mod:
              style: "ha-card { padding: 6px 12px; }"

          # --- GRID INDICATORI ---
          - type: grid
            columns: 5
            square: false
            cards:
              # 1. AdGuard Home
              - type: conditional
                conditions:
                  - entity: binary_sensor.adguard_home_status
                    state: "on"
                card:
                  type: entity-button
                  entity: binary_sensor.adguard_home_status
                  name: "AdGuard Home"
                  icon: mdi:shield-check
                  tap_action:
                    action: more-info
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(46, 125, 50, 0.1);
                        border: 2px solid #4caf50;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }
                      ha-card .sensor-name { font-weight: bold; }
              - type: conditional
                conditions:
                  - entity: binary_sensor.adguard_home_status
                    state_not: "on"
                card:
                  type: entity-button
                  entity: binary_sensor.adguard_home_status
                  name: "AdGuard Home"
                  icon: mdi:shield-alert
                  tap_action:
                    action: more-info
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(211, 47, 47, 0.1);
                        border: 2px solid #d32f2f;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }
                      ha-card .sensor-name { font-weight: bold; }

              # 2. USB Tethering
              - type: conditional
                conditions:
                  - entity: sensor.usb_tether_status
                    state: "active"
                card:
                  type: sensor
                  entity: sensor.usb_tether_status
                  name: "USB Tethering"
                  icon: mdi:usb-tether
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(46, 125, 50, 0.1);
                        border: 2px solid #4caf50;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }
              - type: conditional
                conditions:
                  - entity: sensor.usb_tether_status
                    state_not: "active"
                card:
                  type: sensor
                  entity: sensor.usb_tether_status
                  name: "USB Tethering"
                  icon: mdi:usb-off
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(255, 152, 0, 0.1);
                        border: 2px solid #ff9800;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }

              # 3. Internet Connectivity (via Cloudflare Tunnel)
              - type: conditional
                conditions:
                  - entity: switch.cloudflare_tunnel
                    state: "on"
                card:
                  type: entity-button
                  entity: switch.cloudflare_tunnel
                  name: "Cloudflare Tunnel"
                  icon: mdi:earth
                  tap_action:
                    action: more-info
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(46, 125, 50, 0.1);
                        border: 2px solid #4caf50;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }
              - type: conditional
                conditions:
                  - entity: switch.cloudflare_tunnel
                    state_not: "on"
                card:
                  type: entity-button
                  entity: switch.cloudflare_tunnel
                  name: "Cloudflare Tunnel"
                  icon: mdi:earth-off
                  tap_action:
                    action: more-info
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(211, 47, 47, 0.1);
                        border: 2px solid #d32f2f;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }

              # 4. WAN Ping Reachability
              - type: conditional
                conditions:
                  - entity: sensor.internet_ping
                    state_not: "unavailable"
                  - entity: sensor.internet_ping
                    state_not: "0"
                card:
                  type: sensor
                  entity: sensor.internet_ping
                  name: "Ping Internet"
                  icon: mdi:ping
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(46, 125, 50, 0.1);
                        border: 2px solid #4caf50;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }
              - type: conditional
                conditions:
                  - entity: sensor.internet_ping
                    state: "unavailable"
                card:
                  type: sensor
                  entity: sensor.internet_ping
                  name: "Ping Internet"
                  icon: mdi:ping-network
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(211, 47, 47, 0.1);
                        border: 2px solid #d32f2f;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                      }

              # 5. Router Internet Path (rileva bug intranet WAN prioritaria)
              # Una sola entità (sensor.router_diagnosi_messaggio) come fonte di verità:
              # stato OK -> verde, tutto il resto -> rosso con causa + soluzione.
              - type: conditional
                conditions:
                  - entity: sensor.router_diagnosi_messaggio
                    state_not: "OK"
                card:
                  type: markdown
                  content: |
                    ## ⚠️ Problema Rotta Router
                    **Causa:** {{ state_attr('sensor.router_diagnosi_messaggio', 'causa') }}

                    **Soluzione:** {{ state_attr('sensor.router_diagnosi_messaggio', 'soluzione') }}

                    <sub>{{ state_attr('sensor.router_diagnosi_messaggio', 'detail') }}</sub>
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(198, 40, 40, 0.12);
                        border: 2px solid #c62828;
                        border-radius: 8px;
                        padding: 10px;
                        user-select: text;
                      }
              - type: conditional
                conditions:
                  - entity: sensor.router_diagnosi_messaggio
                    state: "OK"
                card:
                  type: entity
                  entity: sensor.router_diagnosi_messaggio
                  name: "Rotta Router"
                  icon: mdi:router-wireless
                  card_mod:
                    style: |
                      ha-card {
                        background: rgba(46, 125, 50, 0.1);
                        border: 2px solid #4caf50;
                        border-radius: 8px;
                        padding: 6px;
                        font-size: 13px;
                        font-weight: bold;
                      }

          # --- PROGRESS BAR DISPONIBILITÀ INTERNET ---
          # La barra CSS inline nei <div> viene strip-pata dal sanitizer del markdown,
          # quindi la barra vera è disegnata via card_mod (CSS applicato a ha-card,
          # non filtrato) + una barra a blocchi Unicode come fallback sempre visibile.
          - type: markdown
            content: >
              {% set pings = state_attr('sensor.internet_ping_history', 'ping_history') %}
              {% if not pings %}{% set pings = [] %}{% endif %}
              {% set display = pings[-15:] %}
              {% set total = display | length %}
              {% set ok = namespace(v=0) %}
              {% for p in display %}
                {% if p is number and p > 0 and p < 200 %}{% set ok.v = ok.v + 1 %}{% endif %}
              {% endfor %}
              {% set pct = (ok.v / total * 100) | round(0) if total > 0 else 0 %}
              {% set blocks = 20 %}
              {% set filled = (pct / 100 * blocks) | round(0) | int %}
              {% set bar = '🟩' * filled + '⬜' * (blocks - filled) %}

              **🌐 Disponibilità Internet: {{ pct }}%**
              <br>
              {{ ok.v }}/{{ total }} ping riusciti · ultimi 15 tentativi (30s)
              <br>
              {{ bar }}
              <br>
              <sub>🟩 &lt;200ms · 🟥 &gt;200ms o timeout · aggiornamento ogni 30s</sub>
            card_mod:
              style: |
                ha-card {
                  user-select: text !important;
                  padding: 8px 12px;
                }
                /* Barra di riempimento CSS visibile accanto al testo */
                ha-card::before {
                  content: "";
                  display: block;
                  height: 14px;
                  width: {{ pct }}%;
                  background: {% if pct >= 80 %}#4caf50{% elif pct >= 50 %}#ff9800{% else %}#d32f2f{% endif %};
                  border-radius: 7px;
                  margin: 4px 0 8px 0;
                  transition: width .4s ease;
                }

          # --- STATO RETE DETTAGLIATO ---
          - type: conditional
            conditions:
              - entity: sensor.network_status_diagnosis
                state_not: "unavailable"
            card:
              type: entity
              entity: sensor.network_status_diagnosis
              name: "Diagnosi Rete"
              icon: mdi:shield-check-outline
              card_mod:
                style: >
                  ha-card {
                    background: {% if is_state('sensor.network_status_diagnosis', 'OK') %} rgba(46, 125, 50, 0.1) {% else %} rgba(211, 47, 47, 0.1) {% endif %};
                    border: 2px solid {% if is_state('sensor.network_status_diagnosis', 'OK') %} #4caf50 {% else %} #d32f2f {% endif %};
                    border-radius: 8px;
                    padding: 6px;
                    font-weight: bold;
                    font-size: 13px;
                  }
                  ha-card .sensor-name { font-weight: bold; }

          # --- ENTITÀ UTILIZZATE IN QUESTA DASHBOARD ---
          - type: markdown
            content: |
              **Entità monitorate nel tab Status Apparati:**

              • `binary_sensor.adguard_home_status` — DNS check porta 53 su 192.168.0.3 (60s)
              • `sensor.usb_tether_status` — stato tethering (30s)
              • `switch.cloudflare_tunnel` — tunnel Cloudflare (60s)
              • `sensor.internet_ping` — latenza 1.1.1.1 (30s)
              • `sensor.internet_ping_history` — cronologia ping (attributo `ping_history`)
              • `sensor.network_status_diagnosis` — sintesi diagnosi rete
              • `sensor.router_internet_check` — rotta primaria router + ping dal router (60s), rileva bug intranet WAN prioritaria
              • `sensor.router_diagnosi_messaggio` — messaggio leggibile problema rotta router
              • `sensor.internet_packet_loss` — perdita pacchetti WAN
              • `sensor.internet_jitter` — jitter WAN (ms)
              • `sensor.wan_saturation_percent` — saturazione banda (%)
              • `input_boolean.network_boost_mode` — boost monitoraggio
            card_mod:
              style: "ha-card { padding: 6px 12px; font-size: 12px; }"

