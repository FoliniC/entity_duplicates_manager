views:
  - title: Traffico internet
    path: traffico-internet
    icon: mdi:router-wireless
    cards:
      - type: markdown
        content: "# 📊 Monitoraggio Traffico Internet\nAnalisi della banda in tempo reale."
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.router_total_download
            name: Download Totale (MB)
          - type: sensor
            entity: sensor.router_total_upload
            name: Upload Totale (MB)

      - type: markdown
        content: "## 📋 Dati testuali"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: entities
        entities:
          - entity: sensor.router_top_1_consumer_name
            name: "1° Nome"
          - entity: sensor.router_top_1_consumer_value
            name: "1° Valore"
          - entity: sensor.router_top_2_consumer_name
            name: "2° Nome"
          - entity: sensor.router_top_2_consumer_value
            name: "2° Valore"
          - entity: sensor.router_realtime_top_consumer
            name: "Velocità Istantanea"
        card_mod:
          style: |
            ha-card { 
              user-select: text !important; 
            }
            .card-content {
              user-select: text !important;
            }
            .state {
              user-select: text !important;
            }

      - type: markdown
        content: "## 📈 Top 5 Dispositivi (MB)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        chart_type: bar
        apex_config:
          chart:
            height: 300px
          plotOptions:
            bar:
              horizontal: true
              distributed: true
          legend:
            show: false
        series:
          - entity: sensor.router_traffic_stats
            data_generator: |
              const consumers = entity.attributes.top_consumers;
              if (!consumers) return [];
              return consumers.slice(0, 5).map((entry) => {
                return {
                  x: entry.name || entry.ip,
                  y: entry.total_rx_mb
                }
              });

      - type: markdown
        content: "## 📉 Velocità di Rete (kbps)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        graph_span: 30m
        header:
          show: true
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.router_download_speed
            name: Download
            color: "#1e88e5"
            type: area
          - entity: sensor.router_upload_speed
            name: Upload
            color: "#e53935"
            type: area
        yaxis:
          - min: 0
            apex_config:
              forceNiceScale: true

      - type: markdown
        content: "## 📋 Tabella Dettaglio Completa"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:flex-table-card
        entities:
          - entity: sensor.router_traffic_stats
        card_mod:
          style: |
            ha-card { user-select: text !important; }
            tbody tr td { user-select: text !important; }
        columns:
          - name: Dispositivo
            data: top_consumers
            modify: x.name
          - name: IP
            data: top_consumers
            modify: x.ip
          - name: Down (kbps)
            data: top_consumers
            modify: x.rx_kbps
            align: center
          - name: Up (kbps)
            data: top_consumers
            modify: x.tx_kbps
            align: center
          - name: Totale (MB)
            data: top_consumers
            modify: x.total_rx_mb
            align: center
        sort_by: rx_kbps-
