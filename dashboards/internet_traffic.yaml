views:
  - title: Traffico internet
    path: traffico-internet
    icon: mdi:router-wireless
    type: sidebar
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # --- COLONNA 1 (Sinistra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  # 🩺 Diagnosi Avanzata
                  Analisi automatica della linea.
                  
                  ---
                  🚀 **Boost Mode**: Monitoraggio rapido configurabile.
                  *Ottimizzato con SSH Multiplexing per il minimo carico.*
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: vertical-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_number.network_boost_duration
                        name: "Durata Boost (sec)"
                      - entity: input_number.network_boost_interval
                        name: "Frequenza Boost (sec)"
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(255, 165, 0, 0.1);
                            border: 1px solid orange;
                          {% endif %}
                        }

                  # BOX STATO / ERRORE
                  - type: markdown
                    content: >
                      {% set error = states('sensor.network_boost_validation_error') %}
                      {% if error == 'OK' %}
                        <div style="background-color: #4caf50; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center;">
                          ✅ Parametri Corretti
                        </div>
                      {% else %}
                        <div style="background-color: #f44336; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center;">
                          ⚠️ {{ error }}
                        </div>
                      {% endif %}
                    card_mod:
                      style: "ha-card { margin: 5px 0; border: none; background: none; }"

                  # BOTTONE AVVIA (Solo se OK e OFF)
                  - type: conditional
                    conditions:
                      - entity: sensor.network_boost_validation_error
                        state: "OK"
                      - entity: input_boolean.network_boost_mode
                        state: "off"
                    card:
                      type: button
                      name: "AVVIA MONITORAGGIO RAPIDO"
                      icon: mdi:timer-play
                      tap_action:
                        action: perform-action
                        perform_action: input_button.press
                        target:
                          entity_id: input_button.start_network_boost
                      card_mod:
                        style: |
                          ha-card {
                            background: #1e88e5 !important;
                            --mdc-theme-primary: white;
                          }

                  # BOTTONE DISABILITATO / IN CORSO
                  - type: conditional
                    conditions:
                      - entity: input_boolean.network_boost_mode
                        state: "on"
                    card:
                      type: button
                      name: "BOOST IN CORSO..."
                      icon: mdi:rocket-launch
                      tap_action: { action: none }
                      card_mod:
                        style: |
                          ha-card {
                            background: orange !important;
                            --mdc-theme-primary: white;
                            cursor: wait;
                          }

                  - type: entities
                    entities:
                      - entity: input_boolean.network_boost_mode
                        name: "Stato Boost"
                      - entity: sensor.network_boost_countdown
                        name: "Tempo Rimanente"
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(255, 165, 0, 0.1);
                            border: 1px solid orange;
                          {% endif %}
                        }

              - type: conditional
                conditions:
                  - entity: input_boolean.network_boost_mode
                    state: "off"
                  - entity: sensor.network_boost_dl_max
                    state_not: "0.0"
                card:
                  type: vertical-stack
                  cards:
                    - type: entities
                      title: "🏁 Risultati Ultimo Boost (Download)"
                      entities:
                        - entity: sensor.network_boost_dl_min
                          name: "Velocità Minima DL"
                        - entity: sensor.network_boost_dl_max
                          name: "Velocità Massima DL"
                        - entity: sensor.network_boost_dl_avg
                          name: "Velocità Media DL"
                      card_mod:
                        style: |
                          ha-card {
                            border: 1px solid #1e88e5;
                            background: rgba(30, 136, 229, 0.05);
                            user-select: text !important;
                          }
                    - type: entities
                      title: "🏁 Risultati Ultimo Boost (Upload)"
                      entities:
                        - entity: sensor.network_boost_ul_min
                          name: "Velocità Minima UL"
                        - entity: sensor.network_boost_ul_max
                          name: "Velocità Massima UL"
                        - entity: sensor.network_boost_ul_avg
                          name: "Velocità Media UL"
                      card_mod:
                        style: |
                          ha-card {
                            border: 1px solid #e53935;
                            background: rgba(229, 57, 53, 0.05);
                            user-select: text !important;
                          }

              - type: entities
                title: "☁️ Tunnel Cloudflare"
                entities:
                  - entity: switch.cloudflare_tunnel
                    name: "Stato Tunnel"
                  - entity: automation.gestione_cloudflare_presence
                    name: "Gestione Automatica Presenza"
                  - entity: automation.cloudflare_tunnel_watchdog
                    name: "Watchdog Automatico"

              - type: entity
                entity: sensor.network_status_diagnosis
                name: "Stato Rete"
                card_mod:
                  style: |
                    ha-card { 
                      user-select: text !important;
                      --paper-item-icon-color: {% if is_state('sensor.network_status_diagnosis', 'OK') %} green {% else %} red {% endif %};
                    }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.internet_packet_loss
                    name: Loss (%)
                  - type: sensor
                    entity: sensor.internet_jitter
                    name: Jitter (ms)
                  - type: sensor
                    entity: sensor.wan_saturation_percent
                    name: Saturazione (%)

              - type: markdown
                content: "## 📊 Riepilogo Storico (Top 10)"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: custom:flex-table-card
                entities:
                  - entity: sensor.router_traffic_stats
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Dispositivo
                    data: top_consumers
                    modify: x.name
                  - name: Totale (MB)
                    data: top_consumers
                    modify: x.total_rx_mb
                sort_by: Totale (MB)-

          # --- COLONNA 2 (Destra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "# ⚡ Real-time\nAndamento istantaneo."
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.wan_download_speed_realtime
                    name: Down (kbps)
                    card_mod:
                      style: |
                        ha-card { 
                          user-select: text !important;
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(30, 136, 229, 0.2) !important;
                            border: 1px solid #1e88e5;
                          {% endif %}
                        }
                  - type: sensor
                    entity: sensor.wan_upload_speed_realtime
                    name: Up (kbps)
                    card_mod:
                      style: |
                        ha-card { 
                          user-select: text !important;
                          {% if is_state('input_boolean.network_boost_mode', 'on') %}
                            background: rgba(229, 57, 53, 0.2) !important;
                            border: 1px solid #e53935;
                          {% endif %}
                        }
                  - type: sensor
                    entity: sensor.internet_ping
                    name: Ping (ms)

              - type: custom:apexcharts-card
                graph_span: 15m
                header:
                  show: true
                  show_states: true
                  colorize_states: true
                  title: Velocità di Rete (kbps)
                card_mod: { style: "ha-card { user-select: text !important; }" }
                series:
                  - entity: sensor.wan_download_speed_realtime
                    name: Download
                    color: "#1e88e5"
                    type: area
                  - entity: sensor.wan_upload_speed_realtime
                    name: Upload
                    color: "#e53935"
                    type: area
                yaxis:
                  - min: 0
                    apex_config:
                      forceNiceScale: true

              - type: custom:flex-table-card
                title: "📋 Chi sta usando banda ORA?"
                entities:
                  - entity: sensor.realtime_per_device_speed
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Device
                    data: devices
                    modify: x.name
                  - name: Down (kbps)
                    data: devices
                    modify: x.rx_kbps
                  - name: Up (kbps)
                    data: devices
                    modify: x.tx_kbps
                sort_by: Down (kbps)-

              - type: markdown
                content: "## 📈 Andamento Top 5 Dispositivi"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_select.network_graph_span
                        name: "Range"
                  - type: button
                    name: "RESET DATI"
                    icon: mdi:counter
                    tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.reset_network_counters
                    card_mod:
                      style: |
                        ha-card {
                          background: rgba(255, 165, 0, 0.1) !important;
                          height: 100%;
                        }

              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "15 minuti"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 15m
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (15m)" }
                      series: &series_config
                        - entity: sensor.top_device_1_speed
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_2_speed
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_3_speed
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_4_speed
                          type: area
                          group_by: { func: avg, duration: 1m }
                        - entity: sensor.top_device_5_speed
                          type: area
                          group_by: { func: avg, duration: 1m }
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "30 minuti"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 30m
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (30m)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "1 ora"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 1h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (1h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "3 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 3h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (3h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "6 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 6h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (6h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "12 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 12h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (12h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

                  - type: conditional
                    conditions:
                      - entity: input_select.network_graph_span
                        state: "24 ore"
                    card:
                      type: custom:apexcharts-card
                      graph_span: 24h
                      header: { show: true, show_states: true, colorize_states: true, title: "Top 5 Devices (24h)" }
                      series: *series_config
                      yaxis: [{ min: 0, apex_config: { forceNiceScale: true } }]

  # ==========================================================================
  # TAB: TETHERING USB
  # Controllo del tethering USB per aggiornamenti del server via giga del cellulare.
  # ==========================================================================
  - title: Tethering USB
    path: tethering-usb
    icon: mdi:usb
    type: sidebar
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # --- COLONNA SINISTRA: controllo ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  # 📱 Tethering USB

                  Instrada temporaneamente il traffico Internet del server verso il
                  telefono collegato in USB. Pensato per **aggiornamenti software (apt)**
                  pagati con i giga del cellulare.
                card_mod:
                  style: "ha-card { user-select: text !important; }"

              # Box stato principale (colore dinamico)
              - type: markdown
                content: >
                  {% set st = states('sensor.usb_tether_status') %}
                  {% if st == 'active' %}
                    <div style="background-color: #2e7d32; color: white; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center;">
                      ✅ TETHERING ATTIVO
                    </div>
                  {% elif st == 'error' %}
                    <div style="background-color: #c62828; color: white; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center;">
                      ⚠️ {{ state_attr('sensor.usb_tether_status', 'message') }}
                    </div>
                  {% else %}
                    <div style="background-color: #455a64; color: white; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center;">
                      💤 INATTIVO (route normale via router)
                    </div>
                  {% endif %}
                card_mod:
                  style: "ha-card { margin: 4px 0; border: none; background: none; }"

              # Toggle principale
              - type: horizontal-stack
                cards:
                  - type: button
                    name: "ATTIVA TETHERING"
                    icon: mdi:usb-port
                    tap_action:
                      action: perform-action
                      perform_action: switch.turn_on
                      target:
                        entity_id: switch.usb_tether
                    card_mod:
                      style: |
                        ha-card {
                          {% if is_state('switch.usb_tether', 'on') %}
                            background: #2e7d32 !important;
                            --mdc-theme-primary: white;
                          {% else %}
                            background: #1e88e5 !important;
                            --mdc-theme-primary: white;
                          {% endif %}
                        }
                  - type: button
                    name: "RIPRISTINA ORA"
                    icon: mdi:restore
                    tap_action:
                      action: perform-action
                      perform_action: switch.turn_off
                      target:
                        entity_id: switch.usb_tether
                    card_mod:
                      style: |
                        ha-card {
                          background: #c62828 !important;
                          --mdc-theme-primary: white;
                        }

              # Configurazione durata
              - type: entities
                title: "Durata massima (safety-net)"
                entities:
                  - entity: input_number.usb_tether_max_duration
                    name: "Minuti prima del ripristino automatico"
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('sensor.usb_tether_status', 'active') %}
                        background: rgba(46, 125, 50, 0.1);
                        border: 1px solid #2e7d32;
                      {% endif %}
                    }

              # Dettagli tecnici
              - type: entities
                title: "Dettagli connessione"
                entities:
                  - entity: sensor.usb_tether_descrizione
                    name: "Stato"
                  - entity: sensor.usb_tether_status
                    name: "Interfaccia telefono"
                    attribute: phone_if
                  - entity: sensor.usb_tether_status
                    name: "Gateway telefono"
                    attribute: phone_gw
                  - entity: sensor.usb_tether_status
                    name: "Gateway LAN (originale)"
                    attribute: lan_gw
                  - entity: sensor.usb_tether_status
                    name: "Attivo dalle"
                    attribute: active_since
                card_mod:
                  style: "ha-card { user-select: text !important; }"

          # --- COLONNA DESTRA: countdown + istruzioni ---
          - type: vertical-stack
            cards:
              # Countdown (visibile solo se attivo)
              - type: conditional
                conditions:
                  - entity: sensor.usb_tether_status
                    state: "active"
                card:
                  type: markdown
                  content: >
                    # ⏳ Auto-ripristino

                    Mancano circa **{{ state_attr('sensor.usb_tether_status', 'remaining_min') | int(0) }} minuti**
                    al ripristino automatico della route.

                    *Il timer di sicurezza vive sul server: ripristina la route anche se
                    Home Assistant o la rete dovessero cadere.*
                  card_mod:
                    style: |
                      ha-card {
                        user-select: text !important;
                        background: rgba(46, 125, 50, 0.08);
                        border: 1px solid #2e7d32;
                      }

              # Istruzioni d'uso
              - type: markdown
                content: >
                  ## 📋 Come usarlo

                  1. Sul telefono: attiva **Tethering USB** (Impostazioni → Rete).
                  2. Collega il telefono via **cavo USB** al server Debian.
                  3. Qui: premi **ATTIVA TETHERING**.
                  4. Dal tuo accesso SSH / VS Code sul server, lancia:
                     ```
                     sudo apt update && sudo apt upgrade
                     ```
                     *(il traffico esce dal telefono)*
                  5. Al termine: premi **RIPRISTINA ORA**, oppure aspetta il
                     countdown (ripristino automatico garantito).

                  ---

                  **Cosa continua a funzionare** durante il tethering: Cloudflare,
                  AdGuard (DNS/DHCP), Home Assistant. Il DNS upstream esce dal telefono
                  (overhead trascurabile); il DHCP è traffico LAN locale.

                  **Sicurezza**: lo swap di route è *non persistente*. Un riavvio del
                  server o lo scadere del timer riportano tutto alla normalità.
                card_mod:
                  style: "ha-card { user-select: text !important; }"

              # Ultimo errore (se presente)
              - type: conditional
                conditions:
                  - entity: sensor.usb_tether_status
                    state: "error"
                card:
                  type: markdown
                  content: >
                    ## ⚠️ Problema rilevato

                    {{ state_attr('sensor.usb_tether_status', 'message') }}

                    Cause comuni: telefono non collegato, tethering non attivato sul
                    cellulare, o route residua. Premi **RIPRISTINA ORA** per pulire lo stato.
                  card_mod:
                    style: |
                      ha-card {
                        user-select: text !important;
                        background: rgba(198, 40, 40, 0.08);
                        border: 1px solid #c62828;
                      }

