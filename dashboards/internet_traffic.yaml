views:
  - title: Traffico internet
    path: traffico-internet
    icon: mdi:router-wireless
    type: sidebar
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # --- COLONNA 1 (Sinistra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: >
                  # 🩺 Diagnosi Avanzata
                  Analisi automatica della linea.
                  
                  ---
                  🚀 **Boost Mode**: Aumenta la frequenza di campionamento (configurabile).
                  *Ottimizzato con SSH Multiplexing: la connessione resta aperta per tutta la durata del boost riducendo il carico sul router.*
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: entities
                entities:
                  - entity: input_number.network_boost_duration
                    name: "Durata Boost (sec)"
                  - entity: input_number.network_boost_interval
                    name: "Frequenza Boost (sec)"
                  - entity: input_button.start_network_boost
                    name: "Avvia Monitoraggio Rapido"
                  - entity: input_boolean.network_boost_mode
                    name: "Stato Boost"

              - type: entity
                entity: sensor.network_status_diagnosis
                name: "Stato Rete"
                card_mod:
                  style: |
                    ha-card { 
                      user-select: text !important;
                      --paper-item-icon-color: {% if is_state('sensor.network_status_diagnosis', 'OK') %} green {% else %} red {% endif %};
                    }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.internet_packet_loss
                    name: Loss (%)
                    card_mod: { style: "ha-card { user-select: text !important; }" }
                  - type: sensor
                    entity: sensor.internet_jitter
                    name: Jitter (ms)
                    card_mod: { style: "ha-card { user-select: text !important; }" }
                  - type: sensor
                    entity: sensor.wan_saturation_percent
                    name: Saturazione (%)
                    card_mod: { style: "ha-card { user-select: text !important; }" }

              - type: markdown
                content: "## 📊 Riepilogo Storico"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.router_total_download
                    name: Download Totale
                    card_mod: { style: "ha-card { user-select: text !important; }" }
                  - type: sensor
                    entity: sensor.router_total_upload
                    name: Upload Totale
                    card_mod: { style: "ha-card { user-select: text !important; }" }

              - type: custom:flex-table-card
                title: "🏆 Top 10 Dispositivi (MB Totali)"
                entities:
                  - entity: sensor.router_traffic_stats
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Dispositivo
                    data: top_consumers
                    modify: x.name
                  - name: Totale (MB)
                    data: top_consumers
                    modify: x.total_rx_mb
                sort_by: Totale (MB)-

          # --- COLONNA 2 (Destra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "# ⚡ Real-time\nAndamento istantaneo."
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.wan_download_speed_realtime
                    name: Down (kbps)
                    card_mod: { style: "ha-card { user-select: text !important; }" }
                  - type: sensor
                    entity: sensor.wan_upload_speed_realtime
                    name: Up (kbps)
                    card_mod: { style: "ha-card { user-select: text !important; }" }
                  - type: sensor
                    entity: sensor.internet_ping
                    name: Ping (ms)
                    card_mod: { style: "ha-card { user-select: text !important; }" }

              - type: custom:apexcharts-card
                graph_span: 15m
                header:
                  show: true
                  show_states: true
                  colorize_states: true
                  title: Velocità di Rete (kbps)
                card_mod: { style: "ha-card { user-select: text !important; }" }
                series:
                  - entity: sensor.wan_download_speed_realtime
                    name: Download
                    color: "#1e88e5"
                    type: area
                  - entity: sensor.wan_upload_speed_realtime
                    name: Upload
                    color: "#e53935"
                    type: area
                yaxis:
                  - min: 0
                    apex_config:
                      forceNiceScale: true

              - type: custom:flex-table-card
                title: "📋 Chi sta usando banda ORA?"
                entities:
                  - entity: sensor.realtime_per_device_speed
                card_mod: { style: "ha-card { user-select: text !important; }" }
                columns:
                  - name: Device
                    data: devices
                    modify: x.name
                  - name: Down (kbps)
                    data: devices
                    modify: x.rx_kbps
                  - name: Up (kbps)
                    data: devices
                    modify: x.tx_kbps
                sort_by: Down (kbps)-
