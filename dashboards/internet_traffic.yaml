views:
  - title: Traffico internet
    path: traffico-internet
    icon: mdi:router-wireless
    type: sidebar
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          # --- COLONNA 1 (Sinistra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "# 🩺 Diagnosi Avanzata\nAnalisi automatica della linea."
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: entity
                entity: sensor.network_status_diagnosis
                name: "Stato Rete"
                card_mod:
                  style: |
                    ha-card { 
                      --paper-item-icon-color: {% if is_state('sensor.network_status_diagnosis', 'OK') %} green {% else %} red {% endif %};
                    }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.internet_packet_loss
                    name: Loss (%)
                  - type: sensor
                    entity: sensor.internet_jitter
                    name: Jitter (ms)
                  - type: sensor
                    entity: sensor.wan_saturation_percent
                    name: Saturazione (%)

              - type: markdown
                content: "## 📊 Riepilogo Storico"
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.router_total_download
                    name: Download Totale
                  - type: sensor
                    entity: sensor.router_total_upload
                    name: Upload Totale

              - type: custom:apexcharts-card
                experimental:
                  disable_config_validation: true
                update_interval: 60s
                header:
                  title: "Top 5 Dispositivi (MB Totali)"
                  show: true
                apex_config:
                  chart:
                    type: bar
                    height: 250
                  plotOptions:
                    bar:
                      horizontal: true
                  xaxis:
                    type: category
                series:
                  - entity: sensor.top_device_1_mb
                    name: >-
                      {{ state_attr('sensor.top_device_1_mb', 'device_name') or 'Device 1' }}
                    ignore_history: true
                  - entity: sensor.top_device_2_mb
                    name: >-
                      {{ state_attr('sensor.top_device_2_mb', 'device_name') or 'Device 2' }}
                    ignore_history: true
                  - entity: sensor.top_device_3_mb
                    name: >-
                      {{ state_attr('sensor.top_device_3_mb', 'device_name') or 'Device 3' }}
                    ignore_history: true
                  - entity: sensor.top_device_4_mb
                    name: >-
                      {{ state_attr('sensor.top_device_4_mb', 'device_name') or 'Device 4' }}
                    ignore_history: true
                  - entity: sensor.top_device_5_mb
                    name: >-
                      {{ state_attr('sensor.top_device_5_mb', 'device_name') or 'Device 5' }}
                    ignore_history: true

          # --- COLONNA 2 (Destra) ---
          - type: vertical-stack
            cards:
              - type: markdown
                content: "# ⚡ Real-time\nAndamento istantaneo."
                card_mod:
                  style: |
                    ha-card { user-select: text !important; }

              - type: horizontal-stack
                cards:
                  - type: sensor
                    entity: sensor.wan_download_speed_realtime
                    name: Down (kbps)
                  - type: sensor
                    entity: sensor.wan_upload_speed_realtime
                    name: Up (kbps)
                  - type: sensor
                    entity: sensor.internet_ping_ms
                    name: Ping (ms)

              - type: custom:apexcharts-card
                graph_span: 30m
                header:
                  show: true
                  show_states: true
                  colorize_states: true
                  title: Velocità di Rete (kbps)
                series:
                  - entity: sensor.wan_download_speed_realtime
                    name: Download
                    color: "#1e88e5"
                    type: area
                  - entity: sensor.wan_upload_speed_realtime
                    name: Upload
                    color: "#e53935"
                    type: area
                yaxis:
                  - min: 0
                    apex_config:
                      forceNiceScale: true

              - type: custom:flex-table-card
                title: "📋 Chi sta usando banda ORA?"
                entities:
                  - entity: sensor.realtime_per_device_speed
                columns:
                  - name: Device
                    data: devices
                    modify: x.name
                  - name: Down (kbps)
                    data: devices
                    modify: x.rx_kbps
                  - name: Up (kbps)
                    data: devices
                    modify: x.tx_kbps
                sort_by: Down (kbps)-

              - type: custom:flex-table-card
                title: "📋 Dettaglio Storico (nlbwmon)"
                entities:
                  - entity: sensor.router_traffic_stats
                columns:
                  - name: Device
                    data: top_consumers
                    modify: x.name
                  - name: Tot (MB)
                    data: top_consumers
                    modify: x.total_rx_mb
                sort_by: Tot (MB)-
