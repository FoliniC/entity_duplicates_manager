title: Alexa Control
views:
  - title: Alexa Control
    path: alexa-control
    icon: mdi:alexa
    type: masonry
    cards:
      - type: heading
        heading: Comando Personalizzato
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_text.alexa_custom_command
            name: Scrivi comando per Alexa
            icon: mdi:microphone
      - type: horizontal-stack
        cards:
          - type: button
            name: "⚡ Invia Comando Testuale"
            icon: mdi:send
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.alexa_send_custom
      - type: heading
        heading: Comandi Preimpostati
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: "📻 Radio m2o (TuneIn)"
            icon: mdi:radio
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.alexa_radio_m2o_tunein
          - type: button
            name: "📻 Radio m2o (Testuale)"
            icon: mdi:radio
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.alexa_radio_m2o_custom
          - type: button
            name: "⏱️ Timer 9 min (Testuale)"
            icon: mdi:timer
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.alexa_timer_9min_custom
          - type: button
            name: "🛑 STOP"
            icon: mdi:stop-circle
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.alexa_stop
      - type: heading
        heading: emulated_hue Bridge (Comandi Vocali Alexa)
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: "☀️ Buongiorno"
            icon: mdi:sun-greeting
            tap_action:
              action: toggle
            entity: input_boolean.buongiorno_alexa
          - type: button
            name: "🚪 Uscita"
            icon: mdi:exit-run
            tap_action:
              action: toggle
            entity: input_boolean.alexa_accendi_uscita
          - type: button
            name: "🏠 Entrata"
            icon: mdi:home-import
            tap_action:
              action: toggle
            entity: input_boolean.alexa_accendi_entrata
          - type: button
            name: "🏡 Ritorno a Casa"
            icon: mdi:home-account
            tap_action:
              action: toggle
            entity: input_boolean.alexa_ritorno_a_casa
      - type: entities
        title: Dispositivo Alexa Cucina
        show_header_toggle: false
        entities:
          - entity: media_player.cucina
            name: Alexa Cucina
      - type: markdown
        content: |
          **Target:** `media_player.cucina` (Integrazione Ufficiale `alexa_devices`)

          - **Comando Testuale:** Utilizza `alexa_devices.send_text_command` per inviare qualsiasi frase direttamente ad Alexa (es: timer, comandi vocali).
          - **TuneIn:** Riproduzione diretta del flusso audio tramite la piattaforma radio di Alexa (sperimentale, da verificare).
          - **STOP:** Interrompe la riproduzione in corso.

          **emulated_hue Bridge** (`192.168.0.48:80`):
          - **Buongiorno** (ID Hue 45): `input_boolean.buongiorno_alexa` → trigger `automation.alexa_risposta_buongiorno` (auto-reset 5s) — *Apre tapparella camera grande, dice "Buongiorno Carlo!", avvia radio m2o*
          - **Uscita**: `input_boolean.alexa_accendi_uscita` → `light.uscita` → `automation.alexa_modalita_uscita` — *Verifica tethering Normale, spegne luci/radio, accende luci scale, dice "Arrivederci Carlo!"*
          - **Entrata**: `input_boolean.alexa_accendi_entrata` → `light.entrata` → `automation.alexa_modalita_entrata` — *Dice "Bentornato Carlo!", accende luce bancone se buio (<50 lux), avvia radio m2o*
          - **Ritorno a Casa**: `input_boolean.alexa_ritorno_a_casa` → `light.ritorno_a_casa` → `automation.alexa_ritorno_a_casa` — *Apre porta garage, dice "Bentornato Carlo!", accende luce bancone se buio (<50 lux), avvia radio m2o*
