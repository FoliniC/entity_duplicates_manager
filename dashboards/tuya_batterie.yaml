                name: "Batteria (entità LocalTuya)"
                icon: mdi:battery-outline
              - entity: binary_sensor.th2b_battery_low
                name: "Allarme batteria bassa"
                icon: mdi:battery-alert
          - type: entities
            title: Letture TH2B
