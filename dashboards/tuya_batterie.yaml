              - entity: sensor.th2b_temperature
                name: "Temperatura"
                icon: mdi:thermometer
              - entity: sensor.th2b_humidity
                name: "Umidità"
                icon: mdi:water-percent
              - entity: sensor.th2b_temperature_humidity_local_ip
                name: "IP Locale"
                icon: mdi:ip-network

      # --- TH3C ---
      - type: vertical-stack
