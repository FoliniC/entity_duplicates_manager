          - type: markdown
            content: |
              ## 📟 TH3C — Sensore Temperatura/Umidità
              **IP:** 192.168.0.41 | **Canale:** Locale
          - type: entities
            title: Stato Batteria TH3C
            entities:
              - entity: sensor.th3c_battery
                name: "Batteria (percentuale)"
                icon: mdi:battery
                unit_of_measurement: "%"
              - entity: sensor.th3c_temperature_humidity_battery_level
                name: "Livello batteria (testuale)"
                icon: mdi:battery-outline
              - entity: binary_sensor.th3c_battery_low
                name: "Allarme batteria bassa"
                icon: mdi:battery-alert
          - type: entities
            title: Letture TH3C
            entities:
