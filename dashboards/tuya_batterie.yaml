                icon: mdi:ip-network

      # --- TH4D (Esterno) ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 📟 TH4D — Sensore Temperatura/Umidità (Esterno)
              **IP:** 192.168.0.42 | **Canale:** Locale
          - type: entities
            title: Stato Batteria TH4D
            entities:
              - entity: sensor.th4d_battery
                name: "Batteria (percentuale)"
                icon: mdi:battery
                unit_of_measurement: "%"
              - entity: sensor.th4d_temperature_humidity_battery_level
                name: "Livello batteria (testuale)"
