title: Tuya Batterie
icon: mdi:battery-outline
views:
  # ============================================================
  # VISTA: Tuya Batterie - Dispositivi Tuya alimentati a batteria
  # ============================================================
  - title: Tuya Batterie
    path: tuya-batterie
    icon: mdi:battery-outline
    badges: []
    cards:
      # --- TH1A (Cucina/Bagno) ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 📟 TH1A — Sensore Temperatura/Umidità
              **IP:** 192.168.0.139 | **Canale:** Locale
          - type: entities
            title: Stato Batteria TH1A
            entities:
              - entity: sensor.th1a_battery
                name: "Batteria (percentuale)"
                icon: mdi:battery
                unit_of_measurement: "%"
              - entity: sensor.th1a_temperature_humidity_battery
                name: "Batteria (entità LocalTuya)"
                icon: mdi:battery-outline
              - entity: binary_sensor.th1a_battery_low
                name: "Allarme batteria bassa"
                icon: mdi:battery-alert
          - type: entities
            title: Letture TH1A
            entities:
              - entity: sensor.th1a_temperature
                name: "Temperatura"
                icon: mdi:thermometer
              - entity: sensor.th1a_humidity
                name: "Umidità"
                icon: mdi:water-percent
              - entity: sensor.th1a_temperature_humidity_local_ip
                name: "IP Locale"
                icon: mdi:ip-network

      # --- TH2B ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 📟 TH2B — Sensore Temperatura/Umidità
              **IP:** 192.168.0.40 | **Canale:** Locale
          - type: entities
