# ============================================================================
# BITCOIN INVESTMENT TRACKER - Dashboard Lovelace (Enhanced)
# ============================================================================
# Versione con calcoli NETTO tasse italiane 2026+ (33% su tutte le plusvalenze)
# AggIUNTA: sensori di proiezione prezzo telefono
# ============================================================================

title: "₿ BTC Investment Tracker — DASHBOARD MODIFICATA (2026-09-03)"
icon: "mdi:bitcoin"
path: btc-tracker
views:
  # ----------------------------------------------------------------------
  # Vista Principale: Overview
  # ----------------------------------------------------------------------
  - title: "Overview"
    icon: "mdi:view-dashboard"
    badges:
      - entity: sensor.btc_can_buy_phone_net
      - entity: sensor.btc_progress_to_phone_net_pct
      - entity: sensor.bitcoin_price_eur
    cards:
      # Hero card - Stato principale
      - type: entities
        title: "[0] 🎯 Stato Obiettivo Telefono (NETTO tasse) — MODIFICATO 2026-09-03"
        show_header_toggle: false
        style: |
          ha-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #F7931A;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(247, 147, 26, 0.2);
          }
        entities:
            - entity: sensor.btc_can_buy_phone_net
              name: "Puoi comprare il telefono? (NETTO)"
              icon: "mdi:check-circle-outline"
              secondary_info: "last_refresh"
            - entity: sensor.target_phone_name
              name: "Modello target"
              icon: "mdi:cellphone-information"
            - entity: sensor.target_phone_price
              name: "Prezzo target"
              icon: "mdi:currency-eur"
            - entity: sensor.btc_progress_to_phone_net_pct
              name: "Progresso NETTO"
              icon: "mdi:progress-clock"
            - entity: sensor.btc_delta_to_phone_net
              name: "Mancano (NETTO)"
              icon: "mdi:calculator-variant"
            - entity: sensor.btc_break_even_phone_price
              name: "Break-even BTC price"
              icon: "mdi:target-account"
              style: |
                :host([state*="SÌ"]) {
                  --paper-item-icon-color: #4CAF50;
                  --primary-text-color: #4CAF50;
                }
            - entity: sensor.bitcoin_price_eur
              name: "Ultima quotazione BTC (€)"
              icon: "mdi:currency-btc"
              secondary_info: "Ultimo aggiornamento"

      # Phone Price Projection section
      - type: entities
        title: "[1] 📱 Proiezione Prezzo Telefono — MODIFICATO 2026-09-03"
        show_header_toggle: false
        style: |
          ha-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #9C27B0;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(156, 39, 176, 0.2);
          }
        entities:
            - entity: sensor.phone_projection_status
              name: "Stato Proiezione"
              icon: "mdi:chart-line"
              secondary_info: last-changed
            - entity: sensor.target_phone_price
              name: "Prezzo Attuale"
              icon: "mdi:cellphone"
              secondary_info: "Prezzo corrente"
            - entity: sensor.phone_current_of_launch
              name: "% del Prezzo di Lancio"
              icon: "mdi:percent"
              secondary_info: "Sconto rispetto al lancio"
            - entity: sensor.phone_discount_vs_launch
              name: "Sconto vs Lancio"
              icon: "mdi:trending-down"
              secondary_info: "Discount vs launch price"
            - entity: sensor.phone_projection_12m
              name: "Prezzo Consigliato (median)"
              icon: "mdi:calculator"
              secondary_info: "Prezzo atteso basato sul pattern storico"
            - entity: sensor.phone_days_to_successor
              name: "Giorni al Successore"
              icon: "mdi:calendar-clock"
              secondary_info: "When next model launches"
            - entity: sensor.phone_projection_3m
              name: "Proiezione 3 mesi"
              icon: "mdi:clock-outline"
              secondary_info: "Expected in 3 months"
            - entity: sensor.phone_projection_6m
              name: "Proiezione 6 mesi"
              icon: "mdi:clock-outline"
              secondary_info: "Expected in 6 months"
            - entity: sensor.phone_projection_12m
              name: "Proiezione 9 mesi"
              icon: "mdi:clock-outline"
              secondary_info: "Expected in 9 months"
            - entity: sensor.phone_projection_12m
              name: "Proiezione 12 mesi (successore)"
              icon: "mdi:clock-end"
              secondary_info: "At successor launch ~Feb 2027"
            - entity: sensor.phone_projection_3m
              name: "Proiezione 3 mesi"
              icon: "mdi:clock-outline"
              secondary_info: "Expected in 3 months"
            - entity: sensor.phone_projection_6m
              name: "Proiezione 6 mesi"
              icon: "mdi:clock-outline"
              secondary_info: "Expected in 6 months"
            - entity: sensor.phone_projection_12m
              name: "Proiezione 9 mesi"
              icon: "mdi:clock-outline"
              secondary_info: "Expected in 9 months"
            - entity: sensor.phone_projection_12m
              name: "Proiezione 12 mesi (successore)"
              icon: "mdi:clock-end"
              secondary_info: "At successor launch ~Feb 2027"

      # BTC Price & Portfolio — Native history-graph
      - type: history-graph
        title: "📈 BTC Price & Portfolio Value (24h)"
        hours_to_show: 24
        refresh: 60
        entities:
          - entity: sensor.bitcoin_price_eur
            name: "BTC/EUR"
          - entity: sensor.btc_current_value
            name: "Valore Portafoglio"

      # Trailing Stop Suggestion — consiglia quando impostare lo stop loss
      - type: entities
        title: "🔧 Trailing Stop Suggestion (3% trail)"
        show_header_toggle: false
        entities:
          - entity: sensor.btc_trailing_stop_suggestion
            name: "Stato Trailing Stop"
            icon: "mdi:chart-arrow-up"
          - entity: sensor.btc_trailing_stop_price
            name: "Prezzo Trailing Stop (3%)"
            icon: "mdi:flag-checkered"
            secondary_info: "Vendi se scendi sotto"

  # ----------------------------------------------------------------------
  # Vista Configurazione
  # ----------------------------------------------------------------------
  - title: "⚙️ Configurazione"
    icon: "mdi:cog"
    cards:
      - type: entities
        title: "📝 Parametri Investimento BTC (Dati reali: 5000€ @ 54k €/BTC = 0.09259 BTC)"
        show_header_toggle: false
        entities:
          - entity: input_number.btc_investment_eur
          - entity: input_number.btc_amount
          - entity: input_number.btc_avg_buy_price
          - type: section
            label: "Valori calcolati (read-only)"
          - entity: sensor.btc_investment_eur
          - entity: sensor.btc_amount
          - entity: sensor.btc_cost_basis_eur_template
          - entity: sensor.btc_current_value
          - entity: sensor.btc_profit_loss
          - entity: sensor.btc_roi_pct
          - entity: sensor.btc_taxable_gain
          - entity: sensor.btc_tax_amount
          - entity: sensor.btc_profit_loss_net
          - entity: sensor.btc_roi_pct_net
          - entity: input_text.refresh_ops_log
          - entity: input_text.btc_can_buy_phone_net_last_update
            name: "⏰ Ultimo aggiornamento btc_can_buy_phone_net"

      - type: markdown
        title: "📋 Log Operazioni BTC Tracker (storia completa)"
        content: >
          {% set log_text = state_attr('sensor.btc_tracker_log', 'text') %}
          {% set updated = state_attr('sensor.btc_tracker_log', 'updated') %}
          {% if log_text %}
          **Ultimo aggiornamento log:** {{ updated | default('N/A') }} ({{ state_attr('sensor.btc_tracker_log', 'line_count') | int(0) }} righe)

          ```
          {{ log_text }}
          ```
          {% else %}
          _Nessun log disponibile_ — premi 🔄 Aggiorna Proiezione Telefono per generare il log.
          {% endif %}
        card_mod:
          style: |
            ha-card { font-family: monospace; font-size: 11px; line-height: 1.4; white-space: pre-wrap; }

      - type: entities
        title: "📱 Parametri Telefono Target (Xiaomi 17 Ultra 16/512GB)"
        show_header_toggle: false
        entities:
          - entity: input_text.target_phone_name
          - entity: input_text.target_phone_url
          - entity: input_number.target_phone_price
          - type: section
            label: "Valori calcolati (read-only)"
          - entity: sensor.target_phone_name
          - entity: sensor.target_phone_price
          - entity: sensor.target_phone_url
          - entity: sensor.btc_progress_to_phone_net_pct
          - entity: sensor.btc_delta_to_phone_net
          - entity: sensor.btc_break_even_phone_price
          - entity: sensor.btc_days_to_phone_estimate
          - type: section
            label: "Proiezione Prezzo Telefono (pattern storico)"
          - entity: sensor.phone_projection_status
          - entity: sensor.target_phone_price
          - entity: sensor.phone_current_of_launch
          - entity: sensor.phone_discount_vs_launch
          - entity: sensor.phone_projection_12m
          - entity: sensor.phone_days_to_successor
          - entity: sensor.phone_projection_3m
          - entity: sensor.phone_projection_6m
          - entity: sensor.phone_projection_12m

      - type: entities
        title: "🔧 Azioni Rapide"
        show_header_toggle: false
        entities:
          - entity: script.phone_projection_refresh
            name: "🔄 Aggiorna Proiezione Telefono"
            icon: "mdi:refresh"
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.phone_projection_refresh
          - entity: automation.btc_tracker_puoi_comprare_il_telefono
            name: "Test notifica obiettivo raggiunto"
            icon: "mdi:bell-ring"
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.btc_tracker_puoi_comprare_il_telefono
          - entity: automation.btc_tracker_report_giornaliero
            name: "Test report giornaliero"
            icon: "mdi:file-chart"
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.btc_tracker_report_giornaliero
          - entity: automation.btc_tracker_milestone_50
            name: "Test milestone 50%"
            icon: "mdi:flag-checkered"
            tap_action:
              action: call-service
              service: automation.trigger
              service_data:
                entity_id: automation.btc_tracker_milestone_50

  # ----------------------------------------------------------------------
  # Vista Analisi - BTC Investment Tracker
  # ----------------------------------------------------------------------
  - title: "📈 Analysis View - BTC Investment Tracker"
    icon: "mdi:chart-timeline-variant"
    cards:

      # ----------------------------------------------------------------------
      # Card 1: BTC Profit/Loss Chart
      # ----------------------------------------------------------------------
      - type: history-graph
        id: "history_btc_profit_loss"
        title: "🔴 [1] PROFITTO/PERDITA BTC — MODIFICATO 2026-09-03 (NETTO tasse)"
        hours_to_show: 24
        refresh: 60
        entities:
          - entity: sensor.btc_profit_loss
            name: "Profitto LORDO (€)"
          - entity: sensor.btc_profit_loss_net
            name: "Profitto NETTO (€)"

      # ----------------------------------------------------------------------
      # Card 2: Phone Progress Chart
      # ----------------------------------------------------------------------
      - type: history-graph
        id: "history_btc_progress_phone"
        title: "🔴 [2] PROGRESSO VERSO TELEFONO — MODIFICATO 2026-09-03 (NETTO tasse)"
        hours_to_show: 24
        refresh: 60
        entities:
          - entity: sensor.btc_progress_to_phone_net_pct
            name: "Progresso NETTO %"
          - entity: sensor.btc_delta_to_phone_net
            name: "Delta rimasto NETTO"

      # ----------------------------------------------------------------------
      # Card 3: Phone Price Projection Chart
      # ----------------------------------------------------------------------
      - type: history-graph
        id: "history_phone_projection"
        title: "Proiezione Prezzo Telefono"
        hours_to_show: 168
        refresh: 300
        entities:
          - entity: sensor.phone_current_of_launch
            name: "Attuale % lancio"
          - entity: sensor.phone_projection_12m
            name: "Proiezione 12 mesi"

      - type: history-graph
        title: "Storico Sensori Principali (NETTO tasse)"
        hours_to_show: 24
        refresh: 60
        entities:
          - sensor.bitcoin_price_eur
          - sensor.btc_current_value
          - sensor.btc_profit_loss_net
          - sensor.btc_roi_pct_net
          - sensor.btc_progress_to_phone_net_pct
          - sensor.btc_tax_amount