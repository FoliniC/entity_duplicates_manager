views:
  - title: Test Hello
    path: test-hello
    icon: mdi:chat
    cards:
      - type: markdown
        content: "# 📊 Monitoraggio Rete\nAnalisi del traffico in tempo reale."
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: markdown
        content: "---"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.router_total_download
            name: Download Totale (MB)
            card_mod:
              style: |
                ha-card { user-select: text !important; }
          - type: sensor
            entity: sensor.router_total_upload
            name: Upload Totale (MB)
            card_mod:
              style: |
                ha-card { user-select: text !important; }

      - type: markdown
        content: "## ⚡ Top Consumer Attuale"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: entities
        entities:
          - entity: sensor.router_realtime_top_consumer
            name: Dispositivo
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: markdown
        content: "## 📋 Tabella Dettaglio Dispositivi"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:flex-table-card
        entities:
          - sensor.router_traffic_stats
        columns:
          - name: Dispositivo
            data: top_consumers
            modify: x.name
          - name: IP
            data: top_consumers
            modify: x.ip
          - name: Down (kbps)
            data: top_consumers
            modify: x.rx_kbps
            align: center
          - name: Up (kbps)
            data: top_consumers
            modify: x.tx_kbps
            align: center
          - name: Totale (MB)
            data: top_consumers
            modify: x.total_rx_mb
            align: center
        sort_by: rx_kbps-
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: markdown
        content: "## 📈 Top 5 Consumi Accumulati (MB)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        chart_type: donut
        header:
          show: false
        series:
          - entity: sensor.router_traffic_stats
            data_generator: |
              const consumers = entity.attributes.top_consumers;
              if (!consumers || consumers.length === 0) return [];
              return consumers.slice(0, 5).map((entry) => {
                return {
                  y: entry.total_rx_mb,
                  name: entry.name || entry.ip
                }
              });
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: markdown
        content: "## 📉 Velocità di Rete Complessiva (Real-Time)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        graph_span: 1h
        header:
          show: true
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.router_total_download
            name: Download
            color: "#1e88e5"
            type: area
            group_by:
              func: diff
              duration: 1m
          - entity: sensor.router_total_upload
            name: Upload
            color: "#e53935"
            type: area
            group_by:
              func: diff
              duration: 1m
        yaxis:
          - min: 0
        card_mod:
          style: |
            ha-card { user-select: text !important; }
