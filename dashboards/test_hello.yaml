views:
  - title: Test Hello
    path: test-hello
    icon: mdi:chat
    cards:
      - type: markdown
        content: "# 📊 Monitoraggio Rete\nAnalisi del traffico in tempo reale."
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.router_total_download
            name: Download Totale (MB)
          - type: sensor
            entity: sensor.router_total_upload
            name: Upload Totale (MB)

      - type: markdown
        content: "## 🛠️ Valori Entità (Debug)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: entities
        entities:
          - entity: sensor.router_traffic_stats
            name: "Stato Sensore (MB)"
          - entity: sensor.router_realtime_top_consumer
            name: "Top Consumer"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: markdown
        content: "## ⚡ Consumo Top 5 (MB)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        chart_type: bar
        apex_config:
          chart:
            height: 300px
          plotOptions:
            bar:
              horizontal: true
              distributed: true
        series:
          - entity: sensor.router_traffic_stats
            data_generator: |
              const consumers = entity.attributes.top_consumers;
              if (!consumers || !Array.isArray(consumers)) return [];
              return consumers.slice(0, 5).map((entry) => {
                return {
                  x: entry.name || entry.ip || "Unknown",
                  y: entry.total_rx_mb || 0
                }
              });

      - type: markdown
        content: "## 📉 Velocità di Rete (kbps)"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        graph_span: 30m
        header:
          show: true
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.router_download_speed
            name: Download
            color: "#1e88e5"
            type: area
          - entity: sensor.router_upload_speed
            name: Upload
            color: "#e53935"
            type: area
        yaxis:
          - min: 0
            apex_config:
              forceNiceScale: true

      - type: markdown
        content: "## 📋 Tabella Dettaglio Completa"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:flex-table-card
        entities:
          - entity: sensor.router_traffic_stats
        columns:
          - name: Dispositivo
            data: top_consumers
            modify: x.name
          - name: IP
            data: top_consumers
            modify: x.ip
          - name: Down (kbps)
            data: top_consumers
            modify: x.rx_kbps
            align: center
          - name: Up (kbps)
            data: top_consumers
            modify: x.tx_kbps
            align: center
          - name: Totale (MB)
            data: top_consumers
            modify: x.total_rx_mb
            align: center
        sort_by: rx_kbps-

      - type: markdown
        content: "## 📊 Test Campione: Vendite Settimanali"
        card_mod:
          style: |
            ha-card { user-select: text !important; }

      - type: custom:apexcharts-card
        header:
          show: true
          title: "📊 Vendite Settimanali"
          show_states: true
          colorize_states: true
        graph_span: 7d
        update_interval: 1min
        stacked: false
        apex_config:
          chart:
            height: 400px
            type: bar
          plotOptions:
            bar:
              borderRadius: 6
              columnWidth: 70%
          xaxis:
            categories: ["Lun", "Mar", "Mer", "Gio", "Ven"]
        series:
          - entity: input_number.vendite_lunedi
            name: "Vendite"
            type: column
          - entity: input_number.vendite_martedi
            name: "Vendite"
            type: column
          - entity: input_number.vendite_mercoledi
            name: "Vendite"
            type: column
          - entity: input_number.vendite_giovedi
            name: "Vendite"
            type: column
          - entity: input_number.vendite_venerdi
            name: "Vendite"
            type: column
